<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 260" role="img" aria-labelledby="title desc">
  <title id="title">Prismatic Veil party board piece</title>
  <desc id="desc">A polished prismatic tabletop token with three party portrait gems on a gold and cyan base.</desc>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0b0"/>
      <stop offset="0.34" stop-color="#d7aa48"/>
      <stop offset="0.63" stop-color="#67ebff"/>
      <stop offset="1" stop-color="#9169ff"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#162a55"/>
      <stop offset="1" stop-color="#050916"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="36%" r="62%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.21" stop-color="#bdf8ff"/>
      <stop offset="0.52" stop-color="#8d74ff"/>
      <stop offset="1" stop-color="#050916"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.52 0 0 0 0 0.92 0 0 0 0 1 0 0 0 .8 0" result="cyan"/>
      <feMerge><feMergeNode in="cyan"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <ellipse cx="110" cy="226" rx="74" ry="22" fill="#030610" opacity=".66"/>
  <path d="M50 196h120l-15 35H65z" fill="url(#base)" stroke="#fff2ad" stroke-width="3" filter="url(#glow)"/>
  <path d="M65 193h90l-11 22H76z" fill="#061329" opacity=".88"/>
  <path d="M110 20 177 75 155 186H65L43 75z" fill="url(#dark)" stroke="url(#base)" stroke-width="5" filter="url(#glow)"/>
  <path d="M110 34 160 78 143 170H77L60 78z" fill="url(#core)" opacity=".88"/>
  <path d="M110 48 136 82 110 117 84 82z" fill="#fff4ba" opacity=".88"/>
  <path d="M110 117 141 151H79z" fill="#75edff" opacity=".70"/>
  <circle cx="72" cy="160" r="22" fill="#07152e" stroke="#f0cf79" stroke-width="4"/>
  <circle cx="110" cy="174" r="24" fill="#07152e" stroke="#7eecff" stroke-width="4"/>
  <circle cx="148" cy="160" r="22" fill="#07152e" stroke="#a584ff" stroke-width="4"/>
  <path d="M62 158c6-14 16-14 22 0-2 10-20 10-22 0z" fill="#ffd46d"/>
  <path d="M98 172c7-16 18-16 25 0-2 12-23 12-25 0z" fill="#dffcff"/>
  <path d="M138 158c6-14 16-14 22 0-2 10-20 10-22 0z" fill="#c7a0ff"/>
  <path d="M48 78h124M67 190h86M110 20v28M110 117v54" stroke="#ffffff" stroke-opacity=".32" stroke-width="2"/>
