<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#070817"><title>The Prismatic Veil · Hybrid Battle</title>
<style>
:root{--paper:#efe1bd;--paper2:#fff3d3;--gold:#b99148;--ink:#241a11;--night:#070817;--violet:#8d4dff;--vh:1vh;--vw:1vw}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--night);font-family:Georgia,serif}
#stage{position:fixed;inset:0;background:radial-gradient(circle at 70% 55%,#35165b55,transparent 28%),linear-gradient(#071126,#120c26);overflow:hidden}
#stage canvas{position:absolute!important;inset:0!important;width:100%!important;height:100%!important}

.ui{pointer-events:auto}.paper{background:linear-gradient(145deg,var(--paper2),#ddc99a);border:1px solid #8d6d34;border-radius:9px;box-shadow:inset 0 0 0 2px #fff4d855,0 8px 20px #0005}
.night{background:linear-gradient(145deg,#0e1028f5,#21162ef4);border:1px solid #9c7441;color:#f6e7bf}

.hname{grid-column:1/-1;padding:2px 6px;border-bottom:1px solid #9b723f66;background:#fff4d655;font-weight:bold;font-size:clamp(10px,2.25vh,14px);white-space:nowrap}
.portrait{width:36px;height:36px;border-radius:7px;background:#17182d;color:#f1dcaa;display:grid;place-items:center;font:bold 20px Georgia;overflow:hidden}.portrait img{width:100%;height:100%;object-fit:cover}
.stats{font-size:clamp(8px,1.85vh,11px);line-height:1.2;min-width:0}.stats b{font-size:1.08em}.m{height:5px;background:#554b3b44;border-radius:9px;overflow:hidden;margin:2px 0 4px}.m i{display:block;height:100%;background:#70b876}.m.rp i{background:#6d55c8}
#drawer{position:absolute;left:max(12px,1.3vw);right:auto;bottom:max(12px,4.5vh);width:clamp(220px,21vw,300px);min-height:clamp(118px,27vh,178px);padding:11px 12px;display:none;overflow:hidden}
#drawer h2{margin:0;font-size:clamp(17px,3.8vh,27px);font-weight:500}.dgrid{display:grid;grid-template-columns:1fr;gap:7px;margin-top:6px}.desc{font-size:clamp(9px,1.8vh,12px)}dl{margin:0;font-size:clamp(8px,1.7vh,11px)}dl div{display:flex;justify-content:space-between;border-bottom:1px solid #9b723f44;padding:2px 0}dd{margin:0;color:#7741a4}

#boot,#audio,#rotate{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:#070817e8;color:#f6e6ba;text-align:center;padding:24px}#boot[hidden],#audio[hidden],#rotate[hidden]{display:none}

#audio button{padding:13px 18px;border:1px solid #d3b46b;border-radius:8px;background:#f4dfae;color:#271b10;font:bold 12px Georgia}
#home{position:fixed;right:12px;bottom:10px;z-index:40;color:#f4e3bb;background:#0b0d20cc;border:1px solid #b8904f;border-radius:6px;padding:7px 10px;text-decoration:none;font:bold 10px Georgia;letter-spacing:.04em}#home[hidden]{display:none}
#battlemsg{position:absolute;left:50%;top:max(10px,2vh);transform:translateX(-50%);width:min(31vw,360px);min-height:28px;padding:6px 10px;border:1px solid #b6904f88;border-radius:7px;background:#0b0d20d9;color:#f6e6ba;text-align:center;font:bold clamp(9px,1.9vh,12px) Georgia;letter-spacing:.025em;box-shadow:0 5px 16px #0005;backdrop-filter:blur(4px);opacity:.96}

.navfocus,.cmd:focus-visible,.actions button:focus-visible,.result-actions button:focus-visible,.result-actions a:focus-visible,#home:focus-visible{outline:none!important;box-shadow:inset 5px 0 0 #8d4dff,inset 0 0 0 2px #d7b66c,0 0 18px #76ddff99!important;transform:translateX(3px)}.cmd.navfocus{background:#f7e8c8}.actions button,.result-actions button,.result-actions a,#home{transition:box-shadow .12s ease,transform .12s ease}@media(min-width:1000px) and (orientation:landscape){#party{left:27%;width:38%}#drawer{width:clamp(230px,19vw,300px)}#enemy{width:clamp(250px,21vw,350px)}}
@media(max-height:370px){#party{left:22%;width:42%}.hero{height:90px;grid-template-columns:34px 1fr}.portrait{width:32px;height:32px}#drawer{min-height:120px}}
</style><script src="./phaser.min.js"></script></head>
<body><div id="stage"></div><div class="hud"><div id="battlemsg">ENTERING BATTLE…</div>
<section id="turns"><div class="ttl">TURN ORDER</div><div class="chips"><div class="chip"><span>P</span></div><div class="chip"><span>A</span></div><div class="chip"><span>K</span></div><div class="chip"><span>V</span></div></div></section>
<section id="enemy" class="paper night"><div class="row"><strong id="ename">VEIL WRAITH</strong><span>LV 18</span></div><hr><div class="row"><span>HP</span><b><span id="ehp">30</span> / <span id="emax">30</span></b></div><div class="bar"><i id="ebar" style="width:100%"></i></div><small>WEAK ✦ LIGHT</small></section>

<section id="party" class="ui">
<div class="hero paper" data-h="prismel"><div class="hname">PRISMEL</div><div class="portrait">P</div><div class="stats"><div>HP <b class="hpv">0</b></div><div class="m"><i class="hpbar"></i></div><div>RP <b class="rpv">0</b></div><div class="m rp"><i class="rpbar"></i></div></div></div>
<div class="hero paper" data-h="auryi"><div class="hname">AURYI</div><div class="portrait">A</div><div class="stats"><div>HP <b class="hpv">0</b></div><div class="m"><i class="hpbar"></i></div><div>RP <b class="rpv">0</b></div><div class="m rp"><i class="rpbar"></i></div></div></div>
<div class="hero paper" data-h="kineza"><div class="hname">KINEZA</div><div class="portrait">K</div><div class="stats"><div>HP <b class="hpv">0</b></div><div class="m"><i class="hpbar"></i></div><div>RP <b class="rpv">0</b></div><div class="m rp"><i class="rpbar"></i></div></div></div>
</section>
<section id="drawer" class="paper ui"><h2 id="dtitle">ATTACK</h2><div class="dgrid"><div id="ddesc" class="desc"></div><dl id="dstats"></dl></div><div class="actions"><button id="use">USE</button><button id="back">BACK</button></div></section>
</div><div id="result" hidden><div class="result-card"><strong id="resultTitle">VICTORY</strong><div class="result-actions"><button id="retry">RETRY</button><a href="./index.html">MENU</a></div></div></div><div id="boot">STARTING THE VEIL…</div><div id="audio" hidden><button id="audioBtn">✦ TAP TO ENABLE AUDIO ✦</button></div><div id="rotate" hidden>ROTATE TO LANDSCAPE</div><a id="home" href="./index.html">⌂ MENU</a>
<script type="module">
const ROOT=new URL('./',location.href).href,boot=document.querySelector('#boot'),stage=document.querySelector('#stage'),drawer=document.querySelector('#drawer'),commands=document.querySelector('#commands'),battlemsg=document.querySelector('#battlemsg'),home=document.querySelector('#home'),result=document.querySelector('#result'),resultTitle=document.querySelector('#resultTitle');let scene=null,last='';
function fail(e){boot.hidden=false;boot.innerHTML='<div><strong>LIVE BATTLE BOOT ERROR</strong><pre>'+String(e?.stack||e?.message||e)+'</pre></div>'}
addEventListener('error',e=>fail(e.error||e.message));addEventListener('unhandledrejection',e=>fail(e.reason||e));

function paint(s){const sig=JSON.stringify(s);if(sig===last)return;last=sig;

for(const h of s.party){const c=document.querySelector('[data-h="'+h.id+'"]');if(!c)continue;c.classList.toggle('on',h.active);c.classList.toggle('guarding',!!h.guarding);c.classList.toggle('dead',h.alive===false);c.querySelector('.hname').textContent=h.name;c.querySelector('.hpv').textContent=h.hp.toLocaleString();c.querySelector('.rpv').textContent=h.rp;c.querySelector('.hpbar').style.width=(h.hp/h.maxHp*100)+'%';c.querySelector('.rpbar').style.width=(h.rp/h.maxRp*100)+'%';const p=c.querySelector('.portrait');if(h.portrait&&!p.querySelector('img'))p.innerHTML='<img src="'+ROOT+'assets/ui/'+h.portrait+'.png" onerror="this.remove()">' }
ename.textContent=s.enemy.name;ehp.textContent=s.enemy.hp;emax.textContent=s.enemy.maxHp;ebar.style.width=(s.enemy.hp/s.enemy.maxHp*100)+'%';
document.querySelectorAll('.cmd').forEach(b=>{const allowed=s.available?.[b.dataset.c]!==false;b.disabled=s.lock||!allowed;b.classList.toggle('sel',b.dataset.c===s.selected&&!b.disabled)});
commands.classList.toggle('off',!s.railVisible||s.actor==='enemy'||!!s.outcome);

if(!s.drawer){drawer.style.display='none';commands.style.visibility='visible';use.disabled=false}else{drawer.style.display='block';commands.style.visibility='hidden';dtitle.textContent=s.drawer.title;ddesc.textContent=s.drawer.description;dstats.innerHTML=s.drawer.stats.map(x=>'<div><dt>'+x[0]+'</dt><dd>'+x[1]+'</dd></div>').join('');use.disabled=s.drawer.canUse===false}
home.hidden=!!s.drawer||!!s.outcome;
result.hidden=!s.outcome;if(s.outcome)resultTitle.textContent=s.outcome==='victory'?'VICTORY':'DEFEAT';
audio.hidden=!s.audioLocked}
function snap(x,cfg){const a=x.activeHeroId||(x.turnOrder?.[x.turnIndex]==='enemy'?'enemy':null),h=x._activeHero?.()||null,d=x._drawerOpen?.toLowerCase(),alive=!!h?.alive,resonartReady=alive&&h.currentRp>=cfg.RESONART_RP_COST,guardReady=alive&&!h.guarding,itemReady=alive&&h.currentHp<h.maxHp;let dr=null;
if(d&&h){if(d==='attack'){const q=cfg.projectedDamage(h,'Attack');dr={title:h.id==='prismel'?"PRISM’S PROJECTILE PUNCH":'ATTACK',description:h.id==='prismel'?'A compact prismatic projectile punch. Free, focused, and always available.':'A basic strike. Free and always available.',canUse:alive,stats:[['TARGET','1 ENEMY'],['DAMAGE',q.low+'–'+q.high],['HIT',Math.round(cfg.hitChanceFor('Attack')*100)+'%']]}}else if(d==='resonart'){const q=cfg.projectedDamage(h,'Resonart');dr={title:(h.attack?.name||'RESONART').toUpperCase(),description:h.attack?.flavor||'A signature technique.',canUse:resonartReady,stats:[['RP',String(cfg.RESONART_RP_COST)+(resonartReady?'':' · LOW')],['TARGET','1 ENEMY'],['DAMAGE',q.low+'–'+q.high],['HIT',Math.round(cfg.hitChanceFor('Resonart')*100)+'%']]}}else if(d==='guard')dr={title:'GUARD',description:guardReady?h.name+' braces for the next attack.':h.name+' is already guarding.',canUse:guardReady,stats:[['TARGET','SELF'],['GUARD',guardReady?'50%':'ACTIVE']]};else{const it=cfg.ITEM_DEFS[0],missing=Math.max(0,h.maxHp-h.currentHp),heal=Math.min(it.heal,missing);dr={title:it.name.toUpperCase(),description:itemReady?'Restores up to '+it.heal+' HP to '+h.name+'.':h.name+' is already at full HP.',canUse:itemReady,stats:[['TARGET','SELF'],['HEAL',itemReady?heal+' HP':'FULL']]}}}
const living=(x.party||[]).filter(v=>v.alive).length,railVisible=!!x._commandRailContainer?.visible;const outcome=x._hybridOutcome||(x.enemy?.hp<=0?'victory':(living===0?'defeat':null));
return{turnOrder:(x.turnOrder||[]).map(id=>({active:id===a})),party:(x.party||[]).map(v=>({id:v.id,name:v.name.toUpperCase(),hp:Math.max(0,v.currentHp),maxHp:v.maxHp,rp:Math.max(0,v.currentRp),maxRp:v.maxRp,active:v.id===x.activeHeroId,alive:!!v.alive,guarding:!!v.guarding,portrait:v.portrait})),enemy:{name:(x.enemy?.name||'ENEMY').toUpperCase(),hp:Math.max(0,x.enemy?.hp||0),maxHp:x.enemy?.maxHp||1},actor:a,selected:d||null,drawer:dr,available:{attack:alive,resonart:resonartReady,guard:guardReady,item:itemReady},railVisible,outcome,banner:x._hybridBanner||'',lock:!!x._turnLock||a==='enemy'||!!outcome||!railVisible,audioLocked:!!x.audio?.isLocked?.()}}
try{if(!window.Phaser)throw Error('Phaser failed to load');const[{default:Base},cfg]=await Promise.all([import('./src/PartyBattleScene.js?v=xbox-ui-1'),import('./src/PartyBattleConfig.js?v=xbox-ui-1')]);
class Hybrid extends Base{preload(){this.load.setBaseURL(ROOT);super.preload()}create(){this._hybridBanner='';this._hybridOutcome=null;super.create();if(this.uiLayer){this.uiLayer.setVisible(false);disable(this.uiLayer)}scene=this;boot.hidden=true;this.pub(true)}_setBanner(msg){super._setBanner(msg);this._hybridBanner=msg;this.pub?.(true)}_onVictory(){this._hybridOutcome='victory';const r=super._onVictory();this.pub(true);return r}_onDefeat(){this._hybridOutcome='defeat';const r=super._onDefeat();this.pub(true);return r}update(){this.pub(false)}pub(f=false){const s=snap(this,cfg),q=JSON.stringify(s);if(!f&&q===this._q)return;this._q=q;paint(s)}}
window.__pvHybridGame=new Phaser.Game({type:Phaser.AUTO,parent:'stage',width:800,height:600,backgroundColor:'#07060f',scale:{mode:Phaser.Scale.RESIZE,autoCenter:Phaser.Scale.CENTER_BOTH},scene:[Hybrid]});
document.querySelectorAll('.cmd').forEach(b=>b.onclick=()=>{if(b.disabled||!scene||scene._turnLock||!scene._commandRailContainer?.visible)return;scene._onCommand({attack:'Attack',resonart:'Resonart',guard:'Guard',item:'Item'}[b.dataset.c]);scene.pub(true)});
use.onclick=()=>{if(use.disabled)return;if(scene&&scene._drawerOpen&&!scene._turnLock){scene._confirmDrawer();scene.pub(true)}};retry.onclick=()=>location.reload();back.onclick=()=>{if(scene?._drawerOpen){scene._closeDrawer();scene.pub(true)}};audioBtn.onclick=()=>{if(!scene)return;const done=()=>{scene._dismissAudioGate?.();scene.pub(true)};scene.audio?.onUnlocked?.(done);scene.sound?.unlock?.();scene.sound?.context?.resume?.().then(done).catch(()=>{})};
let navIndex=0,navStamp=0,lastPadButtons=[];
function navTargets(){if(!result.hidden)return[...result.querySelectorAll('button,a')].filter(x=>!x.disabled);if(drawer.style.display==='block')return[use,back].filter(x=>!x.disabled);return[...commands.querySelectorAll('.cmd')].filter(x=>!x.disabled&&commands.style.visibility!=='hidden'&&!commands.classList.contains('off'))}
function navFocus(index=navIndex){const t=navTargets();document.querySelectorAll('.navfocus').forEach(x=>x.classList.remove('navfocus'));if(!t.length)return;navIndex=(index+t.length)%t.length;const el=t[navIndex];el.classList.add('navfocus');try{el.focus({preventScroll:true})}catch(e){el.focus()}}

function navBack(){if(drawer.style.display==='block'&&!back.disabled)back.click();else if(!result.hidden){const menu=result.querySelector('a');if(menu)menu.click()}}
addEventListener('keydown',e=>{if(['ArrowUp','ArrowLeft','ArrowDown','ArrowRight','Enter',' ','Escape','Backspace'].includes(e.key))e.preventDefault();if(e.key==='ArrowUp'||e.key==='ArrowLeft')navMove(-1);else if(e.key==='ArrowDown'||e.key==='ArrowRight')navMove(1);else if(e.key==='Enter'||e.key===' ')navConfirm();else if(e.key==='Escape'||e.key==='Backspace')navBack()});
function gamepadNav(){const gp=navigator.getGamepads?.()[0];if(gp){const now=performance.now(),pressed=i=>!!gp.buttons[i]?.pressed,edge=i=>pressed(i)&&!lastPadButtons[i];const up=edge(12)||(gp.axes[1]||0)<-.62,down=edge(13)||(gp.axes[1]||0)>.62,left=edge(14)||(gp.axes[0]||0)<-.62,right=edge(15)||(gp.axes[0]||0)>.62;if(now-navStamp>175){if(up||left){navMove(-1);navStamp=now}else if(down||right){navMove(1);navStamp=now}else if(edge(0)){navConfirm();navStamp=now}else if(edge(1)){navBack();navStamp=now}}lastPadButtons=gp.buttons.map(b=>b.pressed)}requestAnimationFrame(gamepadNav)}gamepadNav();
addEventListener('gamepadconnected',()=>navFocus(0));
const orient=()=>rotate.hidden=innerWidth>=innerHeight;orient();addEventListener('resize',orient)}catch(e){fail(e)}
</script></body></html>
