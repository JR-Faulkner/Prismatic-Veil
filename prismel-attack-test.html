const img=new Image();const c=document.getElementById('c'),ctx=c.getContext('2d'),label=document.getElementById('beat'),play=document.getElementById('play'),loopBtn=document.getElementById('loop');let running=false,loop=false,timer=0;
function draw(i){ctx.clearRect(0,0,c.width,c.height);ctx.imageSmoothingEnabled=true;const sx=(i%5)*160,sy=Math.floor(i/5)*160;const size=340,x=(c.width-size)/2,y=(c.height-size)/2+8;ctx.drawImage(img,sx,sy,160,160,x,y,size,size);label.textContent=beats[i];}
