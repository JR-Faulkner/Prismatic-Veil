<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>The Prismatic Veil — 05I Mobile Shell</title>
<meta name="theme-color" content="#050914">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Prismatic Veil">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="./pv-mobile-shell.webmanifest?v=1">
<style>
  :root {
    --pv-navy: rgba(5, 9, 20, .91);
    --pv-navy-soft: rgba(8, 17, 31, .84);
    --pv-gold: #d7b868;
    --pv-gold-soft: rgba(215,184,104,.58);
    --pv-prism: #89e2ff;
    --pv-violet: #c38cff;
    --pv-hp: #66db86;
    --pv-rp: #8b70ec;
    --pv-enemy: #c64363;
    --pv-text: #f8edd2;
    --pv-muted: #b8b1c3;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; height: 100dvh; overflow: hidden;
    background: #050914;
    touch-action: none;
    user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  #game-container { position: fixed; inset: 0; width: 100vw; height: 100dvh; }
  canvas { display: block; }

  #loading {
    position: fixed; inset: 0; z-index: 1000;
    display: flex; align-items: center; justify-content: center;
    padding: 24px; white-space: pre-wrap; text-align: center;
    color: #f7e8b6; font: 700 15px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Display", Arial, sans-serif;
    background: radial-gradient(circle at 50% 32%, #261448 0%, #050914 72%);
  }

  #pv-mobile-shell {
    position: fixed; inset: 0; z-index: 900;
    pointer-events: none;
    opacity: 0;
    visibility: hidden;
    transition: opacity 140ms ease, visibility 0s linear 140ms;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    color: var(--pv-text);
  }
  #pv-mobile-shell.is-visible {
    opacity: 1;
    visibility: visible;
    transition: opacity 150ms ease;
  }

  .pv-glass {
    background: linear-gradient(180deg, rgba(11,20,39,.94), rgba(4,8,18,.90));
    border: 1px solid var(--pv-gold-soft);
    box-shadow: 0 5px 18px rgba(0,0,0,.30), inset 0 1px 0 rgba(255,255,255,.035);
    backdrop-filter: blur(7px) saturate(1.06);
    -webkit-backdrop-filter: blur(7px) saturate(1.06);
  }

  .pv-turn {
    position: absolute;
    top: calc(env(safe-area-inset-top, 0px) + 7px);
    left: calc(env(safe-area-inset-left, 0px) + 8px);
    width: clamp(146px, 20vw, 174px);
    height: 44px;
    border-radius: 9px;
    display: grid;
    grid-template-columns: 48px 1fr;
    align-items: center;
    overflow: hidden;
  }
  .pv-turn-number {
    height: 100%; display: grid; place-items: center;
    border-right: 1px solid rgba(215,184,104,.34);
    font-size: 19px; font-weight: 800; letter-spacing: .04em;
    color: #f3d993;
  }
  .pv-turn-copy { padding: 0 9px; min-width: 0; }
  .pv-kicker {
    font-size: 8px; line-height: 1.05; letter-spacing: .17em;
    color: #a99c7d; font-weight: 800;
  }
  .pv-active {
    margin-top: 3px; font-size: 12px; line-height: 1;
    color: var(--pv-prism); font-weight: 850; letter-spacing: .05em;
  }

  .pv-target {
    position: absolute;
    top: calc(env(safe-area-inset-top, 0px) + 7px);
    right: calc(env(safe-area-inset-right, 0px) + 8px);
    width: clamp(174px, 23vw, 204px);
    height: 44px;
    border-radius: 9px;
    padding: 7px 10px 6px;
  }
  .pv-target-line, .pv-resource-line {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 8px;
  }
  .pv-target-name { font-size: 12px; font-weight: 850; letter-spacing: .055em; }
  .pv-target-hp { font-size: 9px; font-variant-numeric: tabular-nums; color: #fff; font-weight: 750; }
  .pv-bar {
    height: 6px; margin-top: 7px; border-radius: 999px; overflow: hidden;
    background: rgba(255,255,255,.09);
  }
  .pv-bar > i { display:block; height:100%; width:100%; border-radius:inherit; transition: width 180ms ease; }
  #pv-target-fill { background: var(--pv-enemy); }

  .pv-objective {
    position: absolute;
    top: calc(env(safe-area-inset-top, 0px) + 58px);
    left: 50%; transform: translateX(-50%);
    padding: 4px 9px;
    max-width: 52vw;
    border-radius: 999px;
    border: 1px solid rgba(195,140,255,.28);
    background: rgba(5,9,20,.66);
    color: #d8cbe8;
    font-size: 8px; line-height: 1.15; font-weight: 750;
    letter-spacing: .07em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .pv-hero {
    position: absolute;
    left: calc(env(safe-area-inset-left, 0px) + 8px);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 8px);
    width: clamp(174px, 23vw, 208px);
    height: 66px;
    border-radius: 10px;
    padding: 8px 10px;
  }
  .pv-hero-name { font-size: 13px; line-height: 1; font-weight: 900; letter-spacing: .055em; color: #ffe3ae; }
  .pv-resource-line { margin-top: 6px; font-size: 8px; font-weight: 800; color: #aeb7c5; }
  .pv-resource-line strong { color: #fff; font-size: 9px; font-variant-numeric: tabular-nums; }
  .pv-mini-bar { height: 5px; margin-top: 3px; border-radius: 999px; background: rgba(255,255,255,.08); overflow:hidden; }
  .pv-mini-bar > i { display:block; width:100%; height:100%; border-radius:inherit; transition:width 180ms ease; }
  #pv-hero-hp-fill { background: var(--pv-hp); }
  #pv-hero-rp-fill { background: var(--pv-rp); }

  .pv-action {
    position: absolute;
    right: calc(env(safe-area-inset-right, 0px) + 8px);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 8px);
    width: clamp(268px, 36vw, 318px);
    min-height: 72px;
    border-radius: 11px;
    padding: 8px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 58px 74px;
    grid-template-rows: 20px 44px;
    column-gap: 7px;
    row-gap: 2px;
    pointer-events: auto;
  }
  .pv-ability {
    grid-column: 1 / 3;
    grid-row: 1;
    min-width: 0;
    display: flex; align-items: center; gap: 5px;
    color: #ddb7ff;
    font-size: 12px; font-weight: 900; letter-spacing: .045em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .pv-ability::before { content: "✦"; color: var(--pv-prism); font-size: 11px; }
  .pv-damage {
    grid-column: 3; grid-row: 1;
    display:flex; justify-content:flex-end; align-items:baseline; gap:4px;
    font-size: 7px; color:#a99c7d; letter-spacing:.07em; font-weight:800;
  }
  .pv-damage strong { font-size: 18px; line-height:1; color:#f0c6ff; font-variant-numeric:tabular-nums; }
  .pv-action button {
    appearance: none; -webkit-appearance: none;
    border-radius: 8px;
    min-height: 44px;
    font: 850 10px/1 -apple-system, BlinkMacSystemFont, "SF Pro Text", Arial, sans-serif;
    letter-spacing: .045em;
    touch-action: manipulation;
    cursor: pointer;
    transition: transform 80ms ease, opacity 120ms ease, filter 80ms ease;
  }
  .pv-action button:active { transform: scale(.975); filter: brightness(1.16); }
  #pv-confirm {
    grid-column: 1 / 3; grid-row: 2;
    color:#e5ffea; background:linear-gradient(180deg,#1b4329,#102a1b);
    border:1px solid rgba(102,219,134,.85);
  }
  #pv-back {
    grid-column: 3; grid-row: 2;
    color:#f7dde3; background:linear-gradient(180deg,#3a1d27,#24141b);
    border:1px solid rgba(198,112,132,.66);
  }
  .pv-action button:disabled { pointer-events:none; }

  @media (orientation: portrait) {
    .pv-turn { width: 142px; }
    .pv-target { width: 160px; }
    .pv-objective { top: calc(env(safe-area-inset-top, 0px) + 60px); max-width: 82vw; }
    .pv-hero { width: calc(100vw - 16px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom,0px) + 88px); height: 62px; }
    .pv-action { left: calc(env(safe-area-inset-left,0px) + 8px); right: calc(env(safe-area-inset-right,0px) + 8px); width:auto; }
  }

  @media (max-height: 390px) and (orientation: landscape) {
    .pv-turn, .pv-target { top: calc(env(safe-area-inset-top,0px) + 5px); height: 40px; }
    .pv-objective { top: calc(env(safe-area-inset-top,0px) + 49px); }
    .pv-hero, .pv-action { bottom: calc(env(safe-area-inset-bottom,0px) + 5px); }
    .pv-hero { height: 62px; }
    .pv-action { min-height: 68px; grid-template-rows: 18px 44px; }
  }
</style>
<script src="./phaser.min.js"></script>
</head>
<body>
<div id="loading">✦ Loading 05I Mobile Shell ✦</div>
<div id="game-container"></div>

<div id="pv-mobile-shell" aria-hidden="true">
  <section class="pv-turn pv-glass" aria-label="Turn order">
    <div class="pv-turn-number" id="pv-turn-number">01</div>
    <div class="pv-turn-copy">
      <div class="pv-kicker">ACTIVE TURN</div>
      <div class="pv-active" id="pv-active-label">PRISMEL</div>
    </div>
  </section>

  <section class="pv-target pv-glass" aria-label="Target status">
    <div class="pv-target-line">
      <span class="pv-target-name" id="pv-target-name">HUSHLING</span>
      <span class="pv-target-hp" id="pv-target-hp">10 / 10</span>
    </div>
    <div class="pv-bar"><i id="pv-target-fill"></i></div>
  </section>

  <div class="pv-objective" id="pv-objective">TOO QUIET • DEFEAT HUSHLING • VEIL 36%</div>

  <section class="pv-hero pv-glass" aria-label="Prismel status">
    <div class="pv-hero-name" id="pv-hero-name">PRISMEL</div>
    <div class="pv-resource-line"><span>HP</span><strong id="pv-hero-hp">12/12</strong></div>
    <div class="pv-mini-bar"><i id="pv-hero-hp-fill"></i></div>
    <div class="pv-resource-line"><span>RP</span><strong id="pv-hero-rp">8/8</strong></div>
    <div class="pv-mini-bar"><i id="pv-hero-rp-fill"></i></div>
  </section>

  <section class="pv-action pv-glass" aria-label="Battle action">
    <div class="pv-ability" id="pv-ability-name">PRISMATIC SHARD</div>
    <div class="pv-damage"><span>DMG</span><strong id="pv-predicted-damage">4</strong></div>
    <button id="pv-confirm" type="button">CONFIRM ATTACK</button>
    <button id="pv-back" type="button">BACK</button>
  </section>
</div>

<script type="module">
  import TitleScene from './src/tactical/TitleScene.js?v=7';
  import IntroCrawlScene from './src/tactical/IntroCrawlScene.js?v=3';
  import TacticalScene from './src/tactical/IntegratedTacticalScene05I.js?v=1';
  import VeilBattleScene from './src/IntegratedVeilBattleScene.js?v=2';

  const boot = document.getElementById('loading');
  const shell = document.getElementById('pv-mobile-shell');

  function hideShell() {
    if (!shell) return;
    shell.classList.remove('is-visible');
    shell.setAttribute('aria-hidden', 'true');
  }

  function fail(error) {
    console.error(error);
    hideShell();
    if (!boot) return;
    boot.style.display = 'flex';
    boot.textContent = 'Boot Error\n\n' + (error && (error.stack || error.message) ? (error.stack || error.message) : String(error));
  }

  window.addEventListener('error', event => fail(event.error || event.message));
  window.addEventListener('unhandledrejection', event => fail(event.reason || event));
  window.addEventListener('pagehide', hideShell);

  if (!window.Phaser) {
    fail('Phaser did not load. Make sure phaser.min.js is in the repository root.');
  } else {
    (function () {
      const dpr = Math.min(window.devicePixelRatio || 1, 3);
      const orig = Phaser.GameObjects.GameObjectFactory.prototype.text;
      Phaser.GameObjects.GameObjectFactory.prototype.text = function (x, y, text, style) {
        style = style || {};
        if (style.resolution === undefined) style.resolution = dpr;
        return orig.call(this, x, y, text, style);
      };
    })();

    class HarnessScene extends TacticalScene {
      create() {
        hideShell();
        if (boot) boot.style.display = 'none';
        super.create();
      }
    }

    try {
      new Phaser.Game({
        type: Phaser.AUTO,
        parent: 'game-container',
        width: 800,
        height: 600,
        backgroundColor: '#050914',
        transparent: false,
        scale: { mode: Phaser.Scale.RESIZE, autoCenter: Phaser.Scale.CENTER_BOTH },
        input: { activePointers: 2 },
        scene: [TitleScene, IntroCrawlScene, HarnessScene, VeilBattleScene]
      });
    } catch (error) {
      fail(error);
    }
  }
</script>
</body>
</html>
