<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>PriZim · Kineza Attack Style Lab</title>
<meta name="theme-color" content="#08101e">
<style>
:root{--bg:#08101e;--panel:#111d31;--line:#355071;--gold:#f0d58d;--cyan:#9cecff;--green:#7dff93;--text:#fffdf5}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:radial-gradient(circle at 50% -20%,#4e3475 0,#15243d 38%,#08101e 82%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif}body{overflow:hidden}
.app{height:100dvh;padding:calc(env(safe-area-inset-top,0px)+8px) calc(env(safe-area-inset-right,0px)+8px) calc(env(safe-area-inset-bottom,0px)+8px) calc(env(safe-area-inset-left,0px)+8px);display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:7px}
.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.brand small{display:block;color:var(--gold);font-size:7px;font-weight:900;letter-spacing:.16em}.brand strong{display:block;font-size:15px;margin-top:2px}.status{padding:6px 8px;border:1px solid #5c8bb7;background:#11253d;color:var(--cyan);font-size:7px;font-weight:900;letter-spacing:.07em}.status.fail{border-color:#ff7891;color:#ff9bad}
.styles{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.styles button,.controls button,.controls select,.frames button{appearance:none;border:1px solid rgba(156,236,255,.35);background:linear-gradient(145deg,#17304b,#2b1c3d);color:#eaf7ff;min-height:38px;font:800 8px/1 Arial,sans-serif;letter-spacing:.05em}.styles button.active,.frames button.active{border-color:var(--gold);box-shadow:inset 0 0 0 1px rgba(240,213,141,.22);color:#fff1bd;background:linear-gradient(145deg,#234f67,#553474)}
.stage{position:relative;min-height:0;border:1px solid rgba(240,213,141,.38);overflow:hidden;background:#08101e}.stage:after{content:"LOCKED CHOREOGRAPHY · STYLE ONLY";position:absolute;left:8px;bottom:7px;color:rgba(240,213,141,.72);font-size:6px;font-weight:900;letter-spacing:.12em;pointer-events:none}.stage canvas{display:block;width:100%;height:100%}
.readout{position:absolute;left:8px;right:8px;top:8px;display:flex;justify-content:space-between;gap:6px;z-index:4;pointer-events:none}.pill{padding:5px 7px;background:rgba(8,16,30,.78);border:1px solid rgba(156,236,255,.22);font-size:7px;font-weight:900}.pill b{color:var(--gold)}
.bottom{display:grid;gap:6px}.frames{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}.frames button{min-height:31px}.controls{display:grid;grid-template-columns:54px 54px 72px 72px 1fr;gap:5px}.controls button,.controls select{min-height:38px}.controls #play{border-color:rgba(240,213,141,.72);color:#fff0b8}.controls #loop.on{color:var(--green)}
.meta{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px}.meta div{padding:5px 7px;background:rgba(17,29,49,.92);border-top:1px solid rgba(156,236,255,.20)}.meta small{display:block;color:#aeb7c5;font-size:6px;letter-spacing:.08em}.meta strong{display:block;margin-top:3px;font-size:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(orientation:landscape){.app{grid-template-columns:minmax(0,1fr) 290px;grid-template-rows:auto auto minmax(0,1fr)}.top{grid-column:1/3}.styles{grid-column:2;grid-row:2}.stage{grid-column:1;grid-row:2/4}.bottom{grid-column:2;grid-row:3;align-self:end}.controls{grid-template-columns:1fr 1fr}.controls #play{grid-column:1/3}.meta{grid-template-columns:1fr}.frames{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<main class="app">
<header class="top"><div class="brand"><small>PRIZIM · ATTACK STYLE COMPARISON</small><strong>KINEZA KINETIC PUNCH</strong></div><div class="status" id="boot-status">PRIZIM BOOT…</div></header>
<nav class="styles" id="styles" aria-label="Art style"></nav>
<section class="stage"><canvas id="attack-canvas"></canvas><div class="readout"><div class="pill"><b id="style-label">—</b></div><div class="pill" id="frame-label">—</div></div></section>
<footer class="bottom">
<div class="frames"><button data-frame="0">1</button><button data-frame="1">2</button><button data-frame="2">3</button><button data-frame="3">4</button><button data-frame="4">5</button><button data-frame="5">6</button></div>
<div class="meta"><div><small>TIMING</small><strong id="timing">—</strong></div><div><small>CUE</small><strong id="cue">—</strong></div><div><small>RULE</small><strong>STYLE ONLY CHANGES</strong></div></div>
<div class="controls"><button id="prev">◀ PREV</button><button id="next">NEXT ▶</button><button id="loop" class="on">LOOP ON</button><select id="speed"><option value=".5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select><button id="play">PLAY</button></div>
</footer>
</main>
<script type="module" src="./src/prizim/KinezaAttackStyleLab.js?v=1"></script>
</body>
</html>
