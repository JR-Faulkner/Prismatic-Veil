<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>The Prismatic Veil — 05J Mobile Shell Refinement</title>
<meta name="theme-color" content="#050914">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Prismatic Veil">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="./pv-mobile-shell.webmanifest?v=1">
<style>
:root {
  --navy: rgba(4,8,18,.90);
  --navy2: rgba(8,16,31,.90);
  --gold: #d9bd72;
  --goldLine: rgba(217,189,114,.52);
  --prism: #8de6ff;
  --violet: #c996ff;
  --hp: #69dd89;
  --rp: #8e73ef;
  --enemy: #c94766;
  --text: #f8efd9;
  --muted: #aaa8b3;
}
* { box-sizing:border-box; margin:0; padding:0; }
html, body {
  width:100%; height:100%; height:100dvh; overflow:hidden; background:#050914;
  touch-action:none; user-select:none; -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent; -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
#game-container { position:fixed; inset:0; width:100vw; height:100dvh; }
canvas { display:block; }
#loading {
  position:fixed; inset:0; z-index:1000; display:flex; align-items:center; justify-content:center;
  padding:24px; white-space:pre-wrap; text-align:center; color:#f7e8b6;
  font:750 15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;
  background:radial-gradient(circle at 50% 32%,#261448 0%,#050914 72%);
}
#pv-mobile-shell {
  position:fixed; inset:0; z-index:900; pointer-events:none; opacity:0; visibility:hidden;
  transition:opacity 130ms ease,visibility 0s linear 130ms;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  color:var(--text);
}
#pv-mobile-shell.is-visible { opacity:1; visibility:visible; transition:opacity 140ms ease; }
.pv-glass {
  background:linear-gradient(180deg,rgba(10,19,38,.94),rgba(3,7,16,.91));
  border:1px solid var(--goldLine);
  box-shadow:0 4px 15px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.04);
  backdrop-filter:blur(8px) saturate(1.08); -webkit-backdrop-filter:blur(8px) saturate(1.08);
}
.pv-turn,.pv-target {
  position:absolute; top:calc(env(safe-area-inset-top,0px) + 6px); height:39px; border-radius:9px;
}
.pv-turn {
  left:calc(env(safe-area-inset-left,0px) + 7px); width:clamp(132px,19vw,158px);
  display:grid; grid-template-columns:42px 1fr; overflow:hidden;
}
.pv-turn-number {
  display:grid; place-items:center; border-right:1px solid rgba(217,189,114,.28);
  color:#f3d88f; font-size:17px; font-weight:900; font-variant-numeric:tabular-nums;
}
.pv-turn-copy { display:flex; flex-direction:column; justify-content:center; padding:0 8px; min-width:0; }
.pv-kicker { font-size:7px; line-height:1; letter-spacing:.17em; color:#a99d82; font-weight:850; }
.pv-active { margin-top:3px; font-size:11px; line-height:1; color:var(--prism); font-weight:900; letter-spacing:.055em; }
.pv-target {
  right:calc(env(safe-area-inset-right,0px) + 7px); width:clamp(158px,22vw,190px); padding:6px 9px 5px;
}
.pv-target-line { display:flex; justify-content:space-between; align-items:baseline; gap:7px; }
.pv-target-name { font-size:11px; font-weight:900; letter-spacing:.05em; }
.pv-target-hp { font-size:8px; color:#fff; font-weight:800; font-variant-numeric:tabular-nums; }
.pv-bar { height:5px; margin-top:6px; border-radius:99px; overflow:hidden; background:rgba(255,255,255,.09); }
.pv-bar > i { display:block; width:100%; height:100%; border-radius:inherit; transition:width 160ms ease; }
#pv-target-fill { background:var(--enemy); }
.pv-objective {
  position:absolute; top:calc(env(safe-area-inset-top,0px) + 51px); left:50%; transform:translateX(-50%);
  max-width:54vw; padding:3px 8px; border-radius:999px;
  background:rgba(4,8,18,.59); border:1px solid rgba(201,150,255,.22);
  color:#d8cee6; font-size:7px; line-height:1.1; font-weight:800; letter-spacing:.065em;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}

/* 05J: one bottom dock, not separate hero + action slabs. */
.pv-dock {
  position:absolute; z-index:2; pointer-events:auto;
  left:calc(env(safe-area-inset-left,0px) + 7px);
  right:calc(env(safe-area-inset-right,0px) + 7px);
  bottom:calc(env(safe-area-inset-bottom,0px) + 7px);
  min-height:104px; border-radius:12px; padding:8px;
  display:grid;
  grid-template-columns:minmax(108px,.82fr) minmax(132px,1.18fr) 48px;
  grid-template-rows:38px 46px;
  gap:6px 8px;
}
.pv-hero-mini {
  grid-column:1; grid-row:1;
  min-width:0; padding-right:8px; border-right:1px solid rgba(217,189,114,.20);
  display:grid; grid-template-columns:1fr 1fr; grid-template-rows:14px 16px; column-gap:7px;
}
.pv-hero-name {
  grid-column:1 / 3; font-size:11px; line-height:1; color:#ffe4af; font-weight:900; letter-spacing:.055em;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.pv-resource {
  min-width:0; display:grid; grid-template-columns:auto 1fr; align-items:center; gap:4px;
  color:#aaa9b5; font-size:7px; font-weight:850;
}
.pv-resource strong { color:#fff; font-size:8px; font-weight:850; font-variant-numeric:tabular-nums; }
.pv-mini-bar { grid-column:1 / 3; height:4px; border-radius:99px; overflow:hidden; background:rgba(255,255,255,.08); }
.pv-mini-bar > i { display:block; height:100%; width:100%; border-radius:inherit; transition:width 160ms ease; }
#pv-hero-hp-fill { background:var(--hp); }
#pv-hero-rp-fill { background:var(--rp); }
.pv-hero-bars { grid-column:1 / 3; display:grid; grid-template-columns:1fr 1fr; gap:5px; margin-top:-1px; }

.pv-ability-block {
  grid-column:2; grid-row:1; min-width:0; display:flex; flex-direction:column; justify-content:center;
}
.pv-ability { color:#ddbaff; font-size:11px; line-height:1; font-weight:900; letter-spacing:.04em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pv-ability::before { content:"✦ "; color:var(--prism); }
.pv-action-meta { margin-top:5px; color:#aaa0b1; font-size:7px; font-weight:800; letter-spacing:.07em; }
.pv-damage { grid-column:3; grid-row:1; display:flex; flex-direction:column; align-items:flex-end; justify-content:center; color:#aa9c7e; font-size:6px; font-weight:850; letter-spacing:.08em; }
.pv-damage strong { margin-top:1px; color:#f0c8ff; font-size:18px; line-height:1; font-variant-numeric:tabular-nums; }
.pv-dock button {
  appearance:none; -webkit-appearance:none; min-height:44px; border-radius:8px;
  font:900 10px/1 -apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif;
  letter-spacing:.045em; touch-action:manipulation; cursor:pointer;
  transition:transform 75ms ease,opacity 110ms ease,filter 75ms ease;
}
.pv-dock button:active { transform:scale(.978); filter:brightness(1.14); }
#pv-confirm {
  grid-column:1 / 3; grid-row:2; color:#e9ffed;
  background:linear-gradient(180deg,rgba(27,68,42,.96),rgba(15,39,25,.97));
  border:1px solid rgba(105,221,137,.84); box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
}
#pv-back {
  grid-column:3; grid-row:2; color:#f7dfe5;
  background:linear-gradient(180deg,rgba(57,29,40,.96),rgba(34,18,25,.97));
  border:1px solid rgba(198,112,132,.62);
}
.pv-dock button:disabled { pointer-events:none; }

@media (orientation:landscape) {
  .pv-dock {
    left:auto; width:min(64vw,570px); min-height:68px;
    grid-template-columns:minmax(120px,.78fr) minmax(130px,1fr) 42px minmax(105px,.78fr) 52px;
    grid-template-rows:50px; gap:7px; padding:8px;
  }
  .pv-hero-mini { grid-column:1; grid-row:1; }
  .pv-ability-block { grid-column:2; grid-row:1; }
  .pv-damage { grid-column:3; grid-row:1; align-items:center; }
  #pv-confirm { grid-column:4; grid-row:1; }
  #pv-back { grid-column:5; grid-row:1; }
  .pv-objective { max-width:44vw; }
}
@media (max-width:430px) and (orientation:portrait) {
  .pv-turn { width:128px; }
  .pv-target { width:148px; }
  .pv-dock { grid-template-columns:minmax(98px,.78fr) minmax(118px,1.22fr) 46px; }
  .pv-hero-name,.pv-ability { font-size:10px; }
}
@media (max-height:390px) and (orientation:landscape) {
  .pv-turn,.pv-target { top:calc(env(safe-area-inset-top,0px) + 4px); height:36px; }
  .pv-objective { top:calc(env(safe-area-inset-top,0px) + 44px); }
  .pv-dock { bottom:calc(env(safe-area-inset-bottom,0px) + 4px); min-height:64px; grid-template-rows:46px; padding:7px; }
}
</style>
<script src="./phaser.min.js"></script>
</head>
<body>
<div id="loading">✦ Loading 05J Mobile Shell ✦</div>
<div id="game-container"></div>

<div id="pv-mobile-shell" aria-hidden="true">
  <section class="pv-turn pv-glass" aria-label="Turn order">
    <div class="pv-turn-number" id="pv-turn-number">01</div>
    <div class="pv-turn-copy"><div class="pv-kicker">ACTIVE TURN</div><div class="pv-active" id="pv-active-label">PRISMEL</div></div>
  </section>

  <section class="pv-target pv-glass" aria-label="Target status">
    <div class="pv-target-line"><span class="pv-target-name" id="pv-target-name">HUSHLING</span><span class="pv-target-hp" id="pv-target-hp">10 / 10</span></div>
    <div class="pv-bar"><i id="pv-target-fill"></i></div>
  </section>

  <div class="pv-objective" id="pv-objective">TOO QUIET • DEFEAT HUSHLING • VEIL 36%</div>

  <section class="pv-dock pv-glass" aria-label="Prismel battle controls">
    <div class="pv-hero-mini">
      <div class="pv-hero-name" id="pv-hero-name">PRISMEL</div>
      <div class="pv-resource"><span>HP</span><strong id="pv-hero-hp">24/24</strong></div>
      <div class="pv-resource"><span>RP</span><strong id="pv-hero-rp">8/8</strong></div>
      <div class="pv-hero-bars">
        <div class="pv-mini-bar"><i id="pv-hero-hp-fill"></i></div>
        <div class="pv-mini-bar"><i id="pv-hero-rp-fill"></i></div>
      </div>
    </div>
    <div class="pv-ability-block">
      <div class="pv-ability" id="pv-ability-name">PRISMATIC SHARD</div>
      <div class="pv-action-meta">TARGET • HUSHLING</div>
    </div>
    <div class="pv-damage"><span>DMG</span><strong id="pv-predicted-damage">4</strong></div>
    <button id="pv-confirm" type="button">CONFIRM ATTACK</button>
    <button id="pv-back" type="button">BACK</button>
  </section>
</div>

<script type="module">
import TitleScene from './src/tactical/TitleScene.js?v=7';
import IntroCrawlScene from './src/tactical/IntroCrawlScene.js?v=3';
import TacticalScene from './src/tactical/IntegratedTacticalScene05J.js?v=1';
import VeilBattleScene from './src/IntegratedVeilBattleScene.js?v=2';

const boot = document.getElementById('loading');
const shell = document.getElementById('pv-mobile-shell');
function hideShell() {
  if (!shell) return;
  shell.classList.remove('is-visible');
  shell.setAttribute('aria-hidden','true');
}
function fail(error) {
  console.error(error); hideShell();
  if (!boot) return;
  boot.style.display='flex';
  boot.textContent='Boot Error\n\n'+(error && (error.stack || error.message) ? (error.stack || error.message) : String(error));
}
window.addEventListener('error',e=>fail(e.error||e.message));
window.addEventListener('unhandledrejection',e=>fail(e.reason||e));
window.addEventListener('pagehide',hideShell);

if (!window.Phaser) {
  fail('Phaser did not load. Make sure phaser.min.js is in the repository root.');
} else {
  (function(){
    const dpr=Math.min(window.devicePixelRatio||1,3);
    const orig=Phaser.GameObjects.GameObjectFactory.prototype.text;
    Phaser.GameObjects.GameObjectFactory.prototype.text=function(x,y,text,style){
      style=style||{}; if(style.resolution===undefined) style.resolution=dpr;
      return orig.call(this,x,y,text,style);
    };
  })();
  class HarnessScene extends TacticalScene {
    create(){ hideShell(); if(boot) boot.style.display='none'; super.create(); }
  }
  try {
    new Phaser.Game({
      type:Phaser.AUTO, parent:'game-container', width:800, height:600,
      backgroundColor:'#050914', transparent:false,
      scale:{mode:Phaser.Scale.RESIZE,autoCenter:Phaser.Scale.CENTER_BOTH},
      input:{activePointers:2}, scene:[TitleScene,IntroCrawlScene,HarnessScene,VeilBattleScene]
    });
  } catch(error) { fail(error); }
}
</script>
</body>
</html>
