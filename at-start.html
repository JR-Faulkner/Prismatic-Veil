<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#251151"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="A+T"><link rel="manifest" href="./at-manifest.webmanifest"><link rel="icon" href="./assets/ui/at-home-icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="./assets/ui/at-home-icon.svg"><title>A+T · Alterations of Transformations</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0d1231;color:#fff;font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,sans-serif}body{min-height:100vh;display:grid;place-items:center;padding:calc(18px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom));background:radial-gradient(circle at 50% 34%,#39206d 0,#181747 38%,#0a1732 72%,#071020 100%);overflow:hidden}.wrap{width:min(88vw,430px);text-align:center}.icon{width:min(58vw,260px);aspect-ratio:1;border-radius:28%;display:block;margin:0 auto 18px;filter:drop-shadow(0 20px 34px #0008)}h1{margin:0;font-size:clamp(27px,8vw,42px);line-height:.95;letter-spacing:-.035em}.sub{margin:9px 0 6px;color:#d9d7ff;font-size:12px;letter-spacing:.12em;font-weight:800}.chapter{margin:0 0 20px;color:#9af0c6;font-size:10px;letter-spacing:.14em;font-weight:1000}.buttons{display:grid;gap:10px}.launch{width:100%;border:0;border-radius:18px;padding:15px 18px;font:inherit;font-size:14px;font-weight:1000;letter-spacing:.07em;touch-action:manipulation}.new{color:#24183e;background:linear-gradient(135deg,#ffe382,#ffbd66 46%,#ff8fd2);box-shadow:0 10px 30px #d65cff44}.continue{color:#f5efff;background:#ffffff12;border:1px solid #ffffff35;backdrop-filter:blur(10px)}.continue[hidden]{display:none}.hint{margin-top:13px;font-size:10px;line-height:1.45;color:#9ea6d9}.sig{position:fixed;inset:auto 0 0;height:34vh;pointer-events:none;background:radial-gradient(ellipse at 50% 100%,#4cff8b20 0,#3ce5ff16 35%,#bd54ff0f 60%,transparent 78%)}.saveNote{margin:8px 0 0;font-size:9px;color:#ffdca4;font-weight:800;letter-spacing:.06em}@media (display-mode:standalone){.hint{display:none}}</style></head><body><div class="sig"></div><main class="wrap"><img class="icon" src="./assets/ui/at-home-icon.svg" alt="A+T"><h1>ALTERATIONS OF<br>TRANSFORMATIONS</h1><div class="sub">A PURE-RPG SERIES</div><div class="chapter">THE VERDANT</div><div class="buttons"><button class="launch new" id="newGame">NEW GAME ✦</button><button class="launch continue" id="continueGame" hidden>CONTINUE</button></div><p class="saveNote" id="saveNote"></p><p class="hint">New Game begins the Verdant story fresh. Continue returns to your current A+T V4 life.</p></main><script>const SAVE='at_game_v4';const params=new URLSearchParams(location.search);if(params.get('reset')==='1'){localStorage.removeItem(SAVE);history.replaceState({},'',location.pathname);}const hasSave=()=>!!localStorage.getItem(SAVE);const continueBtn=document.getElementById('continueGame');const note=document.getElementById('saveNote');if(hasSave()){continueBtn.hidden=false;note.textContent='Verdant save detected.';}else{note.textContent='Fresh start ready.';}document.getElementById('newGame').addEventListener('click',()=>{localStorage.removeItem(SAVE);location.href='./at-game-v4.html?new=1';});continueBtn.addEventListener('click',()=>{location.href='./at-game-v4.html?continue=1';});</script></body></html>
