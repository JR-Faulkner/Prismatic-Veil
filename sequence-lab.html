<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>PriZim Sequence Lab v0.2.1</title>
<meta name="theme-color" content="#0b1428">
<style>
:root{--void:#0b1428;--panel:#111d38;--panel2:#1c2042;--gold:#ead08b;--cyan:#9bedff;--violet:#cf9cff;--text:#fffaf0;--muted:#c9c1d0;--line:rgba(234,208,139,.40);--green:#82f2a3;--rose:#e5839d}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;min-height:100dvh;background:radial-gradient(circle at 50% -8%,#49317a 0,#17233f 34%,var(--void) 82%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}body{overflow:hidden}.lab{height:100dvh;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;padding:calc(env(safe-area-inset-top,0px) + 8px) calc(env(safe-area-inset-right,0px) + 8px) calc(env(safe-area-inset-bottom,0px) + 8px) calc(env(safe-area-inset-left,0px) + 8px);gap:7px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:36px;padding:0 4px}.brand{min-width:0}.brand small{display:block;color:var(--gold);font-size:7px;font-weight:850;letter-spacing:.18em}.brand strong{display:block;margin-top:2px;font-size:15px;letter-spacing:.045em;white-space:nowrap}.status{flex:none;padding:5px 8px;border:1px solid rgba(155,237,255,.58);clip-path:polygon(5px 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%,0 5px);background:linear-gradient(135deg,rgba(34,78,108,.94),rgba(83,49,126,.94));color:var(--cyan);font-size:7px;font-weight:900;letter-spacing:.08em}.status.is-bootstrap{border-color:rgba(234,208,139,.50);color:var(--gold)}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.lab-character-tab{appearance:none;border:1px solid rgba(234,208,139,.27);background:linear-gradient(145deg,rgba(22,38,68,.97),rgba(39,27,64,.96));color:#eee5f2;min-height:43px;padding:5px 7px;clip-path:polygon(0 6px,6px 0,calc(100% - 8px) 0,100% 7px,100% calc(100% - 5px),calc(100% - 5px) 100%,5px 100%,0 calc(100% - 5px));text-align:left}.lab-character-tab span{display:block;font-weight:900;font-size:10px;letter-spacing:.055em}.lab-character-tab small{display:block;margin-top:4px;font-size:6px;letter-spacing:.10em;color:#b6adbe}.lab-character-tab.is-active{border-color:rgba(155,237,255,.84);background:linear-gradient(145deg,rgba(31,74,104,.99),rgba(82,46,122,.98));color:#fff}.lab-character-tab.is-active small{color:var(--cyan)}.workspace{min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto;gap:7px}.stage-wrap{position:relative;min-height:0;overflow:hidden;border:1px solid var(--line);background:radial-gradient(circle at 50% 46%,rgba(143,125,203,.33),transparent 48%),linear-gradient(180deg,rgba(45,59,89,.94),rgba(22,34,59,.96));clip-path:polygon(0 11px,11px 0,calc(100% - 15px) 0,100% 12px,100% calc(100% - 10px),calc(100% - 10px) 100%,12px 100%,0 calc(100% - 12px));box-shadow:inset 0 0 30px rgba(155,237,255,.06),0 8px 26px rgba(0,0,0,.18)}.stage-wrap::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,transparent 49.9%,rgba(207,156,255,.10) 50%,transparent 50.1%),linear-gradient(180deg,transparent 87.2%,rgba(234,208,139,.42) 87.4%,rgba(155,237,255,.20) 87.55%,transparent 87.75%),repeating-linear-gradient(90deg,transparent 0 47px,rgba(255,255,255,.012) 48px,transparent 49px);z-index:5}.stage-wrap::after{content:"BASELINE / AUTHORITY QA";position:absolute;left:8px;bottom:11.8%;z-index:6;color:rgba(246,222,166,.62);font-size:6px;font-weight:850;letter-spacing:.13em}.stage-wrap canvas{position:absolute;inset:0;width:100%;height:100%;opacity:0;z-index:2;filter:brightness(1.22) contrast(1.01) saturate(1.06)}.stage-wrap canvas:first-of-type{opacity:1}.loading{position:absolute;inset:0;z-index:20;display:grid;place-items:center;text-align:center;padding:20px;background:rgba(11,20,40,.86);color:var(--gold);white-space:pre-wrap;font-size:11px;font-weight:800}.sequence-copy{position:absolute;z-index:8;left:10px;top:9px;right:10px;pointer-events:none}.sequence-copy h1{margin:0;max-width:82%;font-size:12px;line-height:1.15;letter-spacing:.035em;text-shadow:0 2px 7px rgba(0,0,0,.82)}.sequence-copy p{margin:5px 0 0;max-width:88%;color:rgba(248,241,251,.84);font-size:7px;line-height:1.25}.readout{display:grid;grid-template-columns:1.35fr repeat(4,.65fr);gap:4px}.readout>div{min-width:0;padding:6px 7px;border-top:1px solid rgba(155,237,255,.24);background:linear-gradient(180deg,rgba(22,35,62,.95),rgba(12,21,40,.96))}.readout small{display:block;color:#aaa1b4;font-size:6px;font-weight:850;letter-spacing:.09em}.readout strong{display:block;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:9px}.readout .frame-main strong{color:#ffebb9}.bottom{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px;align-items:end}.plan{max-height:88px;overflow:auto;border:1px solid rgba(234,208,139,.24);background:rgba(13,23,44,.91);clip-path:polygon(0 7px,7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%);-webkit-overflow-scrolling:touch}.lab-plan-row{display:grid;grid-template-columns:24px 1fr auto;align-items:center;gap:6px;padding:5px 7px;border-bottom:1px solid rgba(255,255,255,.045);font-size:7px}.lab-plan-row:last-child{border-bottom:0}.lab-plan-row b{color:var(--gold);font-size:8px}.lab-plan-row span{color:#eee5f1}.lab-plan-row em{font-style:normal;color:var(--rose);font-size:5px;font-weight:900;letter-spacing:.08em}.lab-plan-ready{padding:9px 10px;color:#dde2e7;font-size:7px;line-height:1.35}.controls{display:grid;grid-template-columns:44px 44px 72px;grid-template-rows:38px 30px;gap:5px}.controls button,.controls select{appearance:none;border:1px solid rgba(155,237,255,.36);background:linear-gradient(145deg,#192a49,#281b40);color:#fffaf0;clip-path:polygon(0 6px,6px 0,calc(100% - 6px) 0,100% 6px,100% 100%,0 100%);font:850 8px/1 -apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif;letter-spacing:.05em}.controls button:active{filter:brightness(1.25)}.controls [data-play]{grid-column:3;grid-row:1/3;border-color:rgba(234,208,139,.66);background:linear-gradient(145deg,rgba(36,78,105,.99),rgba(91,49,126,.99));color:#fff}.controls [data-prev]{grid-column:1;grid-row:1}.controls [data-next]{grid-column:2;grid-row:1}.controls [data-loop]{grid-column:1;grid-row:2;color:#aaa1b2}.controls [data-loop].is-on{color:var(--green);border-color:rgba(130,242,163,.46)}.controls select{grid-column:2;grid-row:2;text-align:center;padding:0 2px;color:var(--cyan)}
@media(max-height:720px){.lab{gap:5px}.top{min-height:31px}.lab-character-tab{min-height:38px}.bottom{grid-template-columns:minmax(0,1fr) auto}.plan{max-height:68px}.readout>div{padding:5px 6px}.sequence-copy p{display:none}}
@media(orientation:landscape){.lab{grid-template-rows:auto auto minmax(0,1fr);grid-template-columns:minmax(0,1fr) 260px}.top{grid-column:1/3}.tabs{grid-column:2;grid-row:2}.workspace{grid-column:1;grid-row:2/4}.bottom{grid-column:2;grid-row:3;grid-template-columns:1fr}.plan{max-height:none;align-self:stretch}.controls{justify-content:end}}
</style>
</head>
<body>
<main class="lab" data-sequence-lab>
  <header class="top"><div class="brand"><small>PRIZIM • MOTION QA</small><strong>SEQUENCE LAB v0.2.1</strong></div><div class="status" data-status>AUTHORITY • QA PROXY</div></header>
  <nav class="tabs" data-tabs aria-label="Character sequences"></nav>
  <section class="workspace">
    <div class="stage-wrap" data-stage><canvas id="lab-canvas-a"></canvas><canvas id="lab-canvas-b"></canvas><div class="sequence-copy"><h1 data-sequence-title>Loading…</h1><p data-note></p></div><div class="loading" data-loading>Loading PriZim Sequence Lab…</div></div>
    <div class="readout"><div class="frame-main"><small>FRAME</small><strong data-frame-label>—</strong></div><div><small>INDEX</small><strong data-frame-count>—</strong></div><div><small>HOLD</small><strong data-hold>—</strong></div><div><small>BLEND</small><strong data-blend>—</strong></div><div><small>CUE</small><strong data-cue>—</strong></div></div><div style="display:none" data-bounds></div>
  </section>
  <footer class="bottom"><div class="plan" data-plan></div><div class="controls"><button type="button" data-prev>◀ PREV</button><button type="button" data-next>NEXT ▶</button><button type="button" data-loop class="is-on" aria-pressed="true">LOOP</button><select data-speed aria-label="Playback speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select><button type="button" data-play>PLAY</button></div></footer>
</main>
<script type="module" src="./src/prizim/SequenceLab.js?v=3"></script>
</body>
</html>
