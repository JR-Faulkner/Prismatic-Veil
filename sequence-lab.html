<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>PriZim Sequence Lab v0.2.4</title>
<meta name="theme-color" content="#111b32">
<style>
:root{--void:#101a30;--panel:#172541;--panel2:#253052;--gold:#efd99a;--cyan:#a8f0ff;--violet:#d6adff;--text:#fffdf5;--muted:#d5cedd;--line:rgba(239,217,154,.44);--green:#8df5ad;--rose:#ea92a8}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;min-height:100dvh;background:radial-gradient(circle at 50% -8%,#5a438a 0,#263653 36%,var(--void) 84%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}body{overflow:hidden}.lab{height:100dvh;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;padding:calc(env(safe-area-inset-top,0px) + 8px) calc(env(safe-area-inset-right,0px) + 8px) calc(env(safe-area-inset-bottom,0px) + 8px) calc(env(safe-area-inset-left,0px) + 8px);gap:7px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:36px;padding:0 4px}.brand{min-width:0}.brand small{display:block;color:var(--gold);font-size:7px;font-weight:850;letter-spacing:.18em}.brand strong{display:block;margin-top:2px;font-size:15px;letter-spacing:.045em;white-space:nowrap}.status{flex:none;padding:5px 8px;border:1px solid rgba(168,240,255,.62);clip-path:polygon(5px 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%,0 5px);background:linear-gradient(135deg,rgba(46,93,126,.96),rgba(96,60,139,.96));color:var(--cyan);font-size:7px;font-weight:900;letter-spacing:.08em}.status.is-bootstrap{border-color:rgba(239,217,154,.54);color:var(--gold)}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.lab-character-tab{appearance:none;border:1px solid rgba(239,217,154,.30);background:linear-gradient(145deg,rgba(31,51,83,.98),rgba(52,37,77,.97));color:#f2eaf5;min-height:43px;padding:5px 7px;clip-path:polygon(0 6px,6px 0,calc(100% - 8px) 0,100% 7px,100% calc(100% - 5px),calc(100% - 5px) 100%,5px 100%,0 calc(100% - 5px));text-align:left}.lab-character-tab span{display:block;font-weight:900;font-size:10px;letter-spacing:.055em}.lab-character-tab small{display:block;margin-top:4px;font-size:6px;letter-spacing:.10em;color:#c4bbc9}.lab-character-tab.is-active{border-color:rgba(168,240,255,.88);background:linear-gradient(145deg,rgba(45,89,121,.99),rgba(96,57,139,.99));color:#fff}.lab-character-tab.is-active small{color:var(--cyan)}.workspace{min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto;gap:7px}.stage-wrap{position:relative;min-height:0;overflow:hidden;border:1px solid var(--line);background:radial-gradient(circle at 50% 45%,rgba(191,181,228,.52),transparent 52%),linear-gradient(180deg,rgba(78,96,126,.98),rgba(42,59,88,.98));clip-path:polygon(0 11px,11px 0,calc(100% - 15px) 0,100% 12px,100% calc(100% - 10px),calc(100% - 10px) 100%,12px 100%,0 calc(100% - 12px));box-shadow:inset 0 0 24px rgba(168,240,255,.08),0 8px 22px rgba(0,0,0,.14)}.stage-wrap::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,transparent 49.9%,rgba(214,173,255,.08) 50%,transparent 50.1%),linear-gradient(180deg,transparent 87.2%,rgba(239,217,154,.34) 87.4%,rgba(168,240,255,.14) 87.55%,transparent 87.75%),repeating-linear-gradient(90deg,transparent 0 55px,rgba(255,255,255,.008) 56px,transparent 57px);z-index:5}.stage-wrap::after{content:"BASELINE / AUTHORITY QA";position:absolute;left:8px;bottom:11.8%;z-index:6;color:rgba(255,232,179,.58);font-size:6px;font-weight:850;letter-spacing:.13em}.stage-wrap canvas{position:absolute;inset:0;width:100%;height:100%;opacity:0;z-index:2;filter:brightness(1.18) contrast(1.00) saturate(1.05)}.stage-wrap canvas:first-of-type{opacity:1}.loading{position:absolute;inset:0;z-index:20;display:grid;place-items:center;text-align:center;padding:20px;background:rgba(16,26,48,.80);color:var(--gold);white-space:pre-wrap;font-size:11px;font-weight:800}.loading[hidden]{display:none!important}.sequence-copy{position:absolute;z-index:8;left:10px;top:9px;right:10px;pointer-events:none}.sequence-copy h1{margin:0;max-width:82%;font-size:12px;line-height:1.15;letter-spacing:.035em;color:#fffdf5;text-shadow:0 2px 6px rgba(0,0,0,.72)}.sequence-copy p{margin:5px 0 0;max-width:88%;color:rgba(255,248,255,.90);font-size:7px;line-height:1.25}.readout{display:grid;grid-template-columns:1.35fr repeat(4,.65fr);gap:4px}.readout>div{min-width:0;padding:6px 7px;border-top:1px solid rgba(168,240,255,.26);background:linear-gradient(180deg,rgba(31,47,76,.96),rgba(17,29,51,.97))}.readout small{display:block;color:#b9b0c1;font-size:6px;font-weight:850;letter-spacing:.09em}.readout strong{display:block;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:9px}.readout .frame-main strong{color:#fff0c6}.bottom{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px;align-items:end}.plan{max-height:88px;overflow:auto;border:1px solid rgba(239,217,154,.26);background:rgba(19,31,55,.92);clip-path:polygon(0 7px,7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%);-webkit-overflow-scrolling:touch}.lab-plan-row{display:grid;grid-template-columns:24px 1fr auto;align-items:center;gap:6px;padding:5px 7px;border-bottom:1px solid rgba(255,255,255,.045);font-size:7px}.lab-plan-row:last-child{border-bottom:0}.lab-plan-row b{color:var(--gold);font-size:8px}.lab-plan-row span{color:#f3eaf5}.lab-plan-row em{font-style:normal;color:var(--rose);font-size:5px;font-weight:900;letter-spacing:.08em}.lab-plan-ready{padding:9px 10px;color:#e7ebef;font-size:7px;line-height:1.35}.controls{display:grid;grid-template-columns:44px 44px 72px;grid-template-rows:38px 30px;gap:5px}.controls button,.controls select{appearance:none;border:1px solid rgba(168,240,255,.40);background:linear-gradient(145deg,#203454,#332245);color:#fffdf5;clip-path:polygon(0 6px,6px 0,calc(100% - 6px) 0,100% 6px,100% 100%,0 100%);font:850 8px/1 -apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif;letter-spacing:.05em}.controls button:active{filter:brightness(1.2)}.controls [data-play]{grid-column:3;grid-row:1/3;border-color:rgba(239,217,154,.70);background:linear-gradient(145deg,rgba(49,91,119,.99),rgba(104,59,141,.99));color:#fff}.controls [data-prev]{grid-column:1;grid-row:1}.controls [data-next]{grid-column:2;grid-row:1}.controls [data-loop]{grid-column:1;grid-row:2;color:#b8afc0}.controls [data-loop].is-on{color:var(--green);border-color:rgba(141,245,173,.50)}.controls select{grid-column:2;grid-row:2;text-align:center;padding:0 2px;color:var(--cyan)}
@media(max-height:720px){.lab{gap:5px}.top{min-height:31px}.lab-character-tab{min-height:38px}.bottom{grid-template-columns:minmax(0,1fr) auto}.plan{max-height:68px}.readout>div{padding:5px 6px}.sequence-copy p{display:none}}
@media(orientation:landscape){.lab{grid-template-rows:auto auto minmax(0,1fr);grid-template-columns:minmax(0,1fr) 260px}.top{grid-column:1/3}.tabs{grid-column:2;grid-row:2}.workspace{grid-column:1;grid-row:2/4}.bottom{grid-column:2;grid-row:3;grid-template-columns:1fr}.plan{max-height:none;align-self:stretch}.controls{justify-content:end}}
</style>
</head>
<body>
<main class="lab" data-sequence-lab>
  <header class="top"><div class="brand"><small>PRIZIM • MOTION BRIDGE QA</small><strong>SEQUENCE LAB v0.2.4</strong></div><div class="status" data-status>AUTHORITY • MOTION BRIDGE</div></header>
  <nav class="tabs" data-tabs aria-label="Character sequences"></nav>
  <section class="workspace">
    <div class="stage-wrap" data-stage><canvas id="lab-canvas-a"></canvas><canvas id="lab-canvas-b"></canvas><div class="sequence-copy"><h1 data-sequence-title>Loading…</h1><p data-note></p></div><div class="loading" data-loading>Loading PriZim Sequence Lab…</div></div>
    <div class="readout"><div class="frame-main"><small>FRAME</small><strong data-frame-label>—</strong></div><div><small>INDEX</small><strong data-frame-count>—</strong></div><div><small>HOLD</small><strong data-hold>—</strong></div><div><small>BLEND</small><strong data-blend>—</strong></div><div><small>CUE</small><strong data-cue>—</strong></div></div><div style="display:none" data-bounds></div>
  </section>
  <footer class="bottom"><div class="plan" data-plan></div><div class="controls"><button type="button" data-prev>◀ PREV</button><button type="button" data-next>NEXT ▶</button><button type="button" data-loop class="is-on" aria-pressed="true">LOOP</button><select data-speed aria-label="Playback speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select><button type="button" data-play>PLAY</button></div></footer>
</main>
<script type="module" src="./src/prizim/SequenceLab.js?v=6"></script>
</body>
</html>
