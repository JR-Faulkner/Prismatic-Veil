<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>PriZim Sequence Lab v0.2</title>
<meta name="theme-color" content="#07101f">
<style>
:root{--void:#060b18;--panel:#0d1730;--gold:#efd28c;--cyan:#9beaff;--violet:#c49cff;--text:#fff9ed;--muted:#bbb4c7;--line:rgba(239,210,140,.38);--green:#84f4a6;--rose:#e9859f}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;min-height:100dvh;background:radial-gradient(circle at 50% -12%,#34225f 0,#0d1730 31%,var(--void) 78%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}body{overflow:hidden}.lab{height:100dvh;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;padding:calc(env(safe-area-inset-top,0px) + 8px) calc(env(safe-area-inset-right,0px) + 8px) calc(env(safe-area-inset-bottom,0px) + 8px) calc(env(safe-area-inset-left,0px) + 8px);gap:7px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:36px;padding:0 4px}.brand small{display:block;color:var(--gold);font-size:7px;font-weight:900;letter-spacing:.18em}.brand strong{display:block;margin-top:2px;font-size:15px;letter-spacing:.045em}.status{flex:none;padding:5px 8px;border:1px solid rgba(155,234,255,.55);clip-path:polygon(5px 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%,0 5px);background:linear-gradient(135deg,rgba(25,57,83,.94),rgba(67,38,105,.92));color:var(--cyan);font-size:7px;font-weight:900;letter-spacing:.08em}.status.is-bootstrap{border-color:rgba(239,210,140,.52);color:var(--gold)}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.lab-character-tab{appearance:none;border:1px solid rgba(239,210,140,.24);background:linear-gradient(145deg,rgba(14,27,54,.96),rgba(30,20,53,.94));color:#e2d9e8;min-height:43px;padding:5px 7px;clip-path:polygon(0 6px,6px 0,calc(100% - 8px) 0,100% 7px,100% calc(100% - 5px),calc(100% - 5px) 100%,5px 100%,0 calc(100% - 5px));text-align:left}.lab-character-tab span{display:block;font-weight:900;font-size:10px;letter-spacing:.055em}.lab-character-tab small{display:block;margin-top:4px;font-size:6px;letter-spacing:.10em;color:#aaa2b7}.lab-character-tab.is-active{border-color:rgba(155,234,255,.78);background:linear-gradient(145deg,rgba(23,61,91,.98),rgba(73,39,111,.97));color:#fff}.lab-character-tab.is-active small{color:var(--cyan)}.workspace{min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto;gap:7px}.stage-wrap{position:relative;min-height:0;overflow:hidden;border:1px solid rgba(239,210,140,.48);background:radial-gradient(circle at 50% 49%,rgba(100,99,165,.22),transparent 43%),linear-gradient(180deg,#18243d 0,#111b32 52%,#0b1428 100%);clip-path:polygon(0 11px,11px 0,calc(100% - 15px) 0,100% 12px,100% calc(100% - 10px),calc(100% - 10px) 100%,12px 100%,0 calc(100% - 12px));box-shadow:inset 0 0 30px rgba(155,234,255,.045),0 8px 30px rgba(0,0,0,.22)}.stage-wrap::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,transparent 49.9%,rgba(196,156,255,.10) 50%,transparent 50.1%),linear-gradient(180deg,transparent 86.25%,rgba(239,210,140,.52) 86.45%,rgba(155,234,255,.28) 86.6%,transparent 86.8%),repeating-linear-gradient(90deg,transparent 0 47px,rgba(255,255,255,.012) 48px,transparent 49px);z-index:5}.stage-wrap::after{content:"BASELINE / VISIBLE-ALPHA NORMALIZED";position:absolute;left:8px;bottom:13.6%;z-index:6;color:rgba(239,210,140,.72);font-size:6px;font-weight:900;letter-spacing:.12em}.stage-wrap canvas{position:absolute;inset:0;width:100%;height:100%;opacity:0;z-index:2;filter:brightness(1.22) contrast(1.06) saturate(1.08)}.stage-wrap canvas:first-of-type{opacity:1}.loading{position:absolute;inset:0;z-index:20;display:grid;place-items:center;text-align:center;padding:20px;background:rgba(7,13,27,.91);color:var(--gold);white-space:pre-wrap;font-size:11px;font-weight:850}.sequence-copy{position:absolute;z-index:8;left:10px;top:9px;right:10px;pointer-events:none}.sequence-copy h1{margin:0;max-width:82%;font-size:12px;line-height:1.15;letter-spacing:.035em;text-shadow:0 2px 7px #000}.sequence-copy p{margin:5px 0 0;max-width:86%;color:rgba(246,240,249,.78);font-size:7px;line-height:1.25;text-shadow:0 1px 4px #000}.readout{display:grid;grid-template-columns:1.35fr repeat(4,.65fr);gap:4px}.readout>div{min-width:0;padding:6px 7px;border-top:1px solid rgba(155,234,255,.23);background:linear-gradient(180deg,rgba(18,31,58,.96),rgba(9,16,34,.96))}.readout small{display:block;color:#a39aad;font-size:6px;font-weight:850;letter-spacing:.09em}.readout strong{display:block;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:9px}.readout .frame-main strong{color:#ffe7a9}.bottom{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px;align-items:end}.plan{max-height:88px;overflow:auto;border:1px solid rgba(239,210,140,.22);background:rgba(10,18,37,.88);clip-path:polygon(0 7px,7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%);-webkit-overflow-scrolling:touch}.lab-plan-row{display:grid;grid-template-columns:24px 1fr auto;align-items:center;gap:6px;padding:5px 7px;border-bottom:1px solid rgba(255,255,255,.045);font-size:7px}.lab-plan-row:last-child{border-bottom:0}.lab-plan-row b{color:var(--gold);font-size:8px}.lab-plan-row span{color:#e6ddeb}.lab-plan-row em{font-style:normal;color:var(--rose);font-size:5px;font-weight:900;letter-spacing:.08em}.lab-plan-ready{padding:9px 10px;color:#d0cad8;font-size:7px;line-height:1.35}.controls{display:grid;grid-template-columns:44px 44px 72px;grid-template-rows:38px 30px;gap:5px}.controls button,.controls select{appearance:none;border:1px solid rgba(155,234,255,.34);background:linear-gradient(145deg,#152440,#211738);color:#fffaf0;clip-path:polygon(0 6px,6px 0,calc(100% - 6px) 0,100% 6px,100% 100%,0 100%);font:850 8px/1 -apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif;letter-spacing:.05em}.controls button:active{filter:brightness(1.3)}.controls [data-play]{grid-column:3;grid-row:1/3;border-color:rgba(239,210,140,.70);background:linear-gradient(145deg,rgba(31,67,94,.99),rgba(83,43,116,.99));color:#fff}.controls [data-prev]{grid-column:1;grid-row:1}.controls [data-next]{grid-column:2;grid-row:1}.controls [data-loop]{grid-column:1;grid-row:2;color:#aaa2b4}.controls [data-loop].is-on{color:var(--green);border-color:rgba(132,244,166,.50)}.controls select{grid-column:2;grid-row:2;text-align:center;padding:0 2px;color:var(--cyan)}
@media(max-height:720px){.lab{gap:5px}.top{min-height:31px}.lab-character-tab{min-height:38px}.plan{max-height:68px}.readout>div{padding:5px 6px}.sequence-copy p{display:none}}
@media(orientation:landscape){.lab{grid-template-rows:auto auto minmax(0,1fr);grid-template-columns:minmax(0,1fr) 260px}.top{grid-column:1/3}.tabs{grid-column:2;grid-row:2}.workspace{grid-column:1;grid-row:2/4}.bottom{grid-column:2;grid-row:3;grid-template-columns:1fr}.plan{max-height:none;align-self:stretch}.controls{justify-content:end}}
</style>
</head>
<body>
<main class="lab" data-sequence-lab>
  <header class="top"><div class="brand"><small>PRIZIM • AUTHORITY MOTION QA</small><strong>SEQUENCE LAB v0.2</strong></div><div class="status" data-status>AUTHORITY • QA</div></header>
  <nav class="tabs" data-tabs aria-label="Character sequences"></nav>
  <section class="workspace">
    <div class="stage-wrap" data-stage><canvas id="lab-canvas-a"></canvas><canvas id="lab-canvas-b"></canvas><div class="sequence-copy"><h1 data-sequence-title>Loading…</h1><p data-note></p></div><div class="loading" data-loading>Loading PriZim Sequence Lab v0.2…</div></div>
    <div class="readout"><div class="frame-main"><small>FRAME</small><strong data-frame-label>—</strong></div><div><small>INDEX</small><strong data-frame-count>—</strong></div><div><small>HOLD</small><strong data-hold>—</strong></div><div><small>BLEND</small><strong data-blend>—</strong></div><div><small>CUE</small><strong data-cue>—</strong></div></div>
    <div style="display:none" data-bounds></div>
  </section>
  <footer class="bottom"><div class="plan" data-plan></div><div class="controls"><button type="button" data-prev>◀ PREV</button><button type="button" data-next>NEXT ▶</button><button type="button" data-loop class="is-on" aria-pressed="true">LOOP</button><select data-speed aria-label="Playback speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select><button type="button" data-play>PLAY</button></div></footer>
</main>
<script type="module" src="./src/prizim/SequenceLab.js?v=2"></script>
</body>
</html>
