<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>PriZim Sequence Lab</title>
<meta name="theme-color" content="#050914">
<style>
:root{--void:#050914;--panel:#0a1022;--panel2:#11152c;--gold:#dec47c;--cyan:#8fe6ff;--violet:#bb8cff;--text:#f9f1df;--muted:#aaa2b5;--line:rgba(222,196,124,.30);--green:#79ef9c;--rose:#df7892}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;min-height:100dvh;background:radial-gradient(circle at 50% -10%,#28184d 0,#090d1b 30%,var(--void) 75%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}body{overflow:hidden}.lab{height:100dvh;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;padding:calc(env(safe-area-inset-top,0px) + 8px) calc(env(safe-area-inset-right,0px) + 8px) calc(env(safe-area-inset-bottom,0px) + 8px) calc(env(safe-area-inset-left,0px) + 8px);gap:7px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:36px;padding:0 4px}.brand{min-width:0}.brand small{display:block;color:var(--gold);font-size:7px;font-weight:850;letter-spacing:.18em}.brand strong{display:block;margin-top:2px;font-size:15px;letter-spacing:.045em;white-space:nowrap}.status{flex:none;padding:5px 8px;border:1px solid rgba(143,230,255,.42);clip-path:polygon(5px 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%,0 5px);background:linear-gradient(135deg,rgba(21,45,69,.84),rgba(43,28,79,.84));color:var(--cyan);font-size:7px;font-weight:900;letter-spacing:.08em}.status.is-bootstrap{border-color:rgba(222,196,124,.42);color:var(--gold)}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.lab-character-tab{appearance:none;border:1px solid rgba(222,196,124,.18);background:linear-gradient(145deg,rgba(12,18,36,.94),rgba(20,14,39,.92));color:#d8cedd;min-height:43px;padding:5px 7px;clip-path:polygon(0 6px,6px 0,calc(100% - 8px) 0,100% 7px,100% calc(100% - 5px),calc(100% - 5px) 100%,5px 100%,0 calc(100% - 5px));text-align:left}.lab-character-tab span{display:block;font-weight:900;font-size:10px;letter-spacing:.055em}.lab-character-tab small{display:block;margin-top:4px;font-size:6px;letter-spacing:.10em;color:#8f8799}.lab-character-tab.is-active{border-color:rgba(143,230,255,.66);background:linear-gradient(145deg,rgba(18,43,67,.96),rgba(53,29,88,.94));color:#fff}.lab-character-tab.is-active small{color:var(--cyan)}.workspace{min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto;gap:7px}.stage-wrap{position:relative;min-height:0;overflow:hidden;border:1px solid var(--line);background:radial-gradient(circle at 50% 45%,rgba(115,67,188,.15),transparent 34%),linear-gradient(180deg,rgba(8,13,28,.94),rgba(4,8,18,.98));clip-path:polygon(0 11px,11px 0,calc(100% - 15px) 0,100% 12px,100% calc(100% - 10px),calc(100% - 10px) 100%,12px 100%,0 calc(100% - 12px));box-shadow:inset 0 0 28px rgba(143,230,255,.025),0 8px 30px rgba(0,0,0,.25)}.stage-wrap::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,transparent 49.85%,rgba(187,140,255,.16) 50%,transparent 50.15%),linear-gradient(180deg,transparent 86.25%,rgba(222,196,124,.48) 86.45%,rgba(143,230,255,.24) 86.6%,transparent 86.8%),repeating-linear-gradient(90deg,transparent 0 39px,rgba(255,255,255,.018) 40px,transparent 41px);z-index:5}.stage-wrap::after{content:"BASELINE / ALPHA NORMALIZED";position:absolute;left:8px;bottom:13.8%;z-index:6;color:rgba(222,196,124,.58);font-size:6px;font-weight:850;letter-spacing:.13em}.stage-wrap canvas{position:absolute;inset:0;width:100%;height:100%;opacity:0;z-index:2}.stage-wrap canvas:first-of-type{opacity:1}.loading{position:absolute;inset:0;z-index:20;display:grid;place-items:center;text-align:center;padding:20px;background:rgba(5,9,20,.88);color:var(--gold);white-space:pre-wrap;font-size:11px;font-weight:800}.sequence-copy{position:absolute;z-index:8;left:10px;top:9px;right:10px;pointer-events:none}.sequence-copy h1{margin:0;max-width:78%;font-size:12px;line-height:1.15;letter-spacing:.035em;text-shadow:0 2px 8px #000}.sequence-copy p{margin:5px 0 0;max-width:83%;color:rgba(230,222,235,.65);font-size:7px;line-height:1.25}.readout{display:grid;grid-template-columns:1.35fr repeat(4,.65fr);gap:4px}.readout>div{min-width:0;padding:6px 7px;border-top:1px solid rgba(143,230,255,.16);background:linear-gradient(180deg,rgba(13,19,38,.92),rgba(7,10,24,.94))}.readout small{display:block;color:#837b8e;font-size:6px;font-weight:850;letter-spacing:.09em}.readout strong{display:block;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:9px}.readout .frame-main strong{color:#f6e3b1}.bottom{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px;align-items:end}.plan{max-height:88px;overflow:auto;border:1px solid rgba(222,196,124,.17);background:rgba(7,11,24,.82);clip-path:polygon(0 7px,7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%);-webkit-overflow-scrolling:touch}.lab-plan-row{display:grid;grid-template-columns:24px 1fr auto;align-items:center;gap:6px;padding:5px 7px;border-bottom:1px solid rgba(255,255,255,.035);font-size:7px}.lab-plan-row:last-child{border-bottom:0}.lab-plan-row b{color:var(--gold);font-size:8px}.lab-plan-row span{color:#dcd2e2}.lab-plan-row em{font-style:normal;color:var(--rose);font-size:5px;font-weight:900;letter-spacing:.08em}.lab-plan-ready{padding:9px 10px;color:#bfc7cf;font-size:7px;line-height:1.35}.controls{display:grid;grid-template-columns:44px 44px 72px;grid-template-rows:38px 30px;gap:5px}.controls button,.controls select{appearance:none;border:1px solid rgba(143,230,255,.28);background:linear-gradient(145deg,#101a31,#18122e);color:#f7f1e7;clip-path:polygon(0 6px,6px 0,calc(100% - 6px) 0,100% 6px,100% 100%,0 100%);font:850 8px/1 -apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif;letter-spacing:.05em}.controls button:active{filter:brightness(1.25)}.controls [data-play]{grid-column:3;grid-row:1/3;border-color:rgba(222,196,124,.54);background:linear-gradient(145deg,rgba(25,48,70,.98),rgba(71,37,99,.98));color:#fff}.controls [data-prev]{grid-column:1;grid-row:1}.controls [data-next]{grid-column:2;grid-row:1}.controls [data-loop]{grid-column:1;grid-row:2;color:#8d8595}.controls [data-loop].is-on{color:var(--green);border-color:rgba(121,239,156,.38)}.controls select{grid-column:2;grid-row:2;text-align:center;padding:0 2px;color:var(--cyan)}
@media(max-height:720px){.lab{gap:5px}.top{min-height:31px}.lab-character-tab{min-height:38px}.bottom{grid-template-columns:minmax(0,1fr) auto}.plan{max-height:68px}.readout>div{padding:5px 6px}.sequence-copy p{display:none}}
@media(orientation:landscape){.lab{grid-template-rows:auto auto minmax(0,1fr);grid-template-columns:minmax(0,1fr) 260px}.top{grid-column:1/3}.tabs{grid-column:2;grid-row:2}.workspace{grid-column:1;grid-row:2/4}.bottom{grid-column:2;grid-row:3;grid-template-columns:1fr}.plan{max-height:none;align-self:stretch}.controls{justify-content:end}}
</style>
</head>
<body>
<main class="lab" data-sequence-lab>
  <header class="top">
    <div class="brand"><small>PRIZIM • MOTION QA</small><strong>SEQUENCE LAB v0.1</strong></div>
    <div class="status" data-status>SIGNATURE READY • QA</div>
  </header>
  <nav class="tabs" data-tabs aria-label="Character sequences"></nav>
  <section class="workspace">
    <div class="stage-wrap" data-stage>
      <canvas id="lab-canvas-a"></canvas><canvas id="lab-canvas-b"></canvas>
      <div class="sequence-copy"><h1 data-sequence-title>Loading…</h1><p data-note></p></div>
      <div class="loading" data-loading>Loading PriZim Sequence Lab…</div>
    </div>
    <div class="readout">
      <div class="frame-main"><small>FRAME</small><strong data-frame-label>—</strong></div>
      <div><small>INDEX</small><strong data-frame-count>—</strong></div>
      <div><small>HOLD</small><strong data-hold>—</strong></div>
      <div><small>BLEND</small><strong data-blend>—</strong></div>
      <div><small>CUE</small><strong data-cue>—</strong></div>
    </div>
    <div style="display:none" data-bounds></div>
  </section>
  <footer class="bottom">
    <div class="plan" data-plan></div>
    <div class="controls">
      <button type="button" data-prev>◀ PREV</button>
      <button type="button" data-next>NEXT ▶</button>
      <button type="button" data-loop class="is-on" aria-pressed="true">LOOP</button>
      <select data-speed aria-label="Playback speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select>
      <button type="button" data-play>PLAY</button>
    </div>
  </footer>
</main>
<script type="module" src="./src/prizim/SequenceLab.js?v=1"></script>
</body>
</html>
