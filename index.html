ttom) + 16px));transform:translateX(-50%);display:flex;gap:9px;align-items:center;justify-content:center;pointer-events:auto}.go{display:inline-block;padding:10px 16px;border:1px solid #d5b768;border-radius:999px;background:#070817b8;color:#f7e8c3;text-decoration:none;font:bold 11px Georgia;letter-spacing:.10em;box-shadow:0 8px 22px #0007;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}.go.primary{background:linear-gradient(#fff0c8ee,#d7b86eee);color:#261a10}.go:focus,.go.navfocus{outline:none;box-shadow:0 0 0 2px #8ee9ff,0 0 22px #8d4dff99}.menu[hidden],.gate[hidden]{display:none}@keyframes pulse{50%{opacity:.55}}@media(max-width:560px){.menu{gap:6px}.go{padding:9px 12px;font-size:10px}.gate{bottom:max(24px,calc(env(safe-area-inset-bottom) + 14px))}}</style></head><body><main class="wrap"><div id="gate" class="gate">PRESS ANY BUTTON</div><nav id="menu" class="menu" hidden><a class="go primary" href="./story-scroll.html">ENTER THE VEIL</a><a class="go" href="./pza-main.html">PZ-A</a></nav></main><audio id="titleMusic" preload="auto" loop></audio><script>const gate=document.getElementById('gate'),menu=document.getElementById('menu'),music=document.getElementById('titleMusic');let unlocked=false,lastPad={up:false,down:false,a:false},focusIndex=0;music.volume=.62;const choices=()=>[...menu.querySelectorAll('.go')];const TITLE_TRACKS=['./assets/music/Prism of Elders.mp3?pvasset=live28f','./assets/music/veil_clockwork_drift.mp3?pvasset=live28f'];let titleTrackIndex=0;function loadTitleTrack(i=0){titleTrackIndex=i;if(i>=TITLE_TRACKS.length)return;music.src=TITLE_TRACKS[i];music.load()}music.addEventListener('error',()=>{if(titleTrackIndex+1<TITLE_TRACKS.length)loadTitleTrack(titleTrackIndex+1)});loadTitleTrack();async function syncLiveRoutes(){try{const r=await fetch(`./live-build.json?ts=${Date.now()}`,{cache:'no-store'});if(!r.ok)return;const build=await r.json(),a=choices();if(build.story&&a[0])a[0].href=`./${build.story}`;if(build.pza&&a[1])a[1].href=`./${build.pza}`;document.documentElement.dataset.pvbuild=build.id||'main'}catch(e){}}syncLiveRoutes();function focus(i){const a=choices();if(!a.length)return;focusIndex=(i+a.length)%a.length;a.forEach(x=>x.classList.remove('navfocus'));a[focusIndex].classList.add('navfocus');a[focusIndex].focus({preventScroll:true})}async function startTitleMusic(){try{if(music.paused)await music.play()}catch(e){}}async function unlockTitle(){if(unlocked)return;unlocked=true;await startTitleMusic();gate.hidden=true;menu.hidden=false;focus(0)}document.addEventListener('visibilitychange',()=>{if(!document.hidden&&unlocked)startTitleMusic()});addEventListener('pageshow',()=>{if(unlocked)startTitleMusic()});addEventListener('pointerdown',unlockTitle,{once:true});addEventListener('keydown',e=>{if(!unlocked){e.preventDefault();unlockTitle();return}if(e.key==='ArrowDown'||e.key==='ArrowRight'){e.preventDefault();focus(focusIndex+1)}else if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();focus(focusIndex-1)}else if((e.key==='Enter'||e.key===' ')&&document.activeElement?.href){e.preventDefault();location.href=document.activeElement.href}});function pads(){const p=navigator.getGamepads?.()[0];if(p){const st={up:p.buttons[12]?.pressed||p.axes?.[1]<-.55,down:p.buttons[13]?.pressed||p.axes?.[1]>.55,a:p.buttons[0]?.pressed};const any=p.buttons.some(b=>b.pressed);if(!unlocked&&any)unlockTitle();else if(unlocked){if(st.down&&!lastPad.down)focus(focusIndex+1);if(st.up&&!lastPad.up)focus(focusIndex-1);if(st.a&&!lastPad.a&&document.activeElement?.href)location.href=document.activeElement.href}lastPad=st}requestAnimationFrame(pads)}pads();</script></body></html>
