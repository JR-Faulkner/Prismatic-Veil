<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#070817"><title>The Prismatic Veil</title><link rel="apple-touch-icon" sizes="180x180" href="./assets/ui/apple_touch_icon_180.png"><link rel="icon" type="image/png" sizes="192x192" href="./assets/ui/android_chrome_192.png"><link rel="icon" type="image/png" sizes="512x512" href="./assets/ui/android_chrome_512.png"><link rel="manifest" href="./tactical.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="The Prismatic Veil"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;height:100dvh;overflow:hidden;background:#070817;color:#f7e8c3;font-family:Georgia,serif}body{background:linear-gradient(#05071622,#0507169c),url("./title_screen.jpg") center/cover no-repeat;touch-action:manipulation;-webkit-user-select:none;user-select:none}.wrap{height:100%;height:100dvh;display:grid;place-items:center;padding:max(20px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left))}.card{text-align:center;width:min(760px,90vw);padding:clamp(22px,5vh,46px);background:radial-gradient(ellipse at center,#07081778 0,#07081731 52%,transparent 78%);text-shadow:0 3px 18px #000}.eye{font:11px system-ui;letter-spacing:.28em;color:#d7b86d}h1{margin:12px 0 10px;font-size:clamp(38px,7vw,78px);line-height:.9;letter-spacing:.07em;font-weight:500;text-shadow:0 0 28px #9c5eff66,0 4px 20px #000}.tag{color:#e4d7ee;font-style:italic;font-size:clamp(13px,2vw,19px);margin:0 0 28px}.go,.gate{display:inline-block;min-width:min(320px,78vw);padding:14px 22px;border:1px solid #d5b768;border-radius:9px;font-weight:bold;letter-spacing:.12em}.go{background:linear-gradient(#fff0c8,#d7b86e);color:#261a10;text-decoration:none;box-shadow:0 0 24px #8d4dff44,inset 0 1px #fff9}.go:focus,.go.navfocus{outline:none;box-shadow:0 0 0 2px #8ee9ff,0 0 24px #8d4dff99,inset 0 1px #fff9}.gate{color:#f4e3bb;background:#090b22a8;box-shadow:0 0 28px #0008;animation:pulse 1.45s ease-in-out infinite}.go[hidden],.gate[hidden]{display:none}@keyframes pulse{50%{opacity:.58}}@media(orientation:portrait){.card{width:min(94vw,620px)}h1{font-size:clamp(40px,11vw,66px)}}
</style></head><body><main class="wrap"><section class="card"><div class="eye">THE VEIL IS OPEN</div><h1>THE<br>PRISMATIC VEIL</h1><p class="tag">Beyond the spectrum lies the unknown.</p><div id="gate" class="gate">PRESS ANY BUTTON</div><a id="enter" class="go" href="./story-scroll.html" hidden>ENTER THE VEIL</a></section></main><audio id="titleMusic" src="./assets/music/veil_clockwork_drift.mp3" preload="auto" loop></audio><script>
const gate=document.getElementById('gate'),enter=document.getElementById('enter'),music=document.getElementById('titleMusic');let unlocked=false,lastPad=false;music.volume=.62;
async function unlockTitle(){if(unlocked)return;unlocked=true;try{await music.play()}catch(e){}gate.hidden=true;enter.hidden=false;enter.focus({preventScroll:true});enter.classList.add('navfocus')}
addEventListener('pointerdown',unlockTitle,{once:true});addEventListener('keydown',e=>{if(!unlocked){e.preventDefault();unlockTitle();return}if((e.key==='Enter'||e.key===' ')&&document.activeElement===enter){e.preventDefault();location.href=enter.href}});
function pads(){const p=navigator.getGamepads?.()[0];const any=!!p&&p.buttons.some(b=>b.pressed);if(any&&!lastPad)unlockTitle();lastPad=any;requestAnimationFrame(pads)}pads();
</script></body></html>
