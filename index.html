y loop playsinline webkit-playsinline preload="auto" poster="./title_screen.jpg" aria-hidden="true"><source src="./assets/video/title_splash_loop.mp4?pvasset=live29b3" type="video/mp4"></video><main class="wrap"><div id="gate" class="gate">PRESS ANY BUTTON</div><nav id="menu" class="menu" hidden aria-label="Main menu"><a class="go primary" href="./story-scroll.html">ENTER THE VEIL</a><a class="go" href="./hybrid-overworld.html">OVERWORLD</a><a class="go" href="./pza-main.html">PZ-A</a></nav></main><audio id="titleMusic" preload="auto" loop></audio><script>const gate=document.getElementById('gate'),menu=document.getElementById('menu'),music=document.getElementById('titleMusic'),video=document.getElementById('titleVideo');let unlocked=false,lastPad={up:false,down:false,a:false},focusIndex=0,altTimer=null;music.volume=.62;video.muted=true;const choices=()=>[...menu.querySelectorAll('.go')];const TITLE_TRACKS=['./assets/music/Prism of Elders.mp3?pvasset=live28f','./assets/music/veil_clockwork_drift.mp3?pvasset=live28f'];let titleTrackIndex=0;function loadTitleTrack(i=0){titleTrackIndex=i;if(i>=TITLE_TRACKS.length)return;music.src=TITLE_TRACKS[i];music.load()}music.addEventListener('error',()=>{if(titleTrackIndex+1<TITLE_TRACKS.length)loadTitleTrack(titleTrackIndex+1)});loadTitleTrack();async function syncLiveRoutes(){try{const r=await fetch(`./live-build.json?ts=${Date.now()}`,{cache:'no-store'});if(!r.ok)return;const build=await r.json(),a=choices();if(build.story&&a[0])a[0].href=`./${build.story}`;if(build.pza&&a[2])a[2].href=`./${build.pza}`;document.documentElement.dataset.pvbuild=build.id||'main'}catch(e){}}syncLiveRoutes();function focus(i){const a=choices();if(!a.length)return;focusIndex=(i+a.length)%a.length;a.forEach(x=>x.classList.remove('navfocus'));a[focusIndex].classList.add('navfocus');a[focusIndex].focus({preventScroll:true})}async function startTitleMusic(){try{if(music.paused)await music.play()}catch(e){}}async function startTitleVideo(){try{video.muted=true;if(video.paused)await video.play()}catch(e){document.body.classList.add('show-static')}}function startSplashAlternation(){if(altTimer||matchMedia('(prefers-reduced-motion: reduce)').matches)return;altTimer=setInterval(()=>document.body.classList.toggle('show-static'),10000)}function unlockTitle(){if(unlocked)return;unlocked=true;startTitleMusic();startTitleVideo();gate.hidden=true;menu.hidden=false;focus(0);startSplashAlternation()}video.addEventListener('error',()=>document.body.classList.add('show-static'));document.addEventListener('visibilitychange',()=>{if(!document.hidden&&unlocked){startTitleMusic();startTitleVideo()}});addEventListener('pageshow',()=>{if(unlocked){startTitleMusic();startTitleVideo()}});addEventListener('pointerdown',unlockTitle,{once:true});addEventListener('keydown',e=>{if(!unlocked){e.preventDefault();unlockTitle();return}if(e.key==='ArrowDown'||e.key==='ArrowRight'){e.preventDefault();focus(focusIndex+1)}else if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();focus(focusIndex-1)}else if((e.key==='Enter'||e.key===' ')&&document.activeElement?.href){e.preventDefault();location.href=document.activeElement.href}});function pads(){const p=navigator.getGamepads?.()[0];if(p){const st={up:p.buttons[12]?.pressed||p.axes?.[1]<-.55,down:p.buttons[13]?.pressed||p.axes?.[1]>.55,a:p.buttons[0]?.pressed};const any=p.buttons.some(b=>b.pressed);if(!unlocked&&any)unlockTitle();else if(unlocked){if(st.down&&!lastPad.down)focus(focusIndex+1);if(st.up&&!lastPad.up)focus(focusIndex-1);if(st.a&&!lastPad.a&&document.activeElement?.href)location.href=document.activeElement.href}lastPad=st}requestAnimationFrame(pads)}pads();</script></body></html>
