<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070817">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>The Prismatic Veil · Hybrid</title>
</head>
<body style="margin:0;background:#070817;color:#f6e6ba;font-family:Georgia,serif">
<div id="boot" style="min-height:100dvh;display:grid;place-items:center">OPENING THE VEIL…</div>
<script>
(async()=>{
  const stamp=Date.now();
  const read=async url=>{
    const response=await fetch(url,{cache:'no-store'});
    if(!response.ok) throw new Error(`${url} · ${response.status}`);
    return response;
  };
  const build=await (await read(`./live-build.json?ts=${stamp}`)).json();
  const id=String(build.id||'main');
  // LIVE28K3 is the cache-busted promotion of the LIVE28K2 high-quality adapter lineage.
  // Keep all K2/K3 witnesses on the same corrected battle/formation stack.
  const live28kLineage=/live28k(?:2|3)/i.test(id);
  const battleAdapter=live28kLineage?'Live28K2PartyBattleScene.js':'Live28PartyBattleScene.js';
  const formationAdapter=live28kLineage?'Live28K2PartyFormationView.js':'Live28PartyFormationView.js';
  document.documentElement.dataset.pvbuild=id;
  const abs=path=>new URL(path,location.href).href;
  const imports={
    [abs('./src/PartyBattleScene.js?v=blitzer-2')]:abs(`./src/prizim/${battleAdapter}?v=${encodeURIComponent(id)}`),
    [abs('./src/PartyFormationView.js?v=blitzer-2')]:abs(`./src/prizim/${formationAdapter}?v=${encodeURIComponent(id)}`),
    [abs('./src/EnemyViewFactory.js?v=xbox-ui-1')]:abs(`./src/prizim/Live25EnemyViewFactory.js?v=${encodeURIComponent(id)}`),
    [abs('./src/PartyBattleConfig.js?v=blitzer-2')]:abs(`./src/PartyBattleConfig.js?v=${encodeURIComponent(id)}`),
    [abs('./src/PartyBattleAudioController.js?v=xbox-ui-1')]:abs(`./src/PartyBattleAudioController.js?v=${encodeURIComponent(id)}`),
    [abs('./src/PartyBattleAudioConfig.js?v=4')]:abs(`./src/PartyBattleAudioConfig.js?v=${encodeURIComponent(id)}`)
  };
  let html=await (await read(`./hybrid-battle-live.html?template=${encodeURIComponent(id)}&ts=${stamp}`)).text();
  const importMap=JSON.stringify({imports}).replace(/</g,'\\u003c');
  html=html.replace('</head>',`<script type="importmap">${importMap}<\/script></head>`);
  html=html.replace(
    "import('./src/PartyBattleScene.js?v=blitzer-2')",
    `import('./src/prizim/${battleAdapter}?v=${encodeURIComponent(id)}')`
  );
  html=html.replace('</body>',`<div id="pvBuildWitness" style="position:fixed;left:6px;bottom:5px;z-index:9999;padding:3px 6px;border:1px solid #8d6cac88;border-radius:5px;background:#070817cc;color:#bfa8dc;font:8px ui-monospace,monospace;pointer-events:none">${id}</div></body>`);
  document.open();
  document.write(html);
  document.close();
})().catch(err=>{
  document.body.innerHTML=`<pre style="white-space:pre-wrap;padding:24px">LIVE BOOT ERROR\n${String(err?.stack||err)}</pre>`;
});
</script>
</body>
</html>
