<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070817">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>The Prismatic Veil · Hybrid</title>
</head>
<body style="margin:0;background:#070817;color:#f6e6ba;font-family:Georgia,serif">
<div id="boot" style="min-height:100dvh;display:grid;place-items:center">OPENING THE VEIL…</div>
<script>
(async()=>{
  const stamp=Date.now();
  const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
  const read=async (url,attempts=4)=>{
    let lastErr=null;
    for(let attempt=1;attempt<=attempts;attempt++){
      try{
        const response=await fetch(url,{cache:'no-store'});
        if(response.ok)return response;
        lastErr=new Error(`${url} · ${response.status}`);
      }catch(err){lastErr=err}
      if(attempt<attempts)await sleep(180*Math.pow(2,attempt-1));
    }
    throw lastErr||new Error(`${url} · fetch failed after ${attempts} attempts`);
  };
  const build=await (await read(`./live-build.json?ts=${stamp}`)).json();
  const id=String(build.id||'main');
  const live28kLineage=/live28k\d+/i.test(id);
  const encounterMode=new URLSearchParams(location.search).has('pvencounter');
  // K27 remains the normal battle authority. LIVE29F is an isolated child adapter
  // used only for an Overworld encounter so the locked K27 implementation stays intact.
  const battleAdapter=live28kLineage?(encounterMode?'Live29FEncounterBattleScene.js':'Live28K27BattleGuardScene.js'):'Live28PartyBattleScene.js';
  const battleTag=encounterMode?'encounter1':'guard1';
  const formationAdapter=live28kLineage?'Live28K7PartyFormationView.js':'Live28PartyFormationView.js';
  document.documentElement.dataset.pvbuild=id;
  if(encounterMode)document.documentElement.dataset.pvEncounter='1';
  const abs=path=>new URL(path,location.href).href;
  const imports={
    [abs('./src/PartyBattleScene.js?v=blitzer-2')]:abs(`./src/prizim/${battleAdapter}?v=${encodeURIComponent(id)}-${battleTag}`),
    [abs('./src/PartyFormationView.js?v=blitzer-2')]:abs(`./src/prizim/${formationAdapter}?v=${encodeURIComponent(id)}`),
    [abs('./src/EnemyViewFactory.js?v=xbox-ui-1')]:abs(`./src/prizim/Live25EnemyViewFactory.js?v=${encodeURIComponent(id)}`),
    [abs('./src/PartyBattleConfig.js?v=blitzer-2')]:abs(`./src/PartyBattleConfig.js?v=${encodeURIComponent(id)}`),
    [abs('./src/PartyBattleAudioController.js?v=xbox-ui-1')]:abs(`./src/PartyBattleAudioController.js?v=${encodeURIComponent(id)}`),
    [abs('./src/PartyBattleAudioConfig.js?v=4')]:abs(`./src/PartyBattleAudioConfig.js?v=${encodeURIComponent(id)}`)
  };
  let html=await (await read(`./hybrid-battle-live.html?template=${encodeURIComponent(id)}&ts=${stamp}`)).text();
  const importMap=JSON.stringify({imports}).replace(/</g,'\\u003c');
  const portraitFocus=`<style id="pvPortraitFocus">
    .portrait{background:#17182d;overflow:hidden}
    .portrait img{display:block!important;width:100%!important;height:100%!important;object-fit:contain!important;object-position:50% 50%!important;transform:none!important;background:none!important}
  </style>`;
  const xboxFullscreen=`<script id="pvXboxFullscreen">(()=>{const go=()=>{if(!/Xbox/i.test(navigator.userAgent||'')||document.fullscreenElement||!document.documentElement.requestFullscreen)return;if(navigator.userActivation&&!navigator.userActivation.isActive)return;document.documentElement.requestFullscreen({navigationUI:'hide'}).catch(()=>{})};['pointerdown','keydown','click'].forEach(t=>document.addEventListener(t,go,{capture:true}))})();<\/script>`;
  html=html.replace('</head>',`<script type="importmap">${importMap}<\/script>${portraitFocus}</head>`);
  html=html.replace("import('./src/PartyBattleScene.js?v=blitzer-2')",`import('./src/prizim/${battleAdapter}?v=${encodeURIComponent(id)}-${battleTag}')`);
  html=html.replace('</body>',`${xboxFullscreen}<div id="pvBuildWitness" style="position:fixed;left:6px;bottom:5px;z-index:9999;padding:3px 6px;border:1px solid #8d6cac88;border-radius:5px;background:#070817cc;color:#bfa8dc;font:8px ui-monospace,monospace;pointer-events:none">${id}${encounterMode?' · LIVE29F':''}</div></body>`);
  document.open();document.write(html);document.close();
})().catch(err=>{
  document.body.innerHTML=`<pre style="white-space:pre-wrap;padding:24px">LIVE BOOT ERROR\n${String(err?.stack||err)}</pre>`;
});
</script>
</body>
</html>
