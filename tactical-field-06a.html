<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>The Prismatic Veil — Too Quiet 06A.1</title>
<meta name="theme-color" content="#071022">
<style>
:root{--navy:#071022;--panel:rgba(7,14,31,.94);--line:rgba(229,204,130,.52);--gold:#ead28c;--cyan:#96ebff;--violet:#d3a1ff;--text:#fff7e8;--muted:#b7afbf;--hp:#66df8b;--rp:#9073ee;--red:#dc5b76}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;height:100dvh;overflow:hidden;background:var(--navy);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif;color:var(--text);touch-action:none;-webkit-tap-highlight-color:transparent}#game-container{position:fixed;inset:0}canvas{display:block}#loading{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;padding:24px;text-align:center;background:radial-gradient(circle at 50% 35%,#3c2762,#071022 70%);color:var(--gold);font-weight:850;white-space:pre-wrap}.shell{position:fixed;inset:0;z-index:900;pointer-events:none;opacity:0;visibility:hidden;transition:opacity .14s ease}.shell.is-visible{opacity:1;visibility:visible}.glass{background:linear-gradient(145deg,rgba(18,31,58,.96),rgba(13,10,31,.95));border:1px solid var(--line);box-shadow:0 6px 18px rgba(0,0,0,.28);clip-path:polygon(0 7px,7px 0,calc(100% - 10px) 0,100% 8px,100% calc(100% - 6px),calc(100% - 6px) 100%,7px 100%,0 calc(100% - 7px))}.turn{position:absolute;top:calc(env(safe-area-inset-top,0px) + 7px);left:calc(env(safe-area-inset-left,0px) + 7px);height:42px;width:145px;display:grid;grid-template-columns:42px 1fr}.turn-no{display:grid;place-items:center;border-right:1px solid rgba(234,210,140,.28);font-size:18px;font-weight:950;color:var(--gold)}.turn-copy{display:flex;flex-direction:column;justify-content:center;padding:0 8px}.kick{font-size:6px;letter-spacing:.18em;color:var(--muted);font-weight:850}.active{margin-top:3px;font-size:11px;color:var(--cyan);font-weight:950;letter-spacing:.05em}.target{position:absolute;top:calc(env(safe-area-inset-top,0px) + 7px);right:calc(env(safe-area-inset-right,0px) + 7px);width:170px;height:42px;padding:7px 9px}.target-line{display:flex;justify-content:space-between;gap:8px;font-size:10px;font-weight:900}.target-hp{font-size:8px}.bar{height:5px;margin-top:7px;background:rgba(255,255,255,.08);overflow:hidden}.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#7c243d,var(--red))}.objective{position:absolute;top:calc(env(safe-area-inset-top,0px) + 55px);left:50%;transform:translateX(-50%);padding:4px 11px;max-width:88vw;white-space:nowrap;background:rgba(12,12,34,.70);border-top:1px solid rgba(211,161,255,.25);border-bottom:1px solid rgba(150,235,255,.18);font-size:7px;font-weight:850;color:#e3d7ed;letter-spacing:.05em}.dock{position:absolute;left:calc(env(safe-area-inset-left,0px) + 7px);right:calc(env(safe-area-inset-right,0px) + 7px);bottom:calc(env(safe-area-inset-bottom,0px) + 7px);min-height:96px;padding:8px;display:grid;grid-template-columns:minmax(105px,.8fr) minmax(135px,1.2fr) 48px;grid-template-rows:34px 44px;gap:6px 8px;pointer-events:auto}.hero{grid-column:1;grid-row:1;min-width:0}.hero-name{font-size:10px;font-weight:950;color:var(--gold)}.resource{margin-top:5px;font-size:7px;color:var(--muted);white-space:nowrap}.resource strong{color:#fff}.ability-block{grid-column:2;grid-row:1;min-width:0}.ability{font-size:10px;font-weight:950;color:var(--violet);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{margin-top:5px;font-size:7px;color:var(--muted)}.damage{grid-column:3;grid-row:1;text-align:right;font-size:6px;color:var(--muted)}.damage strong{display:block;font-size:17px;color:#f4ceff}.dock button{appearance:none;border:1px solid rgba(150,235,255,.52);font:900 9px/1 -apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif;color:#fff;background:linear-gradient(135deg,#173c5a,#442b69);clip-path:polygon(0 7px,7px 0,calc(100% - 8px) 0,100% 7px,100% 100%,0 100%)}#pv-confirm{grid-column:1/3;grid-row:2}#pv-back{grid-column:3;grid-row:2;background:linear-gradient(180deg,#3c1d2a,#22131a);border-color:rgba(220,91,118,.45)}.dock button:active{filter:brightness(1.18)}.dock button:disabled{opacity:.5}@media(orientation:landscape){.dock{left:auto;width:min(64vw,570px);grid-template-columns:minmax(120px,.8fr) minmax(150px,1fr) 42px minmax(110px,.8fr) 50px;grid-template-rows:48px;min-height:64px}.hero{grid-column:1}.ability-block{grid-column:2}.damage{grid-column:3}#pv-confirm{grid-column:4;grid-row:1}#pv-back{grid-column:5;grid-row:1}.objective{max-width:58vw}}
</style>
<script src="./phaser.min.js"></script>
</head>
<body>
<div id="loading">✦ Loading Too Quiet 06A.1 ✦</div>
<div id="game-container"></div>
<div id="pv-mobile-shell" class="shell" aria-hidden="true">
  <section class="turn glass"><div class="turn-no" id="pv-turn-number">01</div><div class="turn-copy"><div class="kick">ACTIVE TURN</div><div class="active" id="pv-active-label">PRISMEL</div></div></section>
  <section class="target glass"><div class="target-line"><span id="pv-target-name">HUSHLING</span><span class="target-hp" id="pv-target-hp">10 / 10</span></div><div class="bar"><i id="pv-target-fill"></i></div></section>
  <div class="objective" id="pv-objective">TOO QUIET • THREE-HERO QA • LAWN START</div>
  <section class="dock glass" aria-label="Active turn controls">
    <div class="hero"><div class="hero-name" id="pv-hero-name">PRISMEL</div><div class="resource">HP <strong id="pv-hero-hp">24/24</strong> • RP <strong id="pv-hero-rp">100/100</strong></div><div style="display:none"><i id="pv-hero-hp-fill"></i><i id="pv-hero-rp-fill"></i></div></div>
    <div class="ability-block"><div class="ability" id="pv-ability-name">PRISMATIC SHARD</div><div class="meta">CONFIRM ACTIVE ATTACK</div></div>
    <div class="damage">DMG<strong id="pv-predicted-damage">4</strong></div>
    <button type="button" id="pv-confirm">◆ CONFIRM</button>
    <button type="button" id="pv-back">BACK</button>
  </section>
</div>
<script type="module">
import TacticalScene from './src/tactical/IntegratedTacticalScene06A.js?v=4';
import VeilBattleScene from './src/IntegratedVeilBattleScene.js?v=2';

const params=new URLSearchParams(location.search);
if(!params.has('battleslice')){params.set('battleslice','1');history.replaceState(null,'',`${location.pathname}?${params.toString()}`)}
const boot=document.getElementById('loading');
const shell=document.getElementById('pv-mobile-shell');
function hideShell(){if(!shell)return;shell.classList.remove('is-visible');shell.setAttribute('aria-hidden','true')}
function fail(error){console.error(error);hideShell();if(!boot)return;boot.style.display='grid';boot.textContent='Boot Error\n\n'+(error&&(error.stack||error.message)?(error.stack||error.message):String(error))}
window.addEventListener('error',e=>fail(e.error||e.message));
window.addEventListener('unhandledrejection',e=>fail(e.reason||e));
window.addEventListener('pagehide',hideShell);

if(!window.Phaser){fail('Phaser did not load.')}else{
  const dpr=Math.min(window.devicePixelRatio||1,3);
  const orig=Phaser.GameObjects.GameObjectFactory.prototype.text;
  Phaser.GameObjects.GameObjectFactory.prototype.text=function(x,y,text,style){style=style||{};if(style.resolution===undefined)style.resolution=dpr;return orig.call(this,x,y,text,style)};
  class HarnessScene extends TacticalScene{create(){hideShell();if(boot)boot.style.display='none';super.create()}}
  try{
    new Phaser.Game({type:Phaser.AUTO,parent:'game-container',width:800,height:600,backgroundColor:'#071022',scale:{mode:Phaser.Scale.RESIZE,autoCenter:Phaser.Scale.CENTER_BOTH},input:{activePointers:2},scene:[HarnessScene,VeilBattleScene]});
  }catch(error){fail(error)}
}
</script>
</body>
</html>
