<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PV HR4 Audio Test</title><style>body{margin:0;background:#06142f;color:#ffe9ad;font-family:system-ui;display:grid;place-items:center;min-height:100vh;padding:24px;box-sizing:border-box}.card{max-width:560px;width:100%;border:1px solid #d8b75d88;background:#0b1f44;padding:22px;border-radius:14px;box-shadow:0 12px 40px #0008;box-sizing:border-box}button{font-size:18px;padding:14px 18px;border-radius:10px;border:1px solid #d8b75d;background:#18376b;color:#fff;width:100%}pre{white-space:pre-wrap;color:#cfe5ff;min-height:110px}.tag{font-size:12px;opacity:.75}</style></head><body><div class="card"><div class="tag">PV HR4 · REAL-BYTES TEST</div><h1>Magical Awakening</h1><p>This reconstructs an 8-second AAC/M4A test directly from the real song bytes staged in the repo. Tap once to assemble and play.</p><button id="go">Load + Play Test</button><pre id="s">waiting for tap</pre><audio id="a" preload="none" playsinline></audio></div><script>const a=document.getElementById('a'),s=document.getElementById('s'),b=document.getElementById('go');let ready=false,url='';const paths=Array.from({length:8},(_,i)=>`./assets/audio/overworld/hr4_test_parts/part${String(i+1).padStart(2,'0')}.b64`);function st(x){s.textContent=x+'\nreadyState='+a.readyState+'\nnetworkState='+a.networkState+'\ncurrentTime='+(Number.isFinite(a.currentTime)?a.currentTime.toFixed(2):'0.00')+'\npaused='+a.paused}['loadedmetadata','canplay','playing','pause','ended','error','stalled'].forEach(e=>a.addEventListener(e,()=>st(e+(a.error?' code='+a.error.code:''))));async function build(){st('fetching 8 real-byte chunks…');const rs=await Promise.all(paths.map(async p=>{const r=await fetch(p+'?v=hr4',{cache:'no-store'});if(!r.ok)throw new Error(`${p} HTTP ${r.status}`);return (await r.text()).trim()}));const b64=rs.join('');st('chunks loaded · decoding '+b64.length+' base64 chars…');const bin=atob(b64),bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);const blob=new Blob([bytes],{type:'audio/mp4'});if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(blob);a.src=url;a.load();ready=true;return blob.size}b.onclick=async()=>{try{if(!ready){const n=await build();st('asset reconstructed: '+n+' bytes · requesting play…')}if(a.paused){await a.play();st('play() resolved ✅')}else{a.pause();st('paused by tap')}}catch(e){st('FAILED: '+e.name+' · '+e.message)}};</script></body></html>
