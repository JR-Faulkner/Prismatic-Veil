<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PV Audio Test</title><style>body{margin:0;background:#06142f;color:#ffe9ad;font-family:system-ui;display:grid;place-items:center;min-height:100vh;padding:24px}.card{max-width:520px;border:1px solid #d8b75d88;background:#0b1f44;padding:22px;border-radius:14px;box-shadow:0 12px 40px #0008}button{font-size:18px;padding:14px 18px;border-radius:10px;border:1px solid #d8b75d;background:#18376b;color:#fff}pre{white-space:pre-wrap;color:#cfe5ff}</style></head><body><div class="card"><h1>PV Audio Test</h1><p>Tap below. This tests the exact deployed <b>Magical Awakening.m4a</b> asset from GitHub Pages.</p><button id="go">Play / Pause</button><pre id="s">waiting for tap</pre><audio id="a" preload="metadata" playsinline src="./assets/audio/overworld/Magical%20Awakening.m4a"></audio></div><script>const a=document.getElementById('a'),s=document.getElementById('s'),b=document.getElementById('go');function st(x){s.textContent=x+'\nreadyState='+a.readyState+'\nnetworkState='+a.networkState+'\ncurrentTime='+a.currentTime.toFixed(2)+'\npaused='+a.paused}['loadstart','loadedmetadata','canplay','playing','pause','ended','error','stalled'].forEach(e=>a.addEventListener(e,()=>st(e+(a.error?' code='+a.error.code:''))));b.onclick=async()=>{try{if(a.paused){await a.play();st('play() resolved')}else{a.pause();st('paused by tap')}}catch(e){st('play() failed: '+e.name+' '+e.message)}};st('waiting for tap');</script></body></html>
