<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>The Prismatic Veil — Tactical Flavor 06B</title>
<meta name="theme-color" content="#071022">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;height:100dvh;overflow:hidden;background:#071022;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif;touch-action:none;-webkit-tap-highlight-color:transparent}#game-container{position:fixed;inset:0}canvas{display:block}#loading{position:fixed;inset:0;z-index:3000;display:grid;place-items:center;padding:24px;text-align:center;background:radial-gradient(circle at 50% 35%,#352353,#071022 72%);color:#ead28c;font-weight:850;white-space:pre-wrap}.flavors{position:fixed;z-index:2200;pointer-events:auto;top:calc(env(safe-area-inset-top,0px) + 5px);left:50%;transform:translateX(-50%);display:flex;gap:4px;padding:4px;background:rgba(5,9,20,.80);border:1px solid rgba(234,210,140,.28);border-radius:10px;backdrop-filter:blur(8px)}.flavors button{appearance:none;border:1px solid rgba(150,235,255,.20);border-radius:7px;background:rgba(22,32,55,.92);color:#bdb5c9;padding:7px 8px;font:850 7px/1 -apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif;letter-spacing:.05em;white-space:nowrap}.flavors button.active{color:#fff7e8;border-color:rgba(234,210,140,.72);background:linear-gradient(135deg,rgba(34,77,105,.95),rgba(75,44,102,.95));box-shadow:0 0 10px rgba(165,122,255,.17)}@media(max-width:430px) and (orientation:portrait){.flavors{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 5px)}.flavors button{padding:7px 6px;font-size:6px}}
</style>
<script src="./phaser.min.js"></script>
</head>
<body>
<div id="loading">✦ Loading Tactical Flavor 06B ✦</div>
<div id="game-container"></div>
<nav class="flavors" aria-label="Tactical view flavor">
  <button type="button" data-flavor="classic">CLASSIC</button>
  <button type="button" data-flavor="shallow">SHALLOW</button>
  <button type="button" data-flavor="hybrid">HYBRID</button>
</nav>
<script type="module">
import TacticalScene from './src/tactical/IntegratedTacticalViewFlavor06B.js?v=1';
import VeilBattleScene from './src/IntegratedVeilBattleScene.js?v=2';

const boot=document.getElementById('loading');
const params=new URLSearchParams(location.search);
const allowed=new Set(['classic','shallow','hybrid']);
let flavor=params.get('flavor')||'shallow';
if(!allowed.has(flavor))flavor='shallow';
if(params.get('flavor')!==flavor){params.set('flavor',flavor);history.replaceState(null,'',`${location.pathname}?${params.toString()}`)}

document.querySelectorAll('[data-flavor]').forEach(btn=>{
  btn.classList.toggle('active',btn.dataset.flavor===flavor);
  btn.addEventListener('click',()=>{
    const next=new URLSearchParams(location.search);
    next.set('flavor',btn.dataset.flavor);
    next.set('cb',String(Date.now()));
    location.search=next.toString();
  });
});

function fail(error){console.error(error);if(!boot)return;boot.style.display='grid';boot.textContent='Boot Error\n\n'+(error&&(error.stack||error.message)?(error.stack||error.message):String(error))}
window.addEventListener('error',e=>fail(e.error||e.message));
window.addEventListener('unhandledrejection',e=>fail(e.reason||e));

if(!window.Phaser){fail('Phaser did not load.')}else{
  const dpr=Math.min(window.devicePixelRatio||1,3);
  const orig=Phaser.GameObjects.GameObjectFactory.prototype.text;
  Phaser.GameObjects.GameObjectFactory.prototype.text=function(x,y,text,style){style=style||{};if(style.resolution===undefined)style.resolution=dpr;return orig.call(this,x,y,text,style)};
  class HarnessScene extends TacticalScene{create(){if(boot)boot.style.display='none';super.create()}}
  try{
    new Phaser.Game({type:Phaser.AUTO,parent:'game-container',width:800,height:600,backgroundColor:'#071022',scale:{mode:Phaser.Scale.RESIZE,autoCenter:Phaser.Scale.CENTER_BOTH},input:{activePointers:2},scene:[HarnessScene,VeilBattleScene]});
  }catch(error){fail(error)}
}
</script>
</body>
</html>
