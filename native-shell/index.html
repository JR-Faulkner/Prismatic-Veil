<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#070817" />
  <title>The Prismatic Veil · Native Shell Probe</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#070817;color:#f3ecff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{display:grid;place-items:center;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);box-sizing:border-box}
    main{width:min(92vw,720px);padding:28px;border:1px solid rgba(201,170,255,.35);border-radius:18px;background:linear-gradient(180deg,rgba(40,20,80,.72),rgba(9,8,27,.92));box-shadow:0 18px 60px rgba(0,0,0,.38)}
    h1{margin:0 0 8px;font-size:clamp(28px,6vw,48px)}
    p{opacity:.82;line-height:1.5}
    #status{display:grid;gap:8px;margin-top:18px;padding:16px;border-radius:12px;background:rgba(255,255,255,.05)}
    .pass{color:#c8ffbf}.pending{color:#ffd986}
  </style>
</head>
<body>
  <main>
    <h1>THE PRISMATIC VEIL</h1>
    <p>PriZim native-shell compatibility probe. This is not a replacement game client.</p>
    <section id="status" aria-live="polite">Booting Capacitor shell…</section>
  </main>
  <script type="module" src="/main.ts"></script>
</body>
</html>
