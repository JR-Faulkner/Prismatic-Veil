<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050914">
<title>The Prismatic Veil · Growth Map</title>
<style>
:root{--gold:#efd078;--cyan:#83efff;--navy:#061126;--accent:#6deaff}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;height:100dvh;overflow:hidden;background:#030610;color:#f8edcd;font-family:Georgia,serif;touch-action:manipulation}body{display:grid;place-items:center}.stage{position:relative;width:min(100vw,calc(100dvh * 16 / 9));height:min(100dvh,calc(100vw * 9 / 16));overflow:hidden;background:#071126;container-type:size}.art{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;user-select:none;-webkit-user-drag:none}
.heroes{position:absolute;left:1.5%;top:1.7%;display:flex;gap:.55cqw;z-index:5}.hero-tab{min-width:6.5cqw;height:4.7cqh;padding:0 .7cqw;border:1px solid #d8bb70;background:#061126e8;color:#f7e8bf;font:800 .68cqw system-ui;letter-spacing:.08em;cursor:pointer}.hero-tab.active,.hero-tab:focus-visible,.hero-tab.navfocus{outline:none;border-color:#fff0a0;box-shadow:0 0 0 2px var(--accent),0 0 18px #8455ff}.atlas .heroes{left:4.2%;top:67%;width:45%;justify-content:space-between}.atlas .hero-tab{width:13cqw;background:#061126f4}
.live-panel{position:absolute;z-index:4;padding:1.3cqh 1.1cqw;background:linear-gradient(145deg,#061126f4,#11163af1);border:1px solid #d8bb70;box-shadow:0 0 22px #000b}.book .live-panel{right:4.1%;top:20.5%;width:20.5%;min-height:28%}.atlas .live-panel{left:3.4%;right:auto;top:auto;bottom:10.2%;width:34%;min-height:15%}.live-panel h2{margin:0;color:#fff0c3;font-size:1.35cqw;letter-spacing:.05em}.live-panel .role{color:var(--cyan);font:800 .58cqw system-ui;letter-spacing:.13em}.counts{display:grid;grid-template-columns:1fr auto;gap:.55cqh .7cqw;margin-top:1.2cqh;padding-top:1cqh;border-top:1px solid #80dfff46;font:800 .7cqw system-ui}.counts b{color:var(--gold);font-size:1.2cqw}.selection{margin-top:1.1cqh;padding-top:1cqh;border-top:1px solid #80dfff46}.atlas .selection{position:absolute;left:105%;bottom:0;width:16cqw;padding:1cqh;background:#061126f1;border:1px solid #d8bb70}.selection strong{display:block;color:#fff0ba;font-size:.9cqw}.selection span{display:block;margin-top:.5cqh;color:#d9e5f8;font:650 .6cqw/1.35 system-ui}.selection small{display:block;margin-top:.6cqh;color:var(--cyan);font:800 .54cqw system-ui;letter-spacing:.08em}
.nodes{position:absolute;inset:0;z-index:3}.node{position:absolute;width:4.3cqw;aspect-ratio:1;border-radius:50%;border:2px solid currentColor;background:#0611264d;color:#e9d27f;display:grid;place-items:center;font:900 1.05cqw system-ui;cursor:pointer;box-shadow:0 0 15px currentColor;backdrop-filter:blur(1px)}.node.identity{color:#f5d477}.node.bond{color:#ff6274}.node.veilcraft{color:#79e9ff}.node.locked{filter:saturate(.3);opacity:.54}.node.unlocked{background:#fff0b533;box-shadow:0 0 0 2px #fff7c4,0 0 24px currentColor}.node.selected,.node:focus-visible,.node.navfocus{outline:none;transform:scale(1.13);box-shadow:0 0 0 3px #fff,0 0 28px var(--accent)}
.book .node:nth-child(1){left:38%;top:26%}.book .node:nth-child(2){left:33%;top:41%}.book .node:nth-child(3){left:60%;top:26%}.book .node:nth-child(4){left:65%;top:41%}.book .node:nth-child(5){left:48%;top:43%}.book .node:nth-child(6){left:48%;top:57%}.atlas .node:nth-child(1){left:73%;top:19%}.atlas .node:nth-child(2){left:72%;top:30%}.atlas .node:nth-child(3){left:63%;top:50%}.atlas .node:nth-child(4){left:58%;top:60%}.atlas .node:nth-child(5){left:84%;top:50%}.atlas .node:nth-child(6){left:89%;top:60%}
.focus-tray{position:absolute;z-index:9;left:15%;right:15%;bottom:9%;padding:1cqh 1cqw;background:#041026f6;border:1px solid #d9bb6e;box-shadow:0 0 35px #000;display:grid;grid-template-columns:repeat(6,1fr);gap:.55cqw}.focus-tray[hidden]{display:none}.focus-stat{padding:.7cqh .55cqw;border:1px solid #8db4dc50;background:#0a1733;color:#edf4ff;font:800 .58cqw system-ui;cursor:pointer}.focus-stat strong{display:block;margin-top:.25cqh;color:#fff0bc;font-size:1.05cqw}.focus-stat.selected,.focus-stat:focus-visible,.focus-stat.navfocus{outline:none;border-color:#fff2a6;box-shadow:0 0 0 2px #70eaff}
.actions{position:absolute;z-index:10;left:29%;right:4%;bottom:1.2%;height:6.5%;display:flex;justify-content:flex-end;gap:.65cqw}.actions button,.actions a{min-width:10cqw;padding:0 1cqw;display:grid;place-items:center;border:1px solid #dec274;background:#071126ef;color:#fff0c9;text-decoration:none;font:800 .68cqw system-ui;letter-spacing:.08em;cursor:pointer}.actions .primary{background:linear-gradient(180deg,#b77b38f3,#653719f4)}.actions button:disabled{opacity:.42}.actions button:focus-visible,.actions a:focus-visible,.actions .navfocus{outline:none;box-shadow:0 0 0 2px #74ebff,0 0 20px #8d4dff}
.toast{position:absolute;z-index:12;left:25%;right:25%;top:7%;padding:.8cqh 1cqw;background:#061126f3;border:1px solid #d8bb70;color:#e9f8ff;text-align:center;font:800 .62cqw system-ui;letter-spacing:.06em;opacity:0;transform:translateY(-8px);transition:.2s}.toast.show{opacity:1;transform:none}.rotate{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:#030610;color:#f6dfa1;font:900 16px system-ui;letter-spacing:.12em}.rotate[hidden]{display:none}
</style>
</head>
<body>
<main id="stage" class="stage book">
  <img id="art" class="art" src="./assets/ui/progression/v1/prismodial-growth-map.png?pvasset=live31a1" alt="Prismodial Growth Map">
  <nav class="heroes"><button class="hero-tab" data-hero="prismel">PRISMEL</button><button class="hero-tab" data-hero="kineza">KINEZA</button><button class="hero-tab" data-hero="auryi">AURYI</button></nav>
  <section class="live-panel"><h2 id="heroName">PRISMEL · LV 1</h2><div id="heroRole" class="role">PRISM WEAVER</div><div class="counts"><span>FOCUS POINT</span><b id="focusPoints">0</b><span>SKILL POINT</span><b id="skillPoints">0</b></div><div class="selection"><strong id="selectionName">Choose a node</strong><span id="selectionDescription">Preview a constellation node before committing a Skill Point.</span><small id="selectionStatus">GROWTH MAP READY</small></div></section>
  <section id="nodes" class="nodes"></section>
  <section id="focusTray" class="focus-tray" hidden></section>
  <div id="toast" class="toast"></div>
  <nav class="actions"><button id="focusMode">SPEND FOCUS</button><button id="modeToggle">SPECTRUM ATLAS</button><button id="confirm" class="primary" disabled>CONFIRM</button><a id="back" href="./hybrid-party-live.html">BACK</a></nav>
</main>
<div id="rotate" class="rotate" hidden>ROTATE TO LANDSCAPE</div>
<script type="module">
import { SKILL_NODES, STAT_KEYS, allocateFocus, loadProgression, unlockSkillNode } from './src/progression/PVProgression.js?v=live31a1';
const META={prismel:{name:'PRISMEL',role:'PRISM WEAVER',accent:'#70eaff'},kineza:{name:'KINEZA',role:'MOMENTUM BORN',accent:'#ff667c'},auryi:{name:'AURYI',role:'AURA SPOKEN',accent:'#f4d479'}};
const params=new URLSearchParams(location.search),source=params.get('source')||'party',returnLocation=params.get('return')||'whisper';let view=params.get('view')==='atlas'?'atlas':'book',heroId=META[params.get('hero')]?params.get('hero'):'prismel',selectedNode=null,selectedStat=null,focusOpen=false,navIndex=0,lastButtons=[],stamp=0;
const stage=document.getElementById('stage'),art=document.getElementById('art'),nodes=document.getElementById('nodes'),focusTray=document.getElementById('focusTray'),heroName=document.getElementById('heroName'),heroRole=document.getElementById('heroRole'),focusPoints=document.getElementById('focusPoints'),skillPoints=document.getElementById('skillPoints'),selectionName=document.getElementById('selectionName'),selectionDescription=document.getElementById('selectionDescription'),selectionStatus=document.getElementById('selectionStatus'),confirm=document.getElementById('confirm'),focusMode=document.getElementById('focusMode'),modeToggle=document.getElementById('modeToggle'),back=document.getElementById('back'),toast=document.getElementById('toast');
function backHref(){if(source==='levelup')return`./hybrid-level-up.html?return=${encodeURIComponent(returnLocation)}`;return`./hybrid-party-live.html${params.get('embedded')==='1'?'?embedded=1':''}`}
function showToast(text){toast.textContent=text;toast.classList.add('show');clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>toast.classList.remove('show'),1800)}
function nodeStatus(node,hero){if(hero.unlockedNodes.includes(node.id))return'UNLOCKED';if(node.requires&&!hero.unlockedNodes.includes(node.requires))return'REQUIRES PREVIOUS NODE';if(hero.skillPoints<node.cost)return'NO SKILL POINT AVAILABLE';return'AVAILABLE · COST 1 SKILL POINT'}
function render(){const state=loadProgression(),hero=state.heroes[heroId],meta=META[heroId];document.documentElement.style.setProperty('--accent',meta.accent);stage.className=`stage ${view}`;art.src=view==='book'?'./assets/ui/progression/v1/prismodial-growth-map.png?pvasset=live31a1':'./assets/ui/progression/v1/spectrum-atlas.png?pvasset=live31a1';document.querySelectorAll('.hero-tab').forEach(button=>button.classList.toggle('active',button.dataset.hero===heroId));heroName.textContent=`${meta.name} · LV ${hero.level||1}`;heroRole.textContent=meta.role;focusPoints.textContent=hero.focusPoints;skillPoints.textContent=hero.skillPoints;modeToggle.textContent=view==='book'?'SPECTRUM ATLAS':'OPEN GRIMOIRE';back.href=backHref();const defs=SKILL_NODES[heroId]||[];nodes.innerHTML=defs.map(node=>{const unlocked=hero.unlockedNodes.includes(node.id),locked=node.requires&&!hero.unlockedNodes.includes(node.requires),glyph=unlocked?'✓':locked?'◇':'✦';return`<button class="node ${node.branch}${unlocked?' unlocked':''}${locked?' locked':''}${selectedNode===node.id?' selected':''}" data-node="${node.id}" aria-label="${node.name}">${glyph}</button>`}).join('');if(focusOpen){focusTray.hidden=false;focusTray.innerHTML=STAT_KEYS.map(stat=>`<button class="focus-stat${selectedStat===stat?' selected':''}" data-stat="${stat}">${stat.toUpperCase()}<strong>${hero.stats[stat]} → ${hero.stats[stat]+1}</strong></button>`).join('')}else focusTray.hidden=true;const node=defs.find(candidate=>candidate.id===selectedNode);if(focusOpen){selectionName.textContent=selectedStat?`${selectedStat} +1`:'Choose a stat';selectionDescription.textContent=selectedStat?`${meta.name} will permanently raise ${selectedStat} from ${hero.stats[selectedStat]} to ${hero.stats[selectedStat]+1}.`:'Spend one player-directed Focus Point on any core stat.';selectionStatus.textContent=hero.focusPoints?'FOCUS POINT READY':'NO FOCUS POINT AVAILABLE';confirm.disabled=!selectedStat||hero.focusPoints<1}else if(node){selectionName.textContent=node.name;selectionDescription.textContent=node.description;selectionStatus.textContent=nodeStatus(node,hero);confirm.disabled=hero.unlockedNodes.includes(node.id)||(node.requires&&!hero.unlockedNodes.includes(node.requires))||hero.skillPoints<node.cost}else{selectionName.textContent='Choose a node';selectionDescription.textContent='Preview a constellation node before committing a Skill Point.';selectionStatus.textContent='GROWTH MAP READY';confirm.disabled=true}bind()}
function bind(){document.querySelectorAll('.hero-tab').forEach(button=>button.onclick=()=>{heroId=button.dataset.hero;selectedNode=null;selectedStat=null;render()});nodes.querySelectorAll('[data-node]').forEach(button=>button.onclick=()=>{focusOpen=false;selectedStat=null;selectedNode=button.dataset.node;render()});focusTray.querySelectorAll('[data-stat]').forEach(button=>button.onclick=()=>{selectedStat=button.dataset.stat;render()})}
focusMode.onclick=()=>{focusOpen=!focusOpen;selectedNode=null;selectedStat=null;render()};modeToggle.onclick=()=>{view=view==='book'?'atlas':'book';render()};confirm.onclick=()=>{if(focusOpen&&selectedStat){const result=allocateFocus(heroId,selectedStat);showToast(result.ok?`${selectedStat} increased for ${META[heroId].name}.`:'No Focus Point is available.');selectedStat=null;render();return}if(selectedNode){const result=unlockSkillNode(heroId,selectedNode);showToast(result.ok?`${result.node.name} unlocked.`:result.reason==='prerequisite'?'Unlock the connected first node.':result.reason==='no-skill-points'?'No Skill Point is available.':'That node is already unlocked.');selectedNode=null;render()}};
function targets(){return[...document.querySelectorAll('.hero-tab,.node,.focus-stat,.actions button,.actions a')].filter(el=>!el.disabled&&!el.hidden&&el.offsetParent!==null)}function focusAt(index){const list=targets();document.querySelectorAll('.navfocus').forEach(el=>el.classList.remove('navfocus'));if(!list.length)return;navIndex=(index+list.length)%list.length;list[navIndex].classList.add('navfocus');list[navIndex].focus({preventScroll:true})}function move(delta){focusAt(navIndex+delta)}function activate(){targets()[navIndex]?.click()}
addEventListener('keydown',event=>{if(['ArrowLeft','ArrowUp','ArrowRight','ArrowDown','Enter',' ','Escape','Backspace'].includes(event.key))event.preventDefault();if(event.key==='ArrowLeft'||event.key==='ArrowUp')move(-1);else if(event.key==='ArrowRight'||event.key==='ArrowDown')move(1);else if(event.key==='Enter'||event.key===' ')activate();else if(event.key==='Escape'||event.key==='Backspace')back.click()});function gamepad(){const pad=navigator.getGamepads?.()[0];if(pad){const now=performance.now(),edge=i=>!!pad.buttons[i]?.pressed&&!lastButtons[i],prev=edge(14)||(pad.axes[0]||0)<-.62||(pad.axes[1]||0)<-.62,next=edge(15)||(pad.axes[0]||0)>.62||(pad.axes[1]||0)>.62;if(now-stamp>175){if(prev){move(-1);stamp=now}else if(next){move(1);stamp=now}else if(edge(0)){activate();stamp=now}else if(edge(1)){back.click();stamp=now}}lastButtons=pad.buttons.map(button=>button.pressed)}requestAnimationFrame(gamepad)}gamepad();const orient=()=>rotate.hidden=innerWidth>=innerHeight;orient();addEventListener('resize',orient);render();
</script>
</body>
</html>
