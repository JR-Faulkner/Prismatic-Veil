name: LIVE28K8 portrait reframe

on:
  push:
    paths:
      - '.github/workflows/live28k8_portrait_reframe.yml'

permissions:
  contents: write

jobs:
  reframe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install pillow
      - name: Reframe HUD portraits
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          specs = {
              'assets/ui/portrait_prismel.png': (9, 2, 63, 56),
              'assets/ui/portrait_auryi.png': (13, 5, 65, 57),
              'assets/ui/portrait_kineza.png': (18, 6, 70, 58),
          }

          for path, box in specs.items():
              p = Path(path)
              im = Image.open(p).convert('RGBA')
              if im.size != (72, 72):
                  raise SystemExit(f'{path}: expected 72x72 source, got {im.size}')
              crop = im.crop(box).resize((192, 192), Image.Resampling.LANCZOS)
              alpha = crop.getchannel('A')
              lo, hi = alpha.getextrema()
              if lo == hi == 255:
                  raise SystemExit(f'{path}: transparency lost')
              bbox = alpha.getbbox()
              if not bbox:
                  raise SystemExit(f'{path}: empty alpha')
              crop.save(p, format='PNG', optimize=True)
              print(path, crop.size, bbox, alpha.getextrema())
          PY
      - name: Commit reframed portraits and remove one-shot workflow
        run: |
          git config user.name 'JR-Faulkner'
          git config user.email '53619182+JR-Faulkner@users.noreply.github.com'
          rm .github/workflows/live28k8_portrait_reframe.yml
          git add assets/ui/portrait_prismel.png assets/ui/portrait_auryi.png assets/ui/portrait_kineza.png .github/workflows/live28k8_portrait_reframe.yml
          git commit -m 'LIVE28K8: replace miniature HUD crops with tight face portraits'
          git push origin main
