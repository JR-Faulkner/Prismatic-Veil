name: Audit Kineza v0.3 Existing Animations

on:
  push:
    paths:
      - ".github/workflows/audit-kineza-v03.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inspect v0.2 AIR/CNS/CMD
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, zipfile, json, hashlib
          repo=Path.cwd()
          zp=repo/"mugen-lab/outputs/KINEZA_MUGEN_PROTOTYPE_V0_2.zip"
          tmp=Path("/tmp/kineza-v03-audit")
          tmp.mkdir(exist_ok=True)
          with zipfile.ZipFile(zp) as z: z.extractall(tmp)
          root=next(p.parent for p in tmp.rglob("kineza.def"))
          air=(root/"kineza.air").read_text(errors="replace")
          cns=(root/"kineza.cns").read_text(errors="replace")
          cmd=(root/"kineza.cmd").read_text(errors="replace")

          def action_block(num):
              m=re.search(rf"(?ims)^\s*\[Begin\s+Action\s+{num}\s*\]\s*(.*?)(?=^\s*\[Begin\s+Action\s+|\Z)",air)
              return m.group(1) if m else None

          def parse_action(num):
              block=action_block(num)
              if block is None: return None
              rows=[]
              for raw in block.splitlines():
                  line=raw.split(";",1)[0].strip()
                  if not line or line.lower().startswith(("clsn","loopstart")): continue
                  m=re.match(r"\s*(-?\d+)\s*,\s*(-?\d+)\s*,\s*(-?\d+)\s*,\s*(-?\d+)\s*,\s*(-?\d+)(?:\s*,\s*([^,]+))?",line)
                  if m:
                      rows.append({"group":int(m.group(1)),"image":int(m.group(2)),"x":int(m.group(3)),"y":int(m.group(4)),"ticks":int(m.group(5)),"flags":(m.group(6) or "").strip()})
              return {"raw":block.strip(),"frames":rows}

          def state_block(num):
              m=re.search(rf"(?ims)^\s*\[Statedef\s+{num}\s*\]\s*(.*?)(?=^\s*\[Statedef\s+|\Z)",cns)
              return m.group(1).strip() if m else None

          acts={n:parse_action(n) for n in (0,200,1000,1070)}
          states={n:state_block(n) for n in (0,200,1000,1070)}
          lines=["# Kineza v0.3 Existing Animation Audit","","Generated from current validated v0.2. No art/gameplay files changed.",""]
          for n in (0,200,1000,1070):
              a=acts[n]
              lines += [f"## Action {n}",""]
              if not a:
                  lines += ["Missing",""]
                  continue
              fs=a["frames"]
              lines += [f"- Sprite frames: {len(fs)}",f"- Unique sprite refs: {len(set((x['group'],x['image']) for x in fs))}",f"- Total nominal ticks: {sum(max(0,x['ticks']) for x in fs)}",""]
              lines += ["| # | Sprite | Offset | Ticks | Flags |","|---:|---|---|---:|---|"]
              for i,x in enumerate(fs): lines.append(f"| {i} | {x['group']},{x['image']} | {x['x']},{x['y']} | {x['ticks']} | {x['flags']} |")
              lines += ["","Raw AIR:","",a["raw"],""]
          lines += ["## State summaries",""]
          for n in (200,1000,1070): lines += [f"### State {n}","",states[n] or "MISSING",""]

          gen=[]
          p=(acts[200] or {"frames":[]})["frames"]
          if len(set((x["group"],x["image"]) for x in p)) < 5:
              gen.append("Direct Punch currently has fewer than five unique body sprites. Use the supplied six-frame punch reference for the rebuild before requesting generation.")
          b=(acts[1070] or {"frames":[]})["frames"]
          if len(set((x["group"],x["image"]) for x in b)) >= 12:
              gen.append("Blitzer already has a deep source sequence. Retiming/axis/body-FX classification comes before any generation request.")
          lines += ["## Generation gate findings",""]+[f"- {x}" for x in gen]+[""]
          report="\n".join(lines)
          (repo/"mugen-lab/KINEZA_V0_3_EXISTING_ANIMATION_AUDIT.md").write_text(report)
          payload={"package_sha256":hashlib.sha256(zp.read_bytes()).hexdigest(),"actions":{str(k):v for k,v in acts.items()},"states":{str(k):v for k,v in states.items()},"generation_findings":gen}
          (repo/"mugen-lab/KINEZA_V0_3_EXISTING_ANIMATION_AUDIT.json").write_text(json.dumps(payload,indent=2)+"\n")
          print(report)
          PY

      - name: Build v0.3A motion candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import zipfile, shutil, re, hashlib
          repo=Path.cwd()
          src=repo/"mugen-lab/outputs/KINEZA_MUGEN_PROTOTYPE_V0_2.zip"
          work=Path("/tmp/kineza-v03a-build")
          if work.exists(): shutil.rmtree(work)
          work.mkdir(parents=True)
          with zipfile.ZipFile(src) as z: z.extractall(work)
          root=next(p.parent for p in work.rglob("kineza.def"))
          airp=root/"kineza.air"; cnsp=root/"kineza.cns"
          air=airp.read_text(errors="replace"); cns=cnsp.read_text(errors="replace")
          def swap(src,n,body):
              pat=rf"(?ims)(^\s*\[Begin\s+Action\s+{n}\s*\]\s*)(.*?)(?=^\s*\[Begin\s+Action\s+|\Z)"
              m=re.search(pat,src)
              if not m: raise SystemExit(f"missing action {n}")
              return src[:m.start(2)] + body.rstrip()+"\n\n" + src[m.end(2):]
          a200="Clsn2Default: 1\n  Clsn2[0] = -68,-300,68,0\n1000,0, 0,0, 2\nClsn1: 1\n  Clsn1[0] = 18,-245,205,-65\n1002,0, 0,0, 2\n1003,0, 0,0, 3"
          a1000="Clsn2Default: 1\n  Clsn2[0] = -72,-300,72,0\n1000,0, 0,0, 3\n1070,0, 0,0, 1\n1070,1, 0,0, 1\n1070,2, 0,0, 1\n1070,3, 0,0, 1\n1070,4, 0,0, 1\n1070,5, 0,0, 1\n1070,6, 0,0, 1\nClsn1: 1\n  Clsn1[0] = 18,-255,220,-60\n1002,0, 0,0, 3\n1003,0, 0,0, 4"
          a1070="Clsn2Default: 1\n  Clsn2[0] = -74,-295,74,0\n1070,0, 0,0, 2\n1070,1, 0,0, 2\n1070,2, 0,0, 2\n1070,3, 0,0, 1\n1070,4, 0,0, 1\n1070,5, 0,0, 1\n1070,6, 0,0, 1\nClsn1: 1\n  Clsn1[0] = 20,-245,185,-55\n1070,7, 0,0, 1\nClsn1: 1\n  Clsn1[0] = 20,-250,205,-55\n1070,8, 0,0, 1\nClsn1: 1\n  Clsn1[0] = 20,-255,220,-55\n1070,9, 0,0, 1\nClsn1: 1\n  Clsn1[0] = 20,-250,205,-55\n1070,10, 0,0, 1\nClsn1: 1\n  Clsn1[0] = 20,-245,185,-55\n1070,11, 0,0, 1\n1070,12, 0,0, 2\n1070,13, 0,0, 2\n1070,14, 0,0, 2\n1070,15, 0,0, 2\n1070,16, 0,0, 3\n1070,17, 0,0, 3"
          air=swap(air,200,a200); air=swap(air,1000,a1000); air=swap(air,1070,a1070)
          airp.write_text(air)
          cns=cns.replace("pausetime = 7,7","pausetime = 6,7",1)
          cns=cns.replace("x = 7.8\ny = 0","x = 8.2\ny = 0",1)
          cns=cns.replace("x = .72","x = .68",1)
          cns=cns.replace("pausetime = 10,12","pausetime = 9,11",1)
          cns=cns.replace("x = 6.8\ny = 0","x = 7.4\ny = 0",1)
          cns=cns.replace("x = .78","x = .72",1)
          cns=cns.replace("pausetime = 8,9","pausetime = 7,9",1)
          cnsp.write_text(cns)
          if not re.search(r"(?im)^\s*xscale\s*=\s*\.3\s*$",cns): raise SystemExit("xscale drift")
          if not re.search(r"(?im)^\s*yscale\s*=\s*\.3\s*$",cns): raise SystemExit("yscale drift")
          cmd=(root/"kineza.cmd").read_text(errors="replace")
          if "prototype punch" not in cmd: raise SystemExit("original punch command missing")
          out=repo/"mugen-lab/outputs/KINEZA_MUGEN_PROTOTYPE_V0_3A.zip"
          with zipfile.ZipFile(out,"w",zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in sorted((work/"chars").rglob("*")):
                  if p.is_file(): z.write(p,p.relative_to(work).as_posix())
          shutil.copy2(out,repo/"mugen-lab/assets/ikemen-web/kineza-char-v03a.zip")
          sha=hashlib.sha256(out.read_bytes()).hexdigest()
          report="# Kineza v0.3A Motion Pass\n\nBase: validated v0.2\n\n- No SFF/image bytes changed.\n- No command names changed.\n- Scale remains .3/.3.\n- Direct Punch timing: 2/2/3.\n- Momentum Fist startup/recovery tightened.\n- Blitzer uses setup -> 1-tick rush/contact -> brake/recovery timing.\n- CLSN1/CLSN2 tightened.\n- Velocity/braking and hit-pause modestly tuned.\n- Idle remains one frame.\n- Momentum Fist still borrows early Blitzer travel art.\n- No generated art.\n\nZIP SHA-256: `"+sha+"`\n"
          (repo/"mugen-lab/KINEZA_V0_3A_MOTION_PASS.md").write_text(report)
          print(report)
          PY
      - name: Build v0.3B six-button input gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import zipfile, shutil, re, hashlib
          repo=Path.cwd()
          src=repo/"mugen-lab/outputs/KINEZA_MUGEN_PROTOTYPE_V0_3A.zip"
          work=Path("/tmp/kineza-v03b-input")
          if work.exists(): shutil.rmtree(work)
          work.mkdir(parents=True)
          with zipfile.ZipFile(src) as z: z.extractall(work)
          root=next(p.parent for p in work.rglob("kineza.def"))
          cmdp=root/"kineza.cmd"
          cmd=cmdp.read_text(errors="replace")
          marker="[Statedef -1]"
          if marker not in cmd: raise SystemExit("missing Statedef -1")
          names=[("x",200),("y",1000),("z",1070),("a",200),("b",1000),("c",1070)]
          defs=[]
          for n,_ in names:
              if f"probe_{n}" not in cmd:
                  defs += ["[Command]",f"name = \"probe_{n}\"",f"command = {n}","time = 1",""]
          if defs: cmd=cmd.replace(marker,"\n".join(defs)+"\n"+marker,1)
          if "v0.3B INPUT GATE" not in cmd:
              route=["","; v0.3B INPUT GATE"]
              for n,state in names:
                  route += [f"[State -1, Probe {n.upper()}]","type = ChangeState",f"value = {state}",f"triggerall = command = \"probe_{n}\"","triggerall = statetype != A","trigger1 = ctrl",""]
              cmd=cmd.replace(marker,marker+"\n"+"\n".join(route),1)
          cmdp.write_text(cmd)
          for n,state in names:
              if f"name = \"probe_{n}\"" not in cmd or f"command = {n}" not in cmd: raise SystemExit(f"missing command {n}")
              if f"[State -1, Probe {n.upper()}]" not in cmd or f"value = {state}" not in cmd: raise SystemExit(f"missing route {n}")
          out=repo/"mugen-lab/outputs/KINEZA_MUGEN_PROTOTYPE_V0_3B_INPUT.zip"
          with zipfile.ZipFile(out,"w",zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in sorted((work/"chars").rglob("*")):
                  if p.is_file(): z.write(p,p.relative_to(work).as_posix())
          shutil.copy2(out,repo/"mugen-lab/assets/ikemen-web/kineza-char-v03b-input.zip")
          sha=hashlib.sha256(out.read_bytes()).hexdigest()
          lines=["# Kineza v0.3B Input Gate","", "Base: v0.3A.", "", "Six direct one-button routes:", "- x -> 200","- y -> 1000","- z -> 1070","- a -> 200","- b -> 1000","- c -> 1070","", "Browser controller unchanged. Visible X/Y/Z use keyboard A/S/D; visible A/B/C use Z/X/C, matching the engine default six-button keyboard config.","","No SFF/AIR/CNS change in this gate.","",f"ZIP SHA-256: `{sha}`",""]
          (repo/"mugen-lab/KINEZA_V0_3B_INPUT_GATE.md").write_text("\n".join(lines))
          print("\n".join(lines))
          PY
      - name: Commit audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mugen-lab/KINEZA_V0_3_EXISTING_ANIMATION_AUDIT.md mugen-lab/KINEZA_V0_3_EXISTING_ANIMATION_AUDIT.json mugen-lab/outputs/KINEZA_MUGEN_PROTOTYPE_V0_3A.zip mugen-lab/assets/ikemen-web/kineza-char-v03a.zip mugen-lab/KINEZA_V0_3A_MOTION_PASS.md mugen-lab/outputs/KINEZA_MUGEN_PROTOTYPE_V0_3B_INPUT.zip mugen-lab/assets/ikemen-web/kineza-char-v03b-input.zip mugen-lab/KINEZA_V0_3B_INPUT_GATE.md
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "MOBMUGEN: build Kineza v0.3B six-button input gate"; git push; fi