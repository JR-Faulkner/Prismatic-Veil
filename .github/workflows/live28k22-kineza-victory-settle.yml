name: LIVE28K22 Kineza Victory Recovery Gate

on:
  push:
    branches: [main]
    paths:
      - '.github/ingest_live28k22/TRIGGER.txt'

permissions:
  contents: write

concurrency:
  group: live28k22-kineza-victory-settle
  cancel-in-progress: false

jobs:
  wire-and-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply K22 Kineza lethal-victory settle gate
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/prizim/fix_live28k22_kineza_victory_settle.py
          python tools/prizim/fix_live28k22_kineza_victory_settle.py
          python tools/prizim/sync_live_authority.py
          python tools/prizim/preflight_live28k.py
          node --check src/prizim/Live28K2PartyFormationView.js
          node --check src/prizim/Live28K2PartyBattleScene.js
          node --check src/PartyBattleScene.js

          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('src/prizim/Live28K2PartyFormationView.js').read_text(encoding='utf-8')
          m = re.search(r"  async playAttackSheet\(heroId, onFrame\) \{(.*?)\n  \}\n\n  _fitActorToBodyHeight", s, re.S)
          if not m:
              raise SystemExit('K22 workflow refused: Kineza playAttackSheet override missing')
          body = m.group(1)
          ordered = [
              "const result = await super.playAttackSheet(heroId, onFrame);",
              "if (this.scene.enemy?.hp > 0 || !actor?.sprite) return result;",
              'actor.sprite.setVisible(true).setAlpha(1).setAngle(0);',
              'this.layout();',
              'await new Promise(resolve => this.scene.time.delayedCall(KINEZA_LETHAL_HOME_SETTLE_MS, resolve));',
              'return result;',
          ]
          pos = [body.find(x) for x in ordered]
          if any(x < 0 for x in pos) or pos != sorted(pos):
              raise SystemExit('K22 workflow refused: lethal recovery ordering is not sequence -> home -> settle -> resolve')
          if 'const KINEZA_LETHAL_HOME_SETTLE_MS = 240;' not in s:
              raise SystemExit('K22 workflow refused: exact 240ms settle authority missing')
          PY

          grep -F 'live28k21_runtime_passed' PV_LIVE_AUTHORITY.json
          grep -F 'kineza_lethal_attack_must_settle_at_home_before_victory' PV_LIVE_AUTHORITY.json
          grep -F 'main-20260907-live28k22' PV_LIVE_AUTHORITY.json
          grep -F 'K22 lethal-victory gate' PRIZIM_LIVE_NOTEPAD.md
          grep -F 'Kineza victory timing gate' PV_RESUME_ANCHOR.md

      - name: Commit guarded K22 timing repair
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/ingest_live28k22/TRIGGER.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/prizim/Live28K2PartyFormationView.js \
            PV_LIVE_AUTHORITY.json \
            PRIZIM_LIVE_NOTEPAD.md \
            PV_RESUME_ANCHOR.md \
            tools/prizim/preflight_live28k.py \
            tools/prizim/fix_live28k22_kineza_victory_settle.py \
            .github/ingest_live28k22/TRIGGER.txt
          git commit -m 'LIVE28K22: let Kineza settle home before Victory'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          echo 'K22 push failed after 3 attempts' >&2
          exit 1
