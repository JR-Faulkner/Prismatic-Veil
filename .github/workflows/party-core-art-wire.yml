name: PARTY core art wiring

on:
  push:
    paths:
      - '.github/workflows/party-core-art-wire.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Wire approved normalized Party masters
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('hybrid-party.html')
          s=p.read_text()
          repl={
            './assets/ui/party/v1/characters/prismel_party.webp':'./assets/party_formation/PRISMEL_JRPG_NORMALIZED_900x900.png',
            './assets/ui/party/v1/characters/auryi_party.webp':'./assets/party_formation/AURYI_JRPG_NORMALIZED_900x900.png',
            './assets/ui/party/v1/characters/kineza_party.webp':'./assets/party_formation/KINEZA_JRPG_NORMALIZED_900x900.png',
          }
          for old,new in repl.items():
              if old not in s:
                  raise SystemExit(f'missing expected path: {old}')
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
          test -s assets/party_formation/PRISMEL_JRPG_NORMALIZED_900x900.png
          test -s assets/party_formation/AURYI_JRPG_NORMALIZED_900x900.png
          test -s assets/party_formation/KINEZA_JRPG_NORMALIZED_900x900.png
      - name: Commit Party master wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'JR-Faulkner'
          git config user.email '53619182+JR-Faulkner@users.noreply.github.com'
          git add hybrid-party.html
          git commit -m 'PARTY: wire approved normalized core Party masters'
          git push origin HEAD:main
