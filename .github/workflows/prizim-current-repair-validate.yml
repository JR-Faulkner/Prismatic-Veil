name: PriZim Current Repair Validate
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify current repair authorities
        run: |
          grep -q "Live28K27BattleGuardScene.js" hybrid-main.html
          grep -q "Homecoming_Path.m4a" hybrid-party-live.html
          grep -q "hybrid-party-live.html" hybrid-overworld.html
          grep -q "title_screen.jpg" index.html
      - name: PriZim preflight
        run: python tools/prizim/preflight_live28k.py
      - name: Cleanup one-shot validator
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/prizim-current-repair-validate.yml
          git commit -m "CLEANUP: remove completed PriZim repair validator"
          git push
# trigger
