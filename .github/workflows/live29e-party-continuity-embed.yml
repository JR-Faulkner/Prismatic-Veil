name: LIVE29E Party Continuous Music Embed
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Overworld to keep authoritative BGM alive behind Party
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('hybrid-overworld.html')
          s=p.read_text()
          old="if(t.matches('.tab')){play('tab');if(t.dataset.tab==='party'){e.preventDefault();e.stopImmediatePropagation();storeResume();setTimeout(()=>{location.href='./hybrid-party-live.html'},70)}return}"
          new="if(t.matches('.tab')){play('tab');if(t.dataset.tab==='party'){e.preventDefault();e.stopImmediatePropagation();openParty();}return}"
          if old not in s:
              raise SystemExit('Party navigation signature not found')
          s=s.replace(old,new,1)
          anchor="function xboxFullscreen(){if(!/Xbox/i.test(navigator.userAgent||'')||document.fullscreenElement||!document.documentElement.requestFullscreen)return;if(navigator.userActivation&&!navigator.userActivation.isActive)return;document.documentElement.requestFullscreen({navigationUI:'hide'}).catch(()=>{})}"
          insert=anchor+"function openParty(){if(document.getElementById('pvPartyOverlay'))return;const shell=document.createElement('div');shell.id='pvPartyOverlay';shell.style.cssText='position:fixed;inset:0;z-index:95;background:#030610;';const frame=document.createElement('iframe');frame.src='./hybrid-party-live.html?embedded=1';frame.title='Party';frame.style.cssText='width:100%;height:100%;border:0;display:block;background:#030610;';frame.setAttribute('allow','autoplay; fullscreen');shell.appendChild(frame);document.body.appendChild(shell)}window.addEventListener('message',e=>{if(e.origin!==location.origin||e.data?.type!=='pv-close-party')return;document.getElementById('pvPartyOverlay')?.remove();document.querySelector('.tab[data-tab=\"party\"]')?.focus?.()});"
          if anchor not in s:
              raise SystemExit('Fullscreen anchor not found')
          s=s.replace(anchor,insert,1)
          p.write_text(s)
          PY
      - name: Patch Party return for embedded shell
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('hybrid-party.html')
          s=p.read_text()
          old="document.getElementById('returnBtn').addEventListener('click',()=>{saveState();location.href='./hybrid-overworld.html'});"
          new="document.getElementById('returnBtn').addEventListener('click',()=>{saveState();if(window.parent!==window){window.parent.postMessage({type:'pv-close-party'},location.origin);return}location.href='./hybrid-overworld.html'});"
          if old not in s:
              raise SystemExit('Party return signature not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Disable duplicate Party BGM when embedded
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('hybrid-party-live.html')
          s=p.read_text()
          old="    const runtime=`<script id=\"pv-party-live-runtime\">(()=>{"
          new="    let runtime=`<script id=\"pv-party-live-runtime\">(()=>{"
          if old not in s:
              raise SystemExit('Party runtime declaration not found')
          s=s.replace(old,new,1)
          anchor="      window.PV_PARTY_HOMEcoming={bgm,storeResume,unlock};\n    })();<\\/script>`;"
          replacement=anchor+"\n    if(new URLSearchParams(location.search).get('embedded')==='1'){runtime=`<script id=\"pv-party-embedded\">(()=>{const b=document.getElementById('returnBtn');b?.addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();window.parent.postMessage({type:'pv-close-party'},location.origin)},{capture:true});})();<\\/script>`}"
          if anchor not in s:
              raise SystemExit('Party runtime tail not found')
          s=s.replace(anchor,replacement,1)
          p.write_text(s)
          PY
      - name: Update PriZim route authority for K27 guard
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/prizim/preflight_live28k.py')
          s=p.read_text()
          s=s.replace("    'Live28K2PartyBattleScene.js',\n", "    'Live28K27BattleGuardScene.js',\n", 1)
          anchor="hybrid_template = read('hybrid-battle-live.html')\n"
          insert=anchor+"k27_guard = read('src/prizim/Live28K27BattleGuardScene.js')\n"
          if anchor not in s:
              raise SystemExit('PriZim hybrid-template anchor missing')
          s=s.replace(anchor,insert,1)
          anchor2="if \"h.resonart?.name\" not in hybrid_template or \"h.resonart?.flavor\" not in hybrid_template:\n    errors.append('Hybrid Resonart drawer authority drift')\n"
          insert2=anchor2+"if \"import Live28K2PartyBattleScene from './Live28K2PartyBattleScene.js?v=live28k27'\" not in k27_guard:\n    errors.append('K27 guard no longer inherits locked LIVE28K2 battle authority')\n"
          if anchor2 not in s:
              raise SystemExit('PriZim drawer anchor missing')
          s=s.replace(anchor2,insert2,1)
          p.write_text(s)
          PY
      - name: Verify continuity architecture
        run: |
          grep -q "hybrid-party-live.html?embedded=1" hybrid-overworld.html
          grep -q "pv-close-party" hybrid-overworld.html
          grep -q "pv-close-party" hybrid-party.html
          grep -q "pv-party-embedded" hybrid-party-live.html
          grep -q "Live28K27BattleGuardScene.js" hybrid-main.html
      - name: PriZim preflight
        run: python tools/prizim/preflight_live28k.py
      - name: Commit and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/live29e-party-continuity-embed.yml
          git add hybrid-overworld.html hybrid-party.html hybrid-party-live.html tools/prizim/preflight_live28k.py
          git commit -m "PARTY: keep Homecoming continuous in embedded Party shell"
          git push
