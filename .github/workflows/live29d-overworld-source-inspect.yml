name: LIVE29D Overworld source inspect

on:
  push:
    paths:
      - '.github/workflows/live29d-overworld-source-inspect.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Decompress HR4B for exact selector inspection
        shell: bash
        run: |
          set -euo pipefail
          gzip -dc assets/ui/overworld/v1/hybrid-overworld.hr4b.html.gz > assets/ui/overworld/v1/hr4b_inspect.html
          git config user.name 'JR-Faulkner'
          git config user.email '53619182+JR-Faulkner@users.noreply.github.com'
          git add assets/ui/overworld/v1/hr4b_inspect.html
          git commit -m 'LIVE29D: temporary overworld selector inspection'
          git push origin HEAD:main
