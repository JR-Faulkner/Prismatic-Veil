name: PriZim one-shot Blitzer PNG ingest

on:
  push:
    paths:
      - '.prizim-ingest-blitzer-trigger'

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download approved Blitzer runtime package
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 \
            -o /tmp/blitzer.zip \
            'https://www.dropbox.com/scl/fi/7ilyh85tlsv7b1jk3cq4x/Kineza_Blitzer_DuoHybrid_Runtime_PNGs.zip?rlkey=cqhf1dkx1b0cqqrkcfml6wplw&dl=1'
          unzip -q /tmp/blitzer.zip -d /tmp/blitzer

      - name: Verify PNG authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import struct

          root = Path('/tmp/blitzer/assets/characters/kineza/animations/blitzer/frames')
          files = sorted(root.glob('Kineza_BlitzRush_*.png'))
          if len(files) != 18:
              raise SystemExit(f'Expected 18 PNG frames, found {len(files)}')

          expected = [f'Kineza_BlitzRush_{i:02d}.png' for i in range(1, 19)]
          names = [p.name for p in files]
          if names != expected:
              raise SystemExit(f'Unexpected frame names: {names}')

          for path in files:
              data = path.read_bytes()
              if data[:8] != b'\x89PNG\r\n\x1a\n':
                  raise SystemExit(f'{path.name}: invalid PNG signature')
              if data[12:16] != b'IHDR':
                  raise SystemExit(f'{path.name}: missing IHDR')
              width, height, bit_depth, color_type = struct.unpack('>IIBB', data[16:26])
              if (width, height) != (768, 768):
                  raise SystemExit(f'{path.name}: expected 768x768, got {width}x{height}')
              if color_type not in (4, 6):
                  raise SystemExit(f'{path.name}: expected alpha-bearing PNG, color type={color_type}')
              if bit_depth != 8:
                  raise SystemExit(f'{path.name}: expected 8-bit PNG, got {bit_depth}')
              print(f'OK {path.name} {width}x{height} alpha color_type={color_type}')
          PY

      - name: Promote PNG frames into PriZim runtime assets
        shell: bash
        run: |
          set -euo pipefail
          dest='assets/characters/kineza/animations/blitzer/frames'
          mkdir -p "$dest"
          rm -f "$dest"/Kineza_BlitzRush_*.png
          cp /tmp/blitzer/assets/characters/kineza/animations/blitzer/frames/Kineza_BlitzRush_*.png "$dest"/

      - name: Commit approved PNG frames
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'JR-Faulkner'
          git config user.email '53619182+JR-Faulkner@users.noreply.github.com'
          git add assets/characters/kineza/animations/blitzer/frames/Kineza_BlitzRush_*.png
          if git diff --cached --quiet; then
            echo 'PNG frames already match repository; nothing to commit.'
            exit 0
          fi
          git commit -m 'Promote approved Blitzer PNG frames for PriZim Duo-Hybrid'
          git push origin HEAD:main
