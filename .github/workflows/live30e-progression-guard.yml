name: LIVE30E Progression Guard

on:
  pull_request:
    paths:
      - 'src/progression/PVProgression.js'
      - 'src/prizim/Live29FEncounterBattleScene.js'
      - 'assets/js/pv-overworld-live29f.js'
      - 'assets/js/pv-party-live30e.js'
      - 'hybrid-party-live.html'
      - '.github/workflows/live30e-progression-guard.yml'
  push:
    branches: [main]
    paths:
      - 'src/progression/PVProgression.js'
      - 'src/prizim/Live29FEncounterBattleScene.js'
      - 'assets/js/pv-overworld-live29f.js'
      - 'assets/js/pv-party-live30e.js'
      - 'hybrid-party-live.html'
      - '.github/workflows/live30e-progression-guard.yml'

jobs:
  progression-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax checks
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/js/pv-overworld-live29f.js
          node --check assets/js/pv-party-live30e.js
          node --input-type=module --check < src/progression/PVProgression.js
          node --input-type=module --check < src/prizim/Live29FEncounterBattleScene.js
      - name: Exercise progression persistence and duplicate guard
        shell: bash
        run: |
          set -euo pipefail
          cp src/progression/PVProgression.js /tmp/PVProgression.mjs
          node --input-type=module <<'JS'
          const p=await import('file:///tmp/PVProgression.mjs');
          const mem=new Map();
          const storage={getItem:k=>mem.has(k)?mem.get(k):null,setItem:(k,v)=>mem.set(k,String(v))};
          const first=p.applyEncounterReward('echo',{firstClear:true,encounterId:'echo:test:first'},storage);
          if(!first.awarded||first.xpEach!==50)throw new Error('first-clear XP payout drift');
          let s=p.loadProgression(storage);
          for(const id of p.CORE_BATTLE_BEARERS)if(s.heroes[id].xp!==50)throw new Error(`first-clear XP missing for ${id}`);
          if(s.inventory.veilShard!==1||s.inventory.memoryFragment!==1)throw new Error('first-clear item payout drift');
          const duplicate=p.applyEncounterReward('echo',{firstClear:true,encounterId:'echo:test:first'},storage);
          if(!duplicate.duplicate||duplicate.awarded)throw new Error('duplicate claim guard failed');
          s=p.loadProgression(storage);
          for(const id of p.CORE_BATTLE_BEARERS)if(s.heroes[id].xp!==50)throw new Error(`duplicate XP awarded to ${id}`);
          const repeat=p.applyEncounterReward('echo',{firstClear:false,encounterId:'echo:test:repeat'},storage);
          if(!repeat.awarded||repeat.xpEach!==20)throw new Error('repeat XP payout drift');
          s=p.loadProgression(storage);
          for(const id of p.CORE_BATTLE_BEARERS)if(s.heroes[id].xp!==70)throw new Error(`repeat XP missing for ${id}`);
          if(s.inventory.veilShard!==1||s.inventory.memoryFragment!==1)throw new Error('repeat incorrectly duplicated first-clear items');
          if(s.levelCurveLocked!==false)throw new Error('level curve was accidentally locked');
          console.log('LIVE30E progression exercise PASS');
          JS
      - name: Validate integration boundaries
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          errors=[]
          def read(p): return Path(p).read_text(encoding='utf-8')
          bridge=read('src/prizim/Live29FEncounterBattleScene.js')
          progression=read('src/progression/PVProgression.js')
          party=read('hybrid-party-live.html')
          party_ui=read('assets/js/pv-party-live30e.js')
          overworld=read('assets/js/pv-overworld-live29f.js')
          hybrid=read('hybrid-main.html')
          build=json.loads(read('live-build.json'))
          if build.get('id')!='main-20260909-live28k27': errors.append('K27 witness drift')
          if "import Live28K27BattleGuardScene from './Live28K27BattleGuardScene.js?v=live29f1'" not in bridge: errors.append('LIVE29F no longer inherits K27')
          if "applyEncounterReward" not in bridge or "payout" not in bridge: errors.append('LIVE30E payout bridge missing')
          if "PROGRESSION_STORAGE_KEY = 'pv.progression.v1'" not in progression: errors.append('progression storage authority drift')
          if "levelCurveLocked: false" not in progression: errors.append('unlocked level-curve contract drift')
          if "pv-party-live30e.js" not in party: errors.append('Party progression UI not loaded')
          if "pv.progression.v1" not in party_ui: errors.append('Party progression refresh key missing')
          if 'NO REWARDS AWARDED' not in overworld: errors.append('defeat reward presentation missing')
          for token in ['Live28K27BattleGuardScene.js','Live29FEncounterBattleScene.js','Live28K7PartyFormationView.js']:
              if token not in hybrid: errors.append(f'Hybrid battle authority missing: {token}')
          if errors:
              print('LIVE30E PROGRESSION GUARD FAILED')
              for e in errors: print(' -',e)
              raise SystemExit(1)
          print('LIVE30E INTEGRATION CONTRACT PASS')
          PY
      - name: Preserve PriZim battle authority
        run: python tools/prizim/preflight_live28k.py
      - name: Record result
        if: success()
        run: |
          echo '## LIVE30E Progression Guard ✅' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'Persistence, first-clear/rematch payout, duplicate prevention, Party readout, LIVE29F inheritance, and PriZim K27 authority all passed.' >> "$GITHUB_STEP_SUMMARY"
