name: LIVE30E Progression Guard

on:
  pull_request:
    paths:
      - 'src/progression/PVProgression.js'
      - 'src/prizim/Live29FEncounterBattleScene.js'
      - 'assets/js/pv-overworld-live29f.js'
      - 'assets/js/pv-party-live30e.js'
      - 'assets/js/pv-party-live29e.js'
      - 'assets/js/pv-growth-audio.js'
      - 'hybrid-party-live.html'
      - 'hybrid-battle-live.html'
      - 'hybrid-level-up.html'
      - 'hybrid-growth.html'
      - 'resonance-tower-complete.html'
      - 'src/PartyBattleConfig.js'
      - 'src/PartyBattleScene.js'
      - 'assets/ui/progression/v1/**'
      - '.github/workflows/live30e-progression-guard.yml'
  push:
    branches: [main]
    paths:
      - 'src/progression/PVProgression.js'
      - 'src/prizim/Live29FEncounterBattleScene.js'
      - 'assets/js/pv-overworld-live29f.js'
      - 'assets/js/pv-party-live30e.js'
      - 'assets/js/pv-party-live29e.js'
      - 'assets/js/pv-growth-audio.js'
      - 'hybrid-party-live.html'
      - 'hybrid-battle-live.html'
      - 'hybrid-level-up.html'
      - 'hybrid-growth.html'
      - 'resonance-tower-complete.html'
      - 'src/PartyBattleConfig.js'
      - 'src/PartyBattleScene.js'
      - 'assets/ui/progression/v1/**'
      - '.github/workflows/live30e-progression-guard.yml'

jobs:
  progression-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax checks
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/js/pv-overworld-live29f.js
          node --check assets/js/pv-party-live30e.js
          node --check assets/js/pv-party-live29e.js
          node --check assets/js/pv-growth-audio.js
          node --input-type=module --check < src/progression/PVProgression.js
          node --input-type=module --check < src/prizim/Live29FEncounterBattleScene.js
          node --input-type=module --check < src/PartyBattleConfig.js
          node --input-type=module --check < src/PartyBattleScene.js
      - name: Exercise progression persistence and duplicate guard
        shell: bash
        run: |
          set -euo pipefail
          cp src/progression/PVProgression.js /tmp/PVProgression.mjs
          node --input-type=module <<'JS'
          const p=await import('file:///tmp/PVProgression.mjs');
          const mem=new Map();
          const storage={getItem:k=>mem.has(k)?mem.get(k):null,setItem:(k,v)=>mem.set(k,String(v))};
          if(p.xpForLevel(2)!==100||p.xpForLevel(3)!==235||p.xpForLevel(4)!==417)throw new Error('cumulative XP curve drift');
          const first=p.applyEncounterReward('echo',{firstClear:true,encounterId:'echo:test:first'},storage);
          if(!first.awarded||!first.firstClear||first.xpEach!==100)throw new Error('first-clear XP payout drift');
          let s=p.loadProgression(storage);
          for(const id of p.CORE_BATTLE_BEARERS){
            const h=s.heroes[id];
            if(h.xp!==100||h.level!==2)throw new Error(`first-clear level unlock missing for ${id}`);
            if(h.focusPoints!==1||h.skillPoints!==1)throw new Error(`growth points missing for ${id}`);
          }
          if(s.partyPath.points!==1||s.partyPath.unlockedNodes.length)throw new Error('shared Resonance Path point drift');
          if(!p.unlockPartyResonanceNode('resonance_link',storage).ok)throw new Error('shared Resonance Path unlock failed');
          s=p.loadProgression(storage);
          if(s.partyPath.points!==0||!s.partyPath.unlockedNodes.includes('resonance_link'))throw new Error('shared Resonance Path persistence failed');
          const prismel=s.heroes.prismel;
          const expected={Might:12,Mind:16,Spirit:15,Agility:13,Resilience:14,Harmony:12};
          for(const [stat,value] of Object.entries(expected))if(prismel.stats[stat]!==value)throw new Error(`Prismel natural growth drift: ${stat}`);
          if(!p.allocateFocus('prismel','Might',storage).ok)throw new Error('Focus allocation failed');
          if(!p.unlockSkillNode('prismel','prism_focus',storage).ok)throw new Error('Skill unlock failed');
          s=p.loadProgression(storage);
          if(s.heroes.prismel.stats.Might!==13||s.heroes.prismel.focusPoints!==0)throw new Error('Focus persistence failed');
          if(!s.heroes.prismel.unlockedNodes.includes('prism_focus')||s.heroes.prismel.skillPoints!==0)throw new Error('Skill persistence failed');
          if(s.inventory.veilShard!==1||s.inventory.memoryFragment!==1)throw new Error('first-clear item payout drift');
          const duplicate=p.applyEncounterReward('echo',{firstClear:true,encounterId:'echo:test:first'},storage);
          if(!duplicate.duplicate||duplicate.awarded)throw new Error('duplicate claim guard failed');
          s=p.loadProgression(storage);
          for(const id of p.CORE_BATTLE_BEARERS)if(s.heroes[id].xp!==100)throw new Error(`duplicate XP awarded to ${id}`);
          const replayFirst=p.applyEncounterReward('echo',{firstClear:true,encounterId:'echo:test:false-first'},storage);
          if(!replayFirst.awarded||replayFirst.firstClear||replayFirst.xpEach!==20)throw new Error('first-clear ledger replay guard failed');
          s=p.loadProgression(storage);
          if(s.inventory.veilShard!==1||s.inventory.memoryFragment!==1)throw new Error('unique first-clear loot was duplicated');
          const repeat=p.applyEncounterReward('echo',{firstClear:false,encounterId:'echo:test:repeat'},storage);
          if(!repeat.awarded||repeat.xpEach!==20)throw new Error('repeat XP payout drift');
          s=p.loadProgression(storage);
          for(const id of p.CORE_BATTLE_BEARERS)if(s.heroes[id].xp!==140)throw new Error(`repeat XP missing for ${id}`);
          if(s.inventory.veilShard!==1||s.inventory.memoryFragment!==1)throw new Error('repeat incorrectly duplicated first-clear items');
          if(s.levelCurveLocked!==true)throw new Error('cumulative level curve is not locked');
          const towerMem=new Map();
          const towerStorage={getItem:k=>towerMem.has(k)?towerMem.get(k):null,setItem:(k,v)=>towerMem.set(k,String(v))};
          p.applyEncounterReward('whisper',{firstClear:true,encounterId:'whisper:journey'},towerStorage);
          const ring=p.applyProgressReward('tower:ring-console',{},towerStorage);
          const harmonic=p.applyProgressReward('tower:harmonic-calibration',{},towerStorage);
          const routing=p.applyProgressReward('tower:resonance-routing',{},towerStorage);
          if(ring.xpEach!==20||harmonic.xpEach!==20||routing.xpEach!==35)throw new Error('Tower progression payout drift');
          const towerDuplicate=p.applyProgressReward('tower:ring-console',{},towerStorage);
          if(!towerDuplicate.duplicate||towerDuplicate.awarded)throw new Error('Tower progression duplicate guard failed');
          const towerState=p.loadProgression(towerStorage);
          for(const id of p.CORE_BATTLE_BEARERS)if(towerState.heroes[id].xp!==175||towerState.heroes[id].level!==2)throw new Error(`Tower journey pacing drift for ${id}`);
          const legacyMem=new Map();
          legacyMem.set(p.PROGRESSION_STORAGE_KEY,JSON.stringify({schema:2,heroes:{prismel:{xp:135,level:3,focusAllocations:{Might:1}}}}));
          const legacyStorage={getItem:k=>legacyMem.has(k)?legacyMem.get(k):null,setItem:(k,v)=>legacyMem.set(k,String(v))};
          const migrated=p.loadProgression(legacyStorage);
          if(migrated.heroes.prismel.level!==3||migrated.heroes.prismel.xp!==235||migrated.heroes.prismel.focusAllocations.Might!==1)throw new Error('schema-2 earned-level migration failed');
          console.log('LIVE30E progression exercise PASS');
          JS
      - name: Exercise Prismel skill effects
        shell: bash
        run: |
          set -euo pipefail
          sed "s|import { HEROES } from .*|const HEROES = {};|" src/PartyBattleConfig.js > /tmp/PartyBattleConfig.mjs
          node --input-type=module <<'JS'
          const cfg=await import('file:///tmp/PartyBattleConfig.mjs');
          const mem=new Map();
          globalThis.localStorage={getItem:k=>mem.has(k)?mem.get(k):null,setItem:(k,v)=>mem.set(k,String(v))};
          if(cfg.hitChanceFor('Attack','prismel')!==.96)throw new Error('base attack accuracy drift');
          mem.set('pv.progression.v1',JSON.stringify({heroes:{prismel:{unlockedNodes:['prism_focus']}}}));
          if(cfg.hitChanceFor('Attack','prismel')!==1)throw new Error('Prism Focus effect missing');
          if(cfg.hitChanceFor('Attack','kineza')!==.96)throw new Error('Prism Focus leaked to allies');
          mem.set('pv.progression.v1',JSON.stringify({heroes:{prismel:{unlockedNodes:['guiding_light']}}}));
          mem.set('pv.leader','Prismel');
          if(cfg.hitChanceFor('Attack','kineza')!==.98)throw new Error('Guiding Light effect missing');
          mem.delete('pv.leader');
          mem.set('pv.progression.v1',JSON.stringify({heroes:{prismel:{unlockedNodes:['guiding_light']}},partyPath:{unlockedNodes:['resonance_link']}}));
          if(cfg.hitChanceFor('Attack','kineza')!==.98)throw new Error('Resonance Link effect missing');
          mem.set('pv.progression.v1',JSON.stringify({heroes:{prismel:{unlockedNodes:['guiding_light']}}}));
          mem.set('pv.frontHero','prismel');
          if(cfg.hitChanceFor('Attack','auryi')!==.98)throw new Error('Guiding Light overworld leader compatibility missing');
          if(cfg.hitChanceFor('Resonart','prismel')!==.92)throw new Error('skill effect leaked to Resonart');
          console.log('LIVE31B Prismel skill effects PASS');
          JS
      - name: Validate integration boundaries
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          errors=[]
          def read(p): return Path(p).read_text(encoding='utf-8')
          bridge=read('src/prizim/Live29FEncounterBattleScene.js')
          progression=read('src/progression/PVProgression.js')
          party=read('hybrid-party-live.html')
          party_ui=read('assets/js/pv-party-live30e.js')
          battle=read('hybrid-battle-live.html')
          level_up=read('hybrid-level-up.html')
          growth=read('hybrid-growth.html')
          growth_audio=read('assets/js/pv-growth-audio.js')
          battle_config=read('src/PartyBattleConfig.js')
          battle_scene=read('src/PartyBattleScene.js')
          tower=read('resonance-tower-complete.html')
          overworld=read('assets/js/pv-overworld-live29f.js')
          hybrid=read('hybrid-main.html')
          build=json.loads(read('live-build.json'))
          if build.get('id')!='main-20260909-live28k27': errors.append('K27 witness drift')
          if "import Live28K27BattleGuardScene from './Live28K27BattleGuardScene.js?v=live29f1'" not in bridge: errors.append('LIVE29F no longer inherits K27')
          if "applyEncounterReward" not in bridge or "payout" not in bridge: errors.append('LIVE30E payout bridge missing')
          if "PROGRESSION_STORAGE_KEY = 'pv.progression.v1'" not in progression: errors.append('progression storage authority drift')
          if "levelCurveLocked: true" not in progression: errors.append('locked cumulative level-curve contract drift')
          for token in ['PROGRESSION_SCHEMA = 3','applyProgressReward','tower:ring-console','allocateFocus','unlockSkillNode','NATURAL_GROWTH']:
              if token not in progression: errors.append(f'LIVE31E progression contract missing: {token}')
          if "firstClearClaimed !== true" not in progression: errors.append('one-time first-clear ledger guard missing')
          if "pv-party-live30e.js" not in party: errors.append('Party progression UI not loaded')
          if "pv.progression.v1" not in party_ui: errors.append('Party progression refresh key missing')
          if "pv-party-live30e.js?pvasset=live31j1" not in party: errors.append('Party progression cache tag drift')
          for page_name,page in [('Party runtime',party_ui),('Battle results',battle),('Ascension',level_up),('Growth',growth),('Tower',tower)]:
              if 'PVProgression.js?v=live31j1' not in page: errors.append(f'{page_name} progression cache tag drift')
          if 'hybrid-growth.html?view=book' not in party: errors.append('Party Resonance Path route missing')
          if 'hybrid-level-up.html?source=victory' not in battle: errors.append('Victory level-up handoff missing')
          if 'resonance-ascension.png' not in level_up: errors.append('approved Ascension art not live')
          for token in ['prismodial-growth-map.png','PARTY_RESONANCE_NODES','unlockPartyResonanceNode','allocateFocus','partyPath']:
              if token not in growth: errors.append(f'Growth screen contract missing: {token}')
          for page_name,page in [('Ascension',level_up),('Growth',growth)]:
              if 'pv-growth-audio.js' not in page: errors.append(f'{page_name} PV audio controller missing')
          for token in ['ring-turn.wav','memory-link.wav','harmonic-lock.wav','tower-resolve.wav']:
              if token not in growth_audio: errors.append(f'PV growth audio source missing: {token}')
          if 'hitChanceFor(command, heroId' not in battle_config: errors.append('Prismel skill-aware battle accuracy missing')
          if "hitChanceFor(command, hero.id)" not in battle_scene: errors.append('Battle execution does not publish hero identity to accuracy rules')
          if 'resonanceSightActive' not in tower or 'SIGHT ${direction}' not in tower: errors.append('Resonance Sight Tower effect missing')
          for token in ['applyProgressReward','tower:ring-console','tower:harmonic-calibration','tower:resonance-routing','PVSaveState?.saveRun']:
              if token not in tower: errors.append(f'Tower progression integration missing: {token}')
          for token in ['ANCIENT RELAY','Prism%20of%20Elders.mp3?pvasset=live31f1','veil_clockwork_drift.mp3?pvasset=live31f1','ring-turn.wav','ring-align.wav','harmonic-search.wav','harmonic-lock.wav','route-release.wav','tower-resolve.wav','towerPadIndex']:
              if token not in tower: errors.append(f'LIVE31F Tower lore/audio/input contract missing: {token}')
          for path in ['assets/ui/progression/v1/resonance-ascension.png','assets/ui/progression/v1/prismodial-growth-map.png','assets/ui/progression/v1/spectrum-atlas.png']:
              if not Path(path).is_file() or Path(path).stat().st_size < 1000000: errors.append(f'approved progression art missing: {path}')
          if 'NO REWARDS AWARDED' not in overworld: errors.append('defeat reward presentation missing')
          for token in ['Live28K27BattleGuardScene.js','Live29FEncounterBattleScene.js','Live28K7PartyFormationView.js']:
              if token not in hybrid: errors.append(f'Hybrid battle authority missing: {token}')
          if "returnLocation=battleParams.get('pvreturn')||'whisper'" not in battle: errors.append('Battle result default return drifted from Whispering Grove')
          if 'pvreturn=whisper&pvresult=victory' not in battle: errors.append('Battle fallback return link drifted from Whispering Grove')
          if errors:
              print('LIVE30E PROGRESSION GUARD FAILED')
              for e in errors: print(' -',e)
              raise SystemExit(1)
          print('LIVE30E INTEGRATION CONTRACT PASS')
          PY
      - name: Preserve PriZim battle authority
        run: python tools/prizim/preflight_live28k.py
      - name: Record result
        if: success()
        run: |
          echo '## LIVE30E Progression Guard ✅' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'Persistence, one-time first-clear loot, rematch payout, duplicate prevention, Party readout, LIVE29F inheritance, and PriZim K27 authority all passed.' >> "$GITHUB_STEP_SUMMARY"

