name: Ingest Prism of Elders Title Music

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ingest-prism-of-elders.yml'

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MAIN
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download exact Prism of Elders MP3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/music
          curl -L --fail --retry 2 \
            'https://uc841e6b4816f803cafa8176f4e2.dl.dropboxusercontent.com/cd/0/get/DHVrU81j5O2mvl7KRia71v38F6gs1UC4o37ZpRnia-V8dm6ER8WMN3QKL5Ho2XuF7U920SHs-W1VMOCpkfd_xwDqViTXj5k26KTWxTiG0Uz6HaxaAts6IibiUB_xsmOqazZnga-M6r0enu7inOAHL8uCM-myQo1pp-Dx84neGxP0pQ/file?c_luid=9bd25e73' \
            -o 'assets/music/Prism of Elders.mp3'
          file 'assets/music/Prism of Elders.mp3'
          test "$(stat -c%s 'assets/music/Prism of Elders.mp3')" -eq 11389686
          file 'assets/music/Prism of Elders.mp3' | grep -qiE 'audio|mpeg|ID3'
          echo 'Exact Prism of Elders MP3 verified.'

      - name: Commit title music to MAIN
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'assets/music/Prism of Elders.mp3'
          if git diff --cached --quiet; then
            echo 'Track already current.'
            exit 0
          fi
          git commit -m 'Ingest Prism of Elders title music'
          git push origin HEAD:main
