name: Patch Rig F F6
on:
  push:
    paths:
      - '.github/workflows/patch-rigf-f6.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Rig F to F6 lean streamed app filesystem
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('mugen-lab/rig-f.html')
          s=p.read_text()
          if 'MOBMUGEN · RIG F · F5.6' not in s:
              raise SystemExit('Expected F5.6 base not found')
          s=s.replace('MOBMUGEN · RIG F · F5.6','MOBMUGEN · RIG F · F6')
          s=s.replace('MobMugen · Rig F · F5.6','MobMugen · Rig F · F6')
          s=s.replace('Rig F · F5.6','Rig F · F6')
          s=s.replace('POST-LAUNCH PROBE · BOXEDWINE','LEAN APP FS · BOXEDWINE')
          s=s.replace('F5.6','F6')
          old_desc='F6 keeps the on-demand Wine root, reduces diagnostic overhead, and adds lifecycle/heartbeat probes around the point where WinMUGEN begins executing.'
          if old_desc in s:
              s=s.replace(old_desc,'F6 removes the 1.72 GB resident app buffer. It streams only boot-critical WinMUGEN files into a lean in-memory filesystem while keeping the proven on-demand Wine root.')
          # Add fflate for per-entry raw DEFLATE without reading the whole archive.
          needle='<script src="https://cdn.jsdelivr.net/gh/andrewnakas/exebrowser@c6049f9684f3c6895c8f31f361a0a29462793f41/public/boxedwine/build/default/browserfs.boxedwine.js"></script>'
          if needle not in s: raise SystemExit('browserfs script needle missing')
          s=s.replace(needle,'<script src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js"></script>\n'+needle)
          # Patch shell app mount to consume our prebuilt lean BrowserFS filesystem.
          old_mount="if(window.RIGF_APP_ZIP_DATA){\\n                console.log('RIGF F6: ZERO-COPY ZIPFS mount begin');"
          if old_mount not in s:
              raise SystemExit('F6 mount patch point missing after version replacement')
          new_mount="if(window.RIGF_APP_FS){\\n                console.log('RIGF F6: LEAN APP FS mount begin');\\n                adapterCallback(new BrowserFS.FileSystem.FolderAdapter('/', window.RIGF_APP_FS));\\n                console.log('RIGF F6: LEAN APP FS ready');\\n                return;\\n            }\\n            if(window.RIGF_APP_ZIP_DATA){\\n                console.log('RIGF F6: LEGACY ZIPFS mount begin');"
          s=s.replace(old_mount,new_mount)
          # Insert streamed lean-FS builder before buildParams.
          marker="function buildParams(){const work=exeDir?'d:/'+exeDir:'d:/';"
          if marker not in s: raise SystemExit('buildParams marker missing')
          builder=r'''async function buildLeanAppFS(file){
status('BUILDING LEAN APP FS · STREAMED');prep.textContent='Extracting boot-critical files only…';
const tailStart=Math.max(0,file.size-65557),tailBuf=await file.slice(tailStart).arrayBuffer(),tv=new DataView(tailBuf);let e=-1;for(let i=tv.byteLength-22;i>=0;i--){if(u32(tv,i)===0x06054b50){e=i;break}}if(e<0)throw new Error('ZIP end record not found for lean build.');
const cdSize=u32(tv,e+12),cdOffset=u32(tv,e+16),cdBuf=await file.slice(cdOffset,cdOffset+cdSize).arrayBuffer(),cv=new DataView(cdBuf),dec=new TextDecoder('utf-8');
let p=0,entries=[];while(p+46<=cv.byteLength&&u32(cv,p)===0x02014b50){const method=u16(cv,p+10),comp=u32(cv,p+20),uncomp=u32(cv,p+24),fn=u16(cv,p+28),ex=u16(cv,p+30),cm=u16(cv,p+32),local=u32(cv,p+42),name=dec.decode(new Uint8Array(cdBuf,p+46,fn));entries.push({name,method,comp,uncomp,local});p+=46+fn+ex+cm}
const prefix=exeDir?exeDir.replace(/\\/g,'/')+'/':'';
function keep(ent){if(!ent.name||ent.name.endsWith('/'))return false;let rel=prefix&&ent.name.startsWith(prefix)?ent.name.slice(prefix.length):ent.name;if(prefix&&!ent.name.startsWith(prefix))return false;const l=rel.toLowerCase();if(l==='winmugen.exe')return true;if(!l.includes('/')&&/\\.(dll|ini|cfg|dat|txt)$/i.test(l))return true;return l.startsWith('data/')||l.startsWith('font/')||l.startsWith('sound/')||l.startsWith('plugins/');}
let chosen=entries.filter(keep),packed=chosen.reduce((a,x)=>a+x.comp,0),plain=chosen.reduce((a,x)=>a+x.uncomp,0);log('F6 LEAN PLAN · files='+chosen.length+' · compressed='+(packed/1048576).toFixed(1)+' MB · expanded='+(plain/1048576).toFixed(1)+' MB');
if(!chosen.some(x=>x.name.toLowerCase().endsWith('/winmugen.exe')||x.name.toLowerCase()==='winmugen.exe'))throw new Error('Lean plan lost Winmugen.exe');
const mem=await new Promise((res,rej)=>BrowserFS.FileSystem.InMemory.Create({},(err,fs)=>err?rej(err):res(fs)));
BrowserFS.initialize(mem);const nfs=BrowserFS.BFSRequire('fs'),Buffer=BrowserFS.BFSRequire('buffer').Buffer;
function mkdirp(path){const parts=path.split('/').filter(Boolean);let cur='';for(const part of parts){cur+='/'+part;try{nfs.mkdirSync(cur)}catch(err){if(!/EEXIST/.test(String(err)))throw err}}}
let done=0,liveBytes=0;
for(const ent of chosen){const lh=await file.slice(ent.local,ent.local+30).arrayBuffer(),lv=new DataView(lh);if(u32(lv,0)!==0x04034b50)throw new Error('Bad local ZIP header: '+ent.name);const fn=u16(lv,26),ex=u16(lv,28),start=ent.local+30+fn+ex;let packedBytes=new Uint8Array(await file.slice(start,start+ent.comp).arrayBuffer()),raw;if(ent.method===0)raw=packedBytes;else if(ent.method===8){if(!window.fflate)throw new Error('fflate unavailable');raw=window.fflate.inflateSync(packedBytes)}else throw new Error('Unsupported ZIP method '+ent.method+' for '+ent.name);const out='/'+ent.name.replace(/^\\/+/,''),slash=out.lastIndexOf('/');if(slash>0)mkdirp(out.slice(0,slash));nfs.writeFileSync(out,Buffer.from(raw));liveBytes+=raw.byteLength;done++;if(done===1||done%25===0||done===chosen.length){prep.textContent='Lean boot FS '+done+'/'+chosen.length+' · '+(liveBytes/1048576).toFixed(1)+' MB';log('F6 LEAN PROGRESS · '+done+'/'+chosen.length+' · '+(liveBytes/1048576).toFixed(1)+' MB')}}
window.RIGF_APP_FS=mem;try{BrowserFS.initialize(mem)}catch(e){}log('F6 LEAN FS READY · files='+done+' · resident='+(liveBytes/1048576).toFixed(1)+' MB');prep.textContent='Lean WinMUGEN filesystem ready · '+done+' files · '+(liveBytes/1048576).toFixed(1)+' MB';return mem}
'''
          s=s.replace(marker,builder+marker)
          # Replace whole-file buffer allocation in boot with lean streamed extraction.
          old="status('READING ZIP ONCE FOR DIRECT MOUNT');const raw=await file.arrayBuffer();window.RIGF_APP_ZIP_DATA=raw;log('F6 DIRECT ZIP BUFFER · '+(raw.byteLength/1048576).toFixed(1)+' MB');status('FETCHING BOXEDWINE SHELL');"
          if old not in s: raise SystemExit('boot whole-buffer needle missing')
          new="status('STREAMING BOOT-CRITICAL APP FILES');await buildLeanAppFS(file);window.RIGF_APP_ZIP_DATA=null;status('FETCHING BOXEDWINE SHELL');"
          s=s.replace(old,new)
          # Update setup copy if older exact text survived.
          s=s.replace('F6 keeps the zero-copy app mount but switches the now-working same-origin Wine root to BoxedWine on-demand range loading, avoiding the full-root expansion burst that crashed Safari in F5.4.','F6 removes the giant resident app ZIP. It streams only boot-critical WinMUGEN files into a lean filesystem while retaining the proven on-demand Wine root.')
          p.write_text(s)
          PY
      - name: Update continuity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/MOBMUGEN_LIVE.md')
          s=p.read_text() if p.exists() else '# MOBMUGEN LIVE\n'
          note='''\n## Rig F F6 - lean streamed app filesystem\n- Replaces the 1.72 GB full `file.arrayBuffer()` app mount with selective per-entry extraction from the user ZIP.\n- Keeps only boot-critical WinMUGEN content initially: executable, root DLL/config files, data, font, sound, and plugins.\n- Uses fflate raw DEFLATE per selected ZIP entry, so the giant archive is never resident as one ArrayBuffer.\n- Builds a BrowserFS InMemory filesystem and mounts it as D:, preserving the original nested WinMugen path.\n- Keeps the F5.5/F5.6 same-origin on-demand Wine root path.\n- Goal: create enough iPhone Safari memory headroom for Wine/WinMUGEN to proceed past launch.\n'''
          if '## Rig F F6 - lean streamed app filesystem' not in s:
              s += note
          p.write_text(s)
          PY
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/patch-rigf-f6.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add mugen-lab/rig-f.html docs/MOBMUGEN_LIVE.md .github/workflows/patch-rigf-f6.yml
          git commit -m "Rig F F6 stream lean WinMUGEN app filesystem"
          git push
