name: Rig F F8.6 viewport clarity

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-rigf-f86.yml
      - scripts/patch_rigf_f86_viewport.py

permissions:
  contents: write

jobs:
  apply_f86:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch F8.6 runner
        run: python3 scripts/patch_rigf_f86_viewport.py

      - name: Validate F8.6 inline JS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('mugen-lab/rig-f7.html').read_text()
          blocks=re.findall(r'<script(?:[^>]*)>(.*?)</script>',s,re.S)
          inline='\n'.join(x for x in blocks if x.strip())
          Path('/tmp/rigf-inline.js').write_text(inline)
          PY
          node --check /tmp/rigf-inline.js

      - name: Validate generated BoxedWine shell JS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('mugen-lab/rig-f7.html').read_text()
          a=s.index('function patchShell(src){')
          b=s.index('function installNetTrace()',a)
          fn=s[a:b]
          harness="const ROOT_BASE='./assets/',OVERLAY_BASE='';\n"+fn+"\nconst fs=require('fs');const src=fs.readFileSync('mugen-lab/boxedwine-f83-fallback/boxedwine-shell.js','utf8');fs.writeFileSync('/tmp/rigf-patched-shell.js',patchShell(src));\n"
          Path('/tmp/patchshell-harness.js').write_text(harness)
          PY
          node /tmp/patchshell-harness.js
          node --check /tmp/rigf-patched-shell.js

      - name: Verify F8.6 presentation-only wiring
        run: |
          grep -q 'MOBMUGEN · RIG F · F8.6' mugen-lab/rig-f7.html
          grep -q 'FALLBACK · VIEWPORT CLARITY' mugen-lab/rig-f7.html
          grep -q 'VIEW 100%' mugen-lab/rig-f7.html
          grep -q 'view-zoom' mugen-lab/rig-f7.html
          grep -q 'scale(1.25)' mugen-lab/rig-f7.html
          grep -q 'image-rendering:pixelated' mugen-lab/rig-f7.html
          grep -q 'boxedwine-f83-fallback' mugen-lab/rig-f7.html
          grep -q 'RIGF F8.6: CFG READY' mugen-lab/rig-f7.html
          grep -q 'F8.6 INPUT · ' mugen-lab/rig-f7.html
          grep -q 'TinyCore15Wine3.1' mugen-lab/rig-f7.html
          ! grep -q 'disableWasmJitForWrittenCode=true' mugen-lab/rig-f7.html

      - name: PriZim static preflight
        run: python3 tools/prizim/mobmugen/preflight.py

      - name: Commit F8.6
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add mugen-lab/rig-f7.html
          git commit -m "Rig F F8.6 add viewport clarity toggle"
          git push
