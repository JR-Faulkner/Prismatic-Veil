name: Temporary Auryi entry wiring

on:
  push:
    paths:
      - 'pv-data/triggers/auryi-entry-wire.trigger'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean Auryi entry frames to transparency
        shell: bash
        run: |
          python -m pip install --quiet pillow numpy
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import numpy as np
          folder=Path('assets/characters/auryi/animations/entry/frames')
          files=sorted(folder.glob('Auryi_Entry_*.png'))
          assert len(files)==6, f'expected 6 entry frames, got {len(files)}'
          for p in files:
              im=Image.open(p).convert('RGBA')
              a=np.array(im)
              rgb=a[:,:,:3].astype(np.float32)
              old_alpha=a[:,:,3].astype(np.float32)/255.0
              # Source entry art is on a white field. Use soft color-to-alpha
              # while preserving gold/lavender luminous effects and hair edges.
              dist=np.sqrt(((255.0-rgb)**2).sum(axis=2))
              mx=rgb.max(axis=2); mn=rgb.min(axis=2)
              sat=(mx-mn)
              alpha=np.clip((dist-10.0)/42.0,0,1)
              glow=np.clip((sat-14.0)/70.0,0,1)*np.clip((mx-145.0)/95.0,0,1)
              alpha=np.maximum(alpha,glow*0.86)*old_alpha
              a[:,:,3]=(np.clip(alpha,0,1)*255).astype(np.uint8)
              Image.fromarray(a,'RGBA').save(p)
              out=np.array(Image.open(p).convert('RGBA'))
              assert out.shape[:2]==(768,768)
              assert out[:,:,3].min()==0 and out[:,:,3].max()>240
          print('cleaned',len(files),'Auryi entry frames')
          PY
      - name: Wire Auryi PriZim entry and scale presence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          # Driver: entry sequences may opt out of attack audio/DOM cinematic state.
          p=Path('src/prizim/DuoHybridSequenceDriver.js')
          t=p.read_text()
          t=t.replace('// PriZim Duo-Hybrid Sequence Driver v0.6','// PriZim Duo-Hybrid Sequence Driver v0.7')
          old='    scene.audio?.beginCinematicAttack?.();\n    sprite.setVisible(false);'
          new='    const cinematicAudio = presentation.cinematicAudio !== false;\n    if (cinematicAudio) scene.audio?.beginCinematicAttack?.();\n    sprite.setVisible(false);'
          assert old in t, 'driver begin hook mismatch'
          t=t.replace(old,new,1)
          old='      scene.audio?.endCinematicAttack?.();\n      layer.ctx.setTransform(1, 0, 0, 1, 0, 0);'
          new='      if (cinematicAudio) scene.audio?.endCinematicAttack?.();\n      layer.ctx.setTransform(1, 0, 0, 1, 0, 0);'
          assert old in t, 'driver end hook mismatch'
          t=t.replace(old,new,1)
          p.write_text(t)

          # Auryi entry manifest: stationary actor, camera/scale emphasis only.
          frames=[]
          durations=[140,130,135,145,155,180]
          for i,d in enumerate(durations):
              frames.append({
                  'index':i,
                  'asset':f'./assets/characters/auryi/animations/entry/frames/Auryi_Entry_{i+1:02d}.png',
                  'duration':d,
                  'x':0,'y':0,'scale':1.0,'anchor_x':384,'anchor_y':756
              })
          manifest={
              'schemaVersion':1,'id':'auryi_turn_entry_v1','driver':'prizim-duo-hybrid','mode':'sequence',
              'displayName':'Auryi','sequenceName':'Turn Entry',
              'source':{'type':'frames'},
              'content':{'baselinePx':756,'contentHeightPx':744},
              'reference':{'width':960,'height':540,'homeX':0,'homeY':0,'contactX':1,'baseScale':1.0,'contactXOffsetFrac':0},
              'presentation':{
                  'cinematicAudio':False,
                  'camera':{'focusYOffsetFrac':-0.045,'track':[
                      {'frame':0,'zoom':1.00,'targetMix':0.0},
                      {'frame':1,'zoom':1.05,'targetMix':0.0},
                      {'frame':2,'zoom':1.10,'targetMix':0.0},
                      {'frame':3,'zoom':1.14,'targetMix':0.0},
                      {'frame':4,'zoom':1.10,'targetMix':0.0},
                      {'frame':5,'zoom':1.00,'targetMix':0.0}
                  ]},
                  'actorScaleTrack':[
                      {'frame':0,'scale':1.00},{'frame':2,'scale':1.05},{'frame':3,'scale':1.09},{'frame':5,'scale':1.00}
                  ]
              },
              'markers':{'entryStart':[0],'crownIgnite':[1,2],'auorbOrbit':[2,3,4],'entrySettle':[5]},
              'povFrames':[2,3,4],
              'frames':frames
          }
          Path('pv-data/sequences/auryi_turn_entry.duo.sequence.json').write_text(json.dumps(manifest,indent=2)+'\n')

          # Adapter: add Auryi turn-entry interception and 12% base-presence lift.
          p=Path('src/prizim/DuoHybridPartyFormationView.js')
          t=p.read_text()
          t=t.replace('// PriZim Duo-Hybrid Formation Adapter v0.6','// PriZim Duo-Hybrid Formation Adapter v0.7')
          t=t.replace("import DuoHybridSequenceDriver from './DuoHybridSequenceDriver.js?v=duo-6';","import DuoHybridSequenceDriver from './DuoHybridSequenceDriver.js?v=duo-7';")
          kineza_end="});\n\nexport default class DuoHybridPartyFormationView"
          auryi_cfg="""});

const AURYI_ENTRY_DUO = Object.freeze({
  id: 'auryi_turn_entry_v1',
  name: 'Auryi Turn Entry',
  manifest: './pv-data/sequences/auryi_turn_entry.duo.sequence.json',
  version: '7'
});

export default class DuoHybridPartyFormationView"""
          assert kineza_end in t, 'adapter config insertion anchor mismatch'
          t=t.replace(kineza_end,auryi_cfg,1)
          old="""    this.duoHybrid.prepare(KINEZA_BLITZER_DUO).catch(error => {
      actor.duoPrewarmError = error;
      console.warn('[PriZim Duo-Hybrid] Blitzer prewarm deferred:', error);
    });
  }

  hasAttackSheet(heroId) {"""
          new="""    this.duoHybrid.prepare(KINEZA_BLITZER_DUO).catch(error => {
      actor.duoPrewarmError = error;
      console.warn('[PriZim Duo-Hybrid] Blitzer prewarm deferred:', error);
    });

    const auryi = this.actors.get('auryi');
    if (auryi) {
      auryi.duoEntryConfig = AURYI_ENTRY_DUO;
      this.duoHybrid.prepare(AURYI_ENTRY_DUO).catch(error => {
        auryi.duoEntryPrewarmError = error;
        console.warn('[PriZim Duo-Hybrid] Auryi entry prewarm deferred:', error);
      });
    }
  }

  layout() {
    super.layout();
    const auryi = this.actors.get('auryi');
    if (!auryi || auryi._snapshot) return;
    const mul = 1.12;
    auryi.sprite.setScale(auryi.sprite.scaleX * mul, auryi.sprite.scaleY * mul);
    auryi.ghost.setScale(auryi.ghost.scaleX * mul, auryi.ghost.scaleY * mul);
    auryi.ring.setSize(auryi.sprite.displayWidth * 0.5, auryi.sprite.displayWidth * 0.18);
  }

  hasTurnEntry(heroId) {
    if (heroId === 'auryi') {
      const actor = this.actors.get(heroId);
      return !!(actor && actor.duoEntryConfig);
    }
    return super.hasTurnEntry(heroId);
  }

  async playTurnEntry(heroId) {
    if (heroId !== 'auryi') return super.playTurnEntry(heroId);
    const actor = this.actors.get(heroId);
    if (!actor?.duoEntryConfig) return;
    return this.duoHybrid.playSequence({
      config: actor.duoEntryConfig,
      actor,
      enemyX: actor.sprite.x,
      enemyY: actor.sprite.y,
      onFrame: null
    });
  }

  hasAttackSheet(heroId) {"""
          assert old in t, 'adapter create insertion anchor mismatch'
          t=t.replace(old,new,1)
          p.write_text(t)
          PY
      - name: Commit Auryi entry integration
        shell: bash
        run: |
          git config user.name 'JR-Faulkner'
          git config user.email '53619182+JR-Faulkner@users.noreply.github.com'
          git add assets/characters/auryi/animations/entry/frames src/prizim/DuoHybridSequenceDriver.js src/prizim/DuoHybridPartyFormationView.js pv-data/sequences/auryi_turn_entry.duo.sequence.json
          git commit -m 'Wire Auryi PriZim entry and battle presence'
          git push
