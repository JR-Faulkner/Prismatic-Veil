name: Temporary Auryi Attack Ingest

on:
  push:
    paths:
      - '.github/workflows/auryi-attack-ingest.yml'

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download final Auryi PZ package
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 'https://www.dropbox.com/scl/fi/4uh3w7fegmsnoan17ow56/Auryi_Auorb_Attack_PZ_Final_Package.zip?rlkey=fiojr1kkl0x3y9z4d5xln0tjw&st=4f329ilh&dl=1' -o /tmp/auryi.zip
          rm -rf /tmp/auryi
          mkdir -p /tmp/auryi
          unzip -q /tmp/auryi.zip -d /tmp/auryi
          src='/tmp/auryi/Auryi_Auorb_Attack_PZ_Final'
          test -d "$src/03_runtime_frames"
          test "$(find "$src/03_runtime_frames" -maxdepth 1 -name 'Auryi_Auorb_Attack_*.png' | wc -l | tr -d ' ')" = '18'
          mkdir -p assets/characters/auryi/animations/attack/frames
          cp "$src"/03_runtime_frames/Auryi_Auorb_Attack_*.png assets/characters/auryi/animations/attack/frames/
          cp "$src/Auryi_Auorb_Attack_Runtime_Manifest.json" pv-data/sequences/auryi_auorb_invocation.duo.sequence.json
          cp "$src/Auryi_Auorb_Attack_Anchors.json" pv-data/sequences/auryi_auorb_invocation.anchors.json
      - name: Verify PNG alpha and commit
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          files=sorted(Path('assets/characters/auryi/animations/attack/frames').glob('Auryi_Auorb_Attack_*.png'))
          assert len(files)==18, len(files)
          for p in files:
              im=Image.open(p).convert('RGBA')
              lo,hi=im.getchannel('A').getextrema()
              assert lo==0 and hi==255, (p, lo, hi)
          print('Verified', len(files), 'Auryi RGBA attack frames')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/characters/auryi/animations/attack/frames pv-data/sequences/auryi_auorb_invocation.duo.sequence.json pv-data/sequences/auryi_auorb_invocation.anchors.json
          if git diff --cached --quiet; then
            echo 'No asset changes to commit.'
          else
            git commit -m 'Add final Auryi Duo-Hybrid attack frames'
            git push
          fi
