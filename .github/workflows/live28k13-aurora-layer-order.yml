name: LIVE28K13 Aurora Layer Order

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live28k13-aurora-layer-order.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Match approved Aurora mock stacking
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/prizim/Live28K2PartyBattleScene.js')
          s = p.read_text()
          old = """    const objects = [veilA, veilB, veilC, auroraCore, auroraRingA, auroraRingB, pulse, pulseEcho, flash, title];
    this.worldAdd(objects);
    return { x, y, veilA, veilB, veilC, auroraCore, auroraRingA, auroraRingB, pulse, pulseEcho, flash, title, objects };
"""
          new = """    const objects = [veilA, veilB, veilC, auroraCore, auroraRingA, auroraRingB, pulse, pulseEcho, flash, title];
    this.worldAdd(objects);

    // Phaser Container children render by local list order, so make the
    // approved lab stacking explicit rather than trusting child depth:
    // Veil/Aurora/Pulse behind Auryi, title and white flash in front.
    if (actor?.sprite && this.world?.moveBelow) {
      [veilA, veilB, veilC, auroraCore, auroraRingA, auroraRingB, pulse, pulseEcho]
        .forEach(obj => this.world.moveBelow(obj, actor.sprite));
    }
    this.world?.bringToTop?.(title);
    this.world?.bringToTop?.(flash);

    return { x, y, veilA, veilB, veilC, auroraCore, auroraRingA, auroraRingB, pulse, pulseEcho, flash, title, objects };
"""
          if old not in s:
              raise SystemExit('Aurora mock stage insertion point not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Run PriZim preflight
        run: python tools/prizim/preflight_live28k.py
      - name: Commit layer order
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/prizim/Live28K2PartyBattleScene.js
          git commit -m 'LIVE28K13: match Aurora mock layer order'
          git push
