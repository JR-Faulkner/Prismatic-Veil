name: Patch Rig F F5.3
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch-rigf-f53.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch rig-f.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('mugen-lab/rig-f.html')
          s=p.read_text()
          s=s.replace('MobMugen · Rig F · F5.2','MobMugen · Rig F · F5.3')
          s=s.replace('MOBMUGEN · RIG F · F5.2','MOBMUGEN · RIG F · F5.3')
          s=s.replace('Rig F · F5.2','Rig F · F5.3')
          s=s.replace('F5.2','F5.3')
          s=s.replace('ZERO-COPY · CRASH TRACE','NETWORK TRACE · BOXEDWINE')
          s=s.replace('F5.3 removes the second 1.7 GB ZIP copy during BrowserFS mounting and continuously saves the trace so a Safari memory crash can be recovered after reload.','F5.3 keeps the zero-copy app mount and traces every BoxedWine root/overlay XHR so the remaining filesystem failure identifies its exact URL and HTTP status.')
          needle="function scriptText(t){return new Promise((res,rej)=>{const s=document.createElement('script');s.text=t;s.onerror=rej;document.head.appendChild(s);res()})}"
          inject="""function installNetTrace(){
          const X=window.XMLHttpRequest;if(!X||X.prototype.__rigf53)return;X.prototype.__rigf53=true;
          const o=X.prototype.open,send=X.prototype.send;
          X.prototype.open=function(method,url,async,user,pass){this.__rigf53url=String(url);this.__rigf53method=String(method);log('F5.3 XHR OPEN · '+this.__rigf53method+' · '+this.__rigf53url+' · async='+(async!==false));return o.call(this,method,url,async,user,pass)};
          X.prototype.send=function(body){const xhr=this,u=this.__rigf53url||'?';const done=()=>{try{log('F5.3 XHR DONE · '+(xhr.__rigf53method||'?')+' · '+u+' · status='+xhr.status+' · ready='+xhr.readyState)}catch(e){}};this.addEventListener('load',done);this.addEventListener('error',()=>log('F5.3 XHR ERROR · '+u+' · status='+(xhr.status||0)));this.addEventListener('abort',()=>log('F5.3 XHR ABORT · '+u));this.addEventListener('timeout',()=>log('F5.3 XHR TIMEOUT · '+u));return send.call(this,body)};
          log('F5.3 XHR TRACE ARMED')}
          """+needle
          if needle not in s: raise SystemExit('scriptText needle missing')
          s=s.replace(needle,inject)
          needle2="setup.classList.add('hide');status('LOADING BOXEDWINE WASM · WHOLE ROOT');await scriptURL(ENGINE);"
          repl2="installNetTrace();setup.classList.add('hide');status('LOADING BOXEDWINE WASM · WHOLE ROOT');await scriptURL(ENGINE);"
          if needle2 not in s: raise SystemExit('boot needle missing')
          s=s.replace(needle2,repl2)
          p.write_text(s)
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/patch-rigf-f53.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rig F F5.3 trace root and overlay XHR failures"
          git push