name: Finalize Kineza Sprint A

on:
  push:
    branches:
      - main
    paths:
      - 'prizim-staging/kineza-sprintA/TRIGGER.txt'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download verified carrier
        shell: bash
        run: |
          set -euo pipefail
          url="$(cat prizim-staging/kineza-sprintA/DROPBOX_READY.txt)"
          curl --fail --location --silent --show-error "$url" -o /tmp/kineza.zip
          test "$(wc -c < /tmp/kineza.zip)" -eq 3086538
          echo '31133f3c896295905a5d43cd9f377c69d6961d69e0c0e6f3e1db363277d5a4fe  /tmp/kineza.zip' | sha256sum -c -
          rm -rf /tmp/kineza
          mkdir -p /tmp/kineza
          unzip -q /tmp/kineza.zip -d /tmp/kineza
          echo 'bacf816ecfd936c37931ed7ba6c0d0b135d1fbb7f1688ad91a3900ab92a39e14  /tmp/kineza/kineza_basic_attack_v2.png' | sha256sum -c -
          echo '426e87770bc8d51135a44b291ca68d380a1118f69e0d092ca85bfbf7ced02975  /tmp/kineza/kineza_battle_states_v1.png' | sha256sum -c -

      - name: Install authority assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/characters/kineza/animations assets/characters/kineza/battle
          cp /tmp/kineza/kineza_basic_attack_v2.png assets/characters/kineza/animations/kineza_basic_attack_v2.png
          cp /tmp/kineza/kineza_battle_states_v1.png assets/characters/kineza/battle/kineza_battle_states_v1.png
          cp /tmp/kineza/runtime_manifest.json assets/characters/kineza/battle/KINEZA_SPRINT_A_RUNTIME_AUTHORITY.json

      - name: Apply runtime wiring
        shell: bash
        run: |
          set -euo pipefail
          python tools/finalize_kineza_sprintA.py

      - name: Syntax and authority checks
        shell: bash
        run: |
          set -euo pipefail
          node --check src/PartyBattleConfig.js
          node --check src/PartyFormationView.js
          node --check src/PartyBattleScene.js
          grep -q "kineza_basic_attack_v2" src/PartyBattleConfig.js
          grep -q "KINEZA_STATE_SHEET" src/PartyBattleConfig.js
          grep -q "playTurnEntry" src/PartyFormationView.js
          grep -q "_setAttackPov" src/PartyBattleScene.js
          grep -q "kineza-sprintA-1" hybrid-battle-live.html

      - name: Commit Sprint A integration
        shell: bash
        run: |
          set -euo pipefail
          rm -rf prizim-staging/kineza-sprintA
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Live: Kineza Sprint A battle presentation'
          git push origin HEAD:main
