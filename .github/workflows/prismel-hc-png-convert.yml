name: Prismel HC PNG Convert

on:
  push:
    paths:
      - '.github/workflows/prismel-hc-png-convert.yml'

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install SVG renderer
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - name: Render approved HC SVG wrappers to PNG
        run: |
          rsvg-convert assets/characters/prismel/live_hc/prismel_idle_passive_hc.svg -o assets/characters/prismel/live_hc/prismel_idle_passive_hc.png
          rsvg-convert assets/characters/prismel/live_hc/prismel_idle_active_hc.svg -o assets/characters/prismel/live_hc/prismel_idle_active_hc.png
          file assets/characters/prismel/live_hc/prismel_idle_*_hc.png
      - name: Commit PNG authority and remove converter
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/characters/prismel/live_hc/prismel_idle_passive_hc.png assets/characters/prismel/live_hc/prismel_idle_active_hc.png
          git rm .github/workflows/prismel-hc-png-convert.yml
          git commit -m 'Fix Prismel HC idle assets for iOS MAIN'
          git push
