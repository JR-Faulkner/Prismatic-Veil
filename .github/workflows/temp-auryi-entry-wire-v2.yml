name: Temporary Auryi entry wire v2
on:
  push:
    paths:
      - pv-data/triggers/auryi-entry-wire-v2.trigger
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch PriZim for Auryi entry
        run: |
          python <<'PY'
          from pathlib import Path
          import json

          # Driver v0.7: optional cinematic audio + white-key source preprocessing.
          p=Path('src/prizim/DuoHybridSequenceDriver.js')
          t=p.read_text()
          t=t.replace('// PriZim Duo-Hybrid Sequence Driver v0.6','// PriZim Duo-Hybrid Sequence Driver v0.7')
          anchor='  async prepareSequenceSource(manifest, version = \'1\') {'
          helper='''  whiteKeyImage(image) {
    const canvas = document.createElement('canvas');
    canvas.width = image.naturalWidth;
    canvas.height = image.naturalHeight;
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    if (!ctx) throw new Error('[PriZim Duo-Hybrid] White-key canvas unavailable.');
    ctx.drawImage(image, 0, 0);
    const data = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const px = data.data;
    for (let i = 0; i < px.length; i += 4) {
      const dr = 255 - px[i], dg = 255 - px[i + 1], db = 255 - px[i + 2];
      const dist = Math.sqrt(dr * dr + dg * dg + db * db);
      const max = Math.max(px[i], px[i + 1], px[i + 2]);
      const min = Math.min(px[i], px[i + 1], px[i + 2]);
      const sat = max - min;
      const base = clamp01((dist - 10) / 42);
      const glow = clamp01((sat - 14) / 70) * clamp01((max - 145) / 95) * 0.86;
      px[i + 3] = Math.round(255 * Math.max(base, glow));
    }
    ctx.putImageData(data, 0, 0);
    return canvas;
  }

'''
          assert anchor in t
          t=t.replace(anchor,helper+anchor,1)
          old='''          const image = await this.loadImage(frame.asset, version);
          frames.push({ image, sx: 0, sy: 0, sw: image.naturalWidth, sh: image.naturalHeight });'''
          new='''          let image = await this.loadImage(frame.asset, version);
          if (source.whiteKey === true) image = this.whiteKeyImage(image);
          const iw = image.naturalWidth || image.width;
          const ih = image.naturalHeight || image.height;
          frames.push({ image, sx: 0, sy: 0, sw: iw, sh: ih });'''
          assert old in t
          t=t.replace(old,new,1)
          old='''    scene.audio?.beginCinematicAttack?.();
    sprite.setVisible(false);'''
          new='''    const cinematicAudio = presentation.cinematicAudio !== false;
    if (cinematicAudio) scene.audio?.beginCinematicAttack?.();
    sprite.setVisible(false);'''
          assert old in t
          t=t.replace(old,new,1)
          old='''      scene.audio?.endCinematicAttack?.();
      layer.ctx.setTransform(1, 0, 0, 1, 0, 0);'''
          new='''      if (cinematicAudio) scene.audio?.endCinematicAttack?.();
      layer.ctx.setTransform(1, 0, 0, 1, 0, 0);'''
          assert old in t
          t=t.replace(old,new,1)
          p.write_text(t)

          # Neutral Auryi entry manifest.
          durations=[140,130,135,145,155,180]
          frames=[]
          for i,d in enumerate(durations):
              frames.append({'index':i,'asset':f'./assets/characters/auryi/animations/entry/frames/Auryi_Entry_{i+1:02d}.png','duration':d,'x':0,'y':0,'scale':1.0,'anchor_x':384,'anchor_y':756})
          manifest={
            'schemaVersion':1,'id':'auryi_turn_entry_v1','driver':'prizim-duo-hybrid','mode':'sequence','displayName':'Auryi','sequenceName':'Turn Entry',
            'source':{'type':'frames','whiteKey':True},
            'content':{'baselinePx':756,'contentHeightPx':744},
            'reference':{'width':960,'height':540,'homeX':0,'homeY':0,'contactX':1,'baseScale':1.0,'contactXOffsetFrac':0},
            'presentation':{
              'cinematicAudio':False,
              'camera':{'focusYOffsetFrac':-0.045,'track':[
                {'frame':0,'zoom':1.00,'targetMix':0.0},{'frame':1,'zoom':1.05,'targetMix':0.0},{'frame':2,'zoom':1.10,'targetMix':0.0},{'frame':3,'zoom':1.14,'targetMix':0.0},{'frame':4,'zoom':1.10,'targetMix':0.0},{'frame':5,'zoom':1.00,'targetMix':0.0}
              ]},
              'actorScaleTrack':[{'frame':0,'scale':1.00},{'frame':2,'scale':1.05},{'frame':3,'scale':1.09},{'frame':5,'scale':1.00}]
            },
            'markers':{'entryStart':[0],'crownIgnite':[1,2],'auorbOrbit':[2,3,4],'entrySettle':[5]},'povFrames':[2,3,4],'frames':frames
          }
          Path('pv-data/sequences/auryi_turn_entry.duo.sequence.json').write_text(json.dumps(manifest,indent=2)+'\n')

          # Adapter v0.7: Auryi entry + 12 percent presence lift.
          p=Path('src/prizim/DuoHybridPartyFormationView.js')
          t=p.read_text()
          t=t.replace('// PriZim Duo-Hybrid Formation Adapter v0.6','// PriZim Duo-Hybrid Formation Adapter v0.7')
          t=t.replace("import DuoHybridSequenceDriver from './DuoHybridSequenceDriver.js?v=duo-6';","import DuoHybridSequenceDriver from './DuoHybridSequenceDriver.js?v=duo-7';")
          key='});\n\nexport default class DuoHybridPartyFormationView'
          insert="""});

const AURYI_ENTRY_DUO = Object.freeze({
  id: 'auryi_turn_entry_v1',
  name: 'Auryi Turn Entry',
  manifest: './pv-data/sequences/auryi_turn_entry.duo.sequence.json',
  version: '7'
});

export default class DuoHybridPartyFormationView"""
          assert key in t
          t=t.replace(key,insert,1)
          old="""    this.duoHybrid.prepare(KINEZA_BLITZER_DUO).catch(error => {
      actor.duoPrewarmError = error;
      console.warn('[PriZim Duo-Hybrid] Blitzer prewarm deferred:', error);
    });
  }

  hasAttackSheet(heroId) {"""
          new="""    this.duoHybrid.prepare(KINEZA_BLITZER_DUO).catch(error => {
      actor.duoPrewarmError = error;
      console.warn('[PriZim Duo-Hybrid] Blitzer prewarm deferred:', error);
    });
    const auryi = this.actors.get('auryi');
    if (auryi) {
      auryi.duoEntryConfig = AURYI_ENTRY_DUO;
      this.duoHybrid.prepare(AURYI_ENTRY_DUO).catch(error => {
        auryi.duoEntryPrewarmError = error;
        console.warn('[PriZim Duo-Hybrid] Auryi entry prewarm deferred:', error);
      });
    }
  }

  layout() {
    super.layout();
    const auryi = this.actors.get('auryi');
    if (!auryi || auryi._snapshot) return;
    const mul = 1.12;
    auryi.sprite.setScale(auryi.sprite.scaleX * mul, auryi.sprite.scaleY * mul);
    auryi.ghost.setScale(auryi.ghost.scaleX * mul, auryi.ghost.scaleY * mul);
    auryi.ring.setSize(auryi.sprite.displayWidth * 0.5, auryi.sprite.displayWidth * 0.18);
  }

  hasTurnEntry(heroId) {
    if (heroId === 'auryi') return !!this.actors.get(heroId)?.duoEntryConfig;
    return super.hasTurnEntry(heroId);
  }

  async playTurnEntry(heroId) {
    if (heroId !== 'auryi') return super.playTurnEntry(heroId);
    const actor = this.actors.get(heroId);
    if (!actor?.duoEntryConfig) return;
    return this.duoHybrid.playSequence({ config: actor.duoEntryConfig, actor, enemyX: actor.sprite.x, enemyY: actor.sprite.y, onFrame: null });
  }

  hasAttackSheet(heroId) {"""
          assert old in t
          t=t.replace(old,new,1)
          p.write_text(t)
          PY
      - name: Commit
        run: |
          git config user.name JR-Faulkner
          git config user.email 53619182+JR-Faulkner@users.noreply.github.com
          git add src/prizim/DuoHybridSequenceDriver.js src/prizim/DuoHybridPartyFormationView.js pv-data/sequences/auryi_turn_entry.duo.sequence.json
          git commit -m 'Wire Auryi PriZim entry and battle presence'
          git push
