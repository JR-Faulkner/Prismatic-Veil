name: LIVE29E Overworld enhancement
on:
  push:
    paths:
      - '.github/workflows/live29e-overworld-enhance.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire LIVE29E layer
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('hybrid-overworld.html')
          s=p.read_text()
          old="text=text.replace('</body>',bodyPatch+'</body>');document.open();document.write(text);document.close()"
          new="text=text.replace('</body>',bodyPatch+'<script src=\"./assets/js/pv-menu-sfx.js?pvasset=live29e\"></script><script src=\"./assets/js/pv-overworld-live29e.js?pvasset=live29e\"></script></body>');document.open();document.write(text);document.close()"
          if old not in s:
              raise SystemExit('Expected Overworld injection point not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hybrid-overworld.html
          git diff --cached --quiet && exit 0
          git commit -m "Wire LIVE29E Overworld UI and menu SFX"
          git push
