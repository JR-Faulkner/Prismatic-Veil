name: Patch Rig F F5.6
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch-rigf-f56.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch rig-f.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('mugen-lab/rig-f.html')
          s=p.read_text()
          s=s.replace('MobMugen · Rig F · F5.5','MobMugen · Rig F · F5.6')
          s=s.replace('MOBMUGEN · RIG F · F5.5','MOBMUGEN · RIG F · F5.6')
          s=s.replace('Rig F · F5.5','Rig F · F5.6')
          s=s.replace('F5.5','F5.6')
          s=s.replace('ON-DEMAND ROOT · BOXEDWINE','POST-LAUNCH PROBE · BOXEDWINE')
          s=s.replace('F5.6 keeps the zero-copy app mount but switches the now-working same-origin Wine root to BoxedWine on-demand range loading, avoiding the full-root expansion burst that crashed Safari in F5.4.','F5.6 keeps the proven on-demand root, suppresses high-volume root creation logging, throttles crash-trace persistence, and adds post-launch Wine/WinMUGEN lifecycle probes to reduce iPhone pressure and expose the next failure after EXE launch.')
          old="function persist(){try{localStorage.setItem(TRACE_KEY,lines.slice(-120).join('\\n').slice(-30000))}catch(e){}}\nfunction log(s){s=String(s);lines.push(s);while(lines.length>180)lines.shift();diag.textContent=lines.join('\\n');diag.scrollTop=diag.scrollHeight;persist()}"
          new="let lastPersist=0; function persist(force){const now=Date.now();if(!force&&now-lastPersist<750)return;lastPersist=now;try{localStorage.setItem(TRACE_KEY,lines.slice(-120).join('\\n').slice(-30000))}catch(e){}}\nfunction log(s){s=String(s); if(/^BW OUT · creating:/.test(s)) return; lines.push(s);while(lines.length>180)lines.shift();diag.textContent=lines.join('\\n');diag.scrollTop=diag.scrollHeight;persist(false)}"
          if old not in s: raise SystemExit('persist/log needle missing')
          s=s.replace(old,new)
          old2="console.log=(...a)=>{nlog(...a);const s=fmt(a);if(/wine|mugen|emulator|mount|drive|error|warn|root|param|rIGF|creating|zip/i.test(s))log('BW OUT · '+s.slice(0,900))};"
          new2="console.log=(...a)=>{nlog(...a);const s=fmt(a);if(/wine|mugen|emulator|mount|drive|error|warn|root|param|rIGF|zip|launch|running/i.test(s)&&!/^creating:/i.test(s))log('BW OUT · '+s.slice(0,900))};"
          if old2 not in s: raise SystemExit('console needle missing')
          s=s.replace(old2,new2)
          needle="function probe(){try{const c=window.__RigFConfig;log('F5.6 CONFIG · program='+(c&&c.Program)+' work='+(c&&c.WorkingDir)+' root='+(c&&c.rootZipFile)+' overlay='+(c&&c.extraZipFiles));if(window.__RigFGetParams)log('F5.6 PARAMS · '+window.__RigFGetParams().join(' | '))}catch(e){log('F5.6 PROBE ERROR · '+e.message)}}"
          inject=needle+"\nfunction armLifecycle(){try{const m=window.Module||Module;if(!m){log('F5.6 MODULE PROBE · unavailable');return}const oldAbort=m.onAbort,oldExit=m.onExit;m.onAbort=function(r){log('F5.6 WASM ABORT · '+String(r));persist(true);if(oldAbort)try{oldAbort(r)}catch(e){}};m.onExit=function(c){log('F5.6 WASM EXIT · code='+c);persist(true);if(oldExit)try{oldExit(c)}catch(e){}};log('F5.6 MODULE LIFECYCLE ARMED')}catch(e){log('F5.6 MODULE HOOK ERROR · '+e.message)}}"
          if needle not in s: raise SystemExit('probe needle missing')
          s=s.replace(needle,inject)
          old3="await scriptURL(ENGINE);status('BOXEDWINE ENGINE STARTED');witness()"
          new3="await scriptURL(ENGINE);status('BOXEDWINE ENGINE STARTED');armLifecycle();setTimeout(()=>{log('F5.6 POST-LAUNCH HEARTBEAT · 2s');probe();persist(true)},2000);setTimeout(()=>{log('F5.6 POST-LAUNCH HEARTBEAT · 6s');probe();persist(true)},6000);witness()"
          if old3 not in s: raise SystemExit('engine needle missing')
          s=s.replace(old3,new3)
          p.write_text(s)
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/patch-rigf-f56.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rig F F5.6 quiet root logs and probe WinMUGEN lifecycle"
          git push
