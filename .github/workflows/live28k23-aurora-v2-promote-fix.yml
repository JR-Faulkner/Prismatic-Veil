          for t in ['Auryi_AuroraPulse_Resonart_Beauty_v2_KingAI_MASTER.mp4','choirTail: 9.35','reveal: 9.50','impactReveal: 9.72','reconnect: 9.90','end: 10.02','AURORA_BLOOM_TAIL_SOURCE = 3.86','video.muted = true','video.defaultMuted = true','beginAuroraVideoMix','auroraV2SfxPrime','auroraV2SfxReveal','auroraBloomTailPrime','auroraBloomTailReveal']:
