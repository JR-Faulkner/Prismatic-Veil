name: Promote LIVE28K23 Aurora Pulse V2 Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/promote_aurora_v2_fix/GO.txt'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Run current canonical PriZim preflight before live write
        run: python tools/prizim/preflight_live28k.py

      - name: Verify V2 media already installed
        shell: bash
        run: |
          set -euo pipefail
          VIDEO='assets/characters/auryi/animations/aurora_pulse/cinematic/Auryi_AuroraPulse_Resonart_Beauty_v2_KingAI_MASTER.mp4'
          AUDIO='assets/characters/auryi/animations/aurora_pulse/cinematic/Auryi_AuroraPulse_Resonart_Beauty_v2_KingAI_AUDIO.m4a'
          echo '57101593d7bee82ab444f3f556dd634ad71928975f43cf1a4eebadce020825ac  '"$VIDEO" | sha256sum -c -
          echo '9d3da298c2f5712e3a52446ecaca9b7eb3100e030d0d3acf04f6e041b1f727d0  '"$AUDIO" | sha256sum -c -

      - name: Transform K audio controller for Aurora V2 native mix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('src/PartyBattleAudioController.js')
          s=p.read_text()
          def once(old,new,label):
              global s
              assert old in s, f'missing audio transform anchor: {label}'
              s=s.replace(old,new,1)

          once("const AURORA_BLOOM_PATH = './assets/music/Celestial Bloom.m4a?pvasset=live28k18-native';",
               "const AURORA_BLOOM_PATH = './assets/music/Celestial Bloom.m4a?pvasset=live28k18-native';\nconst AURORA_V2_SFX_PATH = './assets/characters/auryi/animations/aurora_pulse/cinematic/Auryi_AuroraPulse_Resonart_Beauty_v2_KingAI_AUDIO.m4a?pvasset=live28k23-aurora-v2';",
               'V2 SFX constant')
          once("    this._auroraBloom = null;\n    this._triumph = null;",
               "    this._auroraBloom = null;\n    this._auroraV2Sfx = null;\n    this._triumph = null;",
               'constructor native media')
          once("    this._nativeResume = { bloom: false, triumph: false };",
               "    this._nativeResume = { bloom: false, v2sfx: false, triumph: false };",
               'native resume state')
          once("    this._cinematicActive = false;",
               "    this._cinematicActive = false;\n    this._cinematicBgmSilenced = false;",
               'cinematic silence state')
          once("    this._auroraBloom = makeNativeAudio(AURORA_BLOOM_PATH, false);\n    this._triumph = makeNativeAudio(TRIUMPH_LIGHT_PATH, true);\n    try { this._auroraBloom.load(); this._triumph.load(); } catch (err) { /* native preload is best-effort */ }",
               "    this._auroraBloom = makeNativeAudio(AURORA_BLOOM_PATH, false);\n    this._auroraV2Sfx = makeNativeAudio(AURORA_V2_SFX_PATH, false);\n    this._triumph = makeNativeAudio(TRIUMPH_LIGHT_PATH, true);\n    try { this._auroraBloom.load(); this._auroraV2Sfx.load(); this._triumph.load(); } catch (err) { /* native preload is best-effort */ }",
               'native media create')
          once("        this._nativeResume.bloom = !!(this._auroraBloom && !this._auroraBloom.paused && !this._auroraBloom.ended);\n        this._nativeResume.triumph = !!(this._triumph && !this._triumph.paused && !this._triumph.ended);\n        if (this._nativeResume.bloom) this._auroraBloom.pause();\n        if (this._nativeResume.triumph) this._triumph.pause();",
               "        this._nativeResume.bloom = !!(this._auroraBloom && !this._auroraBloom.paused && !this._auroraBloom.ended);\n        this._nativeResume.v2sfx = !!(this._auroraV2Sfx && !this._auroraV2Sfx.paused && !this._auroraV2Sfx.ended);\n        this._nativeResume.triumph = !!(this._triumph && !this._triumph.paused && !this._triumph.ended);\n        if (this._nativeResume.bloom) this._auroraBloom.pause();\n        if (this._nativeResume.v2sfx) this._auroraV2Sfx.pause();\n        if (this._nativeResume.triumph) this._triumph.pause();",
               'visibility pause')
          once("        if (this._nativeResume.bloom) this._auroraBloom?.play?.().catch?.(() => {});\n        if (this._nativeResume.triumph) this._triumph?.play?.().catch?.(() => {});\n        this._nativeResume.bloom = false;\n        this._nativeResume.triumph = false;",
               "        if (this._nativeResume.bloom) this._auroraBloom?.play?.().catch?.(() => {});\n        if (this._nativeResume.v2sfx) this._auroraV2Sfx?.play?.().catch?.(() => {});\n        if (this._nativeResume.triumph) this._triumph?.play?.().catch?.(() => {});\n        this._nativeResume.bloom = false;\n        this._nativeResume.v2sfx = false;\n        this._nativeResume.triumph = false;",
               'visibility resume')
          once("    if (this._auroraBloom && !this._auroraBloom.paused) this._auroraBloom.volume = this._effectiveVolume('sfx', 1.0);\n    if (this._triumph && !this._triumph.paused) this._triumph.volume = this._effectiveVolume('music', 0.92);",
               "    if (this._auroraBloom && !this._auroraBloom.paused) this._auroraBloom.volume = this._effectiveVolume('sfx', 1.0);\n    if (this._auroraV2Sfx && !this._auroraV2Sfx.paused) this._auroraV2Sfx.volume = this._effectiveVolume('sfx', 1.0);\n    if (this._triumph && !this._triumph.paused) this._triumph.volume = this._effectiveVolume('music', 0.92);",
               'mute propagation')
          once("  _musicTargetVolume() {\n    return this._effectiveVolume('music') * (this._cinematicActive ? CINEMATIC_MUSIC_MULT : 1);\n  }",
               "  _musicTargetVolume() {\n    if (this._cinematicBgmSilenced) return 0;\n    return this._effectiveVolume('music') * (this._cinematicActive ? CINEMATIC_MUSIC_MULT : 1);\n  }",
               'music target silence')

          marker="  beginCinematicAttack() {"
          assert marker in s, 'missing beginCinematicAttack marker'
          methods=r'''  beginAuroraVideoMix() {
    this._cinematicActive = true;
    this._cinematicBgmSilenced = true;
    if (!this.music || !this.music.isPlaying) return;
    this._duckToken = (this._duckToken || 0) + 1;
    this.scene.tweens.killTweensOf(this.music);
    this.scene.tweens.add({ targets: this.music, volume: 0, duration: 110, ease: 'Sine.easeOut' });
  }

  endAuroraVideoMix() {
    this._cinematicBgmSilenced = false;
    this._cinematicActive = false;
    if (!this.music || !this.music.isPlaying) return;
    this._duckToken = (this._duckToken || 0) + 1;
    this.scene.tweens.killTweensOf(this.music);
    this.scene.tweens.add({ targets: this.music, volume: this._musicTargetVolume(), duration: 320, ease: 'Sine.easeIn' });
  }

  auroraV2SfxPrime() {
    const sound = this._auroraV2Sfx;
    if (!sound) return false;
    resetNativeAudio(sound);
    sound.loop = false;
    sound.volume = 0;
    try {
      const pending = sound.play();
      pending?.catch?.(err => console.warn('[PV] Aurora V2 SFX native prime blocked:', err));
    } catch (err) {
      console.warn('[PV] Aurora V2 SFX native prime failed:', err);
      return false;
    }
    return true;
  }

  auroraV2SfxReveal() {
    const sound = this._auroraV2Sfx;
    if (!sound) return false;
    try { sound.currentTime = 0; } catch (err) { /* metadata may still be settling */ }
    sound.volume = this._effectiveVolume('sfx', 1.0);
    try {
      const pending = sound.play();
      pending?.catch?.(err => console.warn('[PV] Aurora V2 SFX native reveal blocked:', err));
    } catch (err) {
      console.warn('[PV] Aurora V2 SFX native reveal failed:', err);
      return false;
    }
    return true;
  }

  auroraV2SfxStop(fadeMs = 120) {
    const sound = this._auroraV2Sfx;
    if (!sound) return;
    if (sound.paused || sound.ended) {
      resetNativeAudio(sound);
      sound.volume = this._effectiveVolume('sfx', 1.0);
      return;
    }
    this.scene.tweens.killTweensOf(sound);
    this.scene.tweens.add({
      targets: sound, volume: 0, duration: fadeMs, ease: 'Sine.easeOut',
      onComplete: () => { resetNativeAudio(sound); sound.volume = this._effectiveVolume('sfx', 1.0); }
    });
  }

  auroraBloomTailPrime() {
    const sound = this._auroraBloom;
    if (!sound) return false;
    resetNativeAudio(sound);
    sound.loop = true;
    sound.volume = 0;
    try {
      const pending = sound.play();
      pending?.catch?.(err => console.warn('[PV] Celestial Bloom tail prime blocked:', err));
    } catch (err) {
      console.warn('[PV] Celestial Bloom tail prime failed:', err);
      return false;
    }
    return true;
  }

  auroraBloomTailReveal(sourceSeconds = 3.86) {
    const sound = this._auroraBloom;
    if (!sound) return false;
    sound.loop = false;
    try { sound.currentTime = Math.max(0, Number(sourceSeconds) || 0); } catch (err) { /* metadata may still be settling */ }
    sound.volume = this._effectiveVolume('sfx', 1.0);
    try {
      const pending = sound.play();
      pending?.catch?.(err => console.warn('[PV] Celestial Bloom choir-tail reveal blocked:', err));
    } catch (err) {
      console.warn('[PV] Celestial Bloom choir-tail reveal failed:', err);
      return false;
    }
    return true;
  }

'''
          s=s.replace(marker,methods+marker,1)
          once("    prime(this._auroraBloom);\n    prime(this._triumph);",
               "    prime(this._auroraBloom);\n    prime(this._auroraV2Sfx);\n    prime(this._triumph);",
               'prime native V2')
          once("    if (this._auroraBloom) { try { this._auroraBloom.pause(); this._auroraBloom.removeAttribute('src'); this._auroraBloom.load(); } catch (err) { /* ignore */ } this._auroraBloom = null; }\n    if (this._triumph)",
               "    if (this._auroraBloom) { try { this._auroraBloom.pause(); this._auroraBloom.removeAttribute('src'); this._auroraBloom.load(); } catch (err) { /* ignore */ } this._auroraBloom = null; }\n    if (this._auroraV2Sfx) { try { this._auroraV2Sfx.pause(); this._auroraV2Sfx.removeAttribute('src'); this._auroraV2Sfx.load(); } catch (err) { /* ignore */ } this._auroraV2Sfx = null; }\n    if (this._triumph)",
               'destroy V2 native')
          p.write_text(s)
          PY

      - name: Transform K Aurora director to Beauty V2
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/prizim/Live28K2PartyBattleScene.js')
          s=p.read_text()
          old="const AURORA_BEAUTY_VIDEO_PATH = './assets/characters/auryi/animations/aurora_pulse/cinematic/Auryi_AuroraPulse_Resonart_Beauty_v1_1080p.mp4?pvasset=live28k14-beauty';"
          assert old in s, 'missing V1 Beauty path anchor'
          s=s.replace(old,"const AURORA_BEAUTY_VIDEO_PATH = './assets/characters/auryi/animations/aurora_pulse/cinematic/Auryi_AuroraPulse_Resonart_Beauty_v2_KingAI_MASTER.mp4?pvasset=live28k23-aurora-v2';",1)
          old="const AURORA_BEAUTY_TIMELINE = Object.freeze({ invocation: 0.70, bloomWatchdog: 0.84, silence: 4.56, pulse: 5.18, reveal: 6.08, impactReveal: 6.30, reconnect: 6.58, end: 6.65 });"
          assert old in s, 'missing V1 timeline anchor'
          new="const AURORA_BEAUTY_TIMELINE = Object.freeze({ choirTail: 9.35, reveal: 9.50, impactReveal: 9.72, reconnect: 9.90, end: 10.02 });\nconst AURORA_BLOOM_TAIL_SOURCE = 3.86;\nconst AURORA_LIVE_INTRO_MS = 900;\nconst AURORA_LIVE_HANDOFF_MS = 220;"
          s=s.replace(old,new,1)

          director=r'''  async _runAuroraBeautyDirector(video) {
    if (!video) return;
    // Beauty V2 owns its internal cinematic camera. Hybrid adds only a restrained
    // breathing push so the source animation stays visually authoritative.
    video.style.transition = 'opacity 160ms ease, transform 1800ms cubic-bezier(0.22, 1, 0.36, 1), filter 320ms ease';
    video.style.transform = 'scale(1.026)';
    video.style.filter = 'brightness(0.98) contrast(1.04) saturate(1.05)';
    await this._waitForAuroraBeautyTime(video, 7.90);
    video.style.transition = 'opacity 160ms ease, transform 1500ms cubic-bezier(0.22, 1, 0.36, 1), filter 300ms ease';
    video.style.transform = 'scale(1.012)';
    video.style.filter = 'brightness(1.05) contrast(1.03) saturate(1.08)';
    await this._waitForAuroraBeautyTime(video, 9.30);
    video.style.transition = 'opacity 140ms ease, transform 520ms cubic-bezier(0.22, 1, 0.36, 1), filter 180ms ease';
    video.style.transform = 'scale(1.045)';
    video.style.filter = 'brightness(1.14) contrast(1.02) saturate(1.10)';
  }

'''
          pat=r"  async _runAuroraBeautyDirector\(video\) \{.*?\n  \}\n\n(?=  _playAuroraBattlefieldAfterglow\()"
          s,n=re.subn(pat,director,s,count=1,flags=re.S)
          assert n==1, 'failed to replace Aurora Beauty director'

          beauty=r'''  async _playAuryiAuroraPulseBeauty(hero) {
    const video = this._prepareAuroraBeautyVideo();
    if (!video) return false;

    this._turnLock = true;
    this._hideCommandRail();
    this._hideTargetCursor?.();

    const base = hero.resonart.damage;
    const low = Math.round(base * 0.85);
    const high = Math.round(base * 1.15);
    const hitRoll = Math.random() < AURORA_PULSE_HIT_CHANCE;
    let ownsV2Sfx = false;
    let ownsBloomTail = false;
    let impactResolved = false;
    let pendingImpact = null;
    const cam = this.cameras.main;
    const cameraState = { zoom: cam.zoom, scrollX: cam.scrollX, scrollY: cam.scrollY };

    // Aurora V2 mix: normal battle BGM is completely silent. The exact V2
    // SFX packet-copy owns the cinematic middle; Celestial Bloom enters only
    // as the choir-tail bridge at the final blast.
    this.audio.beginAuroraVideoMix?.();
    ownsV2Sfx = this.audio.auroraV2SfxPrime?.() === true;
    ownsBloomTail = this.audio.auroraBloomTailPrime?.() === true;
    this._setBanner(`${hero.name} invokes ${hero.resonart.name}!`);

    this.tweens.killTweensOf(cam);
    this.tweens.add({ targets: cam, zoom: cameraState.zoom * 1.045, duration: AURORA_LIVE_INTRO_MS, ease: 'Sine.easeOut' });
    const liveActor = this.formation?.actors?.get?.('auryi');
    const liveSprite = liveActor?.sprite;
    const liveY = liveSprite?.y;
    if (liveSprite && Number.isFinite(liveY)) {
      this.tweens.add({ targets: liveSprite, y: liveY - Math.min(18, this.scale.height * 0.03), duration: AURORA_LIVE_INTRO_MS, ease: 'Sine.easeOut' });
    }
    await this._wait(AURORA_LIVE_INTRO_MS);
    this.formation.setPovFocus?.(hero.id, true);
    await this._wait(AURORA_LIVE_HANDOFF_MS);

    try {
      video.pause();
      try { video.currentTime = 0; } catch (err) { /* metadata may still be settling */ }
      video.style.display = 'block';
      video.style.opacity = '0';
      video.style.transform = 'scale(1.026)';
      const playPromise = video.play();
      if (playPromise) await playPromise;
      if (ownsV2Sfx) this.audio.auroraV2SfxReveal?.();
      requestAnimationFrame(() => { video.style.opacity = '1'; });
      const directorTask = this._runAuroraBeautyDirector(video).catch(err => console.warn('[PV] Aurora Pulse V2 Hybrid director skipped:', err));

      await this._waitForAuroraBeautyTime(video, AURORA_BEAUTY_TIMELINE.choirTail);
      if (ownsBloomTail) this.audio.auroraBloomTailReveal?.(AURORA_BLOOM_TAIL_SOURCE);

      await this._waitForAuroraBeautyTime(video, AURORA_BEAUTY_TIMELINE.reveal);
      this._beginAuroraBeautyBattlefieldReveal(video);

      await this._waitForAuroraBeautyTime(video, AURORA_BEAUTY_TIMELINE.impactReveal);
      if (hitRoll) {
        const dmg = Phaser.Math.Between(low, high);
        this.enemy.hp = Math.max(0, this.enemy.hp - dmg);
        this._updateTargetCard();
        pendingImpact = { dmg, lethal: this.enemy.hp <= 0 };
        this._setBanner(`${hero.name} uses ${hero.resonart.name} for ${dmg} damage!`);
        this.audio.attackImpact(hero.id);
        this.audio.enemyHit();
      } else {
        this._setBanner(`${hero.name} uses ${hero.resonart.name} — missed!`);
      }
      impactResolved = true;
      this.audio.auroraReentryWave?.();
      this._playAuroraBattlefieldAfterglow();
      if (pendingImpact) this._playAuroraEnemyReconnectImpact(pendingImpact.dmg, pendingImpact.lethal);

      await this._waitForAuroraBeautyTime(video, AURORA_BEAUTY_TIMELINE.reconnect);
      await this._waitForAuroraBeautyTime(video, AURORA_BEAUTY_TIMELINE.end, 16000);
      await directorTask;
    } catch (err) {
      console.warn('[PV] Aurora Beauty V2 playback fell back to Hybrid mock:', err);
      if (ownsV2Sfx) this.audio.auroraV2SfxStop?.(80);
      if (ownsBloomTail) this.audio.auroraBloomStop?.(120);
      this.audio.endAuroraVideoMix?.();
      await this._hideAuroraBeautyVideo(video, 40);
      this._restoreAuroraBeautyDirector(hero.id, cameraState);
      if (!impactResolved) {
        this._turnLock = false;
        return false;
      }
    }

    if (ownsV2Sfx) this.audio.auroraV2SfxStop?.(90);
    if (ownsBloomTail) this.audio.auroraBloomStop?.(420);
    await this._hideAuroraBeautyVideo(video, 90);
    this._restoreAuroraBeautyDirector(hero.id, cameraState);
    this.audio.endAuroraVideoMix?.();
    this._turnLock = false;
    this._endHeroTurn();
    return true;
  }

'''
          pat=r"  async _playAuryiAuroraPulseBeauty\(hero\) \{.*?\n  \}\n\n(?=  async _resolveHeroAction\()"
          s,n=re.subn(pat,beauty,s,count=1,flags=re.S)
          assert n==1, 'failed to replace Aurora Beauty action'
