          fixed={'assets/characters/auryi/animations/aurora_pulse/cinematic/Auryi_AuroraPulse_Resonart_Beauty_v2_KingAI_MASTER.mp4':(6256162,'57101593d7bee82ab444f3f556dd634ad71928975f43cf1a4eebadce020825ac'),'assets/characters/auryi/animations/aurora_pulse/cinematic/Auryi_AuroraPulse_Resonart_Beauty_v2_KingAI_AUDIO.m4a':(164264,'9d3da298c2f5712e3a52446ecaca9b7eb3100e030d0d3acf04f6e041b1f727d0'),'assets/music/Celestial Bloom.m4a':(113740,'0e8762907bf36650cbdebab8f6497079350054f9819c81e6cb1ba4f3b14cff3d'),'assets/music/Triumph of Light.m4a':(186602,'98c77e8bc536425b8da8ad4212ed26011335c5ac3b9dadbce0ec28c201cca437')}
          for p,(z,h) in fixed.items():
