name: Inspect Auryi Handoff Archive

on:
  push:
    branches: [main]
    paths:
      - '.github/inspect_auryi_handoff/URL.txt'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download and inspect archive
        shell: bash
        run: |
          set -euo pipefail
          URL=$(cat .github/inspect_auryi_handoff/URL.txt)
          curl --fail --location --silent --show-error "$URL" -o /tmp/auryi_handoff.zip
          unzip -t /tmp/auryi_handoff.zip >/tmp/ziptest.txt
          unzip -l /tmp/auryi_handoff.zip >/tmp/ziplist.txt
          rm -rf /tmp/auryi_handoff
          mkdir -p /tmp/auryi_handoff
          unzip -q /tmp/auryi_handoff.zip -d /tmp/auryi_handoff

          python - <<'PY'
          from pathlib import Path
          import hashlib, struct, re

          root = Path('/tmp/auryi_handoff')
          out = []
          out.append('# Auryi DuoHybrid Archive Scan')
          out.append('')
          out.append('Archive source: /Auryi_DuoHybrid_Complete_Handoff.zip')
          out.append('')
          names = sorted(p for p in root.rglob('*') if p.is_file())
          out.append(f'Total files: {len(names)}')
          out.append('')
          out.append('## Matching Aurora / Pulse / Resonart / numbered Auryi candidates')
          out.append('')

          def png_dims(path):
            try:
              b = path.read_bytes()[:32]
              if b[:8] == b'\x89PNG\r\n\x1a\n' and b[12:16] == b'IHDR':
                w,h = struct.unpack('>II', b[16:24])
                return w,h
            except Exception:
              pass
            return None

          pat = re.compile(r'(aurora|pulse|resonart|auryi.*(?:^|[^0-9])0?[1-8](?:[^0-9]|$)|04_08)', re.I)
          matches = [p for p in names if pat.search(str(p.relative_to(root)))]
          if not matches:
            out.append('NONE')
          else:
            for p in matches:
              rel = str(p.relative_to(root))
              size = p.stat().st_size
              sha = hashlib.sha256(p.read_bytes()).hexdigest()
              dims = png_dims(p)
              suffix = f' | PNG {dims[0]}x{dims[1]}' if dims else ''
              out.append(f'- `{rel}` | {size} bytes | sha256 `{sha}`{suffix}')

          out.append('')
          out.append('## Full file inventory')
          out.append('')
          for p in names:
            out.append(f'- `{p.relative_to(root)}`')

          Path('AURYI_HANDOFF_SCAN.md').write_text('\n'.join(out) + '\n', encoding='utf-8')
          PY

      - name: Commit scan and remove temporary URL
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/inspect_auryi_handoff
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AURYI_HANDOFF_SCAN.md .github/inspect_auryi_handoff
          git commit -m 'Record Auryi handoff archive scan'
          git push origin HEAD:main
