name: Build Kineza v0.3B Input Gate

on:
  push:
    paths:
      - ".github/workflows/build-kineza-v03b-input.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build input-gate package from v0.3A
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import zipfile, shutil, re, hashlib
          repo=Path.cwd()
          src=repo/"mugen-lab/outputs/KINEZA_MUGEN_PROTOTYPE_V0_3A.zip"
          if not src.exists(): raise SystemExit("missing v0.3A package")
          work=Path("/tmp/kineza-v03b-input")
          if work.exists(): shutil.rmtree(work)
          work.mkdir(parents=True)
          with zipfile.ZipFile(src) as z: z.extractall(work)
          root=next(p.parent for p in work.rglob("kineza.def"))
          cmdp=root/"kineza.cmd"
          cmd=cmdp.read_text(errors="replace")

          # Add six one-button probe commands only if absent.
          probe_commands=[]
          for n in ["x","y","z","a","b","c"]:
              name=f"probe_{n}"
              if name not in cmd:
                  probe_commands.append(f"""
[Command]
name = "{name}"
command = {n}
time = 1
""")
          marker="[Statedef -1]"
          if marker not in cmd: raise SystemExit("missing Statedef -1")
          if probe_commands:
              cmd=cmd.replace(marker,"".join(probe_commands)+"\n"+marker,1)

          # Put catch-all one-button routes at the top of State -1 so every
          # visible attack button produces an unmistakable Kineza action.
          routes="""

; v0.3B INPUT GATE: one-button routes for all six MUGEN attack inputs.
; These are diagnostic/functional routes, not final move design.
[State -1, Probe X]
type = ChangeState
value = 200
triggerall = command = "probe_x"
triggerall = statetype != A
trigger1 = ctrl

[State -1, Probe Y]
type = ChangeState
value = 1000
triggerall = command = "probe_y"
triggerall = statetype != A
trigger1 = ctrl

[State -1, Probe Z]
type = ChangeState
value = 1070
triggerall = command = "probe_z"
triggerall = statetype != A
trigger1 = ctrl

[State -1, Probe A]
type = ChangeState
value = 200
triggerall = command = "probe_a"
triggerall = statetype != A
trigger1 = ctrl

[State -1, Probe B]
type = ChangeState
value = 1000
triggerall = command = "probe_b"
triggerall = statetype != A
trigger1 = ctrl

[State -1, Probe C]
type = ChangeState
value = 1070
triggerall = command = "probe_c"
triggerall = statetype != A
trigger1 = ctrl
"""
          # Prevent duplicate insertion on reruns.
          if "v0.3B INPUT GATE" not in cmd:
              cmd=cmd.replace(marker,marker+routes,1)
          cmdp.write_text(cmd)

          # Validate the six physical MUGEN commands and routes exist.
          for n,state in [("x",200),("y",1000),("z",1070),("a",200),("b",1000),("c",1070)]:
              if not re.search(rf"(?ims)^\[Command\]\s*name\s*=\s*\"probe_{n}\".*?^command\s*=\s*{n}\s*$",cmd):
                  raise SystemExit(f"missing probe command {n}")
              if not re.search(rf"(?ims)^\[State -1, Probe {n.upper()}\].*?^value\s*=\s*{state}\s*$.*?^triggerall\s*=\s*command\s*=\s*\"probe_{n}\"",cmd):
                  raise SystemExit(f"missing route {n}->{state}")

          out=repo/"mugen-lab/outputs/KINEZA_MUGEN_PROTOTYPE_V0_3B_INPUT.zip"
          with zipfile.ZipFile(out,"w",zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in sorted((work/"chars").rglob("*")):
                  if p.is_file(): z.write(p,p.relative_to(work).as_posix())
          live=repo/"mugen-lab/assets/ikemen-web/kineza-char-v03b-input.zip"
          shutil.copy2(out,live)
          sha=hashlib.sha256(out.read_bytes()).hexdigest()
          report=f"""# Kineza v0.3B Input Gate

Base: v0.3A motion package.

## Purpose
Make every one of the six MUGEN attack inputs visibly route into a Kineza state before any more art work is promoted.

## Routes
- x -> State 200
- y -> State 1000
- z -> State 1070
- a -> State 200
- b -> State 1000
- c -> State 1070

The browser controller remains unchanged. In the current UI the visible X/Y/Z buttons emit keyboard A/S/D, while visible A/B/C emit Z/X/C. The engine default config maps those keyboard keys to the six MUGEN attack inputs.

## Guardrails
- SFF unchanged.
- AIR/CNS unchanged from v0.3A.
- scale unchanged.
- no browser controller rewrite.
- final move mapping will replace these probe routes after phone confirmation.

ZIP SHA-256: `{sha}`
"""
          (repo/"mugen-lab/KINEZA_V0_3B_INPUT_GATE.md").write_text(report)
          print(report)
          PY

      - name: Commit v0.3B input gate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mugen-lab/outputs/KINEZA_MUGEN_PROTOTYPE_V0_3B_INPUT.zip mugen-lab/assets/ikemen-web/kineza-char-v03b-input.zip mugen-lab/KINEZA_V0_3B_INPUT_GATE.md
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "MOBMUGEN: build Kineza v0.3B six-button input gate"; git push; fi