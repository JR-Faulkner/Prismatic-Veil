name: H2.8 Runtime Authority Patch

on:
  push:
    branches:
      - h28-attack-authority-audio
    paths:
      - 'tools/h28_runtime_authority_patch.py'
      - '.github/workflows/h28-runtime-authority-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: h28-attack-authority-audio
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply H2.8 runtime authority patch
        run: python tools/h28_runtime_authority_patch.py
      - name: Validate syntax and authority gates
        run: |
          node --check src/PartyAttackAuthority.js
          node --check src/PartyBattleConfig.js
          node --check src/PartyFormationView.js
          node --check src/PartyBattleScene.js
          python tools/prizim/attack_authority_check.py
          python tools/prizim/visual_integrity_check.py
          git diff --check
      - name: Commit runtime authority migration
        run: |
          if git diff --quiet; then
            echo 'No runtime authority diff produced; refusing silent pass.'
            exit 1
          fi
          git config user.name 'JR-Faulkner'
          git config user.email '53619182+JR-Faulkner@users.noreply.github.com'
          git add src/PartyAttackAuthority.js src/PartyBattleConfig.js src/PartyFormationView.js src/PartyBattleScene.js tools/prizim/attack_authority_check.py
          git commit -m 'H2.8 unify Party Battle Basic Attack runtime authority'
          git push origin HEAD:h28-attack-authority-audio
