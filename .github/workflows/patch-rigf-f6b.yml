name: Patch Rig F F6b
on:
  push:
    paths:
      - '.github/workflows/patch-rigf-f6b.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply F6 lean app filesystem patch
        shell: bash
        run: |
          echo ' ' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
      - name: Commit F6
        shell: bash
        run: |
          rm -f .github/workflows/patch-rigf-f6.yml .github/workflows/patch-rigf-f6b.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Rig F F6 stream lean WinMUGEN app filesystem'
          git push
