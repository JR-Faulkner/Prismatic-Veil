name: LIVE28K27 Prismel Reflected Blades Polish

on:
  push:
    branches: [main]
    paths:
      - '.github/requests/live28k27-prismel-reflected-blades.txt'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply K27 Prismel presentation polish
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')
          runtime_path = root/'src/prizim/PrismelRefractedReflectionsRuntime.js'
          s = runtime_path.read_text()

          s = s.replace("?pvasset=live28k26-prismel-rr';", "?pvasset=live28k27-prismel-rr';")
          s = s.replace(
            "  shatterMs: 520,\n  battlefieldRevealProgress: 0.34\n});",
            "  shatterMs: 520,\n  battlefieldRevealProgress: 0.34,\n  bladeImpactDelayMs: 240,\n  bladeSettleMs: 420,\n  landingHoldMs: 520\n});"
          )

          marker = "function playLiveRefractedImpact(scene, hero, dmg, lethal) {"
          assert marker in s
          helpers = r'''
function playPrismelGlassShatter(scene) {
  const fallback = () => scene.audio?.attackRelease?.('prismel');
  const ctx = scene?.sound?.context;
  if (!ctx || typeof ctx.createOscillator !== 'function' || typeof ctx.createBufferSource !== 'function') {
    fallback();
    return;
  }
  try {
    const now = ctx.currentTime;
    const level = scene.audio?._effectiveVolume?.('sfx', 0.86) ?? 0.78;
    const master = ctx.createGain();
    master.gain.setValueAtTime(Math.max(0.02, level * 0.54), now);
    master.gain.exponentialRampToValueAtTime(0.001, now + 0.34);
    master.connect(ctx.destination);

    const frames = Math.max(1, Math.floor(ctx.sampleRate * 0.22));
    const buffer = ctx.createBuffer(1, frames, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    let seed = 0x47524c53;
    for (let i = 0; i < frames; i++) {
      seed = (seed * 1664525 + 1013904223) >>> 0;
      const white = (seed / 4294967296) * 2 - 1;
      const env = Math.pow(1 - i / frames, 2.25);
      data[i] = white * env;
    }
    const noise = ctx.createBufferSource();
    const hp = ctx.createBiquadFilter();
    const ng = ctx.createGain();
    hp.type = 'highpass';
    hp.frequency.setValueAtTime(1800, now);
    ng.gain.setValueAtTime(0.001, now);
    ng.gain.exponentialRampToValueAtTime(0.72, now + 0.006);
    ng.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
    noise.buffer = buffer;
    noise.connect(hp); hp.connect(ng); ng.connect(master);
    noise.start(now); noise.stop(now + 0.225);

    [1710, 2290, 3070, 4120, 5230].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = i % 2 ? 'sine' : 'triangle';
      osc.frequency.setValueAtTime(freq, now + i * 0.008);
      osc.frequency.exponentialRampToValueAtTime(freq * (1.12 + i * 0.025), now + 0.12 + i * 0.012);
      gain.gain.setValueAtTime(0.001, now + i * 0.008);
      gain.gain.exponentialRampToValueAtTime(0.20 - i * 0.018, now + 0.012 + i * 0.008);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.11 + i * 0.025);
      osc.connect(gain); gain.connect(master);
      osc.start(now + i * 0.008); osc.stop(now + 0.16 + i * 0.03);
    });
  } catch (err) {
    console.warn('[PV] procedural glass shatter fallback:', err);
    fallback();
  }
}

function createReflectiveBlade(scene, x, y, size, tint, angle, alpha = 0.92) {
  const blade = scene.add.triangle(
    x, y,
    -size * 0.60, size * 0.19,
    size * 0.72, 0,
    -size * 0.60, -size * 0.19,
    0xeafaff, alpha
  ).setStrokeStyle(Math.max(1, size * 0.055), tint, 0.96)
    .setAngle(angle).setDepth(31.55).setBlendMode(Phaser.BlendModes.ADD);
  const glint = scene.add.triangle(
    x, y,
    -size * 0.31, size * 0.055,
    size * 0.48, 0,
    -size * 0.31, -size * 0.055,
    0xffffff, 0.88
  ).setAngle(angle).setDepth(31.57).setBlendMode(Phaser.BlendModes.ADD);
  return [blade, glint];
}

function spawnLandedMirrorShard(scene, x, y, size, tint, angle, delay = 0) {
  const [blade, glint] = createReflectiveBlade(scene, x, y - 16, size * 0.72, tint, angle, 0.80);
  blade.setDepth(30.92); glint.setDepth(30.94);
  scene.tweens.add({
    targets: [blade, glint], y, angle: angle + (angle < 0 ? -14 : 14),
    duration: 105 + delay, ease: 'Cubic.easeIn',
    onComplete: () => {
      const spark = scene.add.circle(x, y, Math.max(2, size * 0.11), 0xffffff, 0.92)
        .setDepth(30.96).setBlendMode(Phaser.BlendModes.ADD);
      scene.tweens.add({ targets: spark, scale: 2.8, alpha: 0, duration: 150, ease: 'Cubic.easeOut', onComplete: () => spark.destroy() });
      scene.time.delayedCall(PRISMEL_RR_TIMELINE.landingHoldMs, () => {
        scene.tweens.add({
          targets: [blade, glint], alpha: 0, y: y + 4, duration: 230, ease: 'Sine.easeIn',
          onComplete: () => { blade.destroy(); glint.destroy(); }
        });
      });
    }
  });
}

function launchLiveMirrorBladeVolley(scene, onImpact) {
  const view = scene.enemyView;
  const anchor = view?.container;
  const sprite = view?.sprite;
  if (!anchor) { onImpact?.(); return; }

  const targetX = anchor.x;
  const bodyY = anchor.y - (sprite?.displayHeight || 140) * 0.48;
  const groundY = anchor.y - 7;
  const span = Math.max(120, Math.min(scene.scale.width, scene.scale.height) * 0.34);
  const colors = [0x67c8ff, 0xc477ff, 0xffe8a0, 0xffffff];
  const defs = [
    { sx:-1.42, sy:-0.74, tx:-28, ty:-22, d:0,   ground:false },
    { sx: 1.34, sy:-0.58, tx: 24, ty:-10, d:28,  ground:false },
    { sx:-1.18, sy: 0.30, tx:-42, ty:  0, d:54,  ground:true  },
    { sx: 1.24, sy: 0.18, tx: 38, ty:  0, d:78,  ground:true  },
    { sx: 0.18, sy:-1.18, tx:  0, ty:  4, d:98,  ground:false },
    { sx:-0.70, sy:-1.00, tx:-12, ty:  8, d:126, ground:false },
    { sx: 0.78, sy:-0.96, tx: 16, ty:  5, d:150, ground:false },
    { sx:-1.35, sy:-0.12, tx:-60, ty:  0, d:178, ground:true  },
    { sx: 1.38, sy:-0.06, tx: 58, ty:  0, d:202, ground:true  }
  ];

  let impactDone = false;
  const resolveImpact = () => {
    if (impactDone) return;
    impactDone = true;
    onImpact?.();
  };

  defs.forEach((def, i) => {
    const sx = targetX + def.sx * span;
    const sy = bodyY + def.sy * span * 0.66;
    const tx = targetX + def.tx;
    const ty = (def.ground ? groundY : bodyY) + def.ty;
    const angle = Phaser.Math.RadToDeg(Math.atan2(ty - sy, tx - sx));
    const size = Math.max(15, Math.min(scene.scale.width, scene.scale.height) * (0.035 + (i % 3) * 0.004));
    const tint = colors[i % colors.length];
    const [blade, glint] = createReflectiveBlade(scene, sx, sy, size, tint, angle, 0.90);
    blade.setScale(0.62); glint.setScale(0.62);

    scene.time.delayedCall(def.d, () => {
      scene.tweens.add({
        targets: [blade, glint],
        x: tx, y: ty, angle: angle + (i % 2 ? 105 : -105), scaleX: 1.08, scaleY: 1.08,
        duration: 250 + (i % 3) * 32, ease: 'Cubic.easeIn',
        onUpdate: (_tw, target) => {
          const pulse = 0.72 + Math.abs(Math.sin((_tw.progress || 0) * Math.PI * 4)) * 0.28;
          target.alpha = pulse;
        },
        onComplete: () => {
          blade.destroy(); glint.destroy();
          if (def.ground) {
            spawnLandedMirrorShard(scene, tx, groundY + 2, size, tint, angle, i * 3);
          } else {
            const landingX = targetX + Phaser.Math.Clamp(def.tx * 1.35, -72, 72);
            spawnLandedMirrorShard(scene, landingX, groundY + 2, size * 0.78, tint, angle + 28, i * 3);
          }
          if (i === 4) resolveImpact();
        }
      });
    });
  });

  scene.time.delayedCall(PRISMEL_RR_TIMELINE.bladeImpactDelayMs + 170, resolveImpact);
}

'''
          s = s.replace(marker, helpers + marker, 1)

          s = s.replace(
            "export async function runPrismelScreenBreak(frame, onBattlefieldReveal) {",
            "export async function runPrismelScreenBreak(frame, onBattlefieldReveal, onShatterStart) {"
          )
          s = s.replace(
            "    await animate(PRISMEL_RR_TIMELINE.shatterMs, p => {",
            "    onShatterStart?.();\n    await animate(PRISMEL_RR_TIMELINE.shatterMs, p => {",
            1
          )

          old = '''    await runPrismelScreenBreak(frame, () => {
      if (impactResolved) return;
      impactResolved = true;
      if (hitRoll) {
        scene.enemy.hp = Math.max(0, scene.enemy.hp - pendingDamage);
        scene._updateTargetCard();
        playLiveRefractedImpact(scene, hero, pendingDamage, scene.enemy.hp <= 0);
      } else {
        scene._setBanner(`${hero.name} uses ${hero.resonart.name} — missed!`);
      }
    });'''
          new = '''    await runPrismelScreenBreak(frame, () => {
      if (impactResolved) return;
      impactResolved = true;
      launchLiveMirrorBladeVolley(scene, () => {
        if (hitRoll) {
          scene.enemy.hp = Math.max(0, scene.enemy.hp - pendingDamage);
          scene._updateTargetCard();
          playLiveRefractedImpact(scene, hero, pendingDamage, scene.enemy.hp <= 0);
        } else {
          scene._setBanner(`${hero.name} uses ${hero.resonart.name} — missed!`);
        }
      });
    }, () => playPrismelGlassShatter(scene));
    await scene._wait(PRISMEL_RR_TIMELINE.bladeSettleMs);'''
          assert old in s, 'K26 screen-break callback block not found'
          s = s.replace(old, new, 1)
          runtime_path.write_text(s)

          # Timeline sidecar remains exact-video authority but now records K27 live continuation.
          timeline_path = root/'assets/characters/prismel/animations/refracted_reflections/cinematic/Prismel_RefractedReflections_runtime_timeline.json'
          timeline = json.loads(timeline_path.read_text())
          timeline['presentation_revision'] = 'LIVE28K27-reflected-blades'
          timeline['glass_shatter_sfx'] = 'procedural-runtime-glass-crack'
          timeline['live_mirror_blade_volley'] = True
          timeline['blade_impact_delay_ms'] = 240
          timeline['blade_settle_ms'] = 420
          timeline['landing_hold_ms'] = 520
          timeline_path.write_text(json.dumps(timeline, indent=2) + '\n')

          auth_path = root/'PV_LIVE_AUTHORITY.json'
          auth = json.loads(auth_path.read_text())
          witness = 'main-20260909-live28k27'
          auth['updated'] = '2026-09-09'
          auth['witness'] = witness
          hard = auth.setdefault('hard_gates', {})
          hard['prismel_refracted_reflections_glass_shatter_sfx_required'] = True
          hard['prismel_refracted_reflections_live_mirror_blade_volley_required'] = True
          hard['prismel_refracted_reflections_landed_shards_required'] = True
          dev = auth.setdefault('device_evidence', {})
          dev['pending_witness'] = witness
          dev['pending_iphone_validation'] = True
          dev['live28k27_pending_iphone_validation'] = True
          dev['pending_gate_summary'] = 'LIVE28K27: verify Prismel glass-shatter beat, reflective mirror blades crossing into the live battlefield, visible shard landings around the Wraith, damage synchronized to blade impact, clean return, and unchanged Aurora Pulse + Thunder Tornado.'
          prismel = auth.setdefault('prismel', {})
          sync = prismel.setdefault('refracted_reflections_sync', {})
          sync['blade_impact_delay_ms'] = 240
          sync['blade_settle_ms'] = 420
          sync['landing_hold_ms'] = 520
          prismel['refracted_reflections_presentation'] = 'Exact cinematic in Hybrid/K -> 9.35s staff-to-lens hold -> captured displayed frame becomes the mirror -> radial crack -> glass-shatter SFX -> 16 captured-frame shards -> real battlefield reveal -> reflective mirror-blade volley crosses into live space -> blades strike/land around the real enemy -> refracted hit/recoil -> clean battle return.'
          prismel['refracted_reflections_glass_shatter_policy'] = 'At the start of mirror separation, play a short procedural glass/crystal shatter synchronized to the first moving shards. Preserve cinematic embedded SFX and keep battle BGM silent.'
          prismel['refracted_reflections_blade_policy'] = 'The broken reflection must continue into the live battlefield as reflective cyan/violet/gold/white mirror blades. Blades visibly cross toward the real enemy, strike around/through the target, leave readable landed shards on the battlefield, then fade after the impact settles.'
          auth_path.write_text(json.dumps(auth, indent=2) + '\n')

          build_path = root/'live-build.json'
          build = json.loads(build_path.read_text())
          build['id'] = witness
          build_path.write_text(json.dumps(build, indent=2) + '\n')

          note = '''\n\n## LIVE28K27 Prismel reflected-blades presentation polish\n\n- Current promoted witness: `main-20260909-live28k27`.\n- Preserve the accepted K26 exact cinematic and captured-frame fracture.\n- New K27 shatter beat: procedural glass/crystal shatter fires exactly as the fractured mirror begins separating.\n- New live continuation: reflective cyan/violet/gold/white mirror blades cross into the real Hybrid battlefield, converge on the Wraith, visibly strike/land around it, and remain readable on the ground before fading.\n- Logical damage now resolves on the live blade impact instead of the first battlefield-reveal frame.\n- Preserve battle-BGM silence through the cinematic/shatter and preserve Aurora Pulse V2 + Thunder Tornado.\n- iPhone MAIN remains the final runtime/presentation gate.\n'''
          for rel in ['PRIZIM_LIVE_NOTEPAD.md', 'PV_RESUME_ANCHOR.md']:
            pth = root/rel
            txt = pth.read_text()
            if 'LIVE28K27 Prismel reflected-blades presentation polish' not in txt:
              pth.write_text(txt.rstrip() + note + '\n')

          pre_path = root/'tools/prizim/preflight_live28k.py'
          pre = pre_path.read_text()
          old_keys = "    'prismel_refracted_reflections_embedded_sfx_only_no_music_or_language',\n]:"
          new_keys = "    'prismel_refracted_reflections_embedded_sfx_only_no_music_or_language',\n    'prismel_refracted_reflections_glass_shatter_sfx_required',\n    'prismel_refracted_reflections_live_mirror_blade_volley_required',\n    'prismel_refracted_reflections_landed_shards_required',\n]:"
          assert old_keys in pre, 'K26 preflight hard-gate list not found'
          pre = pre.replace(old_keys, new_keys, 1)
          needle = "if rr_timeline.get('video_sha256') != p.get('refracted_reflections_video_sha256'): errors.append('K26 Prismel timeline/video authority mismatch')\n"
          assert needle in pre, 'K26 Prismel preflight footer not found'
          extra = needle + "\nfor token in ['playPrismelGlassShatter', 'launchLiveMirrorBladeVolley', 'spawnLandedMirrorShard', 'bladeImpactDelayMs: 240', 'bladeSettleMs: 420', 'landingHoldMs: 520']:\n    if token not in rr_runtime:\n        errors.append(f'K27 Prismel reflected-blade token missing: {token}')\nif rr_timeline.get('presentation_revision') != 'LIVE28K27-reflected-blades': errors.append('K27 Prismel timeline revision drift')\nif rr_timeline.get('live_mirror_blade_volley') is not True: errors.append('K27 Prismel live blade-volley timeline gate missing')\nfor key, expected in {'blade_impact_delay_ms': 240, 'blade_settle_ms': 420, 'landing_hold_ms': 520}.items():\n    if int(rr_sync.get(key, -1)) != expected:\n        errors.append(f'K27 Prismel sync drift: {key}')\n"
          pre = pre.replace(needle, extra, 1)
          pre_path.write_text(pre)

          request = root/'.github/requests/live28k27-prismel-reflected-blades.txt'
          if request.exists(): request.unlink()
          PY

      - name: PriZim K27 preflight
        shell: bash
        run: |
          set -euo pipefail
          node --check src/prizim/PrismelRefractedReflectionsRuntime.js
          node --check src/prizim/Live28K2PartyBattleScene.js
          python tools/prizim/preflight_live28k.py

      - name: Commit K27 promotion
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'LIVE28K27: Prismel reflected blades and glass shatter polish'
          git push origin HEAD:main
