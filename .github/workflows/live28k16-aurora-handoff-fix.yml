name: LIVE28K16 Aurora Handoff Fix

on:
  push:
    paths:
      - '.github/ingest_live28k16/TRIGGER.txt'

permissions:
  contents: write

concurrency:
  group: live28k16-aurora-handoff
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply guarded K16 battlefield handoff
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/prizim/fix_live28k16_aurora_handoff.py
          python tools/prizim/fix_live28k16_aurora_handoff.py
          python tools/prizim/sync_live_authority.py
          python tools/prizim/preflight_live28k.py
          node --check src/prizim/Live28K2PartyBattleScene.js
          node --check src/PartyBattleAudioController.js
          grep -F "reveal: 6.08, impactReveal: 6.30, reconnect: 6.58, end: 6.65" src/prizim/Live28K2PartyBattleScene.js
          grep -F "_beginAuroraBeautyBattlefieldReveal(video)" src/prizim/Live28K2PartyBattleScene.js
          grep -F "_playAuroraEnemyReconnectImpact" src/prizim/Live28K2PartyBattleScene.js
          grep -F "pendingImpact = { dmg, lethal: this.enemy.hp <= 0 }" src/prizim/Live28K2PartyBattleScene.js

      - name: Commit guarded K16 correction
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/ingest_live28k16/TRIGGER.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/prizim/Live28K2PartyBattleScene.js \
            PV_LIVE_AUTHORITY.json \
            PRIZIM_LIVE_NOTEPAD.md \
            PV_RESUME_ANCHOR.md \
            tools/prizim/preflight_live28k.py \
            tools/prizim/sync_live_authority.py \
            .github/ingest_live28k16/TRIGGER.txt
          git commit -m 'LIVE28K16: smooth Aurora battlefield reconnect and show live enemy impact'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          echo 'K16 push failed after 3 attempts' >&2
          exit 1
