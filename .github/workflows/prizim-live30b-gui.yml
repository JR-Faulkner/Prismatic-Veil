name: PriZim LIVE30B GUI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prizim-live30b-gui.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Syntax check cinematic GUI modules
        run: |
          node --check assets/js/pv-overworld-live30b.js
          node --check assets/js/pv-party-live30b.js
      - name: Verify LIVE30B wiring and authority markers
        shell: bash
        run: |
          set -euo pipefail
          grep -F "pv-overworld-live30b.js?pvasset=live30b1" hybrid-overworld.html
          grep -F "pv-party-live30b.js?pvasset=live30b1" hybrid-party-live.html
          grep -F "The World Remembers" assets/js/pv-overworld-live30b.js
          grep -F "DESTINATION" assets/js/pv-overworld-live30b.js || true
          grep -F "BEARER FORMATION" assets/js/pv-party-live30b.js
      - name: Run canonical PriZim preflight
        run: python tools/prizim/preflight_live28k.py
