name: One-shot Party chibi canon ingest
on:
  push:
    paths:
      - '.github/workflows/one-shot-party-chibi-ingest.yml'
permissions:
  contents: write
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch and verify PV Semi-Chibi 30 canon pack
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --output /tmp/PV_PARTY_CHIBIS_CANON_V2.zip 'https://uc348469891f4099f13e4328c838.dl.dropboxusercontent.com/cd/0/get/DH9_Uj3EElTVTpcbVjq8QjyNuXUvRMAtpCdipxbAALFq4c1M4Z64boyimrWZxYCmw67T2GCR4H5e-WRyooSIB5EwJJEJYuOzzsEpbZHE6YImilodKrxF2X784VRJMKcQzhk2DCNiu9jcqpimiHd6dYeoAJigy69COQP8LCq1mEZ-BA/file?c_luid=9bd25e73'
          test "$(stat -c%s /tmp/PV_PARTY_CHIBIS_CANON_V2.zip)" = "7586906"
          echo '618c73605dc71b5acaefacada6a929cbbeb355d7fddf4fc74b8bb8ebbfa7de1e  /tmp/PV_PARTY_CHIBIS_CANON_V2.zip' | sha256sum -c -
          rm -rf /tmp/pv_party_chibis
          mkdir -p /tmp/pv_party_chibis assets/ui/party/v1/characters
          unzip -q /tmp/PV_PARTY_CHIBIS_CANON_V2.zip -d /tmp/pv_party_chibis
          for f in party_prismel_chibi.png party_auryi_chibi.png party_kineza_chibi.png party_sarallel_chibi.png party_vyan_chibi.png; do
            test -s "/tmp/pv_party_chibis/$f"
            cp "/tmp/pv_party_chibis/$f" "assets/ui/party/v1/characters/$f"
          done
          cp /tmp/pv_party_chibis/manifest.json assets/ui/party/v1/characters/party_chibi_manifest.json
          rm -f assets/ui/party/v1/characters/.chibi_placeholder
      - name: Commit Party chibi canon bytes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'JR-Faulkner'
          git config user.email '53619182+JR-Faulkner@users.noreply.github.com'
          git add -A assets/ui/party/v1/characters
          if git diff --cached --quiet; then
            echo 'Party chibi canon already present.'
            exit 0
          fi
          git commit -m 'PARTY: ingest approved Semi-Chibi 30 canon assets'
          git push
