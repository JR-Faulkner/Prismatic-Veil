name: LIVE29A HR4 Audio Repair
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/live29a-hr4-audio-repair.yml'
jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and validate Magical Awakening
        run: |
          set -euo pipefail
          mkdir -p assets/audio/overworld
          curl -fL --retry 3 'https://cdn1.suno.ai/1cf25965-8eee-4f3f-bf4c-96f8fed25bf9.mp3' -o /tmp/magical.mp3
          test $(stat -c%s /tmp/magical.mp3) -gt 100000
          ffprobe -v error -show_entries format=duration -of default=nw=1 /tmp/magical.mp3
          ffmpeg -y -i /tmp/magical.mp3 -c:a aac -b:a 128k -movflags +faststart 'assets/audio/overworld/Magical Awakening.m4a'
          test $(stat -c%s 'assets/audio/overworld/Magical Awakening.m4a') -gt 100000
          ffprobe -v error -show_entries format=duration -of default=nw=1 'assets/audio/overworld/Magical Awakening.m4a'
      - name: Commit repaired binary
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'assets/audio/overworld/Magical Awakening.m4a'
          git commit -m 'LIVE29A HR4: replace invalid 11-byte audio with validated AAC' || exit 0
          git push
