name: PriZim LIVE28K Preflight Guard

on:
  push:
    branches: [main]
    paths:
      - 'AGENTS.md'
      - 'live-build.json'
      - 'hybrid-main.html'
      - 'hybrid-battle-live.html'
      - 'src/PartyBattleScene.js'
      - 'src/BattleConfig.js'
      - 'src/PartyBattleConfig.js'
      - 'src/PartyBattleAudioController.js'
      - 'src/prizim/Live28K2PartyBattleScene.js'
      - 'src/prizim/PrismelRefractedReflectionsRuntime.js'
      - 'src/prizim/Live28K7PartyFormationView.js'
      - 'assets/music/Celestial Bloom.m4a'
      - 'assets/music/Triumph of Light.m4a'
      - 'assets/characters/prismel/animations/refracted_reflections/cinematic/Prismel_RefractedReflections_Resonart_MASTER.mp4'
      - 'assets/characters/prismel/animations/refracted_reflections/cinematic/Prismel_RefractedReflections_runtime_timeline.json'
      - 'PV_LIVE_AUTHORITY.json'
      - 'PV_RESUME_ANCHOR.md'
      - 'PRIZIM_LIVE_NOTEPAD.md'
      - 'tools/prizim/preflight_live28k.py'
      - 'tools/prizim/sync_live_authority.py'
      - '.github/workflows/sync-prizim-live-authority.yml'
      - '.github/workflows/prizim-hybrid-stack-guard.yml'
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'live-build.json'
      - 'hybrid-main.html'
      - 'hybrid-battle-live.html'
      - 'src/PartyBattleScene.js'
      - 'src/BattleConfig.js'
      - 'src/PartyBattleConfig.js'
      - 'src/PartyBattleAudioController.js'
      - 'src/prizim/Live28K2PartyBattleScene.js'
      - 'src/prizim/PrismelRefractedReflectionsRuntime.js'
      - 'src/prizim/Live28K7PartyFormationView.js'
      - 'assets/music/Celestial Bloom.m4a'
      - 'assets/music/Triumph of Light.m4a'
      - 'assets/characters/prismel/animations/refracted_reflections/cinematic/Prismel_RefractedReflections_Resonart_MASTER.mp4'
      - 'assets/characters/prismel/animations/refracted_reflections/cinematic/Prismel_RefractedReflections_runtime_timeline.json'
      - 'PV_LIVE_AUTHORITY.json'
      - 'PV_RESUME_ANCHOR.md'
      - 'PRIZIM_LIVE_NOTEPAD.md'
      - 'tools/prizim/preflight_live28k.py'
      - 'tools/prizim/sync_live_authority.py'
      - '.github/workflows/sync-prizim-live-authority.yml'

jobs:
  live28k-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run canonical PriZim LIVE28K preflight
        run: python tools/prizim/preflight_live28k.py
      - name: Record guard result
        if: success()
        run: |
          echo '## PriZim LIVE28K Preflight ✅' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'Hybrid production route, authority ledgers, Aurora ownership, exact audio hashes, PNG/WebP gate, crown semantics, and LIVE28K witness are synchronized.' >> "$GITHUB_STEP_SUMMARY"
