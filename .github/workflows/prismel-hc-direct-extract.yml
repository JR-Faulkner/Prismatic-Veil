name: Prismel HC Direct Extract

on:
  push:
    paths:
      - '.github/workflows/prismel-hc-direct-extract.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Extract embedded WebP and save real PNGs
        run: |
          python - <<'PY'
          import re, base64
          from pathlib import Path
          from PIL import Image
          root = Path('assets/characters/prismel/live_hc')
          for stem in ('prismel_idle_passive_hc','prismel_idle_active_hc'):
              text = (root / f'{stem}.svg').read_text()
              m = re.search(r'data:image/webp;base64,([^"\']+)', text)
              if not m:
                  raise SystemExit(f'No embedded WebP found in {stem}.svg')
              raw = base64.b64decode(m.group(1))
              tmp = root / f'{stem}.webp'
              tmp.write_bytes(raw)
              with Image.open(tmp) as im:
                  im.load()
                  im.convert('RGBA').save(root / f'{stem}.png', 'PNG', optimize=True)
                  print(stem, im.size, (root / f'{stem}.png').stat().st_size)
              tmp.unlink()
          PY
      - name: Commit corrected PNG authority and remove extractor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/characters/prismel/live_hc/prismel_idle_passive_hc.png assets/characters/prismel/live_hc/prismel_idle_active_hc.png
          git rm .github/workflows/prismel-hc-direct-extract.yml
          git commit -m 'Extract real Prismel HC PNG pixels for iOS MAIN'
          git push
