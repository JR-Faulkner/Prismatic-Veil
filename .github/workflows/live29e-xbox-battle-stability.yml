name: LIVE29E Xbox battle stability
on:
  push:
    paths:
      - '.github/workflows/live29e-xbox-battle-stability.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Xbox renderer
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('hybrid-battle-live.html')
          s=p.read_text()
          old="window.__pvHybridGame=new Phaser.Game({type:Phaser.AUTO,parent:'stage',width:800,height:600,backgroundColor:'#07060f',scale:{mode:Phaser.Scale.RESIZE,autoCenter:Phaser.Scale.CENTER_BOTH},scene:[Hybrid]});"
          new="const PV_XBOX=/Xbox/i.test(navigator.userAgent||'');window.__pvHybridGame=new Phaser.Game({type:PV_XBOX?Phaser.CANVAS:Phaser.AUTO,parent:'stage',width:800,height:600,backgroundColor:'#07060f',scale:{mode:Phaser.Scale.RESIZE,autoCenter:Phaser.Scale.CENTER_BOTH},scene:[Hybrid]});"
          if old not in s:
              raise SystemExit('Battle game config anchor not found')
          s=s.replace(old,new,1)
          old2="const orient=()=>rotate.hidden=innerWidth>=innerHeight;orient();addEventListener('resize',orient)}catch(e){fail(e)}"
          new2="const orient=()=>{rotate.hidden=innerWidth>=innerHeight;if(PV_XBOX)requestAnimationFrame(()=>window.__pvHybridGame?.scale?.refresh?.())};orient();addEventListener('resize',orient);addEventListener('fullscreenchange',()=>{if(PV_XBOX)setTimeout(()=>window.__pvHybridGame?.scale?.refresh?.(),60)})}catch(e){fail(e)}"
          if old2 not in s:
              raise SystemExit('Battle resize anchor not found')
          p.write_text(s.replace(old2,new2,1))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hybrid-battle-live.html
          git diff --cached --quiet && exit 0
          git commit -m "Harden Xbox battle canvas lifecycle"
          git push
