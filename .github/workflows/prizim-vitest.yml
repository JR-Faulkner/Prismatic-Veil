name: PriZim Vitest Gate

on:
  push:
    branches:
      - prizim-modernization-phase2-vitest
  pull_request:
    paths:
      - 'package.json'
      - 'tsconfig.json'
      - 'src/core/**'
      - 'tests/**'
      - '.github/workflows/prizim-vitest.yml'

jobs:
  vitest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --ignore-scripts
      - name: TypeScript
        run: npm run typecheck
      - name: Vitest
        run: npm run test:unit
