name: Strip legacy packed Overworld audio

on:
  push:
    paths:
      - '.github/workflows/overworld-audio-legacy-strip.yml'

permissions:
  contents: write

jobs:
  strip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove legacy packed audio runtime
        shell: python
        run: |
          import gzip, re, pathlib, sys
          p = pathlib.Path('assets/ui/overworld/v1/hybrid-overworld.hr4b.html.gz')
          raw = gzip.decompress(p.read_bytes()).decode('utf-8')
          before = raw

          # Old Suno BGM constants + legacy BGM instance/fallback.
          patterns = [
            r"const PV_HR3_BGM='https://cdn1\.suno\.ai/[^']+';",
            r"const PV_HR3_BGM_FALLBACK='https://cdn2\.suno\.ai/[^']+';",
            r"const pvBgm=new Audio\(PV_HR3_BGM\);pvBgm\.loop=true;pvBgm\.preload='auto';pvBgm\.volume=0;",
            r"pvBgm\.addEventListener\('error',\(\)=>\{if\(!pvBgm\.dataset\.fallback\)\{pvBgm\.dataset\.fallback='1';pvBgm\.src=PV_HR3_BGM_FALLBACK;pvBgm\.load\(\)\}\}\);",
            r"async function pvStartBgm\(\)\{.*?\}\n",
            r"function pvFadeBgm\(\)\{.*?\}\n",
            r"function pvUnlockAudio\(\)\{.*?\}\n",
            r"pvSetAudioIcon\(\);pvStartBgm\(\);",
          ]
          for pat in patterns:
            raw = re.sub(pat, '', raw, flags=re.S)

          # Legacy SFX pool was incorrectly cloning the old BGM as every SFX source.
          raw = re.sub(r"const pvSfxPool=Object\.fromEntries\(Object\.keys\(PV_HR3_SFX\).*?return\[k,a\]\}\)\);", "const pvSfxPool={};", raw, flags=re.S)

          # Neutralize old audio toggle branch and travel fade call while preserving click routing.
          raw = re.sub(
            r"if\(t\.id==='audioToggle'\)\{.*?return\}",
            "if(t.id==='audioToggle'){e.stopPropagation();return}",
            raw, flags=re.S)
          raw = raw.replace(";if(!t.disabled)pvFadeBgm()", "")

          # Remove secondary legacy blob-BGM bootstrap if present.
          raw = re.sub(r"let pvBgm=null,pvBlobUrl='',pvReady=false,pvWanted=true;.*?document\.addEventListener\('visibilitychange',\(\)=>\{if\(document\.hidden&&pvBgm\)pvBgm\.pause\(\)\}\);", "", raw, flags=re.S)

          forbidden = ['cdn1.suno.ai','cdn2.suno.ai','PV_HR3_BGM','PV_HR3_BGM_FALLBACK','pvStartBgm()','pvFadeBgm()','pvBlobUrl']
          remain = [x for x in forbidden if x in raw]
          if remain:
            print('Legacy audio markers remain:', remain)
            sys.exit(2)
          if raw == before:
            print('No changes made; refusing silent success')
            sys.exit(3)

          p.write_bytes(gzip.compress(raw.encode('utf-8'), compresslevel=9, mtime=0))
          print('Removed legacy packed audio runtime.')
          print('Packed bytes:', p.stat().st_size)
      - name: Commit cleaned payload
        run: |
          git config user.name 'JR-Faulkner'
          git config user.email '53619182+JR-Faulkner@users.noreply.github.com'
          git add assets/ui/overworld/v1/hybrid-overworld.hr4b.html.gz
          git commit -m 'AUDIO: remove legacy packed Overworld BGM runtime'
          git push origin HEAD:main
