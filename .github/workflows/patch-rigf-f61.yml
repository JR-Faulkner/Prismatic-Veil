name: Patch Rig F F6.1
on:
  push:
    paths:
      - '.github/workflows/patch-rigf-f61.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Rig F to F6.1 same-origin ondemand rewrite
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('mugen-lab/rig-f.html')
          s=p.read_text()
          if 'MOBMUGEN · RIG F · F6' not in s:
              raise SystemExit('Expected F6 base not found')
          s=s.replace('MobMugen · Rig F · F6','MobMugen · Rig F · F6.1')
          s=s.replace('MOBMUGEN · RIG F · F6','MOBMUGEN · RIG F · F6.1')
          s=s.replace('Rig F · F6','Rig F · F6.1')
          s=s.replace('F6 witness log','F6.1 witness log')
          s=s.replace('F6 ERROR · ','F6.1 ERROR · ')
          s=s.replace('F6 XHR ','F6.1 XHR ')
          s=s.replace('F6 WASM ','F6.1 WASM ')
          s=s.replace('F6 MODULE ','F6.1 MODULE ')
          s=s.replace('F6 POST-LAUNCH ','F6.1 POST-LAUNCH ')
          s=s.replace('F6 CONFIG ','F6.1 CONFIG ')
          s=s.replace('F6 PARAMS ','F6.1 PARAMS ')
          s=s.replace('F6 VIDEO ','F6.1 VIDEO ')
          s=s.replace('F6 FIRST ','F6.1 FIRST ')
          s=s.replace('F6 LEAN ','F6.1 LEAN ')
          s=s.replace('RIGF F6','RIGF F6.1')
          old="X.prototype.open=function(method,url,async,user,pass){this.__rigf53url=String(url);this.__rigf53method=String(method);log('F6.1 XHR OPEN · '+this.__rigf53method+' · '+this.__rigf53url+' · async='+(async!==false));return o.call(this,method,url,async,user,pass)};"
          if old not in s:
              old="X.prototype.open=function(method,url,async,user,pass){this.__rigf53url=String(url);this.__rigf53method=String(method);log('F6 XHR OPEN · '+this.__rigf53method+' · '+this.__rigf53url+' · async='+(async!==false));return o.call(this,method,url,async,user,pass)};"
          if old not in s:
              raise SystemExit('XHR open patch point not found')
          new="X.prototype.open=function(method,url,async,user,pass){let u=String(url);if(u.startsWith('/api/fs/')){const from=u;u='./assets/'+u.slice('/api/fs/'.length);log('F6.1 ROOT REWRITE · '+from+' -> '+u)}this.__rigf53url=u;this.__rigf53method=String(method);log('F6.1 XHR OPEN · '+this.__rigf53method+' · '+this.__rigf53url+' · async='+(async!==false));return o.call(this,method,u,async,user,pass)};"
          s=s.replace(old,new)
          s=s.replace('F6 removes the 1.72 GB resident app ZIP. It streams only boot-critical WinMUGEN files into a lean filesystem while keeping the proven on-demand Wine root.','F6.1 keeps the lean WinMUGEN filesystem and rewrites BoxedWine\'s patched /api/fs/ on-demand requests to the same-origin ./assets/ Wine root so late DLL/wineboot reads cannot fall back to a missing API route.')
          p.write_text(s)

          d=Path('docs/MOBMUGEN_LIVE.md')
          t=d.read_text() if d.exists() else '# MOBMUGEN LIVE CONTINUITY\n'
          note='''\n## Rig F F6.1 - same-origin late root rewrite\n- F6 phone witness reached `Launching "/bin/wine" "Winmugen.exe"`.\n- Wine then requested `dinput.dll` through ExeBrowser BrowserFS' hardcoded `/api/fs/fullWine1.7.55-v8.zip` path and got 404.\n- F6.1 rewrites any `/api/fs/*` XHR to `./assets/*`, preserving Range headers and the proven same-origin 206 path.\n- Goal: allow late wineboot/DLL reads to continue past the first real Wine process launch.\n'''
          if '## Rig F F6.1 - same-origin late root rewrite' not in t:
              t += note
          d.write_text(t)
          PY
      - name: Remove one-shot workflow and commit
        run: |
          rm -f .github/workflows/patch-rigf-f61.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add mugen-lab/rig-f.html docs/MOBMUGEN_LIVE.md .github/workflows/patch-rigf-f61.yml
          git commit -m 'Rig F F6.1 rewrite late ondemand root requests same-origin'
          git push
