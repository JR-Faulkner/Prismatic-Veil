name: Temporary live13 presentation wiring

on:
  push:
    paths:
      - 'pv-data/triggers/live13-wire.trigger'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire DOM cinematic HUD and victory grace
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('hybrid-battle-live.html')
          text = path.read_text()

          old = "function paint(s){const sig=JSON.stringify(s);if(sig===last)return;last=sig;\n"
          new = "function paint(s){const sig=JSON.stringify(s);if(sig===last)return;last=sig;\nconst hud=document.querySelector('.hud'),cine=!!s.cinematic;if(hud){hud.style.opacity=cine?'0':'1';hud.style.visibility=cine?'hidden':''}home.style.opacity=cine?'0':'1';home.style.visibility=cine?'hidden':'';\n"
          assert text.count(old) == 1, 'paint hook anchor mismatch'
          text = text.replace(old, new)

          old = "const living=(x.party||[]).filter(v=>v.alive).length,railVisible=!!x._commandRailContainer?.visible;const outcome=x._hybridOutcome||(x.enemy?.hp<=0?'victory':(living===0?'defeat':null));\n"
          new = "const living=(x.party||[]).filter(v=>v.alive).length,railVisible=!!x._commandRailContainer?.visible;const outcome=x._hybridOutcome||(x.enemy?.hp<=0?'victory':(living===0?'defeat':null));const cinematic=!!(x.audio?._cinematicActive)||(x.enemy?.hp<=0);\n"
          assert text.count(old) == 1, 'snap cinematic anchor mismatch'
          text = text.replace(old, new)

          old = "lock:!!x._turnLock||a==='enemy'||!!outcome||!railVisible,audioLocked:!!x.audio?.isLocked?.()}}\n"
          new = "lock:!!x._turnLock||a==='enemy'||!!outcome||!railVisible,audioLocked:!!x.audio?.isLocked?.(),cinematic}}\n"
          assert text.count(old) == 1, 'snap return anchor mismatch'
          text = text.replace(old, new)

          old = "_onVictory(){this._hybridOutcome='victory';const r=super._onVictory();this.pub(true);return r}_onDefeat(){"
          new = "_commitHybridVictory(){this._hybridOutcome='victory';const r=super._onVictory();this.pub(true);return r}_onVictory(){const kinezaFinisher=this.enemy?.hp<=0&&this.activeHeroId==='kineza';if(kinezaFinisher&&!this._hybridVictoryGracePending){this._hybridVictoryGracePending=true;this.time.delayedCall(220,()=>this._commitHybridVictory());return}if(this._hybridVictoryGracePending)return;return this._commitHybridVictory()}_onDefeat(){"
          assert text.count(old) == 1, 'victory hook anchor mismatch'
          text = text.replace(old, new)

          path.write_text(text)
          PY
      - name: Commit wiring
        shell: bash
        run: |
          git config user.name 'JR-Faulkner'
          git config user.email '53619182+JR-Faulkner@users.noreply.github.com'
          git add hybrid-battle-live.html
          git commit -m 'Wire live DOM HUD evacuation and Kineza victory grace'
          git push
