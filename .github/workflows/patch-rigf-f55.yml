name: Patch Rig F F5.5
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch-rigf-f55.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch rig-f.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('mugen-lab/rig-f.html')
          s=p.read_text()
          s=s.replace('MobMugen · Rig F · F5.4','MobMugen · Rig F · F5.5')
          s=s.replace('MOBMUGEN · RIG F · F5.4','MOBMUGEN · RIG F · F5.5')
          s=s.replace('Rig F · F5.4','Rig F · F5.5')
          s=s.replace('F5.4','F5.5')
          s=s.replace('SAME-ORIGIN ROOT · BOXEDWINE','ON-DEMAND ROOT · BOXEDWINE')
          s=s.replace('F5.5 keeps the zero-copy app mount and serves the Wine root from this same GitHub Pages origin, removing the failing external root request while preserving XHR tracing.','F5.5 keeps the zero-copy app mount but switches the now-working same-origin Wine root to BoxedWine on-demand range loading, avoiding the full-root expansion burst that crashed Safari in F5.4.')
          old="return ['root=fullWine1.7.55-v8','overlay=wine1.7.55-v8-min-online','app=userapp.zip','p=Winmugen.exe','work='+work,'auto=true','sound=false','bpp=16'].join('&')"
          new="return ['ondemand=root','root=fullWine1.7.55-v8','inline-default-ondemand-root-overlay=wine1.7.55-v8-min-online','app=userapp.zip','p=Winmugen.exe','work='+work,'auto=true','sound=false','bpp=16'].join('&')"
          if old not in s: raise SystemExit('buildParams needle missing')
          s=s.replace(old,new)
          s=s.replace("status('LOADING BOXEDWINE WASM · WHOLE ROOT')","status('LOADING BOXEDWINE WASM · ON-DEMAND ROOT')")
          p.write_text(s)
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/patch-rigf-f55.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rig F F5.5 switch Wine root to on-demand range loading"
          git push