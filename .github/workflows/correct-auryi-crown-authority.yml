name: Correct Auryi Crown Authority
on:
  push:
    paths:
      - '.github/correct-auryi-crown.trigger'
permissions:
  contents: write
jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct crown authority wording
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('PV_RESUME_ANCHOR.md')
          s = p.read_text()
          old = '''## Future Auryi crown authority\n\nThis does **not** change crownless Aurora Pulse. When Auryi's crown is brought back in a future non-Aurora presentation pass, use the **Main Screen / title-screen crown on Auryi's head** as the visual authority. The returned crown should read closer to that crown's silhouette, scale, placement, and overall design language rather than the older hovering/orbiting crown treatment. Keep it head-worn unless the user later revises this direction.\n'''
          new = '''## Future Auryi crown authority\n\nThis does **not** change crownless Aurora Pulse. When Auryi's crown is brought back in a future non-Aurora presentation pass, use the **Main Splash Screen crown** as the visual authority. It should remain **hovered / offset above Auryi rather than worn directly on her head**, matching the splash screen's crown silhouette, scale, spacing, and relationship to her head as closely as the runtime composition allows. Do not revert to the older wide/orbiting crown treatment unless the user later revises this direction.\n'''
          if old not in s:
              raise SystemExit('expected old crown authority paragraph not found')
          p.write_text(s.replace(old, new))
          PY
      - name: Commit correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PV_RESUME_ANCHOR.md
          git commit -m 'Correct Auryi splash-screen crown authority'
          git push