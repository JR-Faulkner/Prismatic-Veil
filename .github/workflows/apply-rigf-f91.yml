name: Apply MOBMUGEN F9.1 cnc-ddraw GDI

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/patch_rigf_f91_cnc_gdi.py'
      - 'tools/prizim/mobmugen/runtime_probe_f90.mjs'
      - '.github/workflows/apply-rigf-f91.yml'

permissions:
  contents: write

jobs:
  apply_f91:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Guard exact F9.0 visual anchor
        run: |
          grep -q 'MOBMUGEN · RIG F · F9.0' mugen-lab/rig-f7.html
          grep -q 'EXACT F6.5 VISUAL ANCHOR' mugen-lab/rig-f7.html
          cp mugen-lab/rig-f7.html mugen-lab/rig-f90-perf-ci.html
          sha256sum mugen-lab/rig-f7.html > /tmp/f90-anchor.sha256
          cat /tmp/f90-anchor.sha256

      - name: Fetch pinned cnc-ddraw 7.1 and configure GDI only
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip gcc-mingw-w64-i686
          curl -fL --retry 4 \
            -o /tmp/cnc-ddraw.zip \
            https://github.com/FunkyFr3sh/cnc-ddraw/releases/download/v7.1.0.0/cnc-ddraw.zip
          rm -rf /tmp/cnc-ddraw
          mkdir -p /tmp/cnc-ddraw
          unzip -q /tmp/cnc-ddraw.zip -d /tmp/cnc-ddraw
          DLL="$(find /tmp/cnc-ddraw -type f -iname ddraw.dll -print -quit)"
          INI="$(find /tmp/cnc-ddraw -type f -iname ddraw.ini -print -quit)"
          test -n "$DLL" -a -f "$DLL"
          test -n "$INI" -a -f "$INI"
          test "$(sha256sum "$DLL" | awk '{print $1}')" = '85e0f7d530dfda134793a57cb3e76b0287dcc96892ee57162dd68f47283b03a9'
          mkdir -p mugen-lab/assets/cnc-ddraw-gdi
          cp "$DLL" mugen-lab/assets/cnc-ddraw-gdi/ddraw.dll
          cp "$INI" mugen-lab/assets/cnc-ddraw-gdi/ddraw.ini
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('mugen-lab/assets/cnc-ddraw-gdi/ddraw.ini')
          s=p.read_text(errors='ignore')
          if not re.search(r'(?im)^\s*renderer\s*=.*$',s): raise SystemExit('renderer setting missing')
          s=re.sub(r'(?im)^\s*renderer\s*=.*$', 'renderer=gdi', s, count=1)
          if re.search(r'(?im)^\s*vsync\s*=.*$',s):
              s=re.sub(r'(?im)^\s*vsync\s*=.*$', 'vsync=false', s, count=1)
          p.write_text(s)
          global_lines=[x.strip() for x in s.splitlines() if x.lower().startswith(('renderer=','vsync='))]
          print(global_lines[:6])
          if 'renderer=gdi' not in global_lines[:3]: raise SystemExit('GDI renderer not pinned globally')
          PY
          file mugen-lab/assets/cnc-ddraw-gdi/ddraw.dll
          sha256sum mugen-lab/assets/cnc-ddraw-gdi/ddraw.dll mugen-lab/assets/cnc-ddraw-gdi/ddraw.ini

      - name: Patch F9.1 candidate from frozen F9.0
        run: |
          python3 scripts/patch_rigf_f91_cnc_gdi.py
          grep -q 'MOBMUGEN · RIG F · F9.1' mugen-lab/rig-f7.html
          grep -q 'F9.0 ANCHOR · CNC GDI PERF' mugen-lab/rig-f7.html
          grep -q 'F9.1 CNC-DDRAW GDI READY' mugen-lab/rig-f7.html
          grep -q 'WINEDLLOVERRIDES=ddraw=n,b' mugen-lab/rig-f7.html

      - name: Validate F9.1 inline JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          s=Path('mugen-lab/rig-f7.html').read_text()
          m=re.search(r'<script>\(function\(\)\{(.*)</script>',s,re.S)
          if not m: raise SystemExit('inline script not found')
          p=Path('/tmp/f91-inline.js');p.write_text('(function(){'+m.group(1))
          subprocess.run(['node','--check',str(p)],check=True)
          PY

      - name: Build deterministic keyed-sprite fixture
        run: |
          i686-w64-mingw32-gcc -O2 -s -mwindows -DPZ_MODE=2 \
            tools/prizim/mobmugen/pz_ddraw_suite.c \
            -o /tmp/Winmugen-f91-perf.exe \
            -lddraw -ldxguid -lgdi32 -luser32
          python3 tools/prizim/mobmugen/make_perf_fixture.py \
            /tmp/Winmugen-f91-perf.exe /tmp/prizim-f91-perf.zip
          python3 tools/prizim/mobmugen/make_fixture.py

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local candidate server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/f91-http.log 2>&1 &
          echo $! >/tmp/f91-http.pid
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:8000/mugen-lab/rig-f7.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/f91-http.log
          exit 1

      - name: PriZim F9.1 plumbing and controller gate
        env:
          PZ_BASE_URL: http://127.0.0.1:8000
          PZ_ROUTE: /mugen-lab/rig-f7.html?pz_f91=plumbing
          PZ_FIXTURE: tools/prizim/mobmugen/fixtures/prizim_winmugen_fixture.zip
          PZ_EXPECT_BRAND: MOBMUGEN · RIG F · F9.1
          PZ_EXPECT_DIAG: F9.1 CNC-DDRAW GDI READY;F9.1 PERF MODE · CNC-DDRAW GDI
          PZ_RUNTIME_REPORT: prizim-f91-runtime.json
        run: node tools/prizim/mobmugen/runtime_probe_f90.mjs

      - name: PriZim F9.0 keyed-blit baseline
        env:
          PZ_BASE_URL: http://127.0.0.1:8000
          PZ_ROUTE: /mugen-lab/rig-f90-perf-ci.html?pz_f91=baseline
          PZ_PERF_FIXTURE: /tmp/prizim-f91-perf.zip
          PZ_PERF_REPORT: prizim-f91-baseline.json
          PZ_WORKLOAD: f90-colorkey96-builtin
          PZ_WARMUP_MS: '3000'
          PZ_SAMPLE_MS: '6000'
          PZ_SAMPLES: '2'
        run: node tools/prizim/mobmugen/perf_probe.mjs

      - name: PriZim F9.1 keyed-blit candidate
        env:
          PZ_BASE_URL: http://127.0.0.1:8000
          PZ_ROUTE: /mugen-lab/rig-f7.html?pz_f91=candidate
          PZ_PERF_FIXTURE: /tmp/prizim-f91-perf.zip
          PZ_PERF_REPORT: prizim-f91-candidate.json
          PZ_WORKLOAD: f91-colorkey96-cnc-gdi
          PZ_WARMUP_MS: '3000'
          PZ_SAMPLE_MS: '6000'
          PZ_SAMPLES: '2'
        run: node tools/prizim/mobmugen/perf_probe.mjs

      - name: Enforce material performance gate
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          b=json.loads(Path('prizim-f91-baseline.json').read_text())
          c=json.loads(Path('prizim-f91-candidate.json').read_text())
          bf=float(b['median_loop_fps']); cf=float(c['median_loop_fps'])
          gain=(cf/bf-1)*100 if bf else 0
          result={
              'baseline_loop_fps':bf,
              'candidate_loop_fps':cf,
              'gain_pct':gain,
              'candidate_target_45':cf>=45,
              'material_gain_25':gain>=25,
              'candidate_usable':c.get('usable_for_ab'),
              'candidate_fatal':c.get('fatal_runtime_signatures'),
          }
          Path('prizim-f91-gate.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result,indent=2))
          if not c.get('usable_for_ab'): raise SystemExit('F9.1 PZ candidate unusable')
          if c.get('fatal_runtime_signatures'): raise SystemExit('F9.1 PZ fatal signature')
          if cf < 45: raise SystemExit(f'F9.1 failed 45 FPS gate: {cf:.2f}')
          if gain < 25: raise SystemExit(f'F9.1 failed 25% gain gate: {gain:.2f}%')
          PY

      - name: Verify surgical F9.1 scope
        run: |
          grep -q "const PIN='c6049f9684f3c6895c8f31f361a0a29462793f41'" mugen-lab/rig-f7.html
          grep -q "root=fullWine1.7.55-v8" mugen-lab/rig-f7.html
          grep -q "wine1.7.55-v8-min-online" mugen-lab/rig-f7.html
          grep -q 'RIGF F6.5: RAF main loop forced' mugen-lab/rig-f7.html
          grep -q 'HIDE CTRL' mugen-lab/rig-f7.html
          grep -q 'HIDE DEBUG' mugen-lab/rig-f7.html
          echo 'F9.1 scope: F9.0 anchor + cnc-ddraw GDI assets/override only'

      - name: Upload F9.1 PriZim reports
        uses: actions/upload-artifact@v4
        with:
          name: prizim-mobmugen-f91-gate
          path: |
            prizim-f91-*.json
            /tmp/f91-http.log

      - name: Commit F9.1 only after PriZim gates pass
        run: |
          rm -f mugen-lab/rig-f90-perf-ci.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mugen-lab/rig-f7.html \
                  mugen-lab/assets/cnc-ddraw-gdi/ddraw.dll \
                  mugen-lab/assets/cnc-ddraw-gdi/ddraw.ini
          if git diff --cached --quiet; then
            echo 'No F9.1 runtime changes to commit.'
            exit 0
          fi
          git commit -m 'Rig F F9.1 accelerate keyed sprites with cnc-ddraw GDI'
          git push
