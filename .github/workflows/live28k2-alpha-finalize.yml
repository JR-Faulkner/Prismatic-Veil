name: LIVE28K2 PZ Alpha Finalizer

on:
  push:
    paths:
      - '.github/workflows/live28k2-alpha-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PZ image dependencies
        run: python -m pip install --quiet pillow numpy scipy

      - name: Remove only edge-connected source mats at native resolution
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import numpy as np
          from scipy import ndimage

          assets = {
              'prismel': (Path('assets/party_formation/PRISMEL_LIVE28K2_RIGHT_FACING.png'), (1106, 1422)),
              'auryi': (Path('assets/party_formation/AURYI_LIVE28K2_PRIMARY.png'), (1086, 1448)),
          }

          def clean(name, path, expected):
              im = Image.open(path).convert('RGBA')
              if im.size != expected:
                  raise SystemExit(f'{name}: expected {expected}, got {im.size}')

              arr = np.array(im)
              rgb = arr[:, :, :3].astype(np.int16)
              h, w, _ = rgb.shape

              if name == 'auryi':
                  mn = rgb.min(2); mx = rgb.max(2); chroma = mx - mn
                  candidate = (mn >= 238) & (chroma <= 28)
                  dist = np.linalg.norm(rgb - np.array([255,255,255]), axis=2)
                  candidate |= dist < 32
                  edge_bg = np.array([255,255,255])
              else:
                  edge_bg = np.array([239,231,225])
                  dist = np.linalg.norm(rgb - edge_bg, axis=2)
                  mx = rgb.max(2); mn = rgb.min(2); chroma = mx - mn
                  lum = rgb.mean(2)
                  candidate = (dist < 42) | ((chroma < 28) & (lum > 205))

              seed = np.zeros((h, w), bool)
              border = 4
              seed[:border, :] = candidate[:border, :]
              seed[-border:, :] = candidate[-border:, :]
              seed[:, :border] = candidate[:, :border]
              seed[:, -border:] = candidate[:, -border:]
              bgmask = ndimage.binary_propagation(seed, mask=candidate)

              alpha = np.full((h, w), 255, np.uint8)
              alpha[bgmask] = 0
              fringe = ndimage.binary_dilation(bgmask, iterations=2) & ~bgmask

              d = np.linalg.norm(rgb - edge_bg, axis=2)
              if name == 'auryi':
                  soft = np.clip((d - 12) / 38 * 255, 0, 255)
                  sel = fringe & (rgb.min(2) > 210)
              else:
                  soft = np.clip((d - 12) / 48 * 255, 0, 255)
                  sel = fringe & (rgb.mean(2) > 180)
              alpha[sel] = np.minimum(alpha[sel], soft[sel].astype(np.uint8))

              out = arr.copy()
              out[:, :, 3] = alpha
              Image.fromarray(out, 'RGBA').save(path, 'PNG', optimize=False)

              check = Image.open(path)
              if check.format != 'PNG' or check.size != expected:
                  raise SystemExit(f'{name}: output format/size QA failed')
              ca = np.array(check.convert('RGBA'))[:, :, 3]
              transparent = int((ca == 0).sum())
              if transparent < 1000:
                  raise SystemExit(f'{name}: alpha QA failed, transparent={transparent}')
              print(name, 'size=', check.size, 'transparent=', transparent, 'partial=', int(((ca > 0) & (ca < 255)).sum()))

          for name, (path, expected) in assets.items():
              clean(name, path, expected)
          PY

      - name: Commit PZ-clean native PNG primaries and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/party_formation/PRISMEL_LIVE28K2_RIGHT_FACING.png assets/party_formation/AURYI_LIVE28K2_PRIMARY.png
          git rm .github/workflows/live28k2-alpha-finalize.yml
          git commit -m 'PZ clean LIVE28K2 native PNG battle primaries'
          git push
