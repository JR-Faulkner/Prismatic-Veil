name: Sync PriZim Live Authority

on:
  push:
    branches: [main]
    paths:
      - 'PV_LIVE_AUTHORITY.json'
      - 'tools/prizim/sync_live_authority.py'
      - 'tools/prizim/preflight_live28k.py'
      - '.github/workflows/sync-prizim-live-authority.yml'

permissions:
  contents: write

jobs:
  sync-ledgers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Sync PriZim ledgers
        run: python tools/prizim/sync_live_authority.py
      - name: Validate synchronized working tree
        run: python tools/prizim/preflight_live28k.py
      - name: Commit synchronized ledgers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PRIZIM_LIVE_NOTEPAD.md PV_RESUME_ANCHOR.md
          if git diff --cached --quiet; then
            echo 'Ledgers already synchronized.'
          else
            git commit -m 'PriZim: sync live authority ledgers'
            git push
          fi
