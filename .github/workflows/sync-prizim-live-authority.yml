name: Sync PriZim Live Authority

on:
  push:
    branches: [main]
    paths:
      - 'PV_LIVE_AUTHORITY.json'
      - 'tools/prizim/sync_live_authority.py'
      - 'tools/prizim/preflight_live28k.py'
      - '.github/workflows/sync-prizim-live-authority.yml'

permissions:
  contents: write

jobs:
  sync-ledgers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Sync, validate, and commit with race-safe retry
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3; do
            echo "PriZim sync attempt ${attempt}/3"
            git fetch origin main
            git reset --hard origin/main

            python tools/prizim/sync_live_authority.py
            python tools/prizim/preflight_live28k.py

            git add PRIZIM_LIVE_NOTEPAD.md PV_RESUME_ANCHOR.md
            if git diff --cached --quiet; then
              echo 'Ledgers already synchronized on latest MAIN.'
              exit 0
            fi

            git commit -m 'PriZim: sync live authority ledgers'
            if git push origin HEAD:main; then
              echo 'PriZim ledgers synchronized and pushed.'
              exit 0
            fi

            echo 'MAIN moved during sync; retrying from latest origin/main.'
          done

          echo 'PriZim sync failed after 3 race-safe attempts.' >&2
          exit 1
