name: Repair Hybrid Blitzer Wiring

on:
  push:
    paths:
      - '.github/workflows/repair-hybrid-blitzer.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore correct live lineage and wire Blitzer
        shell: bash
        run: |
          set -euo pipefail

          # Restore only the three files accidentally redirected into Tactical.
          git checkout 177eb1e7cc3c295b8a4c9380f786c199b2def181 -- index.html story-scroll.html tactical-shell-06d-clean.html

          # Remove the accidental Tactical-only Blitzer layer.
          rm -f src/tactical/IntegratedTacticalScene06J.js src/tactical/ActiveTurnBattleSlice06J.js

          python3 - <<'PY'
          from pathlib import Path

          # Current Hybrid must pull the fresh Blitzer-aware party modules.
          p = Path('hybrid-battle-live.html')
          s = p.read_text()
          s = s.replace("PartyBattleScene.js?v=xbox-ui-1", "PartyBattleScene.js?v=blitzer-2")
          s = s.replace("PartyBattleConfig.js?v=xbox-ui-1", "PartyBattleConfig.js?v=blitzer-2")
          s = s.replace("title:h.id==='prismel'?\"PRISM’S PROJECTILE PUNCH\":'ATTACK',description:h.id==='prismel'?'A compact prismatic projectile punch. Free, focused, and always available.':'A basic strike. Free and always available.'",
                        "title:h.id==='prismel'?\"PRISM’S PROJECTILE PUNCH\":(h.id==='kineza'?'BLITZER':'ATTACK'),description:h.id==='prismel'?'A compact prismatic projectile punch. Free, focused, and always available.':(h.id==='kineza'?'Kineza blitzes through the target in a kinetic rush. Free and always available.':'A basic strike. Free and always available.')")
          p.write_text(s)

          # Party scene + formation cache chain must advance together.
          p = Path('src/PartyBattleScene.js')
          s = p.read_text()
          s = s.replace("PartyFormationView.js?v=kineza-sprintA-1", "PartyFormationView.js?v=blitzer-2")
          s = s.replace("PartyBattleConfig.js?v=kineza-sprintA-1", "PartyBattleConfig.js?v=blitzer-2")

          # Only the real-sheet branch owns cfg. Make its hit/miss banners say BLITZER.
          needle = "if (command === 'Attack' && this.formation.hasAttackSheet(hero.id)) {"
          start = s.index(needle)
          end = s.index("    // FAI-BATTLE-PRESENTATION-03/04", start)
          block = s[start:end]
          block = block.replace("command === 'Resonart' ? hero.attack.name : 'Attack'", "command === 'Resonart' ? hero.attack.name : (cfg.name || 'Attack')")
          s = s[:start] + block + s[end:]
          p.write_text(s)

          p = Path('src/PartyFormationView.js')
          s = p.read_text().replace("PartyBattleConfig.js?v=blitzer-1", "PartyBattleConfig.js?v=blitzer-2")
          p.write_text(s)

          # PZ-A must pull the same current 18F authority, not a cached registry.
          p = Path('a-lab.html')
          s = p.read_text()
          s = s.replace("ALabRegistry.js?v=1", "ALabRegistry.js?v=blitzer-2")
          s = s.replace("FRAME 01 / 12", "FRAME 01 / 18")
          s = s.replace("Kineza · Basic Attack v2", "Kineza · Blitzer")
          p.write_text(s)

          # Home -> Story -> HYBRID. Tactical stays archived and out of this route.
          p = Path('story-scroll.html')
          s = p.read_text().replace('./hybrid-battle-live.html', './hybrid-battle-live.html?pvbuild=blitzer-hybrid-2')
          p.write_text(s)

          p = Path('index.html')
          s = p.read_text()
          s = s.replace('./story-scroll.html', './story-scroll.html?pvbuild=blitzer-hybrid-2')
          s = s.replace('./a-lab.html', './a-lab.html?pvbuild=blitzer-hybrid-2')
          p.write_text(s)
          PY

          # One-shot workflow cleans itself up.
          rm -f .github/workflows/repair-hybrid-blitzer.yml

          git config user.name 'Prismatic Veil Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Restore Hybrid route and wire Kineza Blitzer 18F [skip ci]'
          git push origin HEAD:main
