name: LIVE29E Party canon polish
on:
  push:
    paths:
      - '.github/workflows/live29e-party-canon-polish.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Polish Party canon labels
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('hybrid-party.html')
          s=p.read_text()
          swaps={
            "sarallel:{name:'Sarallel',title:'',affinity:'Blue • Gold'":"sarallel:{name:'Sarallel',title:'Simulacrum Soul',affinity:'Blue • Gold'",
            "vyan:{name:'Vyan',title:'',affinity:'Red • Gold'":"vyan:{name:'Vyan',title:'The Evolvant',affinity:'Red • Gold'"
          }
          for old,new in swaps.items():
            if old not in s: raise SystemExit(f'Missing Party anchor: {old}')
            s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hybrid-party.html
          git diff --cached --quiet && exit 0
          git commit -m "Polish Party canon identity labels"
          git push
