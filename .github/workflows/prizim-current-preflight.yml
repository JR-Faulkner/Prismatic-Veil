name: PriZim Current Preflight

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prizim-current-preflight.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Run canonical PriZim LIVE28K preflight
        run: python tools/prizim/preflight_live28k.py
