name: Apply Rig F F7.9.1 root params repair
on:
  push:
    paths:
      - 'scripts/patch_rigf_f791_rootparams.py'
      - '.github/workflows/apply-rigf-f791.yml'
permissions:
  contents: write
jobs:
  apply_f791:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply F7.9.1 root param repair
        run: python scripts/patch_rigf_f791_rootparams.py
      - name: Validate F7.9.1 inline JS
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('mugen-lab/rig-f7.html').read_text()
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          inline=[x for x in scripts if x.strip()]
          Path('/tmp/rigf-inline.js').write_text('\n'.join(inline))
          print('inline scripts',len(inline))
          PY
          node --check /tmp/rigf-inline.js
      - name: Verify real Wine 3.1 params
        run: |
          grep -F "root=TinyCore15Wine3.1" mugen-lab/rig-f7.html
          ! grep -F "root=fullWine1.7.55-v8" mugen-lab/rig-f7.html
          ! grep -F "overlay=wine1.7.55-v8-min-online" mugen-lab/rig-f7.html
          grep -F "MobMugen · Rig F · F7.9.1" mugen-lab/rig-f7.html
      - name: Commit F7.9.1
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mugen-lab/rig-f7.html docs/MOBMUGEN_LIVE.md
          git commit -m 'Rig F F7.9.1 repair Wine 3.1 runtime params'
          git push
