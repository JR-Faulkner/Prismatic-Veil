name: Apply Rig F F8.2 JIT stability

on:
  push:
    paths:
      - 'scripts/patch_rigf_f82_jitstability.py'
      - '.github/workflows/apply-rigf-f82.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply_f82:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply F8.2 JIT stability
        run: python scripts/patch_rigf_f82_jitstability.py
      - name: Validate F8.2 inline JS
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('mugen-lab/rig-f7.html').read_text()
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          inline='\n'.join(b for b in blocks if b.strip())
          Path('/tmp/rigf-f82-inline.js').write_text(inline)
          PY
          node --check /tmp/rigf-f82-inline.js
      - name: Verify F8.2 wiring
        run: |
          grep -q 'MOBMUGEN · RIG F · F8.2' mugen-lab/rig-f7.html
          grep -q 'disableWasmJitForWrittenCode=true' mugen-lab/rig-f7.html
          grep -q 'F8.2 INPUT' mugen-lab/rig-f7.html
          grep -q 'IN.*SENT' mugen-lab/rig-f7.html
          grep -q 'F8.2 JIT STABILITY' mugen-lab/rig-f7.html
          grep -q 'TinyCore15Wine3.1' mugen-lab/rig-f7.html
      - name: Commit F8.2
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mugen-lab/rig-f7.html docs/MOBMUGEN_LIVE.md
          git diff --cached --quiet && exit 0
          git commit -m 'Rig F F8.2 stabilize JIT rewritten code path'
          git push
