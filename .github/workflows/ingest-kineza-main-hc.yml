name: Ingest Kineza MAIN HC Idle

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ingest-kineza-main-hc.yml'

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MAIN
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download approved Kineza HC idle from Dropbox
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/party_formation
          curl -L --fail --retry 3 \
            'https://www.dropbox.com/scl/fi/ppi2b4mzziuk3qw8pjg0e/Photo-Sep-01-2026-22-16-31.png?rlkey=ewkiuv4dcwv6zec9o13q189rh&st=vt8v6feu&raw=1' \
            -o assets/party_formation/KINEZA_MAIN_BATTLE_IDLE_HC.png
          file assets/party_formation/KINEZA_MAIN_BATTLE_IDLE_HC.png
          test "$(xxd -p -l 8 assets/party_formation/KINEZA_MAIN_BATTLE_IDLE_HC.png)" = "89504e470d0a1a0a"
          test "$(stat -c%s assets/party_formation/KINEZA_MAIN_BATTLE_IDLE_HC.png)" -gt 500000
          echo 'Kineza HC PNG signature and size verified.'

      - name: Commit production Kineza idle to MAIN
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/party_formation/KINEZA_MAIN_BATTLE_IDLE_HC.png
          if git diff --cached --quiet; then
            echo 'Asset already current.'
            exit 0
          fi
          git commit -m 'Ingest approved Kineza MAIN battle idle HC'
          git push origin HEAD:main
