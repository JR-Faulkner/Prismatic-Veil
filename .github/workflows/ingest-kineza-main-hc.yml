name: Ingest Kineza MAIN HC Idle

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ingest-kineza-main-hc.yml'

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MAIN
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download exact approved Kineza HC idle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/party_formation
          curl -L --fail --retry 2 \
            'https://ucee7d837e64b5a3b924bc42d925.dl.dropboxusercontent.com/cd/0/get/DHV2ALavdgwWg1ybPHrK2kAgOqALDkKEkee7u93onD83M88N53k_4pvDxp4-qMTXGm6ydFMWzOi4xrEJeFNW4M6F_ly5CtZwM9wam4QpeIRfn0ypCBpeceVENdCz2UGH3WqrLVIfG-FyleCviRwL3WHqSan8YtUkoegwofm_YmeMtA/file?c_luid=9bd25e73' \
            -o assets/party_formation/KINEZA_MAIN_BATTLE_IDLE_HC.png
          file assets/party_formation/KINEZA_MAIN_BATTLE_IDLE_HC.png
          test "$(xxd -p -l 8 assets/party_formation/KINEZA_MAIN_BATTLE_IDLE_HC.png)" = "89504e470d0a1a0a"
          test "$(stat -c%s assets/party_formation/KINEZA_MAIN_BATTLE_IDLE_HC.png)" -eq 678330
          echo 'Exact Kineza HC PNG verified.'

      - name: Commit production Kineza idle to MAIN
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/party_formation/KINEZA_MAIN_BATTLE_IDLE_HC.png
          if git diff --cached --quiet; then
            echo 'Asset already current.'
            exit 0
          fi
          git commit -m 'Ingest approved Kineza MAIN battle idle HC'
          git push origin HEAD:main
