name: Ingest Kineza MAIN HC Idle

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ingest-kineza-main-hc.yml'

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MAIN
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download approved Kineza HC idle from Dropbox
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/party_formation
          curl -L --fail --retry 3 \
            'https://www.dropbox.com/scl/fi/ppi2b4mzziuk3qw8pjg0e/Photo-Sep-01-2026-22-16-31.png?rlkey=ewkiuv4dcwv6zec9o13q189rh&st=vt8v6feu&dl=1' \
            -o assets/party_formation/KINEZA_MAIN_BATTLE_IDLE_HC.png
          file assets/party_formation/KINEZA_MAIN_BATTLE_IDLE_HC.png
          python - <<'PY'
          from PIL import Image
          p='assets/party_formation/KINEZA_MAIN_BATTLE_IDLE_HC.png'
          im=Image.open(p)
          if im.format != 'PNG':
              raise SystemExit(f'Expected PNG, got {im.format}')
          if im.width < 500 or im.height < 500:
              raise SystemExit(f'Image unexpectedly small: {im.size}')
          print('Kineza HC asset verified:', im.size, im.mode)
          PY

      - name: Commit production Kineza idle to MAIN
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/party_formation/KINEZA_MAIN_BATTLE_IDLE_HC.png
          if git diff --cached --quiet; then
            echo 'Asset already current.'
            exit 0
          fi
          git commit -m 'Ingest approved Kineza MAIN battle idle HC'
          git push origin HEAD:main
