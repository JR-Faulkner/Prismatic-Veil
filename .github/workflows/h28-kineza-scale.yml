name: H2.8 Kineza Scale Patch

on:
  push:
    branches:
      - h28-attack-authority-audio
    paths:
      - 'tools/h28_kineza_scale_patch.py'
      - '.github/workflows/h28-kineza-scale.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: h28-attack-authority-audio
          fetch-depth: 0
      - name: Apply exact Kineza scale correction
        run: python tools/h28_kineza_scale_patch.py
      - name: Verify JS syntax and contamination removal
        run: |
          node --check src/PartyFormationView.js
          ! sed -n '/playAttackSheet(/,/hasActionPoses(/p' src/PartyFormationView.js | grep -q 'hero.scaleMul'
          git diff --check
      - name: Commit generated runtime change
        run: |
          if git diff --quiet -- src/PartyFormationView.js; then
            echo 'No runtime diff produced; refusing silent pass.'
            exit 1
          fi
          git config user.name 'JR-Faulkner'
          git config user.email '53619182+JR-Faulkner@users.noreply.github.com'
          git add src/PartyFormationView.js
          git commit -m 'H2.8 stop Kineza attack inheriting legacy scale'
          git push origin HEAD:h28-attack-authority-audio
