name: Patch Rig F F6c
on:
  push:
    paths:
      - '.github/workflows/patch-rigf-f6c.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Rig F to F6 lean app filesystem
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('mugen-lab/rig-f.html')
          s=p.read_text()
          if 'MOBMUGEN · RIG F · F5.6' not in s:
              raise SystemExit('Expected F5.6 base not found')
          s=s.replace('MOBMUGEN · RIG F · F5.6','MOBMUGEN · RIG F · F6')
          s=s.replace('MobMugen · Rig F · F5.6','MobMugen · Rig F · F6')
          s=s.replace('Rig F · F5.6','Rig F · F6')
          s=s.replace('POST-LAUNCH PROBE · BOXEDWINE','LEAN APP FS · BOXEDWINE')
          s=s.replace('F5.6','F6')
          browserfs='<script src="https://cdn.jsdelivr.net/gh/andrewnakas/exebrowser@c6049f9684f3c6895c8f31f361a0a29462793f41/public/boxedwine/build/default/browserfs.boxedwine.js"></script>'
          fflate='<script src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js"></script>\n'
          if fflate.strip() not in s:
              if browserfs not in s: raise SystemExit('browserfs script tag not found')
              s=s.replace(browserfs,fflate+browserfs)
          helper=Path('mugen-lab/f6-lean.js').read_text().rstrip()+'\n'
          marker='function buildParams(){'
          if 'async function buildLeanAppFS(file)' not in s:
              if marker not in s: raise SystemExit('buildParams marker missing')
              s=s.replace(marker,helper+marker,1)
          old="if(window.RIGF_APP_ZIP_DATA){\\n                console.log('RIGF F6: ZERO-COPY ZIPFS mount begin');"
          new="if(window.RIGF_APP_FS){\\n                console.log('RIGF F6: LEAN APP FS mount begin');\\n                adapterCallback(new BrowserFS.FileSystem.FolderAdapter('/', window.RIGF_APP_FS));\\n                console.log('RIGF F6: LEAN APP FS ready');\\n                return;\\n            }\\n            if(window.RIGF_APP_ZIP_DATA){\\n                console.log('RIGF F6: LEGACY ZIPFS mount begin');"
          if old in s:
              s=s.replace(old,new,1)
          elif 'RIGF F6: LEAN APP FS mount begin' not in s:
              raise SystemExit('shell app mount patch point missing')
          old_boot="status('READING ZIP ONCE FOR DIRECT MOUNT');const raw=await file.arrayBuffer();window.RIGF_APP_ZIP_DATA=raw;log('F6 DIRECT ZIP BUFFER · '+(raw.byteLength/1048576).toFixed(1)+' MB');status('FETCHING BOXEDWINE SHELL');"
          new_boot="status('STREAMING BOOT-CRITICAL APP FILES');await buildLeanAppFS(file);window.RIGF_APP_ZIP_DATA=null;status('FETCHING BOXEDWINE SHELL');"
          if old_boot in s:
              s=s.replace(old_boot,new_boot,1)
          elif 'STREAMING BOOT-CRITICAL APP FILES' not in s:
              raise SystemExit('boot whole-buffer patch point missing')
          s=s.replace('F6 keeps the proven on-demand root, suppresses high-volume root creation logging, throttles crash-trace persistence, and adds post-launch Wine/WinMUGEN lifecycle probes to reduce iPhone pressure and expose the next failure after EXE launch.','F6 removes the 1.72 GB resident app ZIP. It streams only boot-critical WinMUGEN files into a lean filesystem while keeping the proven on-demand Wine root.')
          p.write_text(s)
          d=Path('docs/MOBMUGEN_LIVE.md')
          t=d.read_text() if d.exists() else '# MOBMUGEN LIVE CONTINUITY\n'
          note='''\n## Rig F F6 - lean streamed app filesystem\n- Removes the 1.72 GB full `file.arrayBuffer()` app mount.\n- Selectively extracts WinMUGEN executable, root DLL/config files, data, font, sound, and plugins.\n- Uses per-entry ZIP slicing + fflate so the whole archive is never resident as one ArrayBuffer.\n- Builds a BrowserFS in-memory D: drive and preserves the nested WinMugen path.\n- Keeps the proven same-origin on-demand Wine root.\n'''
          if '## Rig F F6 - lean streamed app filesystem' not in t:
              t+=note
          d.write_text(t)
          PY
      - name: Remove one-shot workflows and commit
        run: |
          rm -f .github/workflows/patch-rigf-f6.yml .github/workflows/patch-rigf-f6b.yml .github/workflows/patch-rigf-f6c.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add mugen-lab/rig-f.html mugen-lab/f6-lean.js docs/MOBMUGEN_LIVE.md .github/workflows
          git commit -m "Rig F F6 stream lean WinMUGEN app filesystem"
          git push
