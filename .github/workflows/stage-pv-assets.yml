name: Stage approved PV assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage-pv-assets.yml'
      - 'index.html'
      - 'trailer.html'
      - 'hybrid-overworld.html'
      - 'hybrid-battle-live.html'
      - 'assets/js/pv-overworld-live29f.js'
      - 'assets/js/pv-overworld-live30a.js'
      - 'assets/js/pv-overworld-live30b.js'
      - 'assets/js/pv-overworld-live30g.js'

permissions:
  contents: write

jobs:
  stage:
    if: "${{ github.event.head_commit.message != 'chore: stage approved PV assets [skip ci]' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download approved PV binaries
        env:
          CINETRAIL_URL: 'https://uc2f183e6b6e3290d3b549f6d406.dl.dropboxusercontent.com/cd/0/get/DI517rbiYEviRP2vQ66WzknWlJ-pbyQsiizPmghQLRUTUvwtPupuiIP40sln28pGY3ecBAgPM0DIHCxRp8hQBoy1HsyZD6brveXmVmVuFwRS1b4_65B0Nj97d0IaZX0tjIDyr1RZQhMkqoX8Itzn_W-IEGldABQ95HCZt_HVBo61rw/file?c_luid=9bd25e73'
          TOWER_AUDIO_URL: 'https://uc47c528d0cf08388e79d024c8cf.dl.dropboxusercontent.com/cd/0/get/DI6uc7do90ld4_pzZuAwLDlVSr7jTe2T5XFuH2UkBnm1PIYhXB9qMveUId1otp1kx9yUs_YynlzoIv1BAbaxdxfCPUafchyvmNCpiAeKrNGD6DObeQ8TizJexgczgJQ-acu3TwqZL6x0cC9u1aCcr6N5J75lhp8dJyZlE7DLlgUYMw/file?c_luid=9bd25e73'
          PRISM_CORE_URL: 'https://ucf59103ecb7a70bb0d153f506fd.dl.dropboxusercontent.com/cd/0/get/DI7MRXYItJ0Mz_tgWzpRgBlp-HL_yiSPJUkgExziw_Ivbriv2XLk36FnHs1EdYoYZFm22eUhFL3UQYjxmDBNOTv824F2vuGXYoZTMi2A-PlVNDiPIVCLlqSXICT6Bpmds8J77EwHeOMky5V_68xV_KWwCqzwZraHQR97GajqJfrPig/file?c_luid=9bd25e73'
          HARMONIC_URL: 'https://uc607b0e656d9a575c6eff375191.dl.dropboxusercontent.com/cd/0/get/DI5M6hf9p7qoOpcQ6Q-EOH0t2Nj1j8CKjbbsVeh6_UqdtbkAxfseKkR5UC60CtdXtCCYUiFrZrONGxa1b0HXPJuRGOfJP435ws6tPf5jMytMnZE3nst0EmfT7AnyFawyVRYkS3bzTn5lJvAmYNSGfEp0BhZmIuzWecPIiOhcN1iHKA/file?c_luid=9bd25e73'
          ROUTING_URL: 'https://ucad79c254b93f54e57fb93f106f.dl.dropboxusercontent.com/cd/0/get/DI4Bi7jd9ddl5poqDc2bOdKXMSTFRJXQnVjP1v3rYqt4VciTCc_bOfisZ_mYrvnb7ApgLlKbOFqgsDLTxhQqws6prHXLbrjvJT3jkf2a1raQCSt1DwHHWi7JxXv95VQO63GFvDBJOyGUTyY9j81gREYeqdB_Wuvi3w5-Q5KdtUGq9g/file?c_luid=9bd25e73'
        run: |
          set -euo pipefail
          mkdir -p assets/video assets/audio/tower/audition-v1 assets/ui/overworld/v2 assets/ui/tower/review-v1
          curl --fail --location --retry 3 --retry-all-errors "$CINETRAIL_URL" -o assets/video/CineTrail.mp4
          curl --fail --location --retry 3 --retry-all-errors "$TOWER_AUDIO_URL" -o assets/audio/tower/audition-v1/tower-audition-sequence.wav
          curl --fail --location --retry 3 --retry-all-errors "$PRISM_CORE_URL" -o assets/ui/overworld/v2/resonance_prism_core_v1.png
          curl --fail --location --retry 3 --retry-all-errors "$HARMONIC_URL" -o assets/ui/tower/review-v1/harmonic-calibration.png
          curl --fail --location --retry 3 --retry-all-errors "$ROUTING_URL" -o assets/ui/tower/review-v1/resonance-routing.png
          test "$(stat -c%s assets/video/CineTrail.mp4)" -eq 38299008
          test "$(stat -c%s assets/audio/tower/audition-v1/tower-audition-sequence.wav)" -eq 813644
          test "$(stat -c%s assets/ui/overworld/v2/resonance_prism_core_v1.png)" -eq 817433
          test "$(stat -c%s assets/ui/tower/review-v1/harmonic-calibration.png)" -eq 2570557
          test "$(stat -c%s assets/ui/tower/review-v1/resonance-routing.png)" -eq 2858697
      - name: Commit staged assets
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/video/CineTrail.mp4 assets/audio/tower/audition-v1/tower-audition-sequence.wav assets/ui/overworld/v2/resonance_prism_core_v1.png assets/ui/tower/review-v1/harmonic-calibration.png assets/ui/tower/review-v1/resonance-routing.png
          git rm .github/workflows/stage-pv-assets.yml
          git commit -m 'chore: stage approved PV assets [skip ci]'
          git push origin HEAD:main
