name: Stage approved PV assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage-pv-assets.yml'
      - 'index.html'
      - 'trailer.html'
      - 'hybrid-overworld.html'
      - 'hybrid-battle-live.html'
      - 'assets/js/pv-overworld-live29f.js'
      - 'assets/js/pv-overworld-live30a.js'
      - 'assets/js/pv-overworld-live30b.js'
      - 'assets/js/pv-overworld-live30g.js'

permissions:
  contents: write

jobs:
  stage:
    if: github.event.head_commit.message != 'chore: stage approved PV assets [skip ci]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download approved PV binaries
        env:
          CINETRAIL_URL: 'https://uc48c6d67b2a587bf712ff9debfe.dl.dropboxusercontent.com/cd/0/get/DI55DCOMe8io8oP1YViuVJUIDdb7Hpe_I5xfNC2trYmHgzp5ckrocBq7gIseqdfGk8ol0m-dY4bisJVSJosN0Or9XzJzAFAWMhV3YEDwbCpgBi1ap_Z-KimESDPzLeWUZIMdxeLSsUjGx1EiNbmttOzYIRu6dljDMCUV5yzFnux1Lg/file?c_luid=9bd25e73'
          TOWER_AUDIO_URL: 'https://uc8ded050228a5471bd74aedf9d7.dl.dropboxusercontent.com/cd/0/get/DI6vzeqWYz_AEhC2lxmdGtiIz-mXwRuWOC2rOPkeuHZ_R7e__9C6obZiHQ-TL9QfTwFMoPmhXboE2YN5RJ-cVi9c2ePzR-kOMlVeYtLzwgmh0ULJhkQ8zaBRQSveZ9AsTyAksePERCTOkFB120LlMkob_F9mCknXcc3XRklW_mXEKA/file?c_luid=9bd25e73'
          PRISM_CORE_URL: 'https://ucaf63fed193504ec2e9f86c8f54.dl.dropboxusercontent.com/cd/0/get/DI5a4CQcDNE0Yy7KewxeU3T2eUCdKOnR4_-xnapKwyTpyFp3flVhemgQN25Qj-soAfdVZ9N1MhniNwr7gFjK8_8O8n9lvTvtZqi10QTEYNm3CCTRLLmuxVzNp6gYr7wX8WKbbZbWX-Cx62Vosb9u1qx5ncKT1YOmqjFLcHMx-Zjv9A/file?c_luid=9bd25e73'
          HARMONIC_URL: 'https://uca4bcfd23dc200d101f46273cfc.dl.dropboxusercontent.com/cd/0/get/DI6HmiP9aGbhjpEpfRJID_7PeqxfAlICxDUvQ-4kUImdk-GQEX0BQl0Ny-M_u1511VfCOKZ87wA-9n1RSCvXbGbjkoqdbiX7BqFMEmGAjykEAGA7xMYqEMlmp7OmRfMt9cHLNWJu6CRWsPZkfGrsbtARxlrfIBMCmMj6TL_tTJK6hg/file?c_luid=9bd25e73'
          ROUTING_URL: 'https://uc7f0e3404c409417f22656461f2.dl.dropboxusercontent.com/cd/0/get/DI41EcpPdP9_pAGADoaMWT05zalugX3p06_S0uJRZEMTEh9CVpRSU5kMWLOYZSnXD91MhZXQ2EX7firSzg5Svf76JBWBWJGAvBUIXMo7hE6nNB6I2dx0YkuK2V7Gz6Y7ECMMoTGF2gFDBcB4IUYHqlJ8xH-BD5EJnnzAnwDApVq9EA/file?c_luid=9bd25e73'
        run: |
          set -euo pipefail
          mkdir -p assets/video assets/audio/tower/audition-v1 assets/ui/overworld/v2 assets/ui/tower/review-v1
          curl --fail --location --retry 3 --retry-all-errors "$CINETRAIL_URL" -o assets/video/CineTrail.mp4
          curl --fail --location --retry 3 --retry-all-errors "$TOWER_AUDIO_URL" -o assets/audio/tower/audition-v1/tower-audition-sequence.wav
          curl --fail --location --retry 3 --retry-all-errors "$PRISM_CORE_URL" -o assets/ui/overworld/v2/resonance_prism_core_v1.png
          curl --fail --location --retry 3 --retry-all-errors "$HARMONIC_URL" -o assets/ui/tower/review-v1/harmonic-calibration.png
          curl --fail --location --retry 3 --retry-all-errors "$ROUTING_URL" -o assets/ui/tower/review-v1/resonance-routing.png
          test "$(stat -c%s assets/video/CineTrail.mp4)" -eq 38299008
          test "$(stat -c%s assets/audio/tower/audition-v1/tower-audition-sequence.wav)" -eq 813644
          test "$(stat -c%s assets/ui/overworld/v2/resonance_prism_core_v1.png)" -eq 817433
          test "$(stat -c%s assets/ui/tower/review-v1/harmonic-calibration.png)" -eq 2570557
          test "$(stat -c%s assets/ui/tower/review-v1/resonance-routing.png)" -eq 2858697
      - name: Commit staged assets
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/video/CineTrail.mp4 assets/audio/tower/audition-v1/tower-audition-sequence.wav assets/ui/overworld/v2/resonance_prism_core_v1.png assets/ui/tower/review-v1/harmonic-calibration.png assets/ui/tower/review-v1/resonance-routing.png
          git rm .github/workflows/stage-pv-assets.yml
          git commit -m 'chore: stage approved PV assets [skip ci]'
          git push origin HEAD:main
