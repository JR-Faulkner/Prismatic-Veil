name: Apply Rig F F7.9.2 local Wine 3.1 root
on:
  push:
    paths:
      - 'scripts/patch_rigf_f792_localroot.py'
      - '.github/workflows/apply-rigf-f792.yml'
permissions:
  contents: write
jobs:
  apply_f792:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Download official Wine 3.1 root
        run: |
          mkdir -p /tmp/f792 mugen-lab/assets
          curl -fL --retry 4 --retry-delay 2 'https://boxedwine.org/v2/2/TinyCore15Wine3.1.zip' -o /tmp/f792/TinyCore15Wine3.1.zip
          echo '09296bb395cc2b8a563fc7986f242531e485b2664bd282270eb03e12015ca693  /tmp/f792/TinyCore15Wine3.1.zip' | sha256sum -c -
          test "$(stat -c%s /tmp/f792/TinyCore15Wine3.1.zip)" = '119229367'
      - name: Split root below GitHub file limit
        run: |
          rm -f mugen-lab/assets/TinyCore15Wine3.1.zip.part*
          split -b 40M -d -a 2 /tmp/f792/TinyCore15Wine3.1.zip mugen-lab/assets/TinyCore15Wine3.1.zip.part
          ls -lh mugen-lab/assets/TinyCore15Wine3.1.zip.part*
          test "$(ls mugen-lab/assets/TinyCore15Wine3.1.zip.part* | wc -l)" = '3'
      - name: Apply F7.9.2 shell patch
        run: python scripts/patch_rigf_f792_localroot.py
      - name: Validate inline JS
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('mugen-lab/rig-f7.html').read_text()
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/rigf-inline.js').write_text('\n'.join(x for x in scripts if x.strip()))
          PY
          node --check /tmp/rigf-inline.js
      - name: Verify F7.9.2 local root wiring
        run: |
          grep -F "const ROOT_BASE='./assets/'" mugen-lab/rig-f7.html
          grep -F 'RIGF F7.9.2: LOCAL ROOT READY' mugen-lab/rig-f7.html
          grep -F 'TinyCore15Wine3.1.zip.part00' mugen-lab/rig-f7.html
          test -f mugen-lab/assets/TinyCore15Wine3.1.zip.part00
          test -f mugen-lab/assets/TinyCore15Wine3.1.zip.part01
          test -f mugen-lab/assets/TinyCore15Wine3.1.zip.part02
      - name: Commit F7.9.2
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mugen-lab/rig-f7.html mugen-lab/assets/TinyCore15Wine3.1.zip.part00 mugen-lab/assets/TinyCore15Wine3.1.zip.part01 mugen-lab/assets/TinyCore15Wine3.1.zip.part02 docs/MOBMUGEN_LIVE.md
          git commit -m 'Rig F F7.9.2 serve verified Wine 3.1 root same-origin'
          git push
