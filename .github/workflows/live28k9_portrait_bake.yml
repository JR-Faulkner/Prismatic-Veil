name: LIVE28K9 portrait bake

on:
  push:
    paths:
      - '.github/workflows/live28k9_portrait_bake.yml'

permissions:
  contents: write

jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install pillow
      - name: Bake measured approved HUD portraits
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import hashlib

          # Source files are the already-approved transparent HUD portrait derivatives.
          # Coordinates are measured in the 72x72 source space. If a source differs,
          # scale the measurement proportionally rather than guessing CSS positions.
          specs = {
              'prismel': ('assets/ui/portrait_prismel.png', (9, 2, 63, 56)),
              'auryi':   ('assets/ui/portrait_auryi.png',   (13, 5, 65, 57)),
              'kineza':  ('assets/ui/portrait_kineza.png',  (18, 6, 70, 58)),
          }

          for hero, (src_path, base_box) in specs.items():
              src = Path(src_path)
              im = Image.open(src).convert('RGBA')
              w, h = im.size
              sx, sy = w / 72.0, h / 72.0
              l, t, r, b = base_box
              box = (
                  round(l * sx), round(t * sy),
                  round(r * sx), round(b * sy)
              )
              crop = im.crop(box)
              if crop.width != crop.height:
                  side = max(crop.width, crop.height)
                  square = Image.new('RGBA', (side, side), (0, 0, 0, 0))
                  square.alpha_composite(crop, ((side-crop.width)//2, (side-crop.height)//2))
                  crop = square
              out = crop.resize((128, 128), Image.Resampling.LANCZOS)
              alpha = out.getchannel('A')
              if alpha.getbbox() is None:
                  raise SystemExit(f'{hero}: empty alpha after bake')
              out_path = Path(f'assets/ui/portrait_{hero}_k9.png')
              out.save(out_path, 'PNG', optimize=True)
              digest = hashlib.sha256(out_path.read_bytes()).hexdigest()
              print(hero, 'src', im.size, 'box', box, 'out', out.size,
                    'alpha', alpha.getextrema(), 'bbox', alpha.getbbox(), 'sha256', digest)
          PY
      - name: Commit K9 portrait assets and remove one-shot workflow
        run: |
          git config user.name 'JR-Faulkner'
          git config user.email '53619182+JR-Faulkner@users.noreply.github.com'
          rm .github/workflows/live28k9_portrait_bake.yml
          git add assets/ui/portrait_prismel_k9.png assets/ui/portrait_auryi_k9.png assets/ui/portrait_kineza_k9.png .github/workflows/live28k9_portrait_bake.yml
          git commit -m 'LIVE28K9: bake measured approved HUD portraits'
          git push origin main
