name: PV Forge Check

on:
  push:
    paths:
      - 'pv-data/**'
      - 'tools/pv_forge/**'
      - 'src/generated/**'
      - '.github/workflows/pv-forge-check.yml'
  pull_request:
    paths:
      - 'pv-data/**'
      - 'tools/pv_forge/**'
      - 'src/generated/**'
      - '.github/workflows/pv-forge-check.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check PV Forge data adapters
        run: python tools/pv_forge/pv_forge.py check
