name: Temporary Auryi entry patch

on:
  push:
    paths:
      - 'pv-data/triggers/auryi-entry-patch.trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/temp_patch_auryi_entry.py
      - run: |
          git config user.name 'JR-Faulkner'
          git config user.email '53619182+JR-Faulkner@users.noreply.github.com'
          git add src/prizim/DuoHybridSequenceDriver.js src/prizim/DuoHybridPartyFormationView.js
          git commit -m 'Wire Auryi PriZim entry and battle presence'
          git push
