name: One-shot Party chibi canon runtime wire
on:
  push:
    paths:
      - '.github/workflows/one-shot-party-chibi-wire.yml'
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire approved PV Semi-Chibi 30 assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('hybrid-party.html')
          s=p.read_text()
          replacements={
            './assets/party_formation/PRISMEL_JRPG_NORMALIZED_900x900.png':'./assets/ui/party/v1/characters/party_prismel_chibi.png',
            './assets/party_formation/KINEZA_JRPG_NORMALIZED_900x900.png':'./assets/ui/party/v1/characters/party_kineza_chibi.png',
            './assets/party_formation/AURYI_JRPG_NORMALIZED_900x900.png':'./assets/ui/party/v1/characters/party_auryi_chibi.png',
            './assets/ui/party/v1/characters/sarallel_composite.png':'./assets/ui/party/v1/characters/party_sarallel_chibi.png',
            './assets/ui/party/v1/characters/vyan_party.webp':'./assets/ui/party/v1/characters/party_vyan_chibi.png',
          }
          for old,new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing expected source: {old}')
              s=s.replace(old,new)
          for new in replacements.values():
              if new not in s:
                  raise SystemExit(f'failed to wire: {new}')
          p.write_text(s)
          PY
      - name: Commit runtime wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'JR-Faulkner'
          git config user.email '53619182+JR-Faulkner@users.noreply.github.com'
          git add hybrid-party.html
          if git diff --cached --quiet; then
            echo 'Party canon already wired.'
            exit 0
          fi
          git commit -m 'PARTY: wire approved Semi-Chibi 30 canon into runtime'
          git push
