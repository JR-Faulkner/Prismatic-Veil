name: Apply Rig F F7.3 picker witness

on:
  push:
    branches:
      - main
    paths:
      - scripts/patch_rigf_f73_picker.py

permissions:
  contents: write

jobs:
  apply_f73:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply F7.3 picker witness patch
        run: python3 scripts/patch_rigf_f73_picker.py
      - name: Commit F7.3
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add mugen-lab/rig-f7.html docs/MOBMUGEN_LIVE.md
          git commit -m "Rig F F7.3 picker witness" || exit 0
          git push
