name: Overworld Audio Source Audit
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/overworld-audio-source-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect packed Overworld payload
        run: |
          python - <<'PY'
          import gzip,re,pathlib
          src=pathlib.Path('assets/ui/overworld/v1/hybrid-overworld.hr4b.html.gz')
          text=gzip.open(src,'rt',encoding='utf-8',errors='replace').read()
          pats=[r'[^\n]{0,220}(?:Audio\(|<audio|\.mp3|\.m4a|music|bgm)[^\n]{0,320}']
          hits=[]
          for p in pats:
              hits.extend(re.findall(p,text,re.I))
          out='OVERWORLD PACKED AUDIO AUDIT\n\n'+('\n\n---\n\n'.join(hits) if hits else 'NO AUDIO REFERENCES FOUND')+'\n'
          pathlib.Path('docs/overworld-audio-source-audit.txt').write_text(out,encoding='utf-8')
          print(out[:12000])
          PY
      - name: Commit audit
        run: |
          git config user.name 'JR-Faulkner'
          git config user.email '53619182+JR-Faulkner@users.noreply.github.com'
          git add docs/overworld-audio-source-audit.txt
          git diff --cached --quiet && exit 0
          git commit -m 'AUDIT: inventory packed Overworld audio sources'
          git push
