name: Build Blitzer Runtime Asset

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-blitzer-runtime.yml'
      - 'assets/runtime/blitzer/p01.bin'
      - 'assets/runtime/blitzer/p02.bin'
      - 'assets/runtime/blitzer/p03.bin'
      - 'assets/runtime/blitzer/p04.bin'
      - 'assets/runtime/blitzer/p05.bin'
      - 'assets/runtime/blitzer/p06.bin'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build WebP runtime sheet
        run: |
          cat assets/runtime/blitzer/p01.bin \
              assets/runtime/blitzer/p02.bin \
              assets/runtime/blitzer/p03.bin \
              assets/runtime/blitzer/p04.bin \
              assets/runtime/blitzer/p05.bin \
              assets/runtime/blitzer/p06.bin \
              > assets/characters/kineza/animations/kineza_blitzer_basic_v1.webp
          file assets/characters/kineza/animations/kineza_blitzer_basic_v1.webp
      - name: Commit runtime sheet
        run: |
          git config user.name 'prismatic-veil-build'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/characters/kineza/animations/kineza_blitzer_basic_v1.webp
          if git diff --cached --quiet; then
            echo 'Runtime sheet already current.'
          else
            git commit -m 'Build Kineza Blitzer runtime sprite sheet'
            git push
          fi
