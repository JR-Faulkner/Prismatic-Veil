name: Finalize Auryi Aurora Audio

on:
  push:
    branches: [main]
    paths:
      - '.github/ingest_auryi_audio/READY.txt'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reconstruct exact audio masters
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/music
          find .github/ingest_auryi_audio/celestial -type f -name '*.b64' -print0 | sort -z | xargs -0 cat | base64 --decode > 'assets/music/Celestial Bloom.m4a'
          find .github/ingest_auryi_audio/triumph -type f -name '*.b64' -print0 | sort -z | xargs -0 cat | base64 --decode > 'assets/music/Triumph of Light.m4a'
          echo '0e8762907bf36650cbdebab8f6497079350054f9819c81e6cb1ba4f3b14cff3d  assets/music/Celestial Bloom.m4a' | sha256sum -c -
          echo '98c77e8bc536425b8da8ad4212ed26011335c5ac3b9dadbce0ec28c201cca437  assets/music/Triumph of Light.m4a' | sha256sum -c -
          test "$(wc -c < 'assets/music/Celestial Bloom.m4a')" -eq 113740
          test "$(wc -c < 'assets/music/Triumph of Light.m4a')" -eq 186602

      - name: Commit verified masters and remove transport chunks
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/ingest_auryi_audio
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'assets/music/Celestial Bloom.m4a' 'assets/music/Triumph of Light.m4a' .github/ingest_auryi_audio
          git commit -m 'LIVE28K: install exact Aurora Pulse and victory audio masters'
          git push origin HEAD:main
