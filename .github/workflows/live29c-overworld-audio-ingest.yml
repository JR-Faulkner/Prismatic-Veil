name: LIVE29C Overworld audio ingest

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/live29c-overworld-audio-ingest.yml

permissions:
  contents: write

jobs:
  ingest:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch verified Homecoming Path and menu SFX
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/audio/overworld/menu_sfx /tmp/pv-audio
          curl --fail --location --silent --show-error --output assets/audio/overworld/Homecoming_Path.m4a 'https://uc1b92d05d80c2c5638d88bfce01.dl.dropboxusercontent.com/cd/0/get/DH7OF3USa-7c7AxNchT1Xdh5csacPWILnL0C4df5IHt8SwAr9B6ygyziEppa4elQfRm3wB1RpFYe42y5cv5CGgqyCucyZMsvtw0EEw7noPWltgb6z6yTVmYo7TWHOLF4HjucBG5oANmrXPMKcyFsXKCv7zPwFdx3YmywkPsX2FdedA/file?c_luid=9bd25e73'
          curl --fail --location --silent --show-error --output /tmp/pv-audio/menu_sfx.zip 'https://uce117d3900034ea075e20207a6d.dl.dropboxusercontent.com/cd/0/get/DH4fOpFu_i6RQ7DlU5lEW1-ef2lSrjY-44DRTs8T5llZRlRhbxBu-_S7WdCO1P1hgQDfLsgFZn5fieze_aoyNDnkwn76yM5w0LXszESYLM3mg7qen2XTFSX8RaYyncKsAoVAhGFdRPxen0uvzpVJpKoynRAxDul3Yw5X7f7Qg9OhOA/file?c_luid=9bd25e73'
          test "$(wc -c < assets/audio/overworld/Homecoming_Path.m4a)" -eq 1255585
          test "$(wc -c < /tmp/pv-audio/menu_sfx.zip)" -eq 277012
          echo '4e6487e0d18ebf82e34c528a5653171584d2c3665d515cd432247541e48ed3a6  assets/audio/overworld/Homecoming_Path.m4a' | sha256sum -c -
          echo 'd5c05461f49609b9437a67b0ea385bc49f8e8391463f189fee25021ac27ae35e  /tmp/pv-audio/menu_sfx.zip' | sha256sum -c -
          unzip -oq /tmp/pv-audio/menu_sfx.zip -d assets/audio/overworld/menu_sfx
          rm -f assets/audio/overworld/menu_sfx/pv_menu_sfx_preview.wav
          ls -lah assets/audio/overworld/Homecoming_Path.m4a assets/audio/overworld/menu_sfx/*.wav

      - name: Commit verified audio assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/audio/overworld/Homecoming_Path.m4a assets/audio/overworld/menu_sfx
          if git diff --cached --quiet; then
            echo 'Overworld audio already current.'
            exit 0
          fi
          git commit -m 'LIVE29C: ingest Homecoming Path and overworld menu SFX'
          git push origin HEAD:main
