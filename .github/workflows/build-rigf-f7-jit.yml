name: Rig F F7 JIT build

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-rigf-f7-jit.yml

permissions:
  contents: write

jobs:
  build_f7:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Emscripten
        shell: bash
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git /tmp/emsdk
          cd /tmp/emsdk
          ./emsdk install latest
          ./emsdk activate latest

      - name: Build BoxedWine JIT
        shell: bash
        run: |
          source /tmp/emsdk/emsdk_env.sh
          git clone https://github.com/danoon2/Boxedwine.git /tmp/Boxedwine
          cd /tmp/Boxedwine
          git checkout 940cb6fe2c771c2275d57d4fbb5a8f77bfa7b167
          cd project/emscripten
          # Upstream currently links the final WASM target with emcc even though
          # the object graph contains C++ runtime symbols. Emscripten 6 rejects
          # that link. Keep C compilation on emcc, but use em++ only for the
          # final link step.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('makefile')
          s = p.read_text()
          old = '\t@$(CC) $(ALL) -o $@ $(LDFLAGS)'
          new = '\t@$(CXX) $(ALL) -o $@ $(LDFLAGS)'
          if old not in s:
              raise SystemExit('BoxedWine final link rule changed')
          p.write_text(s.replace(old, new, 1))
          PY
          make jit
          mkdir -p "$GITHUB_WORKSPACE/mugen-lab/boxedwine-f7"
          cp -av Build/Jit/. "$GITHUB_WORKSPACE/mugen-lab/boxedwine-f7/"
          echo 940cb6fe2c771c2275d57d4fbb5a8f77bfa7b167 > "$GITHUB_WORKSPACE/mugen-lab/boxedwine-f7/UPSTREAM_COMMIT.txt"

      - name: Patch F7 runner
        shell: bash
        run: python3 scripts/build_rigf_f7_patch.py

      - name: Commit F7
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add mugen-lab/boxedwine-f7 mugen-lab/rig-f7.html docs/MOBMUGEN_LIVE.md
          git commit -m "Rig F F7 modern BoxedWine WASM JIT experiment"
          git push
