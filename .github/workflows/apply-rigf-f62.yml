name: Apply Rig F F6.2
on:
  push:
    paths:
      - 'scripts/patch_rigf_f62.py'
      - '.github/workflows/apply-rigf-f62.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply F6.2 patch
        run: python3 scripts/patch_rigf_f62.py
      - name: Remove one-shot files
        run: rm -f scripts/patch_rigf_f62.py .github/workflows/apply-rigf-f62.yml
      - name: Commit F6.2
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add mugen-lab/rig-f.html index.html docs/MOBMUGEN_LIVE.md scripts/patch_rigf_f62.py .github/workflows/apply-rigf-f62.yml
          git commit -m "Rig F F6.2 restore controls and collapsible debug"
          git push
