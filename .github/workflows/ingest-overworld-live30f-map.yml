name: LIVE30F Ingest Exact Approved Overworld JPEG

on:
  push:
    branches: [main]
    paths:
      - '.github/ingest_overworld_live30f/URL.txt'

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download exact approved Dropbox map bytes
        shell: bash
        run: |
          set -euo pipefail
          M='.github/ingest_overworld_live30f/URL.txt'
          SOURCE_URL="$(sed -n 's/^SOURCE_URL=//p' "$M")"
          EXPECTED_SIZE="$(sed -n 's/^EXPECTED_SIZE=//p' "$M")"
          EXPECTED_DBX_HASH="$(sed -n 's/^EXPECTED_DBX_HASH=//p' "$M")"
          EXPECTED_SHA256="$(sed -n 's/^EXPECTED_SHA256=//p' "$M")"
          test -n "$SOURCE_URL" && test -n "$EXPECTED_SIZE" && test -n "$EXPECTED_DBX_HASH" && test -n "$EXPECTED_SHA256"
          curl -fL --retry 3 --retry-delay 2 "$SOURCE_URL" -o /tmp/map_world_base.jpg
          test "$(wc -c < /tmp/map_world_base.jpg)" -eq "$EXPECTED_SIZE"
          echo "EXPECTED_DBX_HASH=$EXPECTED_DBX_HASH" >> "$GITHUB_ENV"
          echo "EXPECTED_SHA256=$EXPECTED_SHA256" >> "$GITHUB_ENV"

      - name: Verify exact JPEG identity and dimensions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, os
          p=Path('/tmp/map_world_base.jpg')
          b=p.read_bytes()
          assert b[:2] == b'\xff\xd8', 'not JPEG'
          block_hashes=[]
          for i in range(0,len(b),4*1024*1024):
              block_hashes.append(hashlib.sha256(b[i:i+4*1024*1024]).digest())
          dbx=hashlib.sha256(b''.join(block_hashes)).hexdigest()
          assert dbx == os.environ['EXPECTED_DBX_HASH'], (dbx, os.environ['EXPECTED_DBX_HASH'])
          sha=hashlib.sha256(b).hexdigest()
          assert sha == os.environ['EXPECTED_SHA256'], (sha, os.environ['EXPECTED_SHA256'])
          i=2; dims=None; sof={0xC0,0xC1,0xC2,0xC3,0xC5,0xC6,0xC7,0xC9,0xCA,0xCB,0xCD,0xCE,0xCF}
          while i < len(b)-9:
              if b[i] != 0xff:
                  i += 1; continue
              while i < len(b) and b[i] == 0xff: i += 1
              marker=b[i]; i += 1
              if marker in (0xD8,0xD9) or 0xD0 <= marker <= 0xD7: continue
              seg=int.from_bytes(b[i:i+2],'big')
              if marker in sof:
                  dims=(int.from_bytes(b[i+5:i+7],'big'),int.from_bytes(b[i+3:i+5],'big')); break
              if marker == 0xDA: break
              i += seg
          assert dims == (1536,864), dims
          Path('/tmp/map.sha256').write_text(sha+'\n')
          print('EXACT MAP PASS',len(b),dims,sha,dbx)
          PY

      - name: Install exact LIVE30F map and update runtime authority
        shell: bash
        run: |
          set -euo pipefail
          OUT='assets/ui/overworld/v2'
          cp /tmp/map_world_base.jpg "$OUT/map_world_base.jpg"
          python - <<'PY'
          import json
          from pathlib import Path
          sha=Path('/tmp/map.sha256').read_text().strip()
          auth=Path('assets/ui/overworld/v2/map_world_base.authority.json')
          d=json.loads(auth.read_text())
          d.update(
            authority='LIVE30F exact approved Overworld map base',
            source_description='Exact user-approved 1536x864 floating-islands Overworld map supplied through verified Dropbox transport; no labels, route highlights, locks, markers, or GUI baked into the image.',
            runtime_asset='assets/ui/overworld/v2/map_world_base.jpg',
            dimensions=[1536,864],
            runtime_size_bytes=833312,
            runtime_sha256=sha,
            original_clean_source_sha256=sha,
            approved=True
          )
          d.setdefault('rules',{}).update({
            'baked_labels':False,
            'baked_markers':False,
            'baked_routes':False,
            'baked_lock_states':False,
            'coded_navigation_overlay_required':True
          })
          auth.write_text(json.dumps(d,indent=2)+'\n')
          js=Path('assets/js/pv-overworld-live30c.js')
          s=js.read_text()
          old="const MAP='./assets/ui/overworld/v2/map_world_base.jpg?pvasset=live30c-authority1';"
          new="const MAP='./assets/ui/overworld/v2/map_world_base.jpg?pvasset=live30f-exact1';"
          if old not in s and new not in s:
              raise SystemExit('LIVE30C map authority string not found; refusing blind replacement')
          if old in s: s=s.replace(old,new,1)
          js.write_text(s)
          PY

      - name: Verify installed runtime authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          p=Path('assets/ui/overworld/v2/map_world_base.jpg')
          d=json.loads(Path('assets/ui/overworld/v2/map_world_base.authority.json').read_text())
          assert d['runtime_asset']==str(p)
          assert d['dimensions']==[1536,864]
          assert d['runtime_size_bytes']==833312
          assert d['runtime_sha256']==hashlib.sha256(p.read_bytes()).hexdigest()=='5d2c123a5efdacf00122ca91eace9c2585884d7e692a26fd1fc17ae1fe3c760f'
          js=Path('assets/js/pv-overworld-live30c.js').read_text()
          assert 'map_world_base.jpg?pvasset=live30f-exact1' in js
          assert d['rules']['coded_navigation_overlay_required'] is True
          assert not any(d['rules'][k] for k in ('baked_labels','baked_markers','baked_routes','baked_lock_states'))
          PY

      - name: Validate runtime boundaries
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/js/pv-overworld-live30c.js
          python tools/prizim/preflight_live28k.py

      - name: Commit exact LIVE30F map and retire transport manifest
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/ingest_overworld_live30f/URL.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/ui/overworld/v2/map_world_base.jpg assets/ui/overworld/v2/map_world_base.authority.json assets/js/pv-overworld-live30c.js .github/ingest_overworld_live30f/URL.txt
          git commit -m 'LIVE30F: install exact approved Overworld map'
          git push origin HEAD:main
