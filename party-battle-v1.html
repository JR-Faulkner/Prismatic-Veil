<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Prismatic Veil — Party Battle (FAI-HUD-01, dev proof)</title>
<meta name="theme-color" content="#07060f">
<!-- FAI-HUD-01 Phase A: an isolated, standalone dev harness for the new
     party-formation battle scene, exactly mirroring battle-v2.html's role
     as a completely separate single-scene boot for standalone BP dev.
     Nothing here is reachable from tactical-field-v2.html — see
     MIGRATION_PLAN.md Phase B for the eventual feature-flagged bridge,
     which is explicitly not part of this pass. VeilBattleScene.js and
     tactical-field-v2.html are untouched by this file's existence. -->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    height: 100dvh;
    overflow: hidden;
    background: #07060f;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #game-container { width: 100vw; height: 100vh; height: 100dvh; }
  canvas { display: block; }
  #loading {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    white-space: pre-wrap;
    text-align: center;
    color: #f7e8b6;
    font-family: Georgia, serif;
    background: radial-gradient(circle at 50% 30%, #24124b 0%, #07060f 70%);
    line-height: 1.45;
  }
</style>
<script src="./phaser.min.js"></script>
</head>
<body>
<div id="loading">✦ Loading Party Battle (FAI-HUD-01) ✦</div>
<div id="game-container"></div>

<script type="module">
  import PartyBattleScene from './src/PartyBattleScene.js?v=11';

  const boot = document.getElementById('loading');

  function fail(error) {
    console.error(error);
    if (!boot) return;
    boot.style.display = 'flex';
    boot.textContent = 'Boot Error\n\n' + (
      error && (error.stack || error.message)
        ? (error.stack || error.message)
        : String(error)
    );
  }

  window.addEventListener('error', event => fail(event.error || event.message));
  window.addEventListener('unhandledrejection', event => fail(event.reason || event));

  if (!window.Phaser) {
    fail('Phaser did not load. Make sure phaser.min.js is in the repository root.');
  } else {
    // Same per-object text-resolution patch every other entry point in
    // this project applies — see tactical-field-v2.html's fuller comment.
    (function () {
      const dpr = Math.min(window.devicePixelRatio || 1, 3);
      const orig = Phaser.GameObjects.GameObjectFactory.prototype.text;
      Phaser.GameObjects.GameObjectFactory.prototype.text = function (x, y, text, style) {
        style = style || {};
        if (style.resolution === undefined) style.resolution = dpr;
        return orig.call(this, x, y, text, style);
      };
    })();

    class HarnessScene extends PartyBattleScene {
      create() {
        if (boot) boot.style.display = 'none';
        super.create();
      }
    }

    try {
      // Exposed for QA/Playwright only — harmless in production, no other
      // code in this harness reads it back.
      window.__pvGame = new Phaser.Game({
        type: Phaser.AUTO,
        parent: 'game-container',
        width: 800,
        height: 600,
        backgroundColor: '#07060f',
        scale: {
          mode: Phaser.Scale.RESIZE,
          autoCenter: Phaser.Scale.CENTER_BOTH
        },
        scene: [HarnessScene]
      });
    } catch (error) {
      fail(error);
    }
  }
</script>
</body>
</html>
