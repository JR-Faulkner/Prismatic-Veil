<style>
:root{
  --void:#050914;--navy:rgba(5,10,24,.94);--navy2:rgba(11,19,39,.93);
  --gold:#dec47c;--gold-soft:rgba(222,196,124,.48);
  --cyan:#91e8ff;--violet:#c893ff;--lav:#ead6ff;
  --rose:#d15172;--hp:#68dd89;--rp:#9174f3;--text:#fbf2df;--muted:#aaa4b4;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;height:100dvh;overflow:hidden;background:var(--void);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
#game-container{position:fixed;inset:0;width:100vw;height:100dvh}canvas{display:block}
#loading{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:24px;white-space:pre-wrap;text-align:center;color:#f7e8b6;font:760 15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;background:radial-gradient(circle at 50% 32%,#27154c 0%,#050914 72%)}
#pv-mobile-shell{position:fixed;inset:0;z-index:900;pointer-events:none;opacity:0;visibility:hidden;transition:opacity 130ms ease,visibility 0s linear 130ms;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;color:var(--text)}
#pv-mobile-shell.is-visible{opacity:1;visibility:visible;transition:opacity 145ms ease}
#pv-mobile-shell::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.12;background:linear-gradient(112deg,transparent 0 42%,rgba(145,232,255,.12) 42.3%,transparent 43%),linear-gradient(67deg,transparent 0 64%,rgba(200,147,255,.10) 64.2%,transparent 65%),repeating-linear-gradient(135deg,transparent 0 58px,rgba(222,196,124,.018) 59px,transparent 60px);mix-blend-mode:screen}

.pv-glass{position:relative;overflow:hidden;background:radial-gradient(circle at 14% 0%,rgba(80,118,160,.12),transparent 37%),linear-gradient(148deg,rgba(12,22,44,.96),rgba(4,8,19,.94) 61%,rgba(27,13,48,.92));border:1px solid var(--gold-soft);box-shadow:0 5px 19px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.045),inset 0 0 14px rgba(145,232,255,.018);backdrop-filter:blur(8px) saturate(1.12);-webkit-backdrop-filter:blur(8px) saturate(1.12);clip-path:polygon(0 9px,9px 0,calc(100% - 16px) 0,100% 15px,100% calc(100% - 8px),calc(100% - 8px) 100%,13px 100%,0 calc(100% - 13px))}
.pv-glass::before{content:"";position:absolute;z-index:0;left:8px;right:14px;top:0;height:1px;background:linear-gradient(90deg,transparent 0,var(--cyan) 24%,var(--violet) 54%,var(--gold) 79%,transparent 100%);opacity:.82;animation:spectrumDrift 6.4s ease-in-out infinite}
.pv-glass::after{content:"";position:absolute;z-index:0;right:-8px;bottom:-11px;width:33px;height:27px;transform:skewX(-28deg) rotate(-8deg);background:linear-gradient(135deg,rgba(145,232,255,.03),rgba(200,147,255,.18));border-left:1px solid rgba(145,232,255,.26);pointer-events:none}
@keyframes spectrumDrift{0%,100%{filter:hue-rotate(-6deg);opacity:.62}50%{filter:hue-rotate(12deg);opacity:.94}}

.pv-turn,.pv-target{position:absolute;top:calc(env(safe-area-inset-top,0px) + 6px);height:39px}
.pv-turn{left:calc(env(safe-area-inset-left,0px) + 7px);width:clamp(132px,19vw,158px);display:grid;grid-template-columns:40px 1fr}
.pv-turn-number{position:relative;z-index:1;display:grid;place-items:center;border-right:1px solid rgba(222,196,124,.25);color:#f4dc9a;font-size:17px;font-weight:900;font-variant-numeric:tabular-nums;text-shadow:1px 0 8px rgba(145,232,255,.16),-1px 0 8px rgba(200,147,255,.13)}
.pv-turn-number::after{content:"◇";position:absolute;right:-5px;top:3px;font-size:7px;color:var(--cyan);background:#07101f;line-height:8px}
.pv-turn-copy{position:relative;z-index:1;display:flex;flex-direction:column;justify-content:center;padding:0 8px;min-width:0}.pv-kicker{font-size:7px;line-height:1;letter-spacing:.18em;color:#ac9f82;font-weight:850}.pv-active{margin-top:3px;font-size:11px;line-height:1;color:var(--cyan);font-weight:900;letter-spacing:.06em;text-shadow:1px 0 8px rgba(145,232,255,.25),-1px 0 7px rgba(200,147,255,.18)}

.pv-target{right:calc(env(safe-area-inset-right,0px) + 7px);width:clamp(158px,22vw,190px);padding:6px 9px 5px}.pv-target-line{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:baseline;gap:7px}.pv-target-name{font-size:11px;font-weight:900;letter-spacing:.055em}.pv-target-name::before{content:"▹";margin-right:5px;color:#df7892}.pv-target-hp{font-size:8px;color:#fff;font-weight:800;font-variant-numeric:tabular-nums}.pv-bar{position:relative;z-index:1;height:5px;margin-top:6px;overflow:hidden;background:rgba(255,255,255,.075);clip-path:polygon(0 0,100% 0,calc(100% - 5px) 100%,5px 100%)}.pv-bar>i{display:block;width:100%;height:100%;transition:width 160ms ease;background:linear-gradient(90deg,#792039,var(--rose) 62%,#f1789a)}

.pv-objective{position:absolute;top:calc(env(safe-area-inset-top,0px) + 50px);left:50%;transform:translateX(-50%);max-width:80vw;padding:4px 13px;background:linear-gradient(90deg,rgba(4,8,18,.30),rgba(30,14,51,.68),rgba(4,8,18,.30));border-top:1px solid rgba(200,147,255,.25);border-bottom:1px solid rgba(145,232,255,.17);clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 50%,calc(100% - 8px) 100%,8px 100%,0 50%);color:#dfd3ee;font-size:7px;line-height:1.05;font-weight:850;letter-spacing:.075em;white-space:nowrap;text-shadow:1px 0 7px rgba(145,232,255,.11),-1px 0 7px rgba(200,147,255,.10)}

.pv-dock{position:absolute;z-index:2;pointer-events:auto;left:calc(env(safe-area-inset-left,0px) + 7px);right:calc(env(safe-area-inset-right,0px) + 7px);bottom:calc(env(safe-area-inset-bottom,0px) + 7px);min-height:101px;padding:8px 9px;display:grid;grid-template-columns:minmax(104px,.80fr) minmax(128px,1.20fr) 46px;grid-template-rows:36px 45px;gap:6px 8px}.pv-dock .pv-facet-rail{position:absolute;z-index:0;left:16%;right:14%;bottom:5px;height:2px;opacity:.38;background:repeating-linear-gradient(90deg,var(--cyan) 0 7px,transparent 7px 11px,var(--violet) 11px 18px,transparent 18px 23px,var(--gold) 23px 29px,transparent 29px 36px);clip-path:polygon(0 0,100% 0,calc(100% - 3px) 100%,3px 100%)}
.pv-hero-mini{position:relative;z-index:1;grid-column:1;grid-row:1;min-width:0;padding-right:8px;border-right:1px solid rgba(222,196,124,.18);display:grid;grid-template-columns:1fr 1fr;grid-template-rows:13px 16px;column-gap:7px}.pv-hero-name{grid-column:1/3;font-size:10px;line-height:1;color:#ffe5b2;font-weight:900;letter-spacing:.07em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pv-hero-name::before{content:"✦";margin-right:5px;color:var(--cyan);font-size:8px}.pv-resource{min-width:0;display:grid;grid-template-columns:auto 1fr;align-items:center;gap:4px;color:#aaa9b5;font-size:7px;font-weight:850}.pv-resource strong{color:#fff;font-size:8px;font-weight:850;font-variant-numeric:tabular-nums}.pv-hero-bars{grid-column:1/3;display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:-1px}.pv-mini-bar{height:4px;overflow:hidden;background:rgba(255,255,255,.07);clip-path:polygon(0 0,100% 0,calc(100% - 3px) 100%,3px 100%)}.pv-mini-bar>i{display:block;height:100%;width:100%;transition:width 160ms ease}#pv-hero-hp-fill{background:linear-gradient(90deg,#3e7650,var(--hp))}#pv-hero-rp-fill{background:linear-gradient(90deg,#4c3d9d,var(--rp),#c38cff)}

.pv-ability-block{position:relative;z-index:1;grid-column:2;grid-row:1;min-width:0;display:flex;flex-direction:column;justify-content:center}.pv-ability{position:relative;color:var(--lav);font-size:11px;line-height:1;font-weight:900;letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:1px 0 9px rgba(145,232,255,.15),-1px 0 9px rgba(200,147,255,.20)}.pv-ability::before{content:"◈ ";color:var(--cyan)}.pv-action-meta{margin-top:5px;color:#aaa0b5;font-size:7px;font-weight:800;letter-spacing:.075em}.pv-action-meta::after{content:"  ╱╱";color:rgba(222,196,124,.50);letter-spacing:-1px}.pv-damage{position:relative;z-index:1;grid-column:3;grid-row:1;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;color:#ab9e80;font-size:6px;font-weight:850;letter-spacing:.08em}.pv-damage strong{margin-top:1px;color:#f3ceff;font-size:18px;line-height:1;font-variant-numeric:tabular-nums;text-shadow:1px 0 9px rgba(145,232,255,.13),-1px 0 9px rgba(200,147,255,.23)}

.pv-dock button{position:relative;z-index:1;appearance:none;-webkit-appearance:none;min-height:44px;clip-path:polygon(0 8px,8px 0,calc(100% - 11px) 0,100% 8px,100% calc(100% - 6px),calc(100% - 6px) 100%,8px 100%,0 calc(100% - 8px));font:900 10px/1 -apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif;letter-spacing:.055em;touch-action:manipulation;cursor:pointer;transition:transform 75ms ease,opacity 110ms ease,filter 75ms ease}.pv-dock button:active{transform:scale(.978);filter:brightness(1.15)}#pv-confirm{grid-column:1/3;grid-row:2;color:#f3f7ff;background:linear-gradient(112deg,rgba(20,47,75,.99),rgba(64,35,103,.98) 55%,rgba(41,24,77,.98));border:1px solid rgba(145,232,255,.72);box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 0 15px rgba(145,232,255,.055)}#pv-confirm::before{content:"◆";margin-right:8px;color:var(--gold);text-shadow:1px 0 6px var(--cyan),-1px 0 6px var(--violet)}#pv-back{grid-column:3;grid-row:2;color:#e8dce3;background:linear-gradient(180deg,rgba(42,24,34,.94),rgba(25,15,22,.96));border:1px solid rgba(190,116,136,.45)}.pv-dock button:disabled{pointer-events:none}

@media(orientation:landscape){.pv-dock{left:auto;width:min(64vw,570px);min-height:66px;grid-template-columns:minmax(118px,.78fr) minmax(128px,1fr) 40px minmax(110px,.80fr) 50px;grid-template-rows:48px;gap:7px;padding:8px}.pv-hero-mini{grid-column:1;grid-row:1}.pv-ability-block{grid-column:2;grid-row:1}.pv-damage{grid-column:3;grid-row:1;align-items:center}#pv-confirm{grid-column:4;grid-row:1}#pv-back{grid-column:5;grid-row:1}.pv-objective{max-width:58vw}}
@media(max-width:430px) and (orientation:portrait){.pv-turn{width:128px}.pv-target{width:148px}.pv-dock{grid-template-columns:minmax(94px,.76fr) minmax(116px,1.24fr) 44px}.pv-hero-name,.pv-ability{font-size:10px}.pv-objective{max-width:90vw}}
@media(max-height:390px) and (orientation:landscape){.pv-turn,.pv-target{top:calc(env(safe-area-inset-top,0px) + 4px);height:36px}.pv-objective{top:calc(env(safe-area-inset-top,0px) + 44px)}.pv-dock{bottom:calc(env(safe-area-inset-bottom,0px) + 4px);min-height:62px;grid-template-rows:45px;padding:7px}}
@media(prefers-reduced-motion:reduce){.pv-glass::before{animation:none}.pv-dock button,.pv-bar>i,.pv-mini-bar>i{transition:none}}
</style>
<script src="./phaser.min.js"></script>
</head>
<body>
<div id="loading">✦ Loading 05L PriZim Shell ✦</div>
<div id="game-container"></div>
<div id="pv-mobile-shell" aria-hidden="true">
  <section class="pv-turn pv-glass" aria-label="Turn status"><div class="pv-turn-number" id="pv-turn-number">01</div><div class="pv-turn-copy"><div class="pv-kicker">ACTIVE TURN</div><div class="pv-active" id="pv-active-label">PRISMEL</div></div></section>
  <section class="pv-target pv-glass" aria-label="Target status"><div class="pv-target-line"><span class="pv-target-name" id="pv-target-name">HUSHLING</span><span class="pv-target-hp" id="pv-target-hp">10 / 10</span></div><div class="pv-bar"><i id="pv-target-fill"></i></div></section>
  <div class="pv-objective" id="pv-objective">TOO QUIET ◆ DEFEAT HUSHLING ◆ VEIL 36%</div>
  <section class="pv-dock pv-glass" aria-label="Prismel battle controls">
    <div class="pv-facet-rail" aria-hidden="true"></div>
    <div class="pv-hero-mini"><div class="pv-hero-name" id="pv-hero-name">PRISMEL</div><div class="pv-resource"><span>HP</span><strong id="pv-hero-hp">24/24</strong></div><div class="pv-resource"><span>RP</span><strong id="pv-hero-rp">8/8</strong></div><div class="pv-hero-bars"><div class="pv-mini-bar"><i id="pv-hero-hp-fill"></i></div><div class="pv-mini-bar"><i id="pv-hero-rp-fill"></i></div></div></div>
    <div class="pv-ability-block"><div class="pv-ability" id="pv-ability-name">PRISMATIC SHARD</div><div class="pv-action-meta">TARGET ◆ HUSHLING</div></div>
    <div class="pv-damage"><span>DMG</span><strong id="pv-predicted-damage">4</strong></div>
    <button id="pv-confirm" type="button">RELEASE SHARD</button><button id="pv-back" type="button">BACK</button>
  </section>
</div>
<script type="module">
import TitleScene from './src/tactical/TitleScene.js?v=7';
import IntroCrawlScene from './src/tactical/IntroCrawlScene.js?v=3';
import TacticalScene from './src/tactical/IntegratedTacticalScene05L.js?v=2';
import VeilBattleScene from './src/IntegratedVeilBattleScene.js?v=2';
const boot=document.getElementById('loading');const shell=document.getElementById('pv-mobile-shell');
function hideShell(){if(!shell)return;shell.classList.remove('is-visible');shell.setAttribute('aria-hidden','true')}
function fail(error){console.error(error);hideShell();if(!boot)return;boot.style.display='flex';boot.textContent='Boot Error\n\n'+(error&&(error.stack||error.message)?(error.stack||error.message):String(error))}
window.addEventListener('error',e=>fail(e.error||e.message));window.addEventListener('unhandledrejection',e=>fail(e.reason||e));window.addEventListener('pagehide',hideShell);
if(!window.Phaser){fail('Phaser did not load. Make sure phaser.min.js is in the repository root.')}else{
(function(){const dpr=Math.min(window.devicePixelRatio||1,3);const orig=Phaser.GameObjects.GameObjectFactory.prototype.text;Phaser.GameObjects.GameObjectFactory.prototype.text=function(x,y,text,style){style=style||{};if(style.resolution===undefined)style.resolution=dpr;return orig.call(this,x,y,text,style)}})();
class HarnessScene extends TacticalScene{create(){hideShell();if(boot)boot.style.display='none';super.create()}}
try{new Phaser.Game({type:Phaser.AUTO,parent:'game-container',width:800,height:600,backgroundColor:'#050914',transparent:false,scale:{mode:Phaser.Scale.RESIZE,autoCenter:Phaser.Scale.CENTER_BOTH},input:{activePointers:2},scene:[TitleScene,IntroCrawlScene,HarnessScene,VeilBattleScene]})}catch(error){fail(error)}
}
</script>
</body>
