<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>MobMugen · Ikemen · RIG I20 QUIET SELECT</title>
<script>
(function(){
  'use strict';
  fetch('./rig-ikemen-3.html?v=i20-base-i3', { cache: 'no-store' })
    .then(function(r){ if(!r.ok) throw new Error('I20 base HTML HTTP '+r.status); return r.text(); })
    .then(function(html){
      html = html.replaceAll('RIG I3 PLAYABLE', 'RIG I20 QUIET SELECT');
      html = html.replaceAll('RIG I3', 'RIG I20');
      html = html.replaceAll('Rig I3 · playable', 'Rig I20 · quiet select.def');
      html = html.replaceAll('D-pad moves, START selects.', 'D-pad moves. START/attack selects P1, P2, Stage, then START MATCH. Now trims select.def to only the two picked characters before boot, so the internal engine reparse never opens or textures the rest of the roster.');
      html = html.replace('./rig-ikemen-3.js?v=i3-picker-persist', './rig-ikemen-20.js?v=i20-quiet-select');
      document.open();
      document.write(html);
      document.close();
    })
    .catch(function(e){
      document.body.innerHTML = '<pre style="white-space:pre-wrap;color:#f88;background:#070b13;padding:16px">I20 PAGE WRAPPER ERROR\n' + String((e && e.stack) || e).replace(/[<>&]/g, function(c){ return {'<':'&lt;','>':'&gt;','&':'&amp;'}[c]; }) + '</pre>';
    });
})();
</script>
</head>
<body></body>
</html>
