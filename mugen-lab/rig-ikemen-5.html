<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>MobMugen · Ikemen · RIG I5 STAGED PICKER FLOW</title>
<script>
(function(){
  'use strict';
  fetch('./rig-ikemen-3.html?v=i5-base-i3', { cache: 'no-store' })
    .then(function(r){ if(!r.ok) throw new Error('I5 base HTML HTTP '+r.status); return r.text(); })
    .then(function(html){
      html = html.replaceAll('RIG I3 PLAYABLE', 'RIG I5 STAGED PICKER FLOW');
      html = html.replaceAll('RIG I3', 'RIG I5');
      html = html.replaceAll('Rig I3 · playable', 'Rig I5 · staged picker flow');
      html = html.replaceAll('D-pad moves, START selects.', 'D-pad moves. START/attack selects P1, then P2, then stage, then starts.');
      html = html.replace('./rig-ikemen-3.js?v=i3-picker-persist', './rig-ikemen-5.js?v=i5-staged-picker-flow');
      document.open();
      document.write(html);
      document.close();
    })
    .catch(function(e){
      document.body.innerHTML = '<pre style="white-space:pre-wrap;color:#f88;background:#070b13;padding:16px">I5 PAGE WRAPPER ERROR\n' + String((e && e.stack) || e).replace(/[<>&]/g, function(c){ return {'<':'&lt;','>':'&gt;','&':'&amp;'}[c]; }) + '</pre>';
    });
})();
</script>
</head>

</html>
