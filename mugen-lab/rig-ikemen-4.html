<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>MobMugen · Ikemen · RIG I4 TOUCH PICKER FIX</title>
<script>
(function(){
  'use strict';
  fetch('./rig-ikemen-3.html?v=i4-base-i3', { cache: 'no-store' })
    .then(function(r){ if(!r.ok) throw new Error('I4 base HTML HTTP '+r.status); return r.text(); })
    .then(function(html){
      html = html.replaceAll('RIG I3 PLAYABLE', 'RIG I4 TOUCH PICKER FIX');
      html = html.replaceAll('RIG I3', 'RIG I4');
      html = html.replaceAll('Rig I3 · playable', 'Rig I4 · touch picker fix');
      html = html.replaceAll('D-pad moves, START selects.', 'D-pad moves, START/attack selects. Fixed for touch controls.');
      html = html.replace('./rig-ikemen-3.js?v=i3-picker-persist', './rig-ikemen-4.js?v=i4-touch-picker-startfix');
      document.open();
      document.write(html);
      document.close();
    })
    .catch(function(e){
      document.body.innerHTML = '<pre style="white-space:pre-wrap;color:#f88;background:#070b13;padding:16px">I4 PAGE WRAPPER ERROR\n' + String((e && e.stack) || e).replace(/[<>&]/g, function(c){ return {'<':'&lt;','>':'&gt;','&':'&amp;'}[c]; }) + '</pre>';
    });
})();
</script>
</head>
<body></body>
</html>
