<title>MobMugen · Ikemen · RIG I17 LOAD PATIENT</title>
<script>
(function(){
  'use strict';
  fetch('./rig-ikemen-3.html?v=i17-base-i3', { cache: 'no-store' })
    .then(function(r){ if(!r.ok) throw new Error('I17 base HTML HTTP '+r.status); return r.text(); })
    .then(function(html){
      html = html.replaceAll('RIG I3 PLAYABLE', 'RIG I17 LOAD PATIENT');

      html = html.replaceAll('Rig I3 · playable', 'Rig I17 · load patient');
      html = html.replaceAll('D-pad moves, START selects.', 'D-pad moves. START/attack selects P1, P2, Stage, then START MATCH. Loading screen stays up for the whole real load, with live progress shown.');
      html = html.replace('./rig-ikemen-3.js?v=i3-picker-persist', './rig-ikemen-17.js?v=i17-load-patient');
      document.open();
      document.write(html);
      document.close();
    })
    .catch(function(e){
      document.body.innerHTML = '<pre style="white-space:pre-wrap;color:#f88;background:#070b13;padding:16px">I17 PAGE WRAPPER ERROR\n' + String((e && e.stack) || e).replace(/[<>&]/g, function(c){ return {'<':'&lt;','>':'&gt;','&':'&amp;'}[c]; }) + '</pre>';
    });
})();
</script>
