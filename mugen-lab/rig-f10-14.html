<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>MobMugen · Rig F · F10.14 NON-JIT CORE HARNESS</title>
<script>
(function(){
  'use strict';
  function esc(s){ return String(s).replace(/[<>&]/g, function(c){ return {'<':'&lt;','>':'&gt;','&':'&amp;'}[c]; }); }
  function installEmergencyTraceCopy(){
    function currentTrace(){
      var state = document.getElementById('runtimeState');
      var diag = document.getElementById('diag');
      var old = '';
      try { old = localStorage.getItem('mobmugen-f1014-nonjit-core-trace') || ''; } catch(_) {}
      return 'MOBMUGEN · RIG F · F10.14 NON-JIT CORE HARNESS\n' +
        'RUNTIME STATUS · ' + (state ? state.textContent : 'unknown') + '\n' +
        'PAGE · ' + location.href + '\n' +
        'USER AGENT · ' + navigator.userAgent + '\n\n' +
        'TRACE\n' + ((diag && diag.textContent) || old || 'NO TRACE TEXT VISIBLE') + '\n';
    }
    function showManualTrace(text){
      var wrap = document.getElementById('manualTraceWrap');
      if(!wrap){
        wrap = document.createElement('div');
        wrap.id = 'manualTraceWrap';
        wrap.style.cssText = 'position:fixed;inset:8px;z-index:2147483647;background:#05070c;color:#eef4ff;border:2px solid #f1bf55;border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;font:11px ui-monospace;';
        wrap.innerHTML = '<div style="color:#f1bf55;font-weight:900">MANUAL TRACE COPY · tap text, Select All, Copy</div><textarea id="manualTraceText" readonly style="flex:1;width:100%;background:#080d16;color:#eef4ff;border:1px solid #28384c;border-radius:10px;padding:10px;font:10px ui-monospace;white-space:pre;resize:none"></textarea><button id="manualTraceClose" type="button" style="height:38px;border:1px solid #7a6227;background:#181307;color:#f1bf55;border-radius:999px;font:900 11px ui-monospace">CLOSE</button>';
        document.body.appendChild(wrap);
        document.getElementById('manualTraceClose').addEventListener('click', function(){ wrap.style.display = 'none'; });
      }
      var ta = document.getElementById('manualTraceText');
      ta.value = text;
      wrap.style.display = 'flex';
      setTimeout(function(){ try{ ta.focus(); ta.setSelectionRange(0, ta.value.length); }catch(_){} }, 50);
    }
    function bind(){
      var btn = document.getElementById('copyTrace');
      if(!btn) return false;
      btn.textContent = 'SHOW TRACE';
      btn.addEventListener('click', function(e){
        e.preventDefault();
        e.stopPropagation();
        if(e.stopImmediatePropagation) e.stopImmediatePropagation();
        showManualTrace(currentTrace());
        return false;
      }, true);
      return true;
    }
    if(!bind()){
      var tries = 0;
      var timer = setInterval(function(){ tries++; if(bind() || tries > 80) clearInterval(timer); }, 250);
    }
  }
  fetch('./rig-f10-8.html?v=f1014-base-f10-8', { cache: 'no-store' })
    .then(function(r){ if(!r.ok) throw new Error('F10.14 base HTML HTTP '+r.status); return r.text(); })
    .then(function(html){
      html = html.replaceAll('F10.8 WRITTEN-CODE JIT OFF', 'F10.14 NON-JIT CORE HARNESS');
      html = html.replaceAll('F10.8 JIT FAULT WITNESS', 'F10.14 NON-JIT CORE HARNESS');
      html = html.replaceAll('Rig F · F10.8', 'Rig F · F10.14');
      html = html.replace('F10.8 is a one-switch JIT mitigation build. It keeps F10.7\'s root, overlay, capsule, fault capture and heap witness, then adds disableWasmJitForWrittenCode=true to test whether early wineserver null faults come from JITing written/self-modified code.', 'F10.14 changes exactly one thing from F10.13: the CPU core. Same bare /bin/wine launch (no WinMUGEN program argument, no explorer/desktop fallback), same root/overlay/capsule -- but BASE now points at boxedwine-f83-fallback/, the non-JIT interpreter core that has never been used by any page. If this boots WinMUGEN, the fault is JIT-specific. If it faults identically, the bare-wine launch path itself is implicated, not the JIT.');
      html = html.replace('F10.8 written-code JIT-off trace', 'F10.14 non-JIT core trace');
      html = html.replace('./rig-f10-8.js?v=f108-writtenjitoff', './rig-f10-14.js?v=f1014-nonjit-core');
      document.open();
      document.write(html);
      document.close();
      setTimeout(installEmergencyTraceCopy, 0);
    })
    .catch(function(e){
      document.body.innerHTML = '<pre style="white-space:pre-wrap;color:#f88;background:#070b13;padding:16px">F10.14 PAGE WRAPPER ERROR\n' + esc((e && e.stack) || e) + '</pre>';
    });
})();
</script>
</head>
<body></body>
</html>
