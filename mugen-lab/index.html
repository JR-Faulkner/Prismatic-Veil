<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="#05070b" />
<title>MUGEN Lab · Touch Rig B</title>
<style>
:root{
  --ink:#eef3ff; --muted:#8f9bb0; --gold:#f3c457; --blue:#66baff; --red:#ef5961;
  --pad:min(20.5vw,164px); --btn:min(7vw,54px); --alpha:.72;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070b;color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
body{position:fixed;inset:0}
button{font:inherit}
#app{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,#121827 0,#080b12 45%,#030509 100%)}

/* Classic-MUGEN-first layout: a clean 4:3 game window centered in wide phone landscape. */
.stage-shell{
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  width:min(62vw,calc(86vh * 4 / 3)); aspect-ratio:4/3;
  max-height:86vh; border:1px solid rgba(235,242,255,.20); border-radius:10px;
  overflow:hidden; background:#0d111a; box-shadow:0 18px 50px #000b,0 0 0 1px #000 inset;
}
.arena{position:absolute;inset:0;background:radial-gradient(circle at 54% 25%,rgba(77,69,138,.35),transparent 28%),linear-gradient(180deg,#20283b 0%,#101825 58%,#091019 100%)}
.arena:before{content:"";position:absolute;left:-10%;right:-10%;bottom:-23%;height:56%;background:linear-gradient(rgba(95,184,255,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(95,184,255,.12) 1px,transparent 1px);background-size:34px 24px;transform:perspective(330px) rotateX(59deg);transform-origin:bottom;opacity:.55}
.arena:after{content:"";position:absolute;left:7%;right:7%;bottom:24%;height:2px;background:linear-gradient(90deg,transparent,rgba(243,196,87,.28),transparent)}
.fighter{position:absolute;bottom:18%;width:8%;height:39%;filter:drop-shadow(0 12px 12px #0009)}
.fighter:before{content:"";position:absolute;left:23%;top:0;width:54%;height:22%;border-radius:50%;background:#10141d;border:2px solid #ffffff25}
.fighter:after{content:"";position:absolute;left:3%;right:3%;top:20%;bottom:0;border-radius:42% 42% 13% 13%;background:linear-gradient(90deg,#10151f,#324057 45%,#111620);border:2px solid rgba(102,186,255,.22)}
.fighter.p1{left:30%;transform:skew(-3deg)} .fighter.p2{right:30%;transform:scaleX(-1) skew(-3deg)}
.fighter.p2:after{border-color:rgba(239,89,97,.24)}
.hud{position:absolute;top:8px;left:10px;right:10px;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:8px;pointer-events:none}
.life{height:10px;border:1px solid #e9f0ff44;background:#06080c;transform:skew(-10deg);overflow:hidden}.life span{display:block;height:100%;width:94%;background:linear-gradient(90deg,#62dfad,#d8e76b)}.life.r span{margin-left:auto;background:linear-gradient(90deg,#f2ce61,#ec525b)}
.name{font-size:clamp(6px,1vw,9px);letter-spacing:.13em;color:#aeb9cc;margin-top:3px;text-transform:uppercase}.name.r{text-align:right}.round{font-size:clamp(7px,1.05vw,10px);letter-spacing:.16em;font-weight:900;color:#e9eef9}
.watermark{position:absolute;left:50%;bottom:7px;transform:translateX(-50%);font-size:7px;letter-spacing:.24em;color:#ffffff48;text-transform:uppercase;white-space:nowrap}

/* Side gutters hold controls so they do not cover the fight window. */
.side{position:absolute;top:0;bottom:0;width:19vw;min-width:132px;max-width:205px;display:flex;align-items:center;justify-content:center;z-index:10;pointer-events:none}
.side.left{left:max(4px,env(safe-area-inset-left))}.side.right{right:max(4px,env(safe-area-inset-right))}
.dpad{width:var(--pad);height:var(--pad);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:3px;opacity:var(--alpha);pointer-events:auto;filter:drop-shadow(0 8px 14px #0008)}
.dir{border:1px solid #dce7ff26;background:linear-gradient(#45536bba,#161d2bde);color:#e8eef9;border-radius:10px;font-weight:900;font-size:clamp(15px,2.5vw,24px);display:flex;align-items:center;justify-content:center;touch-action:none}.dir.center{border-radius:50%;margin:8%;pointer-events:none;color:#ffffff24;background:radial-gradient(circle at 35% 30%,#52617a,#161d2a)}.dir.active{background:linear-gradient(#6fc0ff,#285f8f);border-color:#bde1ffb8;transform:scale(.96)}
.actions{position:relative;width:min(18vw,190px);height:min(25vw,205px);min-width:132px;min-height:150px;pointer-events:auto;opacity:var(--alpha)}
.action{position:absolute;width:var(--btn);height:var(--btn);border-radius:50%;border:1px solid #ffffff35;background:radial-gradient(circle at 35% 28%,#ffffff35,#44516ec0 42%,#111722f2 100%);color:#fff;font-size:clamp(9px,1.4vw,13px);font-weight:950;touch-action:none;box-shadow:0 5px 11px #0008}.action.p{border-color:#66baff77}.action.k{border-color:#ef596177}.action.active{transform:scale(.93);filter:brightness(1.35)}
.lp{left:3%;top:20%}.mp{left:36%;top:4%}.hp{right:3%;top:20%}.lk{left:3%;bottom:6%}.mk{left:36%;bottom:21%}.hk{right:3%;bottom:6%}
.macros{position:absolute;left:50%;bottom:-1px;transform:translateX(-50%);display:flex;gap:6px}.macro{border:1px solid #f3c45755;background:#211b10cc;color:#f7dda0;border-radius:7px;padding:4px 7px;font-size:8px;font-weight:900;pointer-events:auto;touch-action:none}.macro.active{background:#7c581ccc}

.topline{position:absolute;left:50%;top:max(4px,env(safe-area-inset-top));transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:8px;padding:4px 8px;border:1px solid #dfe9ff1c;background:#080b12b8;border-radius:999px;color:#93a1b8;font-size:8px;letter-spacing:.1em;white-space:nowrap}.topline b{color:#e7c86f}.topline button{border:0;background:transparent;color:#dce5f4;font-size:8px;font-weight:900;padding:2px 4px}
.readout{position:absolute;left:50%;bottom:max(3px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:20;color:#8190a6;font-size:8px;letter-spacing:.08em;white-space:nowrap}.readout span{color:#fff;font-weight:900}
#panel{display:none;position:absolute;z-index:50;top:30px;left:50%;transform:translateX(-50%);width:min(310px,55vw);padding:10px;border:1px solid #dfe9ff2a;border-radius:12px;background:#0c111bdc;box-shadow:0 16px 40px #000c;font-size:10px}.panel-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:7px 0;color:#aeb9cc}.panel-row input{width:130px;accent-color:#e6bb54}.panel-row button{border:1px solid #ffffff22;background:#131b29;color:#dbe5f7;border-radius:7px;padding:5px 8px}.open{display:block!important}
#portraitGate{display:none;position:absolute;inset:0;z-index:100;background:#05070b;align-items:center;justify-content:center;text-align:center;padding:28px}#portraitGate div{max-width:330px}#portraitGate strong{display:block;font-size:22px;margin-bottom:7px}#portraitGate p{color:#96a3b8;font-size:13px;line-height:1.4;margin:0}
@media (orientation:portrait){#portraitGate{display:flex}}
@media (max-height:380px){:root{--pad:min(19vw,145px);--btn:min(6.2vw,47px)}.stage-shell{width:min(59vw,calc(82vh * 4 / 3));max-height:82vh}.actions{height:min(23vw,180px)}}
</style>
</head>
<body>
<div id="app">
  <div class="stage-shell" aria-label="4 by 3 MUGEN game viewport">
    <div class="arena"><div class="fighter p1"></div><div class="fighter p2"></div></div>
    <div class="hud">
      <div><div class="life"><span></span></div><div class="name">P1 · RYU TEST</div></div>
      <div class="round">ROUND 1</div>
      <div><div class="life r"><span></span></div><div class="name r">P2 · DUMMY</div></div>
    </div>
    <div class="watermark">MUGEN LAB · CLEAN 4:3 GAME WINDOW</div>
  </div>

  <div class="side left"><div class="dpad" id="dpad">
    <button class="dir" data-dir="↖">↖</button><button class="dir" data-dir="↑">↑</button><button class="dir" data-dir="↗">↗</button>
    <button class="dir" data-dir="←">←</button><div class="dir center">P1</div><button class="dir" data-dir="→">→</button>
    <button class="dir" data-dir="↙">↙</button><button class="dir" data-dir="↓">↓</button><button class="dir" data-dir="↘">↘</button>
  </div></div>

  <div class="side right"><div class="actions">
    <button class="action p lp" data-key="LP">LP</button><button class="action p mp" data-key="MP">MP</button><button class="action p hp" data-key="HP">HP</button>
    <button class="action k lk" data-key="LK">LK</button><button class="action k mk" data-key="MK">MK</button><button class="action k hk" data-key="HK">HK</button>
    <div class="macros"><button class="macro" data-key="2P">2P</button><button class="macro" data-key="2K">2K</button></div>
  </div></div>

  <div class="topline"><b>TOUCH RIG B</b><span>4:3 viewport · side-gutter controls</span><button id="settings">SETTINGS</button></div>
  <div class="readout">INPUT <span id="input">READY</span> · TOUCHES <span id="touches">0</span></div>
  <div id="panel"><div class="panel-row"><span>Control opacity</span><input id="opacity" type="range" min=".35" max="1" value=".72" step=".05"></div><div class="panel-row"><span>Input history</span><button id="clear">CLEAR</button></div></div>
  <div id="portraitGate"><div><strong>Rotate to landscape</strong><p>This MUGEN control layout is built around the wide iPhone landscape gutters.</p></div></div>
</div>
<script>
const input=document.getElementById('input'),touchEl=document.getElementById('touches');
const hist=[]; const activePointers=new Set();
function log(v){hist.push(v);while(hist.length>10)hist.shift();input.textContent=hist.join('  ')}
function bindButton(el,label){
  el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture?.(e.pointerId);activePointers.add(e.pointerId);touchEl.textContent=activePointers.size;el.classList.add('active');log(label)});
  const up=e=>{activePointers.delete(e.pointerId);touchEl.textContent=activePointers.size;el.classList.remove('active')};
  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('lostpointercapture',up);
}
document.querySelectorAll('[data-key]').forEach(el=>bindButton(el,el.dataset.key));
const dpad=document.getElementById('dpad');
let dpadPointer=null,currentDir=null;
function dirAt(x,y){const r=dpad.getBoundingClientRect();const cx=(x-r.left)/r.width,cy=(y-r.top)/r.height;if(cx<0||cx>1||cy<0||cy>1)return null;const col=Math.max(0,Math.min(2,Math.floor(cx*3))),row=Math.max(0,Math.min(2,Math.floor(cy*3)));if(col===1&&row===1)return null;return [['↖','↑','↗'],['←',null,'→'],['↙','↓','↘']][row][col]}
function paintDir(v){document.querySelectorAll('.dir[data-dir]').forEach(b=>b.classList.toggle('active',b.dataset.dir===v));if(v&&v!==currentDir){currentDir=v;log(v)}}
dpad.addEventListener('pointerdown',e=>{e.preventDefault();dpadPointer=e.pointerId;dpad.setPointerCapture?.(e.pointerId);activePointers.add(e.pointerId);touchEl.textContent=activePointers.size;paintDir(dirAt(e.clientX,e.clientY))});
dpad.addEventListener('pointermove',e=>{if(e.pointerId===dpadPointer)paintDir(dirAt(e.clientX,e.clientY))});
function endPad(e){if(e.pointerId!==dpadPointer)return;activePointers.delete(e.pointerId);touchEl.textContent=activePointers.size;dpadPointer=null;currentDir=null;paintDir(null)}
dpad.addEventListener('pointerup',endPad);dpad.addEventListener('pointercancel',endPad);dpad.addEventListener('lostpointercapture',endPad);
const panel=document.getElementById('panel');document.getElementById('settings').onclick=()=>panel.classList.toggle('open');
document.getElementById('opacity').oninput=e=>document.documentElement.style.setProperty('--alpha',e.target.value);
document.getElementById('clear').onclick=()=>{hist.length=0;input.textContent='READY'};
document.addEventListener('contextmenu',e=>e.preventDefault());
</script>
</body>
</html>
