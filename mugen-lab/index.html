<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="#05070b" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>MUGEN Lab · Touch Rig D</title>
<style>
:root{--alpha:.82;--pad:min(36vw,166px);--btn:min(15vw,64px);--gold:#f2c45d;--blue:#67bcff;--red:#f05b62}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070b;color:#eef3ff;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
body{position:fixed;inset:0}button,input{font:inherit}
#app{position:absolute;inset:0;padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));display:flex;flex-direction:column;align-items:center;gap:7px;background:radial-gradient(circle at 50% 24%,#141c2d 0,#090d15 43%,#040609 100%)}
.topbar{width:min(96vw,560px);height:26px;display:flex;align-items:center;justify-content:space-between;color:#9ba8bb;font-size:9px;letter-spacing:.11em;text-transform:uppercase;flex:0 0 auto}.topbar b{color:#f3d27e;letter-spacing:.17em}.topbar button{border:1px solid #ffffff1f;background:#0c111acd;color:#dce5f5;border-radius:999px;padding:5px 9px;font-size:8px;font-weight:900}
.stage-wrap{position:relative;width:min(96vw,520px);flex:0 0 auto}.viewport-label{position:absolute;z-index:5;left:8px;top:7px;padding:4px 7px;border-radius:6px;background:#030509cf;border:1px solid #ffffff20;color:#f5d57d;font-size:7px;font-weight:950;letter-spacing:.17em;text-transform:uppercase;pointer-events:none}.stage-shell{position:relative;width:100%;aspect-ratio:4/3;border:2px solid #eff5ff55;border-radius:11px;overflow:hidden;background:#0b1018;box-shadow:0 15px 38px #000c,0 0 0 2px #000 inset}.arena{position:absolute;inset:0;background:radial-gradient(circle at 56% 23%,rgba(106,80,174,.42),transparent 25%),linear-gradient(180deg,#26324a 0%,#131e2d 57%,#0b121c 100%)}.arena:before{content:"";position:absolute;left:-10%;right:-10%;bottom:-17%;height:52%;background:linear-gradient(rgba(103,188,255,.14) 1px,transparent 1px),linear-gradient(90deg,rgba(103,188,255,.14) 1px,transparent 1px);background-size:34px 25px;transform:perspective(340px) rotateX(58deg);transform-origin:bottom;opacity:.7}.moon{position:absolute;width:23%;aspect-ratio:1;border-radius:50%;left:39%;top:12%;background:radial-gradient(circle at 38% 35%,#e9f0ff,#8696b2 54%,#3b4558 100%);opacity:.24}.fighter{position:absolute;bottom:18%;width:9%;height:39%;filter:drop-shadow(0 13px 13px #000b)}.fighter:before{content:"";position:absolute;left:23%;top:0;width:54%;height:22%;border-radius:50%;background:#111722;border:2px solid #ffffff2c}.fighter:after{content:"";position:absolute;left:3%;right:3%;top:20%;bottom:0;border-radius:42% 42% 13% 13%;background:linear-gradient(90deg,#111826,#3a4d69 47%,#111722);border:2px solid #67bcff48}.fighter.p1{left:29%;transform:skew(-3deg)}.fighter.p2{right:29%;transform:scaleX(-1) skew(-3deg)}.fighter.p2:after{border-color:#f05b624d}.hud{position:absolute;top:8px;left:9px;right:9px;display:grid;grid-template-columns:1fr auto 1fr;gap:8px;pointer-events:none}.life{height:10px;border:1px solid #f0f5ff4d;background:#05070a;transform:skew(-10deg);overflow:hidden}.life span{display:block;width:94%;height:100%;background:linear-gradient(90deg,#62dfad,#d8e76b)}.life.r span{margin-left:auto;background:linear-gradient(90deg,#f1cd60,#ed555d)}.name{margin-top:3px;font-size:clamp(6px,1.9vw,9px);letter-spacing:.1em;color:#c1cada;text-transform:uppercase}.name.r{text-align:right}.round{font-size:clamp(6px,2vw,9px);letter-spacing:.13em;font-weight:950;white-space:nowrap}.screen-note{position:absolute;left:50%;bottom:7px;transform:translateX(-50%);font-size:7px;letter-spacing:.18em;color:#ffffff66;text-transform:uppercase;white-space:nowrap}
.status{width:min(94vw,540px);display:flex;justify-content:center;gap:7px;height:20px;font-size:8px;letter-spacing:.08em;color:#7f8ca1;flex:0 0 auto}.status span{color:#fff;font-weight:900}
.control-deck{position:relative;width:min(96vw,540px);flex:1 1 auto;min-height:245px;border:1px solid #dfe9ff18;border-radius:18px;background:linear-gradient(180deg,#101722a3,#070a10cb);overflow:hidden}.control-deck:before{content:"CONTROLLER";position:absolute;left:50%;top:9px;transform:translateX(-50%);font-size:7px;letter-spacing:.24em;color:#ffffff32;font-weight:900}.left-zone,.right-zone{position:absolute;top:18px;bottom:8px;width:50%;display:flex;align-items:center;justify-content:center}.left-zone{left:0}.right-zone{right:0}.dpad{width:var(--pad);height:var(--pad);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:4px;opacity:var(--alpha);filter:drop-shadow(0 10px 16px #0009)}.dir{appearance:none;border:1px solid #dce7ff2d;background:linear-gradient(#485873cc,#171e2dde);color:#eaf0fb;border-radius:13px;font-weight:950;font-size:clamp(18px,6vw,27px);display:flex;align-items:center;justify-content:center;touch-action:none}.dir.center{border-radius:50%;margin:9%;pointer-events:none;color:#ffffff2d;background:radial-gradient(circle at 35% 30%,#566984,#171e2b);font-size:9px}.dir.active{background:linear-gradient(#72c4ff,#2b6699);border-color:#c4e5ffca;transform:scale(.96)}.actions{position:relative;width:min(43vw,196px);height:min(48vw,208px);min-width:168px;min-height:182px;opacity:var(--alpha)}.action{position:absolute;width:var(--btn);height:var(--btn);border-radius:50%;border:1px solid #ffffff35;background:radial-gradient(circle at 35% 28%,#ffffff38,#455572c7 42%,#111722f2 100%);color:#fff;font-size:clamp(10px,3vw,14px);font-weight:950;touch-action:none;box-shadow:0 6px 12px #0009}.action.p{border-color:#67bcff8a}.action.k{border-color:#f05b6282}.action.active{transform:scale(.93);filter:brightness(1.35)}.lp{left:1%;top:19%}.mp{left:34%;top:1%}.hp{right:1%;top:19%}.lk{left:1%;bottom:2%}.mk{left:34%;bottom:19%}.hk{right:1%;bottom:2%}.macros{position:absolute;left:50%;bottom:-3px;transform:translateX(-50%);display:flex;gap:6px}.macro{border:1px solid #f2c45d66;background:#251d0fdd;color:#f8dda0;border-radius:8px;padding:5px 8px;font-size:8px;font-weight:950;touch-action:none}.macro.active{background:#805c1dcc;transform:scale(.95)}
#panel{display:none;position:absolute;z-index:50;left:50%;top:max(42px,calc(env(safe-area-inset-top) + 32px));transform:translateX(-50%);width:min(330px,88vw);padding:12px;border:1px solid #dfe9ff2a;border-radius:14px;background:#0c111bed;box-shadow:0 18px 48px #000d;font-size:10px}.panel-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:8px 0;color:#aeb9cc}.panel-row input{width:145px;accent-color:#e5ba55}.panel-row button{border:1px solid #ffffff22;background:#131b29;color:#dce6f8;border-radius:7px;padding:6px 9px}.open{display:block!important}
@media (orientation:landscape){#app{overflow:auto;justify-content:flex-start}.stage-wrap{width:min(60vw,520px)}.control-deck{width:min(60vw,520px);min-height:230px}}
@media (max-height:760px) and (orientation:portrait){:root{--pad:min(33vw,148px);--btn:min(13.5vw,56px)}#app{gap:4px}.topbar{height:23px}.stage-wrap{width:min(92vw,480px)}.control-deck{min-height:220px}.actions{min-width:150px;min-height:164px;height:min(43vw,180px)}}
</style>
</head>
<body>
<div id="app">
  <div class="topbar"><b>Touch Rig D</b><span>Portrait-first, no rotate lock</span><button id="settings" type="button">SETTINGS</button></div>
  <div class="stage-wrap"><div class="viewport-label">Gameplay viewport</div><div class="stage-shell"><div class="arena"><div class="moon"></div><div class="fighter p1"></div><div class="fighter p2"></div></div><div class="hud"><div><div class="life"><span></span></div><div class="name">P1 · RYU TEST</div></div><div class="round">ROUND 1</div><div><div class="life r"><span></span></div><div class="name r">P2 · DUMMY</div></div></div><div class="screen-note">4:3 MUGEN RUNTIME SLOT</div></div></div>
  <div class="status">INPUT <span id="input">READY</span> · TOUCHES <span id="touches">0</span></div>
  <div class="control-deck"><div class="left-zone"><div class="dpad" id="dpad"><button class="dir" data-dir="↖">↖</button><button class="dir" data-dir="↑">↑</button><button class="dir" data-dir="↗">↗</button><button class="dir" data-dir="←">←</button><div class="dir center">P1</div><button class="dir" data-dir="→">→</button><button class="dir" data-dir="↙">↙</button><button class="dir" data-dir="↓">↓</button><button class="dir" data-dir="↘">↘</button></div></div><div class="right-zone"><div class="actions"><button class="action p lp" data-key="LP">LP</button><button class="action p mp" data-key="MP">MP</button><button class="action p hp" data-key="HP">HP</button><button class="action k lk" data-key="LK">LK</button><button class="action k mk" data-key="MK">MK</button><button class="action k hk" data-key="HK">HK</button><div class="macros"><button class="macro" data-key="2P">2P</button><button class="macro" data-key="2K">2K</button></div></div></div></div>
  <div id="panel"><div class="panel-row"><span>Control opacity</span><input id="opacity" type="range" min=".35" max="1" value=".82" step=".05"></div><div class="panel-row"><span>Input history</span><button id="clear" type="button">CLEAR</button></div></div>
</div>
<script>
const input=document.getElementById('input'),touchEl=document.getElementById('touches'),hist=[],activePointers=new Set();
function log(v){hist.push(v);while(hist.length>8)hist.shift();input.textContent=hist.join('  ')}
function bindButton(el,label){el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture?.(e.pointerId);activePointers.add(e.pointerId);touchEl.textContent=activePointers.size;el.classList.add('active');log(label)});const up=e=>{activePointers.delete(e.pointerId);touchEl.textContent=activePointers.size;el.classList.remove('active')};el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('lostpointercapture',up)}
document.querySelectorAll('[data-key]').forEach(el=>bindButton(el,el.dataset.key));
const dpad=document.getElementById('dpad');let dpadPointer=null,currentDir=null;
function dirAt(x,y){const r=dpad.getBoundingClientRect(),cx=(x-r.left)/r.width,cy=(y-r.top)/r.height;if(cx<0||cx>1||cy<0||cy>1)return null;const col=Math.max(0,Math.min(2,Math.floor(cx*3))),row=Math.max(0,Math.min(2,Math.floor(cy*3)));if(col===1&&row===1)return null;return [['↖','↑','↗'],['←',null,'→'],['↙','↓','↘']][row][col]}
function paintDir(v){document.querySelectorAll('.dir[data-dir]').forEach(b=>b.classList.toggle('active',b.dataset.dir===v));if(v&&v!==currentDir){currentDir=v;log(v)}}
dpad.addEventListener('pointerdown',e=>{e.preventDefault();dpadPointer=e.pointerId;dpad.setPointerCapture?.(e.pointerId);activePointers.add(e.pointerId);touchEl.textContent=activePointers.size;paintDir(dirAt(e.clientX,e.clientY))});dpad.addEventListener('pointermove',e=>{if(e.pointerId===dpadPointer)paintDir(dirAt(e.clientX,e.clientY))});function endPad(e){if(e.pointerId!==dpadPointer)return;activePointers.delete(e.pointerId);touchEl.textContent=activePointers.size;dpadPointer=null;currentDir=null;paintDir(null)}dpad.addEventListener('pointerup',endPad);dpad.addEventListener('pointercancel',endPad);dpad.addEventListener('lostpointercapture',endPad);
const panel=document.getElementById('panel');document.getElementById('settings').onclick=()=>panel.classList.toggle('open');document.getElementById('opacity').oninput=e=>document.documentElement.style.setProperty('--alpha',e.target.value);document.getElementById('clear').onclick=()=>{hist.length=0;input.textContent='READY'};document.addEventListener('contextmenu',e=>e.preventDefault());
</script>
</body>
</html>
