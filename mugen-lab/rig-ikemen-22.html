<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>MobMugen · Ikemen · RIG I22 QUIET STAGES</title>
<script>
(function(){
  'use strict';
  fetch('./rig-ikemen-3.html?v=i22-base-i3', { cache: 'no-store' })
    .then(function(r){ if(!r.ok) throw new Error('I22 base HTML HTTP '+r.status); return r.text(); })
    .then(function(html){
      html = html.replaceAll('RIG I3 PLAYABLE', 'RIG I22 QUIET STAGES');
      html = html.replaceAll('RIG I3', 'RIG I22');
      html = html.replaceAll('Rig I3 · playable', 'Rig I22 · quiet stages');
      html = html.replaceAll('D-pad moves, START selects.', 'D-pad moves. START/attack selects P1, P2, Stage, then START MATCH. Kineza is merged in from this repo over HTTP and sits first in the roster. select.def is trimmed to just the picked fighters AND the picked stage before boot, so the engine never walks the rest of the roster.');
      html = html.replace('./rig-ikemen-3.js?v=i3-picker-persist', './rig-ikemen-22.js?v=i22-quiet-stages');
      document.open();
      document.write(html);
      document.close();
    })
    .catch(function(e){
      document.body.innerHTML = '<pre style="white-space:pre-wrap;color:#f88;background:#070b13;padding:16px">I22 PAGE WRAPPER ERROR\n' + String((e && e.stack) || e).replace(/[<>&]/g, function(c){ return {'<':'&lt;','>':'&gt;','&':'&amp;'}[c]; }) + '</pre>';
    });
})();
</script>
</head>
<body></body>
</html>
