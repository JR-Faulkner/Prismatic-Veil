<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>MobMugen Runtime</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:system-ui,-apple-system,sans-serif;touch-action:none}body{position:fixed;inset:0}#canvas{position:absolute;inset:0;width:100%;height:100%;background:#000;outline:none}.status{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:#05070b;color:#dce7f8;text-align:center;padding:18px;font-size:11px;line-height:1.45;letter-spacing:.05em}.status b{display:block;color:#f2c45d;margin-bottom:7px;font-size:13px}.status.hide{display:none}.err{color:#ff8f95;font-size:9px;margin-top:8px;overflow-wrap:anywhere;white-space:pre-wrap}
</style>
<script src="https://cdn.jsdelivr.net/npm/browserfs@1.4.3/dist/browserfs.min.js"></script>
</head>
<body>
<div id="runtimeStatus" class="status"><div><b>MOBMUGEN · RIG E7</b><span id="runtimeText">Preparing browser Windows layer…</span><div id="runtimeErr" class="err"></div></div></div>
<canvas class="emscripten" id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
<script>
(function(){
'use strict';
const BASE='https://cdn.jsdelivr.net/gh/lrusso/WinAppRunner@0c5b654a50cda92f3bb6f8f37080bf8a7eab785b/';
const SYSTEM_ZIP=BASE+'WinAppRunnerSystem.zip';
const ENGINE_JS=BASE+'WinAppRunnerSystem.js';
const MEMORY_IMAGE=BASE+'WinAppRunnerSystem.wasm';
const HOME_DIRECTORY='/root/home/username/files/';
const status=document.getElementById('runtimeStatus'),statusText=document.getElementById('runtimeText'),statusErr=document.getElementById('runtimeErr'),canvas=document.getElementById('canvas');
let systemFileData=null,memoryImageData=null;const loaderTrail=[];
function clean(v,n){return String(v==null?'':v).replace(/^Uncaught\s*/i,'').slice(0,n||900)}
function remember(v){v=clean(v,700);if(!v)return;loaderTrail.push(v);while(loaderTrail.length>22)loaderTrail.shift()}
function notify(type,detail){try{parent.postMessage({source:'mugen-lab-runtime',type,detail:clean(detail,1200)},location.origin)}catch(e){}}
function setStatus(text){statusText.textContent=clean(text,180);notify('status',text)}
function loaderContext(detail){const useful=loaderTrail.filter(x=>/import_dll|library|module|dll|wineboot|probe|seed|prefix|not found|failed|error|err:/i.test(x)).slice(-12);return clean(detail,600)+(useful.length?'\n\nLoader trail:\n'+useful.join('\n'):'')}
function fail(detail){const d=loaderContext(detail)||'Unknown runtime failure';status.classList.remove('hide');statusText.textContent='Runtime stopped';statusErr.textContent=d;notify('error',d);console.error('[MobMugen]',d)}
function installLegacyHostShim(engineText){const p=parent;const strings={STRING_BOOTING:'Booting…',STRING_DOWNLOADFILE:'Download file',STRING_SELECTFOLDER:'Select folder',STRING_UPLOADFILE:'Upload file'};Object.keys(strings).forEach(k=>{try{if(p[k]==null)p[k]=strings[k]}catch(e){}});try{p.exeFilename=p.mugenExeFilename||p.exeFilename||'Winmugen.exe';p.zipFileData=p.mugenZipData||p.zipFileData||null;p.systemFileData=systemFileData}catch(e){}const special={updateTitle:t=>{remember('title: '+clean(t));notify('host','Wine title: '+clean(t));},handleError:()=>fail('Legacy Wine host reported main EXE initialization failure.'),closeWindow:()=>notify('host','Legacy runtime requested window close.'),hideTitle:()=>{},showTitle:()=>{},updateOptionsButton:()=>{},showMenu:()=>{},hideMenu:()=>{},noSleepMode:()=>{},enableDisableSound:()=>{},toggleMouse:()=>{},toggleJoystick:()=>{},toggleFullscreen:()=>{},downloadFile:()=>{},uploadFile:()=>{},displayShareAbout:()=>{},getWindowSelectionMenu:()=>null,frame_Launch:()=>{}};Object.keys(special).forEach(k=>{try{if(typeof p[k]!=='function')p[k]=special[k]}catch(e){}});const calls=new Set(),re=/parent\.([A-Za-z_$][\w$]*)\s*\(/g;let m;while((m=re.exec(engineText))!==null)calls.add(m[1]);calls.forEach(k=>{try{if(typeof p[k]!=='function')p[k]=()=>null}catch(e){}})}
function exists(p){try{return !!FS.stat(p)}catch(e){return false}}
function mkdirp(p){try{if(FS.mkdirTree)FS.mkdirTree(p);else{let cur='';p.split('/').filter(Boolean).forEach(s=>{cur+='/'+s;if(!exists(cur))try{FS.mkdir(cur)}catch(e){}})}}catch(e){remember('mkdir '+p+' failed: '+clean(e))}}
function copyFile(src,dst){try{if(!exists(src))return false;mkdirp(dst.slice(0,dst.lastIndexOf('/')));const data=FS.readFile(src,{encoding:'binary'});FS.writeFile(dst,data,{encoding:'binary'});remember('E7 seeded '+dst+' from '+src);return true}catch(e){remember('E7 seed failed '+src+' -> '+dst+': '+clean(e));return false}}
function findFirst(paths){for(const p of paths)if(exists(p))return p;return null}
function seedWinePrefix(){
 const sys='/root/home/username/.wine/drive_c/windows/system32';mkdirp(sys);
 const modules={
  'wineboot.exe':['/root/usr/lib/wine/fakedlls/wineboot.exe','/root/usr/lib/i386-linux-gnu/wine/fakedlls/wineboot.exe','/root/usr/lib32/wine/fakedlls/wineboot.exe','/root/usr/lib/wine/wineboot.exe'],
  'dinput.dll':['/root/usr/lib/wine/fakedlls/dinput.dll','/root/usr/lib/i386-linux-gnu/wine/fakedlls/dinput.dll','/root/usr/lib32/wine/fakedlls/dinput.dll'],
  'crtdll.dll':['/root/usr/lib/wine/fakedlls/crtdll.dll','/root/usr/lib/i386-linux-gnu/wine/fakedlls/crtdll.dll','/root/usr/lib32/wine/fakedlls/crtdll.dll']
 };
 const report=[];Object.keys(modules).forEach(name=>{const dst=sys+'/'+name;if(exists(dst)){report.push(name+' already');return}const src=findFirst(modules[name]);report.push(name+(src&&copyFile(src,dst)?' seeded':' source✗'))});
 const msg='E7 prefix seed: '+report.join(' · ');remember(msg);notify('diag',msg)
}
function probeRuntime(){const wb=exists('/root/home/username/.wine/drive_c/windows/system32/wineboot.exe'),di=exists('/root/home/username/.wine/drive_c/windows/system32/dinput.dll'),cr=exists('/root/home/username/.wine/drive_c/windows/system32/crtdll.dll');const msg='E7 probe: wineboot '+(wb?'✓':'✗')+' · dinput '+(di?'✓':'✗')+' · crtdll '+(cr?'✓':'✗');remember(msg);notify('diag',msg)}
function hardenGameConfig(){try{const p='/root/home/username/files/data/mugen.cfg';let t=FS.readFile(p,{encoding:'utf8'});t=t.replace(/^(\s*Width\s*=).*/gmi,'$1 320').replace(/^(\s*Height\s*=).*/gmi,'$1 240').replace(/^(\s*Depth\s*=).*/gmi,'$1 16').replace(/^(\s*Stretch\s*=).*/gmi,'$1 0').replace(/^(\s*DoubleRes\s*=).*/gmi,'$1 0').replace(/^(\s*DXmode\s*=).*/gmi,'$1 None').replace(/^(\s*VRetrace\s*=).*/gmi,'$1 0').replace(/^(\s*BlitMode\s*=).*/gmi,'$1 Normal').replace(/^(\s*DrawShadows\s*=).*/gmi,'$1 0').replace(/^(\s*Sound\s*=).*/gmi,'$1 0').replace(/^(\s*Play(?:MIDI|MP3|MOD|CDA)\s*=).*/gmi,'$1 0').replace(/^(\s*plugin\s*=.*)$/gmi,'; $1').replace(/^(\s*FirstRun\s*=).*/gmi,'$1 0');FS.writeFile(p,t,{encoding:'utf8'})}catch(e){remember('config patch skipped: '+clean(e))}}
function postBuildFileSystem(rootFS,homeFS){const mountPoint=HOME_DIRECTORY.slice(0,-1),systemData=new BrowserFS.FileSystem.MountableFileSystem();systemData.mount('/',rootFS);systemData.mount(mountPoint,homeFS);const BFS=new BrowserFS.EmscriptenFS();BrowserFS.initialize(systemData);FS.mount(BFS,{root:'/root'},'/root');hardenGameConfig();seedWinePrefix();probeRuntime()}
function buildBrowserFileSystem(writableStorage,zipfs,homeAdapter){FS.createFolder(FS.root,'root',true,true);const rootOverlay=new BrowserFS.FileSystem.OverlayFS(new BrowserFS.FileSystem.InMemory(),zipfs);rootOverlay.initialize(e3=>{if(e3)return fail('Root filesystem: '+e3);homeAdapter.initialize(e=>{if(e)return fail('Game package mount: '+e);const homeOverlay=new BrowserFS.FileSystem.OverlayFS(writableStorage,homeAdapter);homeOverlay.initialize(e2=>{if(e2)return fail('Writable game overlay: '+e2);postBuildFileSystem(rootOverlay,homeOverlay)})})})}
function buildFileSystem(writableStorage){const Buffer=BrowserFS.BFSRequire('buffer').Buffer;if(!systemFileData)throw new Error('Windows system ZIP was not loaded.');const gameData=parent.mugenZipData;if(!gameData)throw new Error('No MUGEN mini-pack supplied by parent page.');const zipfs=new BrowserFS.FileSystem.ZipFS(new Buffer(new Uint8Array(systemFileData))),gamefs=new BrowserFS.FileSystem.ZipFS(new Buffer(new Uint8Array(gameData))),homeAdapter=new BrowserFS.FileSystem.FolderAdapter('/',gamefs);buildBrowserFileSystem(writableStorage,zipfs,homeAdapter)}
function processWineLine(text,kind){text=clean(text,700);if(!text)return;remember(text);kind==='err'?console.warn(text):console.log(text);notify(kind==='err'?'diag':'log',text);if(/main exe initialization.*failed|failed to initialize/i.test(text))fail(text);else if(/fatal|out of memory/i.test(text))fail(text)}
function makeModule(){if(!memoryImageData||!memoryImageData.byteLength)throw new Error('Legacy Wine memory image is empty.');window.Module={logReadFiles:false,memoryInitializerRequest:{status:200,response:memoryImageData.slice(0)},preRun:[function(){try{if(typeof ENV==='object'){ENV.PATH='/usr/local/bin:/usr/bin:/bin';ENV.HOME='/home/username';ENV.WINEPREFIX='/home/username/.wine';ENV.WINEDLLPATH='/usr/lib/wine:/usr/lib32/wine:/usr/lib/i386-linux-gnu/wine';ENV.WINEDEBUG='+loaddll,+module'}}catch(e){remember('E7 env setup failed: '+clean(e))}setStatus('Mounting private MUGEN package…');buildFileSystem(new BrowserFS.FileSystem.InMemory())}],arguments:['-root','/root','-m','160','-w','/home/username/files/','/usr/bin/wine',parent.mugenExeFilename||parent.exeFilename||'Winmugen.exe'],postRun:[()=>notify('postrun','Wine process returned.')],print:t=>processWineLine(t,'out'),printErr:t=>processWineLine(t,'err'),canvas:(()=>{canvas.width=640;canvas.height=480;return canvas})(),setStatus:t=>{if(t)setStatus(t)},monitorRunDependencies:left=>{if(left)setStatus('Loading Windows layer… '+left)},onAbort:r=>fail('Wine aborted: '+clean(r))};notify('diag','E7 prefix repair armed. Memory initializer: '+memoryImageData.byteLength+' bytes.')}
window.injectKey=function(code,isDown){const map={ArrowUp:['ArrowUp','ArrowUp',38],ArrowDown:['ArrowDown','ArrowDown',40],ArrowLeft:['ArrowLeft','ArrowLeft',37],ArrowRight:['ArrowRight','ArrowRight',39],KeyA:['a','KeyA',65],KeyS:['s','KeyS',83],KeyD:['d','KeyD',68],KeyZ:['z','KeyZ',90],KeyX:['x','KeyX',88],KeyC:['c','KeyC',67],Enter:['Enter','Enter',13],Escape:['Escape','Escape',27]},m=map[code];if(!m)return;const type=isDown?'keydown':'keyup';let ev;try{ev=new KeyboardEvent(type,{key:m[0],code:m[1],keyCode:m[2],which:m[2],bubbles:true,cancelable:true});Object.defineProperty(ev,'keyCode',{get:()=>m[2]});Object.defineProperty(ev,'which',{get:()=>m[2]})}catch(e){return}canvas.focus();canvas.dispatchEvent(ev);document.dispatchEvent(ev);window.dispatchEvent(ev)};
window.addEventListener('error',e=>fail((e&&e.message)||'JavaScript runtime error'));window.addEventListener('unhandledrejection',e=>{const r=e&&e.reason;fail('Promise: '+(r&&r.message?r.message:r||'unknown'))});
async function get(url,label,type){setStatus('Loading '+label+'…');const r=await fetch(url,{mode:'cors',cache:'force-cache'});if(!r.ok)throw new Error(label+' download failed ('+r.status+').');return type==='text'?r.text():r.arrayBuffer()}
async function boot(){try{if(!parent.mugenZipData){setStatus('Choose the extracted WinMugen folder in MobMugen first.');return}systemFileData=await get(SYSTEM_ZIP,'Windows filesystem','buffer');memoryImageData=await get(MEMORY_IMAGE,'legacy Wine memory image','buffer');if(memoryImageData.byteLength<100000)throw new Error('Memory image download was incomplete.');const engineText=await get(ENGINE_JS,'Wine JavaScript core','text');installLegacyHostShim(engineText);setStatus('E7 prefix repair ready · starting Wine…');makeModule();const script=document.createElement('script');script.text=engineText;document.body.appendChild(script);notify('boot','MobMugen E7 executing Wine with prefix repair.');setTimeout(()=>{if(!statusErr.textContent){status.classList.add('hide');notify('engine','Wine engine loaded')}},1400)}catch(err){fail(err&&err.message?err.message:String(err))}}
boot();
})();
</script>
</body>
</html>
