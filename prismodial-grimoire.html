ter-spacing:.12em}.refgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}.ref{border:1px solid #9a8ad055;background:#07152be8;padding:9px;min-height:90px}.ref b{display:block;color:var(--gold);font-size:12px}.ref span{display:block;margin-top:5px;color:var(--muted);font:12px system-ui;line-height:1.25}.creature{display:grid;grid-template-columns:66px 1fr;gap:10px;align-items:center}.creature img{width:66px;height:84px;object-fit:contain;background:#02040a88;border:1px solid #9a8ad055}.lock{display:grid;place-items:center;min-height:210px;border:1px solid #a77cff77;background:radial-gradient(circle,#3a2a7255,#071226e8 62%);text-align:center}.lock b{display:block;color:#fff2bc;font-size:23px}.lock span{display:block;color:var(--muted);font:12px system-ui;max-width:30ch;margin-top:8px;line-height:1.4}.mapref{height:220px;border:1px solid #9a8ad055;background:linear-gradient(135deg,#152c4a,#0a1630);display:grid;place-items:center;color:var(--cyan);font-size:56px;box-shadow:inset 0 0 40px #5033a844}.close{position:fixed;right:18px;top:16px;z-index:5;border:1px solid #d9b96b99;background:#07152be8;color:var(--ink);padding:9px 13px;font:800 10px system-ui;letter-spacing:.12em}.sync{position:fixed;left:18px;top:16px;z-index:5;border:1px solid #73eaff77;background:#07152be8;padding:8px 12px;color:var(--cyan);font:800 10px system-ui;letter-spacing:.12em}@media(max-width:760px){.book{left:1vw;right:1vw;height:76vh}.tabs{grid-template-columns:repeat(3,1fr)}.tab:nth-child(4),.tab:nth-child(5){display:none}.page{padding:14px}.title{font-size:26px}.content p{font-size:13px}.refgrid{grid-template-columns:1fr}.creature{grid-template-columns:54px 1fr}.creature img{width:54px;height:68px}}
</style></head><body><div class="veil"></div><button class="close" onclick="location.href='./hybrid-overworld.html'">RETURN</button><div class="sync">RESONANCE SYNC · <span id="sync">UNREAD</span></div><main class="book"><section class="page left"><div class="kicker">PRISMODIAL GRIMOIRE</div><h1 class="title">Field Archive</h1><nav class="tabs"><button class="tab active" data-tab="map">MAP</button><button class="tab" data-tab="creatures">CREATURES</button><button class="tab" data-tab="locations">PLACES</button><button class="tab" data-tab="resonance">RESONANCE</button><button class="tab" data-tab="memories">MEMORIES</button></nav><div class="content" id="leftContent"></div></section><section class="page right"><div class="kicker">OPEN PAGE</div><div class="content" id="rightContent"></div></section></main><script>(()=>{const left=document.getElementById('leftContent'),right=document.getElementById('rightContent'),sync=document.getElementById('sync');let unlocked=Number(localStorage.getItem('pv.resonance.sync')||0)>=3;sync.textContent=unlocked?'SYNCHRONIZED':'UNREAD';const data={map:{title:'Regional reference',html:'<div class="mapref">◇</div><div class="readout">READ-ONLY REFERENCE · ROUTES ARE DISCOVERED IN THE OVERWORLD</div><p>Whispering Grove, Resonance Tower, Echo Castle, and Frigid Hills are recorded here as places with distinct resonance. The map informs the Bearers; it does not move them.</p>'},creatures:{title:'Known signatures',html:'<div class="creature"><img src="./assets/enemy/veil_wraith/VeilWraith_v34_Idle.png"><div><b>VEIL WRAITH</b><p>Broken identity carrying a distorted echo.</p></div></div><div class="creature" style="margin-top:12px"><img src="./assets/enemy/hushling/Hushling_v34_Idle.png"><div><b>HUSHLING</b><p>Same armored resonance family, smaller and close to the ground.</p></div></div>'},locations:{title:'Places that remember',html:'<div class="refgrid"><div class="ref"><b>WHISPERING GROVE</b><span>Living memory. First disturbance.</span></div><div class="ref"><b>RESONANCE TOWER</b><span>Routes and calibrates Veil signatures.</span></div><div class="ref"><b>ECHO CASTLE</b><span>Amplifies repeating signals.</span></div><div class="ref"><b>FRIGID HILLS</b><span>Preserved, slowed resonance.</span></div></div>'},resonance:{title:'The page that waits',html:unlocked?'<div class="refgrid"><div class="ref"><b>SYNC COMPLETE</b><span>The script resolves into a readable route pattern.</span></div><div class="ref"><b>BEARER HARMONY</b><span>Three signatures now read as one key.</span></div></div>':'<div class="lock"><div><b>PAGE SEALED</b><span>The Prismodial language remains unresolved. Increase resonance synchronization to read this page.</span></div></div>'},memories:{title:'Memory fragments',html:'<div class="refgrid"><div class="ref"><b>FRAGMENT 01</b><span>A voice in leaves that belongs to more than one place.</span></div><div class="ref"><b>FRAGMENT 02</b><span>A tower pulse repeating from beyond the safe route.</span></div></div>'}};function render(k){const d=data[k];left.querySelector('h2')?.remove();right.innerHTML='<h2>'+d.title+'</h2>'+d.html}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));render(b.dataset.tab)});render('map')})();</script></body></html>
