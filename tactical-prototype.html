<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>The Prismatic Veil — Tactical Prototype</title>
<style>
:root {
  --bg:#090713; --panel:#171126; --gold:#e0b75f; --violet:#8564d9;
  --cyan:#70d9ff; --ink:#f8efcf; --danger:#d85a6a;
}
*{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Georgia,serif}
body{touch-action:none;user-select:none}
#app{position:relative;width:100%;height:100%}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
#hud{position:absolute;left:12px;right:12px;top:10px;display:flex;justify-content:space-between;gap:10px;pointer-events:none}
.card{background:rgba(13,9,27,.82);border:1px solid rgba(224,183,95,.55);box-shadow:0 8px 28px #0008,inset 0 0 20px #7650b522;border-radius:12px;padding:9px 12px;backdrop-filter:blur(5px)}
#title{font-weight:700;color:#ffe6a1;letter-spacing:.06em}
#status{font-family:Arial,sans-serif;font-size:13px;color:#d7c8ed;margin-top:4px}
#enemyHud{min-width:170px;text-align:right}
.hpbar{height:8px;margin-top:6px;border:1px solid #d8bd6b66;background:#2e1930;border-radius:10px;overflow:hidden}
.hpfill{height:100%;background:linear-gradient(90deg,#9e2f4b,#ef6877);transition:width .35s}
#instructions{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);font-family:Arial,sans-serif;font-size:12px;white-space:nowrap}
#cinematic{display:none;position:absolute;inset:0;background:radial-gradient(circle at 40% 45%,#33216b 0,#100b24 42%,#04030a 100%);overflow:hidden}
#cinematic.active{display:block}
#cinematic .scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 3px,#fff1 4px);opacity:.22}
#heroLarge{position:absolute;left:6%;bottom:-8%;height:86%;filter:drop-shadow(0 0 22px #765fff88);image-rendering:auto}
#enemyLarge{position:absolute;right:10%;bottom:16%;width:22%;aspect-ratio:1;background:radial-gradient(circle at 45% 40%,#9f5860,#4a2632 48%,#1d1119 72%);clip-path:polygon(50% 0,66% 24%,95% 20%,78% 48%,100% 70%,65% 66%,50% 100%,34% 66%,0 70%,22% 48%,5% 20%,34% 24%);filter:drop-shadow(0 0 20px #d65b6c66)}
#beam{position:absolute;left:47%;top:42%;width:0;height:34px;transform:rotate(-5deg);transform-origin:left center;border-radius:50%;background:linear-gradient(90deg,#fff,#70d9ff,#a66cff,#ff83cb,#ffd86d);box-shadow:0 0 12px #fff,0 0 28px #8f74ff,0 0 50px #ff73ca;opacity:0}
#burst{position:absolute;right:20%;top:37%;width:10px;height:10px;border-radius:50%;background:#fff;box-shadow:0 0 20px 10px #fff,0 0 50px 30px #b884ff,0 0 90px 48px #ff7bd655;opacity:0}
#attackName{position:absolute;left:50%;top:9%;transform:translateX(-50%);font-size:clamp(24px,5vw,54px);color:#ffe8a0;text-shadow:0 0 10px #6c44c8,0 3px 0 #24113d;letter-spacing:.06em;opacity:0}
#damage{position:absolute;right:19%;top:23%;font:bold clamp(30px,8vw,88px) Arial;color:white;text-shadow:0 0 14px #ff4a7b,4px 4px 0 #5f1329;opacity:0}
#start{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#28164e,#070611 70%);z-index:20}
#start button{padding:16px 24px;border-radius:12px;border:2px solid var(--gold);background:#1a1033;color:#ffe7a1;font:bold 18px Georgia;box-shadow:0 0 28px #8955ff55}
#endBanner{display:none;position:absolute;inset:0;align-items:center;justify-content:center;background:#070611cc;z-index:30;text-align:center}
#endBanner.show{display:flex}
#endBanner button{margin-top:16px;padding:11px 18px;border-radius:9px;border:1px solid var(--gold);background:#21153d;color:#fff0bf}
@media(max-width:650px){#heroLarge{left:-10%;height:76%}#enemyLarge{right:5%;width:31%}#instructions{bottom:8px}}
</style>
</head>

 tile=Math.floor(Math.min((W-28)/COLS,(H-150)/ROWS));
 tile=Math.max(38,Math.min(88,tile));
 ox=Math.floor((W-COLS*tile)/2); oy=Math.floor((H-ROWS*tile)/2)+24;
 draw();
}
addEventListener("resize",resize);

function neighbors(c,r){
 return [[c+1,r],[c-1,r],[c,r+1],[c,r-1]].filter(([x,y])=>x>=0&&x<COLS&&y>=0&&y<ROWS&&!(x===enemy.c&&y===enemy.r));
}
function calcReach(){
 reachable=new Set([key(hero.c,hero.r)]); let q=[[hero.c,hero.r,0]];
 while(q.length){let [c,r,d]=q.shift();if(d===3)continue;for(const [nc,nr] of neighbors(c,r)){let k=key(nc,nr);if(!reachable.has(k)){reachable.add(k);q.push([nc,nr,d+1])}}}
}
function adjacent(){return Math.abs(hero.c-enemy.c)+Math.abs(hero.r-enemy.r)===1}
function screen(c,r){
 const x=ox+c*tile, y=oy+r*tile;
 return {x,y,cx:x+tile/2,cy:y+tile/2};
}
function diamond(x,y,s,fill,stroke){
 ctx.beginPath();ctx.moveTo(x,y-s*.42);ctx.lineTo(x+s*.58,y);ctx.lineTo(x,y+s*.42);ctx.lineTo(x-s*.58,y);ctx.closePath();
 ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle=stroke;ctx.lineWidth=1.5;ctx.stroke();
}
function drawBackdrop(){
 const g=ctx.createRadialGradient(W*.5,H*.35,20,W*.5,H*.35,Math.max(W,H)*.7);
 g.addColorStop(0,"#2d1c57");g.addColorStop(.45,"#121027");g.addColorStop(1,"#06050d");
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 for(let i=0;i<55;i++){const x=(i*157%997)/997*W,y=(i*311%883)/883*H*.78;ctx.fillStyle=["#9b7cff66","#70d9ff55","#ffd87955"][i%3];ctx.fillRect(x,y,i%5===0?2:1,i%5===0?2:1)}
}
function drawBoard(){
 for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
   const p=screen(c,r), dark=(c+r)%2===0;
   ctx.fillStyle=dark?"#21183b":"#291e48";ctx.fillRect(p.x,p.y,tile,tile);
   ctx.strokeStyle="#8c6fc744";ctx.strokeRect(p.x+.5,p.y+.5,tile-1,tile-1);
   if(mode==="move"&&reachable.has(key(c,r))){
     ctx.fillStyle="rgba(74,177,255,.26)";ctx.fillRect(p.x+3,p.y+3,tile-6,tile-6);
   }
 }
 if(adjacent()&&mode==="attack"){
   const p=screen(enemy.c,enemy.r);ctx.fillStyle="rgba(235,70,92,.34)";ctx.fillRect(p.x+3,p.y+3,tile-6,tile-6);
 }
}
function drawEnemy(){
 const p=screen(enemy.c,enemy.r);const s=tile*.34;
 ctx.save();ctx.translate(p.cx,p.cy+2);ctx.shadowColor="#ef587c";ctx.shadowBlur=18;
 ctx.fillStyle="#792e49";ctx.beginPath();ctx.moveTo(0,-s);ctx.lineTo(s*.85,-s*.15);ctx.lineTo(s*.55,s*.9);ctx.lineTo(0,s*.55);ctx.lineTo(-s*.55,s*.9);ctx.lineTo(-s*.85,-s*.15);ctx.closePath();ctx.fill();
 ctx.fillStyle="#ffe3ef";ctx.fillRect(-s*.3,-s*.2,s*.18,s*.14);ctx.fillRect(s*.12,-s*.2,s*.18,s*.14);ctx.restore();
}
function drawHero(){
 const p=screen(hero.c,hero.r);let bob=Math.sin(time*.004)*1.5;
 if(anim){const a=Math.min(1,(performance.now()-anim.start)/anim.duration);const e=1-Math.pow(1-a,3);const from=screen(anim.fc,anim.fr),to=screen(anim.tc,anim.tr);p.cx=from.cx+(to.cx-from.cx)*e;p.cy=from.cy+(to.cy-from.cy)*e;bob=Math.sin(a*Math.PI*3)*3;if(a>=1)anim=null}
 const h=tile*1.55,w=h*.5;
 ctx.save();ctx.shadowColor="#7e5eff";ctx.shadowBlur=12;ctx.drawImage(locked,p.cx-w/2,p.cy-h*.78+bob,w,h);ctx.restore();
 ctx.fillStyle="#0006";ctx.beginPath();ctx.ellipse(p.cx,p.cy+tile*.28,tile*.25,tile*.08,0,0,Math.PI*2);ctx.fill();
}
function draw(){
 if(!W)return;ctx.clearRect(0,0,W,H);drawBackdrop();drawBoard();drawEnemy();drawHero();
}
function loop(ts){time=ts;draw();requestAnimationFrame(loop)}
function tileAt(x,y){const c=Math.floor((x-ox)/tile),r=Math.floor((y-oy)/tile);return c>=0&&c<COLS&&r>=0&&r<ROWS?{c,r}:null}
function pointer(e){
 if(cine.classList.contains("active")||enemy.hp<=0)return;
 const rect=canvas.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top,p=tileAt(x,y);if(!p)return;
 if(mode==="move"&&reachable.has(key(p.c,p.r))&&!(p.c===hero.c&&p.r===hero.r)){
   anim={fc:hero.c,fr:hero.r,tc:p.c,tr:p.r,start:performance.now(),duration:360};
   hero.c=p.c;hero.r=p.r;
   mode=adjacent()?"attack":"move";calcReach();
   status.textContent=adjacent()?"Tap the red enemy to attack.":"Tap another blue tile to move.";
   tone(155,.06,.025);
 } else if(mode==="attack"&&p.c===enemy.c&&p.r===enemy.r&&adjacent()) runCinematic();
}
canvas.addEventListener("pointerdown",pointer);

function ensureAudio(){if(!audio){try{audio=new (AudioContext||webkitAudioContext)()}catch(e){}} if(audio?.state==="suspended")audio.resume()}
function tone(f,d,v=.03,type="triangle"){ensureAudio();if(!audio)return;const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+d+.03)}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function runCinematic(){
 mode="busy";cine.classList.add("active");attackName.style.opacity=0;beam.style.opacity=0;burst.style.opacity=0;damage.style.opacity=0;
 await wait(250);attackName.style.transition=".35s";attackName.style.opacity=1;tone(330,.18,.035);
 await wait(500);
 beam.style.transition=".42s ease-out";beam.style.opacity=1;beam.style.width="43%";tone(540,.35,.045,"sawtooth");
 await wait(360);burst.style.transition=".18s";burst.style.opacity=1;tone(95,.22,.07,"square");
 await wait(170);damage.style.transition=".18s";damage.style.opacity=1;
 enemy.hp=0;hpfill.style.width="0%";hpText.textContent="0 / 10";
 await wait(700);cine.classList.remove("active");status.textContent="Victory! Tactical loop complete.";endBanner.classList.add("show");
}
function reset(){
 hero={c:1,r:4};enemy={c:6,r:1,hp:10};mode="move";calcReach();hpfill.style.width="100%";hpText.textContent="10 / 10";status.textContent="Tap a blue tile to move.";endBanner.classList.remove("show");draw();
}
document.getElementById("startBtn").onclick=()=>{ensureAudio();start.style.display="none";reset()};
document.getElementById("restartBtn").onclick=reset;
locked.onload=()=>{resize();calcReach();requestAnimationFrame(loop)};
locked.onerror=()=>{document.getElementById("status").textContent="Locked Prismel image failed to load.";resize();calcReach();requestAnimationFrame(loop)};
})();
</script>
</body>
</html>
